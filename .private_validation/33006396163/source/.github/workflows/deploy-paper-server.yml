name: deploy-paper-server

on:
  workflow_dispatch:
  schedule:
    - cron: "12,42 * * * *"
  workflow_run:
    workflows: ["v4-live-paper-smoke"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: polymarket-paper-server
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'schedule' &&
        vars.POLYMARKET_SERVER_DEPLOY == 'true'
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event != 'pull_request'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SERVER_HOST: ${{ vars.POLYMARKET_SERVER_HOST || '100.104.183.109' }}
      SERVER_USER: ${{ vars.POLYMARKET_SERVER_USER || 'enrico' }}
      SERVER_PORT: ${{ vars.POLYMARKET_SERVER_PORT || '22' }}
      EXPECTED_VALIDATED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select existing Tailscale credential mode
        id: tailscale_auth
        shell: bash
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TS_TAGS: ${{ vars.TS_TAGS || 'tag:ci' }}
        run: |
          set -euo pipefail
          if [[ -n "${TS_AUTHKEY:-}" ]]; then
            mode=authkey
          elif [[ -n "${TS_OAUTH_CLIENT_ID:-}" && -n "${TS_OAUTH_SECRET:-}" ]]; then
            test -n "${TS_TAGS:-}" || { echo "OAuth credentials are visible but TS_TAGS is empty" >&2; exit 1; }
            mode=oauth
          else
            echo "No visible Tailscale credential set. Expected existing TS_AUTHKEY or TS_OAUTH_CLIENT_ID + TS_OAUTH_SECRET." >&2
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "tailscale_credential_mode=$mode"

      - name: Join private tailnet with auth key
        if: steps.tailscale_auth.outputs.mode == 'authkey'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: ${{ env.SERVER_HOST }}

      - name: Join private tailnet with OAuth
        if: steps.tailscale_auth.outputs.mode == 'oauth'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TS_TAGS || 'tag:ci' }}
          ping: ${{ env.SERVER_HOST }}

      - name: Configure SSH identity
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.POLYMARKET_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}" || { echo "POLYMARKET_SERVER_SSH_KEY secret is required" >&2; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/polymarket_deploy
          chmod 600 ~/.ssh/polymarket_deploy
          for i in {1..20}; do
            if ssh-keyscan -T 3 -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            sleep 2
          done
          test -s ~/.ssh/known_hosts

      - name: Determine whether reconciliation is required
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            state="$(
              ssh -i ~/.ssh/polymarket_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
                -o ConnectTimeout=10 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
                -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "bash -s" <<'REMOTE'
              set -euo pipefail
              cd ~/polymarket
              git fetch origin main paper-validated
              target_sha="$(git rev-parse origin/paper-validated)"
              head_sha="$(git rev-parse HEAD 2>/dev/null || true)"
              printf 'reconcile_event=periodic\n'
              printf 'server_head=%s\n' "${head_sha:-missing}"
              printf 'paper_validated=%s\n' "$target_sha"
              if [[ "$head_sha" == "$target_sha" ]]; then
                printf 'need_deploy=false\n'
              else
                printf 'need_deploy=true\n'
              fi
          REMOTE
            )"
            printf '%s\n' "$state" | tee deploy-evidence.txt
            need_deploy="$(printf '%s\n' "$state" | sed -n 's/^need_deploy=//p' | tail -n 1)"
            [[ "$need_deploy" == "true" || "$need_deploy" == "false" ]]
          else
            need_deploy=true
            printf 'reconcile_event=%s\nneed_deploy=true\n' "$GITHUB_EVENT_NAME" | tee deploy-evidence.txt
          fi
          echo "NEED_DEPLOY=$need_deploy" >> "$GITHUB_ENV"

      - name: Deploy validated paper ref
        if: env.NEED_DEPLOY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$EXPECTED_VALIDATED_SHA" || "$EXPECTED_VALIDATED_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh -i ~/.ssh/polymarket_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=10 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "EXPECTED_VALIDATED_SHA='$EXPECTED_VALIDATED_SHA' bash -s" <<'REMOTE' | tee -a deploy-evidence.txt
          set -euo pipefail
          cd ~/polymarket
          git fetch origin main paper-validated
          main_sha="$(git rev-parse origin/main)"
          validated_sha="$(git rev-parse origin/paper-validated)"
          git merge-base --is-ancestor "$validated_sha" "$main_sha"
          if [[ -n "${EXPECTED_VALIDATED_SHA:-}" ]]; then
            test "$validated_sha" = "$EXPECTED_VALIDATED_SHA"
          fi
          printf 'predeploy_origin_main=%s\n' "$main_sha"
          printf 'predeploy_paper_validated=%s\n' "$validated_sha"
          printf 'trigger_expected_validated=%s\n' "${EXPECTED_VALIDATED_SHA:-periodic-or-manual}"

          case "$(uname -s)" in
            Darwin) updater_path=ops/update_server_macos.sh ;;
            Linux)  updater_path=ops/update_server.sh ;;
            *) echo "unsupported server OS: $(uname -s)" >&2; exit 1 ;;
          esac
          updater="$(mktemp)"
          trap 'rm -f "$updater"' EXIT
          git show "$validated_sha:$updater_path" > "$updater"
          chmod 700 "$updater"
          POLYMARKET_DEPLOY_REF=paper-validated bash "$updater"
          REMOTE

      - name: Verify production paper services
        if: env.NEED_DEPLOY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/polymarket_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "EXPECTED_VALIDATED_SHA='$EXPECTED_VALIDATED_SHA' bash -s" <<'REMOTE' | tee -a deploy-evidence.txt
          set -euo pipefail

          fail_verify() {
            printf 'verify_failure=%s\n' "$1" >&2
            exit 1
          }

          require_equal() {
            local name="$1" actual="$2" expected="$3"
            if [[ "$actual" != "$expected" ]]; then
              printf 'verify_failure=%s actual=%s expected=%s\n' "$name" "$actual" "$expected" >&2
              exit 1
            fi
          }

          require_metric() {
            local name="$1" pattern="$2"
            grep -q "$pattern" <<<"$metrics" || fail_verify "$name"
          }

          require_file() {
            local name="$1" path="$2"
            test -s "$path" || fail_verify "$name"
          }

          cd ~/polymarket
          git fetch origin main paper-validated || fail_verify "git_fetch_refs"
          head_sha="$(git rev-parse HEAD)" || fail_verify "server_head_read"
          main_sha="$(git rev-parse origin/main)" || fail_verify "main_sha_read"
          validated_sha="$(git rev-parse origin/paper-validated)" || fail_verify "validated_sha_read"
          require_equal "server_head_matches_validated" "$head_sha" "$validated_sha"
          git merge-base --is-ancestor "$validated_sha" "$main_sha" || fail_verify "validated_not_ancestor_of_main"
          if [[ -n "${EXPECTED_VALIDATED_SHA:-}" ]]; then
            require_equal "validated_matches_trigger_sha" "$validated_sha" "$EXPECTED_VALIDATED_SHA"
          fi

          champion_meta="$(python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('config/live_champion.json').read_text())
          print(f"{int(m['version'])}\t{Path(m['run_root']).name}")
          PY
          )" || fail_verify "champion_manifest_read"
          IFS=$'\t' read -r version run_name <<<"$champion_meta"
          [[ "$version" == "5" || "$version" == "6" ]] || fail_verify "unsupported_champion_version"

          curl -fsS http://127.0.0.1:9108/healthz >/dev/null || fail_verify "exporter_healthz"
          metrics="$(curl -fsS http://127.0.0.1:9108/metrics)" || fail_verify "exporter_metrics_fetch"
          require_metric "runtime_info_schema" "^polymarket_runtime_info{adapter=\"v${version}\",run_root=\"${run_name}\",version=\"v${version}\"} 1$"
          require_metric "runtime_pnl_metric" '^polymarket_runtime_pnl_usd '
          require_metric "allocator_state_metric" '^polymarket_allocator_state_present 1$'
          require_metric "allocator_models_expected_metric" '^polymarket_allocator_models_expected 5$'
          require_metric "model_info_metric" '^polymarket_model_info{'
          if [[ "$version" == "6" ]]; then
            require_metric "v6_exporter_info_metric" '^polymarket_v6_exporter_info{'
            # Grafana's V6 strategy panels depend on this exact Prometheus schema.
            # Fail deployment rather than silently provisioning a dashboard whose
            # fill/health panels resolve to empty vectors.
            require_metric "v6_model_fills_metric" '^polymarket_model_fills_total{action="all",'
            require_metric "v6_model_gross_exposure_metric" '^polymarket_model_gross_exposure_usd{'
            require_metric "v6_model_drawdown_metric" '^polymarket_model_drawdown_ratio{'
            require_metric "v6_model_alive_metric" '^polymarket_model_alive{'
            require_metric "v6_model_staleness_metric" '^polymarket_model_alert_staleness_seconds{'
            require_file "v6_hard_arb_status_file" "runs/${run_name}/hard_arb/status.json"
            require_file "v6_local_factor_status_file" "runs/${run_name}/local_factor_status.json"
            require_file "v6_runtime_status_file" "runs/${run_name}/runtime_status.json"
          fi
          curl -fsS http://127.0.0.1:9090/-/ready >/dev/null || fail_verify "prometheus_ready"
          curl -fsS http://127.0.0.1:3000/api/health >/dev/null || fail_verify "grafana_health"
          grafana_search="$(curl -fsS http://127.0.0.1:3000/api/search)" || fail_verify "grafana_search_fetch"
          grep -q 'polymarket-multi-strategy-v5' <<<"$grafana_search" || fail_verify "grafana_dashboard_missing"
          printf 'verify_result=success\n'
          printf 'server_head=%s\n' "$head_sha"
          printf 'paper_validated=%s\n' "$validated_sha"
          printf 'origin_main=%s\n' "$main_sha"
          printf 'champion_version=%s\n' "$version"
          printf 'champion_run_root=%s\n' "$run_name"
          case "$(uname -s)" in
            Darwin) bash ops/macos_service_control.sh status || fail_verify "macos_service_status" ;;
            Linux)
              systemctl is-active --quiet polymarket-paper.service || fail_verify "linux_paper_service"
              systemctl is-active --quiet polymarket-monitoring.service || fail_verify "linux_monitoring_service"
              systemctl --no-pager --full status polymarket-paper.service | sed -n '1,12p'
              systemctl --no-pager --full status polymarket-monitoring.service | sed -n '1,12p'
              ;;
            *) fail_verify "unsupported_server_os" ;;
          esac
          REMOTE

      - name: Record no-op reconciliation
        if: env.NEED_DEPLOY == 'false'
        shell: bash
        run: echo 'reconciliation_result=already_current' | tee -a deploy-evidence.txt

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-server-deploy-${{ github.run_id }}
          path: deploy-evidence.txt
          if-no-files-found: warn
          retention-days: 7
