name: V7 PAPER server health

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed V7 SHA to verify
        required: false
        type: string
  repository_dispatch:
    types: [v7-paper-server-health]
  workflow_run:
    workflows: ["V7 deploy PAPER server"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "20,50 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: v7-paper-server-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      SERVER_HOST: ${{ vars.POLYMARKET_SERVER_HOST || '100.104.183.109' }}
      SERVER_USER: ${{ vars.POLYMARKET_SERVER_USER || 'enrico' }}
      SERVER_PORT: ${{ vars.POLYMARKET_SERVER_PORT || '22' }}
      EXPECTED_SHA: ${{ github.event.inputs.expected_sha || github.event.client_payload.expected_sha || github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Validate requested SHA syntax
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0

      - name: Gate exact validated/deployed SHA
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "ready=false" >> "$GITHUB_OUTPUT"
          git fetch --no-tags origin main paper-validated
          main_sha="$(git rev-parse origin/main)"
          validated_sha="$(git rev-parse origin/paper-validated)"
          if [[ "$main_sha" != "$EXPECTED_SHA" || "$validated_sha" != "$EXPECTED_SHA" ]]; then
            echo "health_state=noop_not_exact_validated_main" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/v7_cutover_contract.py --repository-root . --expected-head "$EXPECTED_SHA" >/dev/null
          runs="$(mktemp)"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/v7-deploy-paper-server.yml/runs?branch=main&per_page=50" > "$runs"
          python3 - "$runs" "$EXPECTED_SHA" <<'PY'
          import json,sys
          rows=json.load(open(sys.argv[1])).get('workflow_runs') or []; sha=sys.argv[2]
          exact=[r for r in rows if r.get('head_sha')==sha and r.get('status')=='completed' and r.get('conclusion')=='success']
          if not exact: raise SystemExit('no exact-SHA successful V7 deploy')
          PY
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Select Tailscale credential mode
        if: steps.gate.outputs.ready == 'true'
        id: tailscale_auth
        shell: bash
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TS_TAGS: ${{ vars.TS_TAGS || 'tag:ci' }}
        run: |
          set -euo pipefail
          if [[ -n "${TS_AUTHKEY:-}" ]]; then mode=authkey
          elif [[ -n "${TS_OAUTH_CLIENT_ID:-}" && -n "${TS_OAUTH_SECRET:-}" ]]; then test -n "${TS_TAGS:-}"; mode=oauth
          else echo "No visible Tailscale credential set" >&2; exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Join private tailnet with auth key
        if: steps.gate.outputs.ready == 'true' && steps.tailscale_auth.outputs.mode == 'authkey'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: ${{ env.SERVER_HOST }}

      - name: Join private tailnet with OAuth
        if: steps.gate.outputs.ready == 'true' && steps.tailscale_auth.outputs.mode == 'oauth'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TS_TAGS || 'tag:ci' }}
          ping: ${{ env.SERVER_HOST }}

      - name: Configure SSH identity
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.POLYMARKET_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/polymarket_v7_health
          chmod 600 ~/.ssh/polymarket_v7_health
          ssh-keyscan -T 5 -p "$SERVER_PORT" "$SERVER_HOST" > ~/.ssh/known_hosts

      - name: Verify exact canonical V7 deployment and economics health
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p health-evidence
          ssh -i ~/.ssh/polymarket_v7_health -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10 -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "EXPECTED_SHA='$EXPECTED_SHA' bash -s" <<'REMOTE' | tee health-evidence/server-health.txt
          set -euo pipefail
          app="$HOME/polymarket"; root="$app/runs/paper_v7_live"; now="$(date +%s)"
          cd "$app"
          head_sha="$(git rev-parse HEAD)"; validated_sha="$(git rev-parse origin/paper-validated 2>/dev/null || true)"; main_sha="$(git rev-parse origin/main 2>/dev/null || true)"
          test "$head_sha" = "$EXPECTED_SHA"; test "$validated_sha" = "$EXPECTED_SHA"; test "$main_sha" = "$EXPECTED_SHA"
          test "$(cat "$root/control/deployed_sha")" = "$EXPECTED_SHA"
          python3 - "$root" "$EXPECTED_SHA" "$now" <<'PY'
          import csv,json,os,sys
          from pathlib import Path
          root=Path(sys.argv[1]); sha=sys.argv[2]; now=int(sys.argv[3])
          runtime=json.loads((root/'control/runtime_status.json').read_text()); portfolio=json.loads((root/'control/portfolio_state.json').read_text()); graph=json.loads((root/'graph_rv/status.json').read_text()); economics=json.loads((root/'canonical_economics.json').read_text())
          assert runtime.get('version')==7 and runtime.get('model_sha')==sha and runtime.get('paper_only') is True and runtime.get('authenticated_execution') is False and runtime.get('real_order_submission') is False
          pid=int(runtime.get('pid') or 0); assert pid>0; os.kill(pid,0); assert now-int(runtime.get('timestamp') or 0)<=180
          assert portfolio.get('paper_only') is True and portfolio.get('authenticated_execution') is False and portfolio.get('killed') is False and float(portfolio.get('drawdown',1))<.15 and now-int(portfolio.get('timestamp') or 0)<=30
          assert graph.get('paper_only') is True and graph.get('authenticated_execution') is False and now-int(graph.get('timestamp') or 0)<=180
          assert economics.get('paper_only') is True and economics.get('authenticated_execution') is False and economics.get('expected_model_sha')==sha
          ledger=root/'ledger/execution.jsonl'; assert ledger.is_file()
          tape=root/'trade_tape.csv'; assert tape.is_file()
          with tape.open(newline='',encoding='utf-8') as h: rows=list(csv.DictReader(h))
          assert rows and max(int(float(r.get('received_ms') or 0)) for r in rows)>0
          print(json.dumps({'runtime_sha':sha,'pid':pid,'drawdown':portfolio.get('drawdown'),'economic_state':economics.get('state'),'promotion_ready':economics.get('promotion_ready'),'submitted_units':economics.get('submitted_units'),'complete_units':economics.get('complete_units'),'net_pnl':economics.get('net_pnl'),'stressed_net_pnl':economics.get('stressed_net_pnl')},sort_keys=True))
          PY
          curl -fsS http://127.0.0.1:9108/healthz
          metrics="$(curl -fsS http://127.0.0.1:9108/metrics)"
          grep -q '^polymarket_v7_runtime_info 1$' <<<"$metrics"
          grep -q '^polymarket_v7_execution_alive 1$' <<<"$metrics"
          grep -q '^polymarket_v7_paper_only_contract_ok 1$' <<<"$metrics"
          grep -q '^polymarket_v7_authenticated_execution_disabled 1$' <<<"$metrics"
          grep -q '^polymarket_v7_ledger_valid 1$' <<<"$metrics"
          curl -fsS http://127.0.0.1:9090/-/ready >/dev/null
          curl -fsS http://127.0.0.1:3000/api/health >/dev/null
          curl -fsS http://127.0.0.1:3000/api/dashboards/uid/polymarket-v7 >/dev/null
          REMOTE

      - name: Publish exact-SHA health summary
        if: steps.gate.outputs.ready == 'true'
        run: |
          echo '## V7 PAPER server health' >> "$GITHUB_STEP_SUMMARY"
          echo "- exact deployed SHA: $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo '- runtime/control/portfolio/Graph/canonical-economics/ledger/trade-tape: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- exporter/Prometheus/Grafana: PASS' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload health evidence
        if: always() && steps.gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v7-paper-server-health-${{ env.EXPECTED_SHA }}-${{ github.run_id }}
          path: health-evidence/
          if-no-files-found: warn
          retention-days: 14
