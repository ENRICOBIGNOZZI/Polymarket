name: V6 market cache relay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v6-market-cache-relay.yml"
      - "config/live_champion.json"
      - "config/paper_v6.json"
      - "scripts/v6_market_proxy.py"
      - "scripts/v6_market_snapshot.py"
      - "tests/test_v6_market_cache_relay_contract.py"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: polymarket-v6-market-cache-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SERVER_HOST: ${{ vars.POLYMARKET_SERVER_HOST || '100.104.183.109' }}
      SERVER_USER: ${{ vars.POLYMARKET_SERVER_USER || 'enrico' }}
      SERVER_PORT: ${{ vars.POLYMARKET_SERVER_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Select existing Tailscale credential mode
        id: tailscale_auth
        shell: bash
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TS_TAGS: ${{ vars.TS_TAGS || 'tag:ci' }}
        run: |
          set -euo pipefail
          if [[ -n "${TS_AUTHKEY:-}" ]]; then
            mode=authkey
          elif [[ -n "${TS_OAUTH_CLIENT_ID:-}" && -n "${TS_OAUTH_SECRET:-}" ]]; then
            test -n "${TS_TAGS:-}"
            mode=oauth
          else
            echo "No visible Tailscale credential set" >&2
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Join private tailnet with auth key
        if: steps.tailscale_auth.outputs.mode == 'authkey'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: ${{ env.SERVER_HOST }}

      - name: Join private tailnet with OAuth
        if: steps.tailscale_auth.outputs.mode == 'oauth'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TS_TAGS || 'tag:ci' }}
          ping: ${{ env.SERVER_HOST }}

      - name: Configure SSH identity
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.POLYMARKET_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}" || { echo "missing POLYMARKET_SERVER_SSH_KEY" >&2; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/polymarket_deploy
          chmod 600 ~/.ssh/polymarket_deploy
          ssh-keyscan -T 5 -p "$SERVER_PORT" "$SERVER_HOST" > ~/.ssh/known_hosts

      - name: Resolve manifest-selected V6 cache target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          target="$(ssh -i ~/.ssh/polymarket_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=10 -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/polymarket
          git fetch -q origin main paper-validated
          main_sha="$(git rev-parse origin/main)"
          paper_validated_sha="$(git rev-parse origin/paper-validated)"
          head_sha="$(git rev-parse HEAD)"
          bootstrap=false
          if [[ "$head_sha" == "$paper_validated_sha" ]]; then
            bootstrap=false
          else
            # A data-starved validated revision can otherwise deadlock deployment:
            # deploy waits for market-data health while relay waits for deploy.
            # Permit only a forward cache bootstrap to the exact current validated
            # main revision; never bootstrap arbitrary, diverged or unvalidated code.
            test "$paper_validated_sha" = "$main_sha"
            git merge-base --is-ancestor "$head_sha" "$paper_validated_sha"
            bootstrap=true
          fi
          manifest_json="$(git show "$paper_validated_sha:config/live_champion.json")"
          printf 'main_sha=%s\n' "$main_sha"
          printf 'paper_validated_sha=%s\n' "$paper_validated_sha"
          printf 'server_head_sha=%s\n' "$head_sha"
          printf 'bootstrap=%s\n' "$bootstrap"
          MANIFEST_JSON="$manifest_json" python3 - <<'PY'
          import json,os,re
          manifest=json.loads(os.environ["MANIFEST_JSON"])
          if int(manifest["version"]) != 6:
              print("active=false")
          else:
              root=str(manifest["run_root"])
              assert re.fullmatch(r"runs/[A-Za-z0-9._-]+", root), root
              print("active=true")
              print("run_root="+root)
          PY
          REMOTE
          )"
          printf '%s\n' "$target"
          active="$(printf '%s\n' "$target" | sed -n 's/^active=//p' | tail -n 1)"
          [[ "$active" == "true" || "$active" == "false" ]]
          echo "active=$active" >> "$GITHUB_OUTPUT"
          if [[ "$active" == "true" ]]; then
            root="$(printf '%s\n' "$target" | sed -n 's/^run_root=//p' | tail -n 1)"
            [[ "$root" =~ ^runs/[A-Za-z0-9._-]+$ ]]
            echo "run_root=$root" >> "$GITHUB_OUTPUT"
            paper_validated_sha="$(printf '%s\n' "$target" | sed -n 's/^paper_validated_sha=//p' | tail -n 1)"
            [[ "$paper_validated_sha" =~ ^[0-9a-f]{40}$ ]]
            echo "paper_validated_sha=$paper_validated_sha" >> "$GITHUB_OUTPUT"
            bootstrap="$(printf '%s\n' "$target" | sed -n 's/^bootstrap=//p' | tail -n 1)"
            [[ "$bootstrap" == "true" || "$bootstrap" == "false" ]]
            echo "bootstrap=$bootstrap" >> "$GITHUB_OUTPUT"
          fi

      - name: Build fresh verified public market cache
        if: steps.target.outputs.active == 'true'
        shell: bash
        env:
          PAPER_VALIDATED_SHA: ${{ steps.target.outputs.paper_validated_sha }}
        run: |
          set -euo pipefail
          [[ "$PAPER_VALIDATED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch -q origin paper-validated
          git checkout --detach "$PAPER_VALIDATED_SHA"
          test "$(git rev-parse HEAD)" = "$PAPER_VALIDATED_SHA"
          mkdir -p relay-evidence
          python3 scripts/v6_market_snapshot.py \
            --output relay-evidence/market_proxy_cache.json \
            --status relay-evidence/market_proxy_status.json \
            --markets 300 --min-markets 100 --min-liquidity 10 \
            --max-cache-age-seconds 90 | tee relay-evidence/snapshot-summary.json
          python3 - relay-evidence/market_proxy_cache.json <<'PY'
          import json,sys,time
          payload=json.load(open(sys.argv[1],encoding="utf-8"))
          assert payload.get("schema") == "polymarket_v6_market_proxy_cache_v1"
          assert time.time()-float(payload["timestamp"]) <= 90
          assert len(payload.get("markets") or []) >= 100
          assert all(
              isinstance(row,dict) and str(row.get("id") or "")
              and str(row.get("conditionId") or "")
              and float(row.get("liquidityNum")) >= 10
              for row in payload["markets"]
          )
          PY

      - name: Transfer cache atomically to private V6 runtime
        if: steps.target.outputs.active == 'true'
        shell: bash
        env:
          RUN_ROOT_REL: ${{ steps.target.outputs.run_root }}
        run: |
          set -euo pipefail
          [[ "$RUN_ROOT_REL" =~ ^runs/[A-Za-z0-9._-]+$ ]]
          incoming="market_proxy_cache.json.relay.${GITHUB_RUN_ID}"
          ssh -i ~/.ssh/polymarket_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=10 -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "RUN_ROOT_REL='$RUN_ROOT_REL' bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/polymarket
          [[ "$RUN_ROOT_REL" =~ ^runs/[A-Za-z0-9._-]+$ ]]
          mkdir -p "$RUN_ROOT_REL"
          REMOTE
          scp -i ~/.ssh/polymarket_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            -P "$SERVER_PORT" relay-evidence/market_proxy_cache.json \
            "$SERVER_USER@$SERVER_HOST:polymarket/${RUN_ROOT_REL}/${incoming}"
          ssh -i ~/.ssh/polymarket_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=10 -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "RUN_ROOT_REL='$RUN_ROOT_REL' INCOMING='$incoming' bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/polymarket
          [[ "$RUN_ROOT_REL" =~ ^runs/[A-Za-z0-9._-]+$ ]]
          [[ "$INCOMING" =~ ^market_proxy_cache\.json\.relay\.[0-9]+$ ]]
          target="$RUN_ROOT_REL/market_proxy_cache.json"
          incoming="$RUN_ROOT_REL/$INCOMING"
          python3 - "$incoming" <<'PY'
          import json,sys,time
          path=sys.argv[1]
          value=json.load(open(path,encoding="utf-8"))
          assert value.get("schema") == "polymarket_v6_market_proxy_cache_v1"
          assert time.time()-float(value["timestamp"]) <= 120
          assert len(value.get("markets") or []) >= 100
          assert all(
              isinstance(row,dict) and str(row.get("id") or "")
              and str(row.get("conditionId") or "")
              and float(row.get("liquidityNum")) >= 10
              for row in value["markets"]
          )
          PY
          previous_mtime_ns="$(python3 - "$target" <<'PY'
          import os,sys
          try:
              print(os.stat(sys.argv[1]).st_mtime_ns)
          except FileNotFoundError:
              print(0)
          PY
          )"
          mv "$incoming" "$target"
          python3 - "$target" "$previous_mtime_ns" <<'PY'
          import os,sys,time
          path=sys.argv[1]
          previous=int(sys.argv[2])
          stat=os.stat(path)
          refreshed=max(time.time_ns(), previous+1, stat.st_mtime_ns+1)
          os.utime(path, ns=(stat.st_atime_ns, refreshed))
          PY
          printf 'relay_cache_installed=%s\n' "$target"
          REMOTE

      - name: Verify running proxy consumes installed cache
        if: steps.target.outputs.active == 'true'
        shell: bash
        env:
          RUN_ROOT_REL: ${{ steps.target.outputs.run_root }}
          BOOTSTRAP: ${{ steps.target.outputs.bootstrap }}
        run: |
          set -euo pipefail
          mkdir -p relay-evidence
          ssh -i ~/.ssh/polymarket_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=10 -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "RUN_ROOT_REL='$RUN_ROOT_REL' BOOTSTRAP='$BOOTSTRAP' bash -s" <<'REMOTE' | tee relay-evidence/live-proxy-consumption.txt
          set -euo pipefail
          cd ~/polymarket
          [[ "$RUN_ROOT_REL" =~ ^runs/[A-Za-z0-9._-]+$ ]]
          [[ "$BOOTSTRAP" == "true" || "$BOOTSTRAP" == "false" ]]
          python3 - "$RUN_ROOT_REL/market_proxy_cache.json" <<'PY'
          import json,sys,time
          value=json.load(open(sys.argv[1],encoding='utf-8'))
          assert value.get('schema') == 'polymarket_v6_market_proxy_cache_v1'
          assert time.time()-float(value['timestamp']) <= 180
          assert len(value.get('markets') or []) >= 100
          assert all(
              isinstance(row,dict) and str(row.get('id') or '')
              and str(row.get('conditionId') or '')
              and float(row.get('liquidityNum')) >= 10
              for row in value['markets']
          )
          PY
          if [[ "$BOOTSTRAP" == "true" ]]; then
            printf 'relay_bootstrap_staged=true\n'
            printf 'relay_bootstrap_waits_for_validated_deploy=true\n'
            exit 0
          fi
          proxy_url="$(python3 - "$RUN_ROOT_REL/runtime_config.json" <<'PY'
          import json,sys,urllib.parse
          cfg=json.load(open(sys.argv[1],encoding='utf-8'))
          url=str(cfg.get('gamma_url') or '')
          parsed=urllib.parse.urlsplit(url)
          assert parsed.scheme == 'http', url
          assert parsed.hostname in {'127.0.0.1','localhost'}, url
          assert parsed.port is not None, url
          print(f'http://127.0.0.1:{parsed.port}')
          PY
          )"
          proxy_port="${proxy_url##*:}"
          proxy_diagnostics() {
            local health_probe response_probe pid command_line
            health_probe="$(curl --silent --show-error --max-time 3 "$proxy_url/healthz" 2>&1 || true)"
            response_probe="$(curl --silent --show-error --max-time 5 "$proxy_url/markets?active=true&closed=false&limit=1&offset=0&order=liquidityNum&ascending=false&liquidity_num_min=10" 2>&1 || true)"
            printf 'relay_proxy_port=%s\n' "$proxy_port"
            printf 'relay_proxy_health_probe=%s\n' "$(printf '%s' "$health_probe" | tr '\n' ' ' | cut -c1-512)"
            printf 'relay_proxy_markets_probe_bytes=%s\n' "${#response_probe}"
            python3 - "$RUN_ROOT_REL/market_proxy_status.json" "$RUN_ROOT_REL/market_proxy_cache.json" <<'PY'
          import json, os, sys
          for label, path in (("status", sys.argv[1]), ("cache", sys.argv[2])):
              try:
                  stat = os.stat(path)
                  value = json.load(open(path, encoding="utf-8"))
                  if not isinstance(value, dict):
                      raise ValueError("not an object")
                  summary = {key: value.get(key) for key in (
                      "schema", "timestamp", "source", "markets", "cache_age_seconds", "failures", "last_error"
                  )}
                  summary["mtime"] = int(stat.st_mtime)
                  summary["bytes"] = stat.st_size
              except Exception as exc:
                  summary = {"error": str(exc)}
              print("relay_proxy_" + label + "=" + json.dumps(summary, sort_keys=True))
          PY
            if command -v lsof >/dev/null 2>&1; then
              while IFS= read -r pid; do
                [[ "$pid" =~ ^[1-9][0-9]*$ ]] || continue
                command_line="$(/bin/ps -o pid=,ppid=,comm= -p "$pid" 2>/dev/null | tr -s '[:space:]' ' ' | sed 's/^ //')"
                printf 'relay_proxy_listener_pid=%s command=%s\n' "$pid" "${command_line:-unavailable}"
              done < <(lsof -nP -t -iTCP:"$proxy_port" -sTCP:LISTEN 2>/dev/null || true)
            fi
            printf '%s\n' 'relay_proxy_log_tail_begin'
            tail -n 20 "$RUN_ROOT_REL/market_proxy.log" 2>/dev/null || true
            printf '%s\n' 'relay_proxy_log_tail_end'
          }
          # A successful live-paper smoke can trigger deploy at the same minute as
          # this scheduled relay. Deployment intentionally restarts the paper
          # runtime, so a single immediate localhost probe can observe the planned
          # restart and falsely classify a valid relay as broken. Retry only the
          # read-only consumption proof for a bounded 90 seconds; never restart or
          # mutate the service here, and still fail closed unless the running proxy
          # actually serves the installed cache.
          verified=false
          for attempt in {1..18}; do
            if health="$(curl -fsS --max-time 3 "$proxy_url/healthz" 2>/dev/null)" && \
               response="$(curl -fsS --max-time 5 "$proxy_url/markets?active=true&closed=false&limit=1&offset=0&order=liquidityNum&ascending=false&liquidity_num_min=10" 2>/dev/null)" && \
               python3 - "$response" "$RUN_ROOT_REL/market_proxy_status.json" <<'PY'
          import json,sys,time
          rows=json.loads(sys.argv[1])
          assert isinstance(rows,list) and rows, rows
          row=rows[0]
          assert isinstance(row,dict)
          assert str(row.get('id') or '') and str(row.get('conditionId') or '')
          assert float(row.get('liquidityNum')) >= 10.0
          status=json.load(open(sys.argv[2],encoding='utf-8'))
          assert status.get('schema') == 'polymarket_v6_market_proxy_status_v1'
          assert str(status.get('source') or '').endswith('_cache'), status
          assert int(status.get('markets') or 0) >= 1, status
          assert float(status.get('cache_age_seconds') or 0.0) <= 180.0, status
          assert time.time()-float(status.get('timestamp') or 0) <= 30.0, status
          print('live_proxy_cache_consumed=true')
          print('live_proxy_source='+str(status.get('source')))
          print('live_proxy_markets='+str(status.get('markets')))
          print('live_proxy_cache_age_seconds='+str(status.get('cache_age_seconds')))
          PY
            then
              printf 'proxy_health=%s\n' "$health"
              printf 'relay_verify_attempt=%s\n' "$attempt"
              verified=true
              break
            fi
            printf 'relay_verify_retry=%s\n' "$attempt"
            if (( attempt == 1 || attempt == 18 )); then
              proxy_diagnostics
            fi
            sleep 5
          done
          test "$verified" = true
          REMOTE

      - name: Publish relay summary
        if: always()
        shell: bash
        run: |
          echo "## V6 public-data cache relay" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.target.outputs.active }}" != "true" ]]; then
            echo "Manifest-selected champion is not V6; relay skipped." >> "$GITHUB_STEP_SUMMARY"
          elif [[ -s relay-evidence/snapshot-summary.json ]]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat relay-evidence/snapshot-summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -s relay-evidence/live-proxy-consumption.txt ]]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat relay-evidence/live-proxy-consumption.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload relay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-market-cache-relay-${{ github.run_id }}
          path: relay-evidence/
          if-no-files-found: warn
          retention-days: 7
