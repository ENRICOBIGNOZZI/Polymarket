name: Polymarket Integration Merge

on:
  workflow_dispatch:
  schedule:
    - cron: "3,18,33,48 * * * *"

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: polymarket-integration-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require a safe V7 integration base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main paper-validated
          main_sha="$(git rev-parse origin/main)"
          validated_sha="$(git rev-parse origin/paper-validated)"
          test "$(git rev-parse HEAD)" = "$main_sha"
          git merge-base --is-ancestor "$validated_sha" "$main_sha"
          if [[ "$main_sha" != "$validated_sha" ]]; then
            python3 - <<'PY'
          import json
          from pathlib import Path

          champion = json.loads(Path('config/live_champion.json').read_text(encoding='utf-8'))
          directives = json.loads(Path('config/operator_directives.json').read_text(encoding='utf-8'))
          assert champion.get('enabled') is False, 'main may lead paper-validated only during the explicit no-champion V7 recovery state'
          assert champion.get('paper_only') is True
          assert champion.get('authenticated_execution') is False
          assert directives.get('operator_instruction_id') == 'user-v7-master-multi-agent-operating-prompt-20260827'
          sequence = str(directives.get('rule') or '')
          assert 'same-SHA PAPER -> main -> paper-validated -> deploy -> server health' in sequence
          PY
            echo "recovery_base=true main=$main_sha paper_validated=$validated_sha"
          else
            echo "recovery_base=false main=$main_sha"
          fi

      - name: Select exactly one controller-authorized integration
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p integration-merge
          gh pr list --state open --base main --limit 100 \
            --label autonomous-promotion-approved \
            --json number,title,url,headRefName,headRefOid,baseRefOid,isDraft,labels,mergeStateStatus,statusCheckRollup,body \
            > integration-merge/authorized.json
          count="$(python3 -c 'import json; print(len(json.load(open("integration-merge/authorized.json"))))')"
          echo "AUTHORIZED_COUNT=$count" >> "$GITHUB_ENV"
          if [[ "$count" -gt 1 ]]; then
            echo 'More than one controller authorization is active; fail closed.' >&2
            exit 1
          fi
          if [[ "$count" -eq 1 ]]; then
            number="$(python3 -c 'import json; print(json.load(open("integration-merge/authorized.json"))[0]["number"])')"
            echo "PR_NUMBER=$number" >> "$GITHUB_ENV"
          fi

      - name: Revalidate authorization against current evidence and base
        if: env.AUTHORIZED_COUNT == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" \
            --json number,title,url,headRefName,headRefOid,baseRefOid,isDraft,labels,mergeStateStatus,statusCheckRollup,body \
            > integration-merge/candidate.json
          source_number="$(python3 - <<'PY'
          import json,re
          body=json.load(open('integration-merge/candidate.json')).get('body') or ''
          match=re.search(r'source research pr/branch/commit:\s*#(\d+)\b',body,re.I)
          print(match.group(1) if match else '')
          PY
          )"
          test -n "$source_number"
          echo "SOURCE_PR_NUMBER=$source_number" >> "$GITHUB_ENV"
          gh pr view "$source_number" \
            --json number,headRefName,headRefOid,isDraft,labels,state,body,statusCheckRollup,comments,reviews \
            > integration-merge/source.json
          gh pr diff "$PR_NUMBER" --name-only > integration-merge/changed-files.txt

          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          base_sha="$(python3 -c 'import json; print(json.load(open("integration-merge/candidate.json"))["baseRefOid"])')"
          test "$base_sha" = "$current_main" || { echo "Authorized PR base $base_sha is stale versus main $current_main; wait for fresh checks." >&2; exit 1; }

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${source_number}" \
            > integration-merge/source-pr.json
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues/${source_number}/comments?per_page=100" \
            > integration-merge/source-comments-pages.json
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls/${source_number}/reviews?per_page=100" \
            > integration-merge/source-reviews-pages.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          def flatten(path: str) -> list[dict]:
              raw = json.loads(Path(path).read_text(encoding='utf-8'))
              if not isinstance(raw, list):
                  return []
              if raw and all(isinstance(page, list) for page in raw):
                  return [item for page in raw for item in page if isinstance(item, dict)]
              return [item for item in raw if isinstance(item, dict)]

          source = json.loads(Path('integration-merge/source-pr.json').read_text(encoding='utf-8'))
          source['comments'] = flatten('integration-merge/source-comments-pages.json')
          source['reviews'] = flatten('integration-merge/source-reviews-pages.json')
          Path('integration-merge/source-research.json').write_text(
              json.dumps(source, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )

          candidate = json.loads(Path('integration-merge/candidate.json').read_text(encoding='utf-8'))
          event = {
              'pull_request': {
                  'head': {'ref': candidate.get('headRefName') or ''},
                  'draft': bool(candidate.get('isDraft')),
                  'body': candidate.get('body') or '',
                  'labels': candidate.get('labels') or [],
              }
          }
          Path('integration-merge/policy-event.json').write_text(
              json.dumps(event, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          python3 scripts/research_pr_policy.py \
            --event integration-merge/policy-event.json \
            --changed-files integration-merge/changed-files.txt \
            --manifest-existed-on-base true \
            --source-research-json integration-merge/source-research.json \
            --output integration-merge/research-policy.md

          evidence_path="$(python3 - <<'PY'
          import json,re
          body=json.load(open('integration-merge/candidate.json')).get('body') or ''
          match=re.search(r'promotion evidence file:\s*([^\s`]+\.json)\b',body,re.I)
          print(match.group(1) if match else '')
          PY
          )"
          gate_args=(
            python3 scripts/promotion_gate.py
            --candidate integration-merge/candidate.json
            --source integration-merge/source.json
            --changed-files integration-merge/changed-files.txt
            --alpha-config config/alpha_factory.json
            --policy config/promotion_policy.json
            --report integration-merge/promotion-gate.md
            --json-output integration-merge/promotion-gate.json
            --require-approval-label
          )
          if [[ -n "$evidence_path" ]]; then
            actual_source_sha="$(python3 -c 'import json; print(json.load(open("integration-merge/source.json"))["headRefOid"])')"
            gh api "repos/${GITHUB_REPOSITORY}/contents/${evidence_path}?ref=${actual_source_sha}" --jq .content > integration-merge/evidence.b64
            base64 -d integration-merge/evidence.b64 > integration-merge/evidence.json
            bound_source_sha="$(python3 -c 'import json; print(str(json.load(open("integration-merge/evidence.json")).get("source_head_sha") or ""))')"
            [[ "$bound_source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Promotion evidence source SHA is invalid.' >&2; exit 1; }
            git fetch --quiet --no-tags origin "$actual_source_sha" "$bound_source_sha"
            git merge-base --is-ancestor "$bound_source_sha" "$actual_source_sha" || { echo 'Promotion evidence is not bound to an ancestor of the current research head.' >&2; exit 1; }
            python3 - integration-merge/source.json "$actual_source_sha" "$bound_source_sha" <<'PY'
          import json,sys
          path=sys.argv[1];source=json.load(open(path));source['actualHeadRefOid']=sys.argv[2];source['headRefOid']=sys.argv[3]
          with open(path,'w') as handle:json.dump(source,handle)
          PY
            gate_args+=(--evidence integration-merge/evidence.json)
          fi
          "${gate_args[@]}"

          candidate_head="$(python3 -c 'import json; print(json.load(open("integration-merge/candidate.json"))["headRefOid"])')"
          source_actual_head="$(python3 -c 'import json; d=json.load(open("integration-merge/source.json")); print(d.get("actualHeadRefOid") or d["headRefOid"])')"
          source_bound_head="$(python3 -c 'import json; print(json.load(open("integration-merge/source.json"))["headRefOid"])')"
          python3 - <<'PY' > integration-merge/source-match-files.txt
          import json
          for path in json.load(open('integration-merge/promotion-gate.json')).get('source_content_match_files',[]):print(path)
          PY
          : > integration-merge/provenance.tsv
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            candidate_blob="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${candidate_head}" --jq .sha 2>/dev/null || echo __missing__)"
            source_blob="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${source_actual_head}" --jq .sha 2>/dev/null || echo __missing__)"
            bound_blob="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${source_bound_head}" --jq .sha 2>/dev/null || echo __missing__)"
            printf '%s\t%s\t%s\t%s\n' "$path" "$candidate_blob" "$source_blob" "$bound_blob" >> integration-merge/provenance.tsv
            test "$candidate_blob" = "$source_blob" && test "$candidate_blob" = "$bound_blob" || { echo "Economic source-content mismatch: $path" >&2; exit 1; }
          done < integration-merge/source-match-files.txt

      - name: Fast-forward main to the exact controller-authorized V7 head
        if: env.AUTHORIZED_COUNT == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" --json headRefOid,baseRefOid,mergeStateStatus,labels > integration-merge/candidate-final.json
          expected_head="$(python3 -c 'import json; print(json.load(open("integration-merge/candidate-final.json"))["headRefOid"])')"
          expected_base="$(python3 -c 'import json; print(json.load(open("integration-merge/candidate-final.json"))["baseRefOid"])')"
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          test "$expected_base" = "$current_main"
          test "$(python3 -c 'import json; print(json.load(open("integration-merge/candidate-final.json"))["mergeStateStatus"])')" = CLEAN
          python3 - <<'PY'
          import json
          labels={x.get('name') for x in json.load(open('integration-merge/candidate-final.json')).get('labels',[])}
          assert 'autonomous-promotion-approved' in labels
          PY
          [[ "$expected_head" =~ ^[0-9a-f]{40}$ ]]
          git fetch --quiet --no-tags origin "$expected_head"
          git merge-base --is-ancestor "$current_main" "$expected_head"

          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/main" \
            -f sha="$expected_head" -F force=false > integration-merge/ref-update.json
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" = "$expected_head"
          integrated_sha="$expected_head"
          echo "INTEGRATED_SHA=$integrated_sha" >> "$GITHUB_ENV"

          pr_state="$(gh pr view "$PR_NUMBER" --json state --jq .state 2>/dev/null || true)"
          if [[ "$pr_state" == "OPEN" ]]; then
            gh pr close "$PR_NUMBER" --delete-branch \
              --comment "Integrated by exact-head fast-forward at \`$expected_head\`. No squash or merge commit was created, preserving same-SHA PAPER/main/paper-validated/deploy provenance. Authenticated real-money execution remains disabled."
          else
            echo "PR $PR_NUMBER already non-open after exact-head fast-forward: ${pr_state:-unknown}"
          fi

          python3 - "$integrated_sha" "$PR_NUMBER" > integration-merge/integration-dispatch.json <<'PY'
          import json,sys
          print(json.dumps({'event_type':'champion-integration-merged','client_payload':{'sha':sys.argv[1],'pr_number':int(sys.argv[2]),'automatic_promotion':True,'exact_head_fast_forward':True}}))
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input integration-merge/integration-dispatch.json

      - name: Publish integration action
        if: always()
        shell: bash
        run: |
          echo '## Automatic exact-head integration' >> "$GITHUB_STEP_SUMMARY"
          echo "- controller-authorized candidates: ${AUTHORIZED_COUNT:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "- integrated PR: ${PR_NUMBER:-none}" >> "$GITHUB_STEP_SUMMARY"
          echo "- source research PR: ${SOURCE_PR_NUMBER:-none}" >> "$GITHUB_STEP_SUMMARY"
          echo "- exact integrated SHA: ${INTEGRATED_SHA:-none}" >> "$GITHUB_STEP_SUMMARY"
          cat integration-merge/research-policy.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          cat integration-merge/promotion-gate.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-merge-${{ github.run_id }}
          path: integration-merge/
          if-no-files-found: warn
          retention-days: 30
