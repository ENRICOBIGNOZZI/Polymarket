name: V7 point-in-time universe archive

on:
  workflow_dispatch:
  schedule:
    - cron: "11,41 * * * *"

permissions:
  contents: read

concurrency:
  group: polymarket-v7-point-in-time-universe-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SERVER_HOST: ${{ vars.POLYMARKET_SERVER_HOST || '100.104.183.109' }}
      SERVER_USER: ${{ vars.POLYMARKET_SERVER_USER || 'enrico' }}
      SERVER_PORT: ${{ vars.POLYMARKET_SERVER_PORT || '22' }}
    steps:
      - name: Select existing Tailscale credential mode
        id: tailscale_auth
        shell: bash
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TS_TAGS: ${{ vars.TS_TAGS || 'tag:ci' }}
        run: |
          set -euo pipefail
          if [[ -n "${TS_AUTHKEY:-}" ]]; then
            mode=authkey
          elif [[ -n "${TS_OAUTH_CLIENT_ID:-}" && -n "${TS_OAUTH_SECRET:-}" ]]; then
            test -n "${TS_TAGS:-}"
            mode=oauth
          else
            echo "No visible Tailscale credential set" >&2
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Join private tailnet with auth key
        if: steps.tailscale_auth.outputs.mode == 'authkey'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: ${{ env.SERVER_HOST }}

      - name: Join private tailnet with OAuth
        if: steps.tailscale_auth.outputs.mode == 'oauth'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TS_TAGS || 'tag:ci' }}
          ping: ${{ env.SERVER_HOST }}

      - name: Configure SSH identity
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.POLYMARKET_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}" || { echo "missing POLYMARKET_SERVER_SSH_KEY" >&2; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/polymarket_archive
          chmod 600 ~/.ssh/polymarket_archive
          ssh-keyscan -T 5 -p "$SERVER_PORT" "$SERVER_HOST" > ~/.ssh/known_hosts

      - name: Archive exact paper-validated market universe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive-evidence
          ssh -i ~/.ssh/polymarket_archive -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=10 -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "GITHUB_RUN_ID='$GITHUB_RUN_ID' bash -s" <<'REMOTE' | tee archive-evidence/archive-status.txt
          set -euo pipefail
          cd ~/polymarket
          git fetch -q origin paper-validated
          validated_sha="$(git rev-parse origin/paper-validated)"
          [[ "$validated_sha" =~ ^[0-9a-f]{40}$ ]]
          manifest_json="$(git show "${validated_sha}:config/live_champion.json")"
          target="$(MANIFEST_JSON="$manifest_json" python3 - <<'PY'
          import json,os,re
          manifest=json.loads(os.environ['MANIFEST_JSON'])
          if int(manifest.get('version') or 0) != 6:
              print('active=false')
          else:
              root=str(manifest.get('run_root') or '')
              assert re.fullmatch(r'runs/[A-Za-z0-9._-]+',root), root
              print('active=true')
              print('run_root='+root)
          PY
          )"
          printf 'validated_sha=%s\n' "$validated_sha"
          printf '%s\n' "$target"
          active="$(printf '%s\n' "$target" | sed -n 's/^active=//p' | tail -n1)"
          if [[ "$active" != "true" ]]; then
            printf 'archive_skipped=non_v6_validated_champion\n'
            exit 0
          fi
          run_root="$(printf '%s\n' "$target" | sed -n 's/^run_root=//p' | tail -n1)"
          [[ "$run_root" =~ ^runs/[A-Za-z0-9._-]+$ ]]
          cache="$run_root/market_proxy_cache.json"
          archive_dir="$run_root/universe_snapshots"

          python3 - "$cache" <<'PY'
          import json,sys,time
          path=sys.argv[1]
          value=json.load(open(path,encoding='utf-8'))
          assert value.get('schema') == 'polymarket_v6_market_proxy_cache_v1'
          assert time.time()-float(value.get('timestamp') or 0) <= 600.0
          rows=value.get('markets') or []
          assert isinstance(rows,list) and len(rows) >= 100
          assert all(isinstance(row,dict) and str(row.get('id') or '') and str(row.get('conditionId') or '') for row in rows)
          PY

          helper_path="scripts/v7_archive_market_universe.py"
          if ! git cat-file -e "${validated_sha}:${helper_path}" 2>/dev/null; then
            printf 'archive_skipped=helper_not_yet_paper_validated\n'
            exit 0
          fi
          tmp_helper="$run_root/.v7_archive_market_universe.${GITHUB_RUN_ID}.py"
          git show "${validated_sha}:${helper_path}" > "$tmp_helper"
          trap 'rm -f "$tmp_helper"' EXIT
          python3 "$tmp_helper" \
            --cache "$cache" \
            --archive-dir "$archive_dir" \
            --cadence-seconds 1800 \
            --retention-days 45
          python3 - "$archive_dir" <<'PY'
          import gzip,json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          files=sorted(root.glob('universe-*.json.gz'))
          assert files, 'point-in-time archive is empty'
          value=json.loads(gzip.decompress(files[-1].read_bytes()).decode('utf-8'))
          assert value.get('schema') == 'polymarket_v7_point_in_time_universe_v1'
          assert int(value.get('cadence_seconds') or 0) == 1800
          assert int(value.get('market_count') or 0) >= 100
          print('archive_snapshot_count='+str(len(files)))
          print('archive_latest='+files[-1].name)
          print('archive_latest_markets='+str(value.get('market_count')))
          PY
          REMOTE

      - name: Publish archive summary
        if: always()
        shell: bash
        run: |
          echo '## V7 point-in-time universe archive' >> "$GITHUB_STEP_SUMMARY"
          if test -s archive-evidence/archive-status.txt; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat archive-evidence/archive-status.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-point-in-time-universe-${{ github.run_id }}
          path: archive-evidence/
          if-no-files-found: warn
          retention-days: 30
