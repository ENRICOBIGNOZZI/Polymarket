name: Polymarket Control-Plane Event Bridge

on:
  workflow_dispatch:
  schedule:
    - cron: "11,26,41,56 * * * *"
  workflow_run:
    workflows:
      - "ci"
      - "Polymarket Research Policy"
      - "monitoring"
      - "v4-live-paper-smoke"
      - "Private runtime single-writer validation"
      - "Polymarket Promotion Controller"
    types: [completed]

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: polymarket-control-plane-event-bridge
  cancel-in-progress: true

jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify current project context
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_project_context.py --root . --output event-bridge-project-context.md
          python3 -m json.tool config/operator_directives.json >/dev/null
          python3 -m json.tool config/scheduler_registry.json >/dev/null

      - name: Dispatch the bounded next authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_NAME: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name || '' }}
          TRIGGER_CONCLUSION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion || '' }}
          TRIGGER_HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" && "$TRIGGER_NAME" == "Polymarket Promotion Controller" ]]; then
            if [[ "$TRIGGER_CONCLUSION" == "success" ]]; then
              gh workflow run integration-merge.yml --ref main
              echo 'dispatched=integration-merge.yml reason=promotion-controller-success' >> "$GITHUB_STEP_SUMMARY"
            else
              echo "no_dispatch=integration-merge.yml reason=promotion-controller-${TRIGGER_CONCLUSION:-unknown}" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            if [[ "$GITHUB_EVENT_NAME" == "workflow_run" && "$TRIGGER_CONCLUSION" == "success" ]]; then
              case "$TRIGGER_NAME" in
                "ci"|"Polymarket Research Policy"|"monitoring"|"Private runtime single-writer validation")
                  SOURCE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/546" --jq '.head.sha')"
                  if [[ -n "$SOURCE_SHA" && "$TRIGGER_HEAD_SHA" == "$SOURCE_SHA" ]]; then
                    gh workflow run v7-unified-paper-evidence.yml --ref main
                    echo "dispatched=v7-unified-paper-evidence.yml reason=exact-v7-gate-success trigger=$TRIGGER_NAME source_sha=$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
                  else
                    echo "no_dispatch=v7-unified-paper-evidence.yml reason=non-v7-head trigger=$TRIGGER_NAME trigger_sha=${TRIGGER_HEAD_SHA:-none} source_sha=${SOURCE_SHA:-none}" >> "$GITHUB_STEP_SUMMARY"
                  fi
                  ;;
              esac
            fi
            gh workflow run promotion-controller.yml --ref main
            echo "dispatched=promotion-controller.yml trigger=${TRIGGER_NAME:-$GITHUB_EVENT_NAME} conclusion=${TRIGGER_CONCLUSION:-n/a}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce bridge authority boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_WORKFLOW" = "Polymarket Control-Plane Event Bridge"
          echo 'The bridge may dispatch only the existing promotion/integration authorities and the isolated read-only V7 PAPER evidence reconciler. It has no merge, deploy, champion-ref, paper-validated-ref, credential or authenticated-execution authority of its own.' >> "$GITHUB_STEP_SUMMARY"
