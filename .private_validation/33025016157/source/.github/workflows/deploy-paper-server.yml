name: Polymarket V7 PAPER Deploy

on:
  schedule:
    - cron: "12,42 * * * *"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact paper-validated SHA to deploy; empty means current paper-validated
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: polymarket-v7-paper-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SERVER_HOST: ${{ vars.POLYMARKET_SERVER_HOST || '100.104.183.109' }}
      SERVER_USER: ${{ vars.POLYMARKET_SERVER_USER || 'enrico' }}
      SERVER_PORT: ${{ vars.POLYMARKET_SERVER_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve V7 deployment contract
        id: contract
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.expected_sha || '' }}
        run: |
          set -euo pipefail
          git fetch origin main paper-validated
          main_sha="$(git rev-parse origin/main)"
          validated_sha="$(git rev-parse origin/paper-validated)"
          python3 - "$REQUESTED_SHA" "$main_sha" "$validated_sha" "$GITHUB_OUTPUT" <<'PY'
          import json, subprocess, sys
          from pathlib import PurePosixPath
          requested, main_sha, validated_sha, output = sys.argv[1:]
          manifest=json.loads(subprocess.check_output(['git','show',f'{main_sha}:config/live_champion.json'],text=True))
          if manifest.get('enabled') is not True:
              with open(output,'a',encoding='utf-8') as f:
                  f.write('enabled=false\n')
                  f.write(f'main_sha={main_sha}\nvalidated_sha={validated_sha}\n')
              raise SystemExit(0)
          if manifest.get('version') != 7: raise SystemExit('enabled main champion must be V7')
          if manifest.get('paper_only') is not True or manifest.get('authenticated_execution') is not False:
              raise SystemExit('unsafe main champion boundary')
          if manifest.get('deployment_ref') != 'paper-validated': raise SystemExit('wrong deployment_ref')
          if requested and requested != validated_sha: raise SystemExit(f'requested SHA {requested} != paper-validated {validated_sha}')
          subprocess.check_call(['git','merge-base','--is-ancestor',validated_sha,main_sha])
          validated_manifest=json.loads(subprocess.check_output(['git','show',f'{validated_sha}:config/live_champion.json'],text=True))
          keys=('enabled','version','loop','config','run_root','deployment_ref','paper_only','authenticated_execution')
          if any(validated_manifest.get(k) != manifest.get(k) for k in keys):
              raise SystemExit('paper-validated champion manifest does not match main authority')
          for key,prefix in (('loop','scripts/'),('config','config/'),('run_root','runs/')):
              raw=str(manifest.get(key) or ''); p=PurePosixPath(raw)
              if not raw.startswith(prefix) or p.is_absolute() or '..' in p.parts: raise SystemExit(f'unsafe {key}')
          for key in ('loop','config'):
              subprocess.check_call(['git','cat-file','-e',f'{validated_sha}:{manifest[key]}'])
          with open(output,'a',encoding='utf-8') as f:
              f.write('enabled=true\n')
              f.write(f'main_sha={main_sha}\nvalidated_sha={validated_sha}\n')
          PY
          printf 'main_sha=%s\npaper_validated=%s\nchampion_enabled=%s\n' \
            "$main_sha" "$validated_sha" "$(grep -E '^enabled=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)" | tee deploy-evidence.txt

      - name: Enforce scheduler deploy switch
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          allowed=false
          if [[ "${{ steps.contract.outputs.enabled }}" == "true" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "${{ vars.POLYMARKET_SERVER_DEPLOY }}" == "true" ]]; then
              allowed=true
            fi
          fi
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          echo "deploy_allowed=$allowed" | tee -a deploy-evidence.txt

      - name: Select Tailscale credential mode
        if: steps.gate.outputs.allowed == 'true'
        id: tailscale_auth
        shell: bash
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TS_TAGS: ${{ vars.TS_TAGS || 'tag:ci' }}
        run: |
          set -euo pipefail
          if [[ -n "${TS_AUTHKEY:-}" ]]; then
            echo 'mode=authkey' >> "$GITHUB_OUTPUT"
          elif [[ -n "${TS_OAUTH_CLIENT_ID:-}" && -n "${TS_OAUTH_SECRET:-}" && -n "${TS_TAGS:-}" ]]; then
            echo 'mode=oauth' >> "$GITHUB_OUTPUT"
          else
            echo 'No visible Tailscale credential set' >&2
            exit 1
          fi

      - name: Join tailnet with auth key
        if: steps.gate.outputs.allowed == 'true' && steps.tailscale_auth.outputs.mode == 'authkey'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: ${{ env.SERVER_HOST }}

      - name: Join tailnet with OAuth
        if: steps.gate.outputs.allowed == 'true' && steps.tailscale_auth.outputs.mode == 'oauth'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TS_TAGS || 'tag:ci' }}
          ping: ${{ env.SERVER_HOST }}

      - name: Configure SSH identity
        if: steps.gate.outputs.allowed == 'true'
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.POLYMARKET_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}" || { echo 'POLYMARKET_SERVER_SSH_KEY is required' >&2; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/polymarket_deploy
          chmod 600 ~/.ssh/polymarket_deploy
          ssh-keyscan -T 10 -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Deploy exact paper-validated V7 SHA
        if: steps.gate.outputs.allowed == 'true'
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.contract.outputs.validated_sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/polymarket_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=10 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "POLYMARKET_EXPECTED_SHA='$EXPECTED_SHA' bash -s" <<'REMOTE' | tee -a deploy-evidence.txt
          set -euo pipefail
          cd ~/polymarket
          git fetch origin main paper-validated
          target="$(git rev-parse origin/paper-validated)"
          test "$target" = "$POLYMARKET_EXPECTED_SHA"
          git merge-base --is-ancestor "$target" origin/main
          updater="$(mktemp)"
          trap 'rm -f "$updater"' EXIT
          git show "$target:ops/update_server.sh" > "$updater"
          chmod 700 "$updater"
          POLYMARKET_DEPLOY_REF=paper-validated POLYMARKET_EXPECTED_SHA="$target" bash "$updater"
          python3 scripts/v7_server_health.py --repository-root . --expected-sha "$target" --require-monitoring
          REMOTE

      - name: Record dormant/no-op state
        if: steps.gate.outputs.allowed != 'true'
        shell: bash
        run: |
          echo 'deployment_result=dormant_or_disabled' | tee -a deploy-evidence.txt

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-paper-deploy-${{ github.run_id }}
          path: deploy-evidence.txt
          if-no-files-found: warn
          retention-days: 14
