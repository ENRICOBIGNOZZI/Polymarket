name: Polymarket V7 Server Health

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Optional exact paper-validated SHA expected on server
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: polymarket-v7-server-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SERVER_HOST: ${{ vars.POLYMARKET_SERVER_HOST || '100.104.183.109' }}
      SERVER_USER: ${{ vars.POLYMARKET_SERVER_USER || 'enrico' }}
      SERVER_PORT: ${{ vars.POLYMARKET_SERVER_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve canonical V7 health target
        id: contract
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.expected_sha || '' }}
        run: |
          set -euo pipefail
          git fetch origin main paper-validated
          main_sha="$(git rev-parse origin/main)"
          validated_sha="$(git rev-parse origin/paper-validated)"
          python3 - "$REQUESTED_SHA" "$main_sha" "$validated_sha" "$GITHUB_OUTPUT" <<'PY'
          import json, subprocess, sys
          requested, main_sha, validated_sha, output=sys.argv[1:]
          manifest=json.loads(subprocess.check_output(['git','show',f'{main_sha}:config/live_champion.json'],text=True))
          enabled=manifest.get('enabled') is True
          if enabled:
              if manifest.get('version') != 7: raise SystemExit('enabled main champion must be V7')
              if manifest.get('paper_only') is not True or manifest.get('authenticated_execution') is not False:
                  raise SystemExit('unsafe champion boundary')
              if requested and requested != validated_sha: raise SystemExit('requested SHA != paper-validated')
              subprocess.check_call(['git','merge-base','--is-ancestor',validated_sha,main_sha])
          with open(output,'a',encoding='utf-8') as f:
              f.write(f'enabled={str(enabled).lower()}\n')
              f.write(f'main_sha={main_sha}\nvalidated_sha={validated_sha}\n')
          PY
          printf 'main_sha=%s\npaper_validated=%s\nchampion_enabled=%s\n' \
            "$main_sha" "$validated_sha" "$(grep -E '^enabled=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)" | tee health-evidence.txt

      - name: Select Tailscale credential mode
        if: steps.contract.outputs.enabled == 'true'
        id: tailscale_auth
        shell: bash
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TS_TAGS: ${{ vars.TS_TAGS || 'tag:ci' }}
        run: |
          set -euo pipefail
          if [[ -n "${TS_AUTHKEY:-}" ]]; then
            echo 'mode=authkey' >> "$GITHUB_OUTPUT"
          elif [[ -n "${TS_OAUTH_CLIENT_ID:-}" && -n "${TS_OAUTH_SECRET:-}" && -n "${TS_TAGS:-}" ]]; then
            echo 'mode=oauth' >> "$GITHUB_OUTPUT"
          else
            echo 'No visible Tailscale credential set' >&2
            exit 1
          fi

      - name: Join tailnet with auth key
        if: steps.contract.outputs.enabled == 'true' && steps.tailscale_auth.outputs.mode == 'authkey'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: ${{ env.SERVER_HOST }}

      - name: Join tailnet with OAuth
        if: steps.contract.outputs.enabled == 'true' && steps.tailscale_auth.outputs.mode == 'oauth'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TS_TAGS || 'tag:ci' }}
          ping: ${{ env.SERVER_HOST }}

      - name: Configure SSH identity
        if: steps.contract.outputs.enabled == 'true'
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.POLYMARKET_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}" || { echo 'POLYMARKET_SERVER_SSH_KEY is required' >&2; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/polymarket_health
          chmod 600 ~/.ssh/polymarket_health
          ssh-keyscan -T 10 -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Verify exact-SHA V7 runtime and monitoring
        if: steps.contract.outputs.enabled == 'true'
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.contract.outputs.validated_sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/polymarket_health -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=10 -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "EXPECTED_SHA='$EXPECTED_SHA' bash -s" <<'REMOTE' | tee -a health-evidence.txt
          set -euo pipefail
          cd ~/polymarket
          git fetch origin main paper-validated
          test "$(git rev-parse origin/paper-validated)" = "$EXPECTED_SHA"
          python3 scripts/v7_server_health.py --repository-root . --expected-sha "$EXPECTED_SHA" --require-monitoring
          REMOTE

      - name: Record no-champion state
        if: steps.contract.outputs.enabled != 'true'
        shell: bash
        run: echo 'health_result=no_operational_champion' | tee -a health-evidence.txt

      - name: Upload health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-server-health-${{ github.run_id }}
          path: health-evidence.txt
          if-no-files-found: warn
          retention-days: 14
