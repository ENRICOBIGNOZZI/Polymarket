groups:
  - name: polymarket-v7
    rules:
      - alert: PolymarketV7RuntimeDown
        expr: polymarket_v7_runtime_alive < 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Canonical V7 PAPER runtime is unhealthy
      - alert: PolymarketV7RuntimeStale
        expr: polymarket_v7_runtime_status_age_seconds > 180
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Canonical V7 runtime status is stale
      - alert: PolymarketV7AuthenticatedExecutionEnabled
        expr: polymarket_v7_runtime_authenticated_execution > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Authenticated execution invariant violated
      - alert: PolymarketV7RiskKilled
        expr: polymarket_v7_runtime_killed > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: V7 hard-risk kill is active
