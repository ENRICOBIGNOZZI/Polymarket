name: v4-live-paper-smoke

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit SHA to validate; defaults to the event SHA
        required: false
        type: string
  push:
    branches: [main]
  schedule:
    - cron: "37 * * * *"
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: champion-live-paper-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-paper-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VALIDATION_SHA: ${{ github.event.inputs.expected_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.expected_sha || github.sha }}

      - name: Verify exact validation revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VALIDATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"
          echo "validation_sha=$VALIDATION_SHA"

      - name: Resolve manifest-selected paper champion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path, PurePosixPath
          m=json.loads(Path('config/live_champion.json').read_text())
          version=m.get('version')
          if isinstance(version,bool) or not isinstance(version,int) or version <= 0:
              raise SystemExit(f'invalid paper champion version {version!r}')
          for key in ('run_root','config','loop'):
              value=str(m[key]); path=PurePosixPath(value)
              if path.is_absolute() or '..' in path.parts:
                  raise SystemExit(f'invalid champion {key}: {value}')
          run_name=Path(m['run_root']).name
          print(f'CHAMPION_VERSION={version}')
          print(f'CHAMPION_CONFIG={m["config"]}')
          print(f'CHAMPION_RUN_ROOT={m["run_root"]}')
          print(f'CHAMPION_RUN_NAME={run_name}')
          print(f'CHAMPION_LOOP={m["loop"]}')
          PY

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev python3

      - name: Build Release champion dependencies
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          bash -n scripts/paper_v5_loop.sh scripts/paper_v6_loop.sh scripts/v6_live_smoke_once.sh scripts/paper_latest_loop.sh "$CHAMPION_LOOP"
          python3 -m py_compile scripts/v6_*.py scripts/runtime_contract_health.py monitoring/exporter_v6.py monitoring/exporter_latest.py
          if [[ -f "monitoring/exporter_v${CHAMPION_VERSION}.py" ]]; then
            python3 -m py_compile "monitoring/exporter_v${CHAMPION_VERSION}.py"
          fi

      - name: Fresh public-data V5 full-strategy smoke
        if: env.CHAMPION_VERSION == '5'
        shell: bash
        run: |
          set -euo pipefail
          R=paper_v5_live
          mkdir -p "$R" "$R/maker" "$R/strategies"
          python3 scripts/multi_strategy_paper.py \
            --config config/paper_v5.json --run-root "$R" --engine ./build/polymarket_engine \
            --markets 180 --min-liquidity 25 --once | tee "$R/allocator_once.log"
          ./build/polymarket_trade_recorder \
            --config config/paper_v5.json --run-dir "$R" --markets 400 --batch 40 \
            --min-liquidity 25 --lookback-seconds 900 --once | tee "$R/trade_recorder_latest.log"
          ./build/polymarket_negrisk_arb \
            --config config/paper_v5.json --markets 400 --min-liquidity 25 --top 120 \
            | tee "$R/structural_latest.log" "$R/structural_latest.csv"
          ./build/polymarket_stat_arb \
            --config config/paper_v5.json --markets 400 --history-universe 220 \
            --lookback-hours 720 --fidelity-minutes 30 --min-z 0.75 --min-t-reversion 0.75 \
            --max-half-life-hours 336 --top 120 --csv "$R/stat_arb_pairs.csv" \
            | tee "$R/stat_arb_pairs_latest.log"
          ./build/polymarket_pca_stat_arb \
            --config config/paper_v5.json --markets 400 --universe 220 \
            --lookback-hours 720 --fidelity-minutes 30 --factors 5 --max-hedges 8 \
            --min-z 0.65 --min-t-reversion 0.60 --max-half-life-hours 336 \
            --max-factor-hedge-error 0.80 --top 120 --csv "$R/stat_arb_pca_raw.csv" \
            | tee "$R/stat_arb_pca_latest.log"
          python3 scripts/filter_coherent_hedges.py \
            --input "$R/stat_arb_pca_raw.csv" --output "$R/stat_arb_pca.csv" \
            --rejections "$R/stat_arb_pca_rejected.csv" --cache "$R/market_metadata_cache.json" \
            --min-jaccard 0.08 --min-shared-tokens 1 | tee "$R/coherent_hedges.log"
          python3 scripts/build_v4_intents.py --strategy B1 \
            --input "$R/stat_arb_pairs.csv" --output "$R/b1_intents.csv" \
            --config config/paper_v5.json --min-edge 0.00025
          python3 scripts/build_v4_intents.py --strategy B2 \
            --input "$R/stat_arb_pca.csv" --output "$R/b2_intents.csv" \
            --config config/paper_v5.json --min-edge 0.00025
          python3 scripts/merge_v4_intents.py \
            --input "$R/b1_intents.csv" --input "$R/b2_intents.csv" --output "$R/intents.csv" \
            --min-edge 0.00025 --max-age-seconds 240 --max-bundles 80
          ./build/polymarket_multileg_paper \
            --config config/paper_v5.json --run-dir "$R" --intents "$R/intents.csv" \
            --trade-tape "$R/trade_tape.csv" --min-edge 0.00025 --completion-threshold 0.75 \
            --submit-latency-ms 100 --cancel-latency-ms 100 --max-replaces 6 \
            --max-leg-risk-usd 12 --adverse-horizon-seconds 45 --once | tee "$R/multileg_latest.log"
          ./build/polymarket_maker_paper \
            --config config/paper_v5.json --run-dir "$R/maker" --markets 400 --min-liquidity 25 \
            --min-edge 0.0005 --max-order-usd 25 --ttl-seconds 120 --hold-seconds 300 \
            --adverse-selection-mult 0.20 --once | tee "$R/maker_latest.log"
          python3 scripts/walk_forward_v4.py \
            --ledger "$R/bundle_ledger.csv" --output "$R/walk_forward.json" --starting-capital 10000 || true
          PYTHONPATH=monitoring python3 - <<'PY'
          from pathlib import Path
          from exporter_latest import LatestCollector
          c=LatestCollector(Path('.'),Path('config'),'paper_v5_live','config/paper_v5.json',20)
          text=c.collect()
          assert 'polymarket_runtime_info{adapter="v5",run_root="paper_v5_live",version="v5"} 1' in text
          assert 'polymarket_allocator_state_present 1' in text
          Path('paper_v5_live/metrics.prom').write_text(text)
          PY
          test -s "$R/runtime_status.json"
          test -s "$R/strategy_status.csv"
          test -s "$R/allocator_status.json"
          echo "SMOKE_RUN_ROOT=$R" >> "$GITHUB_ENV"

      - name: Fresh public-data V6 model-specific smoke
        id: v6_smoke
        if: env.CHAMPION_VERSION == '6'
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CHAMPION_CONFIG" = "config/paper_v6.json"
          test "$CHAMPION_RUN_NAME" = "paper_v6_live"
          bash scripts/v6_live_smoke_once.sh "$CHAMPION_CONFIG" "$CHAMPION_RUN_NAME"
          echo "SMOKE_RUN_ROOT=$CHAMPION_RUN_NAME" >> "$GITHUB_ENV"

      - name: Verify V6 unhealthy-tape negative canary
        if: github.event_name == 'pull_request' && env.CHAMPION_VERSION == '6' && steps.v6_smoke.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          test -s "$CHAMPION_RUN_NAME/trade_recorder_health.json"
          python3 - "$CHAMPION_RUN_NAME/trade_recorder_health.json" <<'PY'
          import json, sys
          from pathlib import Path
          report=json.loads(Path(sys.argv[1]).read_text())
          if report.get('status') != 'unhealthy' or not report.get('failures'):
              raise SystemExit('V6 smoke failed outside the explicit recorder-health gate')
          print('expected_pr_negative_canary=' + ','.join(report['failures']))
          PY
          echo "SMOKE_RUN_ROOT=$CHAMPION_RUN_NAME" >> "$GITHUB_ENV"

      - name: Version-neutral V7+ PAPER runtime smoke
        if: env.CHAMPION_VERSION != '5' && env.CHAMPION_VERSION != '6'
        shell: bash
        run: |
          set -euo pipefail
          R="$CHAMPION_RUN_ROOT"
          rm -rf "$R"
          mkdir -p "$R"
          POLYMARKET_FAST_ARB_ENABLED=0 bash scripts/paper_latest_loop.sh >"$R/live_smoke_supervisor.log" 2>&1 &
          owner=$!
          cleanup() {
            kill -TERM "$owner" 2>/dev/null || true
            wait "$owner" 2>/dev/null || true
          }
          trap cleanup EXIT INT TERM
          healthy=0
          for _ in {1..360}; do
            if ! kill -0 "$owner" 2>/dev/null; then
              tail -n 120 "$R/live_smoke_supervisor.log" >&2 || true
              exit 1
            fi
            if python3 scripts/runtime_contract_health.py \
              --manifest config/live_champion.json --repository-root . \
              --max-age-seconds 180 >/tmp/runtime-contract-health.txt 2>&1; then
              healthy=1
              break
            fi
            sleep 2
          done
          cat /tmp/runtime-contract-health.txt || true
          test "$healthy" = 1
          PYTHONPATH=monitoring python3 - "$R" "$CHAMPION_CONFIG" "$CHAMPION_VERSION" <<'PY'
          import re,sys
          from pathlib import Path
          from exporter_latest import LatestCollector
          root=Path(sys.argv[1]); config=sys.argv[2]; version=sys.argv[3]
          text=LatestCollector(root.parent,Path('config'),root.name,config,20).collect()
          pattern=rf'^polymarket_runtime_info\{{adapter="[^"]+",run_root="{re.escape(root.name)}",version="v{re.escape(version)}"\}} 1$'
          assert re.search(pattern,text,re.MULTILINE), text[:2500]
          assert 'polymarket_runtime_contract_present 1' in text
          assert 'polymarket_runtime_pnl_usd ' in text
          (root/'metrics.prom').write_text(text,encoding='utf-8')
          PY
          echo "SMOKE_RUN_ROOT=$R" >> "$GITHUB_ENV"
          cleanup
          trap - EXIT INT TERM

      - name: Verify selected champion telemetry
        if: env.CHAMPION_VERSION != '6' || github.event_name != 'pull_request' || steps.v6_smoke.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          R="${SMOKE_RUN_ROOT:-$CHAMPION_RUN_NAME}"
          test -s "$R/metrics.prom"
          if [[ "$CHAMPION_VERSION" == "5" || "$CHAMPION_VERSION" == "6" ]]; then
            test -s "$R/runtime_status.json"
            grep -q "^polymarket_runtime_info{adapter=\"v${CHAMPION_VERSION}\",run_root=\"$(basename "$R")\",version=\"v${CHAMPION_VERSION}\"} 1$" "$R/metrics.prom"
          else
            grep -Eq "^polymarket_runtime_info\{adapter=\"[^\"]+\",run_root=\"$(basename "$R")\",version=\"v${CHAMPION_VERSION}\"\} 1$" "$R/metrics.prom"
            grep -q '^polymarket_runtime_contract_present 1$' "$R/metrics.prom"
            python3 scripts/runtime_contract_health.py \
              --manifest config/live_champion.json --repository-root . \
              --max-age-seconds 180
          fi
          if [[ "$CHAMPION_VERSION" == "6" ]]; then
            grep -q '^polymarket_v6_exporter_info{' "$R/metrics.prom"
            test -s "$R/hard_arb/status.json"
            test -s "$R/local_factor_status.json"
            test -s "$R/relation_guard_status.json"
          fi

      - name: Build public telemetry snapshot
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          R="${SMOKE_RUN_ROOT:-${CHAMPION_RUN_NAME:-paper_v5_live}}"
          if [[ "${CHAMPION_VERSION:-5}" == "5" || "${CHAMPION_VERSION:-5}" == "6" ]]; then
            python3 scripts/summarize_live_smoke.py \
              --run-root "$R" --output "$R/live_snapshot.json" \
              --git-sha "$VALIDATION_SHA" --run-id "$GITHUB_RUN_ID" \
              --trade-lookback-seconds 900 || true
            if [[ ! -s "$R/live_snapshot.json" && -s "$R/runtime_status.json" ]]; then
              cp "$R/runtime_status.json" "$R/live_snapshot.json"
            fi
          else
            python3 - "$R" "$VALIDATION_SHA" "$GITHUB_RUN_ID" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          candidates=[root/'runtime_status.json']
          if root.exists(): candidates += sorted(p/'runtime_status.json' for p in root.iterdir() if p.is_dir())
          source=next((p for p in candidates if p.is_file()),None)
          if source is None: raise SystemExit(0)
          payload=json.loads(source.read_text(encoding='utf-8'))
          payload['git_sha']=sys.argv[2]; payload['workflow_run_id']=sys.argv[3]
          (root/'live_snapshot.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          fi

      - name: Publish live summary
        if: always()
        shell: bash
        run: |
          R="${SMOKE_RUN_ROOT:-${CHAMPION_RUN_NAME:-paper_v5_live}}"
          echo "## V${CHAMPION_VERSION:-5} manifest-selected live paper smoke" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$R/live_snapshot.json" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for f in "$R/live_smoke_supervisor.log" "$R/trade_recorder_latest.log" "$R/maker_latest.log" "$R/micro_taker_latest.log" "$R/hard_arb_latest.log" "$R/local_factor_latest.log" "$R/relation_latest.log" "$R/multileg_latest.log"; do
            if [[ -s "$f" ]]; then
              echo "### $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              tail -n 8 "$f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Publish latest public telemetry
        if: github.event_name != 'pull_request' && success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          R="${SMOKE_RUN_ROOT:-$CHAMPION_RUN_NAME}"
          test -s "$R/live_snapshot.json"
          endpoint="repos/${GITHUB_REPOSITORY}/contents/telemetry/latest-live-smoke.json"
          content="$(base64 -w0 "$R/live_snapshot.json")"
          publish_error="$(mktemp)"
          for attempt in 1 2 3 4 5; do
            current_sha="$(gh api "${endpoint}?ref=telemetry" --jq .sha 2>/dev/null || true)"
            args=("$endpoint" --method PUT -f message="Update public V${CHAMPION_VERSION} live smoke telemetry" -f content="$content" -f branch=telemetry)
            if [[ -n "$current_sha" ]]; then args+=(-f sha="$current_sha"); fi
            if gh api "${args[@]}" >/dev/null 2>"$publish_error"; then
              rm -f "$publish_error"
              exit 0
            fi
            if [[ "$attempt" -eq 5 ]]; then
              cat "$publish_error" >&2
              rm -f "$publish_error"
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Upload live diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: champion-live-paper-smoke-${{ github.run_id }}
          path: ${{ env.SMOKE_RUN_ROOT || env.CHAMPION_RUN_NAME }}/
          if-no-files-found: warn
          retention-days: 7

      - name: Advance paper validated ref
        if: github.event_name != 'pull_request' && success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          validated_sha="$(git rev-parse HEAD)"
          test "$validated_sha" = "$VALIDATION_SHA"
          git fetch --no-tags origin main paper-validated
          main_sha="$(git rev-parse origin/main)"
          current_validated_sha="$(git rev-parse origin/paper-validated)"
          test "$validated_sha" = "$main_sha"

          merged_pr=""
          for attempt in {1..10}; do
            merged_pr="$(
              gh api "repos/${GITHUB_REPOSITORY}/commits/${validated_sha}/pulls" \
                --jq '[.[] | select(.base.ref == "main" and .merged_at != null)] | first | .number // empty'
            )"
            if [[ -n "$merged_pr" ]]; then break; fi
            sleep 3
          done
          if [[ -z "$merged_pr" ]]; then
            echo "::error::refusing paper-validated promotion: main revision $validated_sha has no merged pull-request provenance"
            exit 1
          fi
          echo "paper_validation_source_pr=$merged_pr"

          if [[ "$current_validated_sha" != "$validated_sha" ]]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/paper-validated" \
              -f sha="$validated_sha" -F force=false >/dev/null
          fi
          echo "paper_validated_sha=$validated_sha"
