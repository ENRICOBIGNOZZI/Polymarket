name: Polymarket Control-Plane Event Bridge

on:
  workflow_dispatch:
  schedule:
    - cron: "11,26,41,56 * * * *"
  workflow_run:
    workflows:
      - "ci"
      - "monitoring"
      - "Private runtime single-writer validation"
      - "Polymarket Promotion Controller"
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: polymarket-control-plane-event-bridge
  cancel-in-progress: true

jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify current project context
        run: |
          set -euo pipefail
          python3 scripts/validate_project_context.py --root . --output event-bridge-project-context.md
          python3 -m json.tool config/operator_directives.json >/dev/null
          python3 -m json.tool config/scheduler_registry.json >/dev/null
      - name: Dispatch bounded next authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_NAME: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name || '' }}
          TRIGGER_CONCLUSION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion || '' }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" && "$TRIGGER_NAME" == "Polymarket Promotion Controller" ]]; then
            if [[ "$TRIGGER_CONCLUSION" == "success" ]]; then
              gh workflow run integration-merge.yml --ref main
              echo 'dispatched=integration-merge.yml reason=promotion-controller-success' >> "$GITHUB_STEP_SUMMARY"
            else
              echo "no_dispatch=integration-merge.yml reason=promotion-controller-${TRIGGER_CONCLUSION:-unknown}" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            gh workflow run promotion-controller.yml --ref main
            echo "dispatched=promotion-controller.yml trigger=${TRIGGER_NAME:-$GITHUB_EVENT_NAME} conclusion=${TRIGGER_CONCLUSION:-n/a}" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Enforce bridge authority boundary
        run: |
          set -euo pipefail
          test "$GITHUB_WORKFLOW" = "Polymarket Control-Plane Event Bridge"
          echo 'Bridge authority is limited to promotion-controller and integration-merge dispatch.' >> "$GITHUB_STEP_SUMMARY"
