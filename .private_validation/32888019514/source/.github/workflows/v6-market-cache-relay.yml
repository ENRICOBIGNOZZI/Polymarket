name: V6 market cache relay

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["deploy-paper-server"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/workflows/v6-market-cache-relay.yml"
      - "config/live_champion.json"
      - "config/paper_v6.json"
      - "scripts/v6_market_proxy.py"
      - "scripts/v6_market_snapshot.py"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: polymarket-v6-market-cache-relay
  cancel-in-progress: false

jobs:
  relay:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SERVER_HOST: ${{ vars.POLYMARKET_SERVER_HOST || '100.104.183.109' }}
      SERVER_USER: ${{ vars.POLYMARKET_SERVER_USER || 'enrico' }}
      SERVER_PORT: ${{ vars.POLYMARKET_SERVER_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Select existing Tailscale credential mode
        id: tailscale_auth
        shell: bash
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TS_TAGS: ${{ vars.TS_TAGS || 'tag:ci' }}
        run: |
          set -euo pipefail
          if [[ -n "${TS_AUTHKEY:-}" ]]; then
            mode=authkey
          elif [[ -n "${TS_OAUTH_CLIENT_ID:-}" && -n "${TS_OAUTH_SECRET:-}" ]]; then
            test -n "${TS_TAGS:-}"
            mode=oauth
          else
            echo "No visible Tailscale credential set" >&2
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Join private tailnet with auth key
        if: steps.tailscale_auth.outputs.mode == 'authkey'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: ${{ env.SERVER_HOST }}

      - name: Join private tailnet with OAuth
        if: steps.tailscale_auth.outputs.mode == 'oauth'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TS_TAGS || 'tag:ci' }}
          ping: ${{ env.SERVER_HOST }}

      - name: Configure SSH identity
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.POLYMARKET_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}" || { echo "missing POLYMARKET_SERVER_SSH_KEY" >&2; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/polymarket_deploy
          chmod 600 ~/.ssh/polymarket_deploy
          ssh-keyscan -T 5 -p "$SERVER_PORT" "$SERVER_HOST" > ~/.ssh/known_hosts

      - name: Resolve manifest-selected V6 cache target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          target="$(ssh -i ~/.ssh/polymarket_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=10 -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/polymarket
          git fetch -q origin main paper-validated
          paper_validated_sha="$(git rev-parse origin/paper-validated)"
          test "$(git rev-parse HEAD)" = "$paper_validated_sha"
          printf 'paper_validated_sha=%s\n' "$paper_validated_sha"
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          manifest=json.loads(Path("config/live_champion.json").read_text(encoding="utf-8"))
          if int(manifest["version"]) != 6:
              print("active=false")
          else:
              root=str(manifest["run_root"])
              assert re.fullmatch(r"runs/[A-Za-z0-9._-]+", root), root
              print("active=true")
              print("run_root="+root)
          PY
          REMOTE
          )"
          printf '%s\n' "$target"
          active="$(printf '%s\n' "$target" | sed -n 's/^active=//p' | tail -n 1)"
          [[ "$active" == "true" || "$active" == "false" ]]
          echo "active=$active" >> "$GITHUB_OUTPUT"
          if [[ "$active" == "true" ]]; then
            root="$(printf '%s\n' "$target" | sed -n 's/^run_root=//p' | tail -n 1)"
            [[ "$root" =~ ^runs/[A-Za-z0-9._-]+$ ]]
            echo "run_root=$root" >> "$GITHUB_OUTPUT"
            paper_validated_sha="$(printf '%s\n' "$target" | sed -n 's/^paper_validated_sha=//p' | tail -n 1)"
            [[ "$paper_validated_sha" =~ ^[0-9a-f]{40}$ ]]
            echo "paper_validated_sha=$paper_validated_sha" >> "$GITHUB_OUTPUT"
          fi

      - name: Build fresh verified public market cache
        if: steps.target.outputs.active == 'true'
        shell: bash
        env:
          PAPER_VALIDATED_SHA: ${{ steps.target.outputs.paper_validated_sha }}
        run: |
          set -euo pipefail
          [[ "$PAPER_VALIDATED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch -q origin paper-validated
          git checkout --detach "$PAPER_VALIDATED_SHA"
          test "$(git rev-parse HEAD)" = "$PAPER_VALIDATED_SHA"
          mkdir -p relay-evidence
          python3 scripts/v6_market_snapshot.py \
            --output relay-evidence/market_proxy_cache.json \
            --status relay-evidence/market_proxy_status.json \
            --markets 300 --min-markets 100 --min-liquidity 10 \
            --max-cache-age-seconds 90 | tee relay-evidence/snapshot-summary.json
          python3 - relay-evidence/market_proxy_cache.json <<'PY'
          import json,sys,time
          payload=json.load(open(sys.argv[1],encoding="utf-8"))
          assert payload.get("schema") == "polymarket_v6_market_proxy_cache_v1"
          assert time.time()-float(payload["timestamp"]) <= 90
          assert len(payload.get("markets") or []) >= 100
          assert all(
              isinstance(row,dict) and str(row.get("id") or "")
              and str(row.get("conditionId") or "")
              and float(row.get("liquidityNum")) >= 10
              for row in payload["markets"]
          )
          PY

      - name: Transfer cache atomically to private V6 runtime
        if: steps.target.outputs.active == 'true'
        shell: bash
        env:
          RUN_ROOT_REL: ${{ steps.target.outputs.run_root }}
        run: |
          set -euo pipefail
          [[ "$RUN_ROOT_REL" =~ ^runs/[A-Za-z0-9._-]+$ ]]
          incoming="market_proxy_cache.json.relay.${GITHUB_RUN_ID}"
          scp -i ~/.ssh/polymarket_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            -P "$SERVER_PORT" relay-evidence/market_proxy_cache.json \
            "$SERVER_USER@$SERVER_HOST:polymarket/${RUN_ROOT_REL}/${incoming}"
          ssh -i ~/.ssh/polymarket_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=10 -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "RUN_ROOT_REL='$RUN_ROOT_REL' INCOMING='$incoming' bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/polymarket
          [[ "$RUN_ROOT_REL" =~ ^runs/[A-Za-z0-9._-]+$ ]]
          [[ "$INCOMING" =~ ^market_proxy_cache\.json\.relay\.[0-9]+$ ]]
          target="$RUN_ROOT_REL/market_proxy_cache.json"
          incoming="$RUN_ROOT_REL/$INCOMING"
          python3 - "$incoming" <<'PY'
          import json,sys,time
          path=sys.argv[1]
          value=json.load(open(path,encoding="utf-8"))
          assert value.get("schema") == "polymarket_v6_market_proxy_cache_v1"
          assert time.time()-float(value["timestamp"]) <= 120
          assert len(value.get("markets") or []) >= 100
          assert all(
              isinstance(row,dict) and str(row.get("id") or "")
              and str(row.get("conditionId") or "")
              and float(row.get("liquidityNum")) >= 10
              for row in value["markets"]
          )
          PY
          mv "$incoming" "$target"
          printf 'relay_cache_installed=%s\n' "$target"
          REMOTE

      - name: Publish relay summary
        if: always()
        shell: bash
        run: |
          echo "## V6 public-data cache relay" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.target.outputs.active }}" != "true" ]]; then
            echo "Manifest-selected champion is not V6; relay skipped." >> "$GITHUB_STEP_SUMMARY"
          elif [[ -s relay-evidence/snapshot-summary.json ]]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat relay-evidence/snapshot-summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload relay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-market-cache-relay-${{ github.run_id }}
          path: relay-evidence/
          if-no-files-found: warn
          retention-days: 7
