name: Load Polymarket project context
description: Materialize the complete repository inventory and canonical runtime/control-plane context for scheduler jobs.
runs:
  using: composite
  steps:
    - name: Materialize complete project context
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/project_context_snapshot.py \
          --root . \
          --manifest config/project_context.json \
          --output-json project-context.json \
          --output-markdown project-context.md
        test -s project-context.json
        test -s project-context.md
        echo "POLYMARKET_PROJECT_CONTEXT_JSON=$GITHUB_WORKSPACE/project-context.json" >> "$GITHUB_ENV"
        echo "POLYMARKET_PROJECT_CONTEXT_MARKDOWN=$GITHUB_WORKSPACE/project-context.md" >> "$GITHUB_ENV"
        echo '## Complete project context' >> "$GITHUB_STEP_SUMMARY"
        cat project-context.md >> "$GITHUB_STEP_SUMMARY"
