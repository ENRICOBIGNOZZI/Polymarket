groups:
  - name: polymarket-v7-two-engine-hard-safety
    rules:
      - alert: PolymarketV7ExporterDown
        expr: up{job="polymarket-v7"} == 0
        for: 30s
        labels: {severity: critical}
        annotations: {summary: "V7 PAPER exporter is unreachable"}
      - alert: PolymarketV7HealthFailed
        expr: polymarket_v7_health < 1
        for: 15s
        labels: {severity: critical}
        annotations: {summary: "The two-engine V7 health contract failed"}
      - alert: PolymarketV7PaperContractInvalid
        expr: polymarket_v7_paper_only_contract_ok < 1
        for: 0s
        labels: {severity: critical}
        annotations: {summary: "PAPER-only contract is invalid"}
      - alert: PolymarketV7AuthenticatedExecutionEnabled
        expr: polymarket_v7_authenticated_execution_disabled < 1
        for: 0s
        labels: {severity: critical}
        annotations: {summary: "Authenticated execution is not disabled"}
      - alert: PolymarketV7AlgorithmScopeInvalid
        expr: (polymarket_v7_live_algorithm_count != 2) or (polymarket_v7_legacy_algorithm_count != 0) or (polymarket_v7_live_algorithm_scope_wired < 1)
        for: 0s
        labels: {severity: critical}
        annotations: {summary: "Live scope is not exactly the two canonical algorithms"}
      - alert: PolymarketV7NewRiskUnexpectedlyEnabled
        expr: polymarket_v7_economic_new_risk_ready > 0
        for: 0s
        labels: {severity: critical}
        annotations: {summary: "New-risk authority must remain disabled"}
      - alert: PolymarketV7ExecutionOwnerDown
        expr: polymarket_v7_execution_alive < 1
        for: 15s
        labels: {severity: critical}
        annotations: {summary: "Canonical V7 runtime process is down"}
      - alert: PolymarketV7SupervisorDown
        expr: polymarket_v7_supervisor_alive < 1
        for: 30s
        labels: {severity: critical}
        annotations: {summary: "Canonical V7 supervisor is down"}
      - alert: PolymarketV7DuplicateWriter
        expr: polymarket_v7_single_writer_ok < 1
        for: 5s
        labels: {severity: critical}
        annotations: {summary: "Single-writer proof failed"}
      - alert: PolymarketV7ExactShaDrift
        expr: polymarket_v7_exact_sha_ok < 1
        for: 0s
        labels: {severity: critical}
        annotations: {summary: "Runtime SHA differs from deployed HEAD"}
      - alert: PolymarketV7KillSwitchEngaged
        expr: polymarket_runtime_killed > 0
        for: 0s
        labels: {severity: critical}
        annotations: {summary: "PAPER kill switch is engaged"}
      - alert: PolymarketV7HardDrawdownLimitBreach
        expr: polymarket_runtime_drawdown_ratio >= polymarket_v7_authority_max_drawdown_ratio
        for: 0s
        labels: {severity: critical}
        annotations: {summary: "PAPER drawdown reached the operator ceiling"}
      - alert: PolymarketV7ProfessionalMakerDown
        expr: polymarket_v7_component_ready{component="professional_maker"} < 1
        for: 30s
        labels: {severity: critical}
        annotations: {summary: "Crypto Settlement Engine maker component is unavailable"}
      - alert: PolymarketV7StructuralEngineDown
        expr: polymarket_v7_component_ready{component="fast_structural"} < 1
        for: 30s
        labels: {severity: critical}
        annotations: {summary: "Structural Arbitrage Engine component is unavailable"}
      - alert: PolymarketV7CanonicalLedgerInvalid
        expr: polymarket_v7_ledger_valid < 1
        for: 0s
        labels: {severity: critical}
        annotations: {summary: "Canonical V7 ledger is invalid or missing"}
      - alert: PolymarketV7AccountingDivergence
        expr: polymarket_v7_portfolio_reconciled < 1
        for: 15s
        labels: {severity: critical}
        annotations: {summary: "Ledger, engine state and portfolio accounting diverged"}
      - alert: PolymarketV7TradeTapeEmpty
        expr: (polymarket_v7_trade_tape_rows <= 0) and (polymarket_v7_trade_tape_no_standard_clob_flow < 1)
        for: 30s
        labels: {severity: critical}
        annotations: {summary: "Public trade tape is empty without verified no-flow evidence"}
      - alert: PolymarketV7PortfolioGuardStale
        expr: polymarket_v7_state_age_seconds{state="portfolio"} > 30
        for: 15s
        labels: {severity: critical}
        annotations: {summary: "Account portfolio guard is stale"}
      - alert: PolymarketV7RuntimeStateStale
        expr: polymarket_v7_state_age_seconds{state=~"runtime|economics|trade_tape"} > 180
        for: 15s
        labels: {severity: critical}
        annotations: {summary: "A canonical runtime surface is stale"}
      - alert: PolymarketV7DiskPressure
        expr: polymarket_v7_disk_free_ratio < 0.20
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "V7 runtime disk is under pressure"}
      - alert: PolymarketV7RestartStorm
        expr: polymarket_v7_restart_count_window >= 3
        for: 0s
        labels: {severity: critical}
        annotations: {summary: "V7 runtime is repeatedly restarting"}
      - alert: PolymarketV7SettlementOracleStale
        expr: (polymarket_external_fair_present > 0) and (polymarket_external_fair_oracle_healthy < 1)
        for: 30s
        labels: {severity: critical}
        annotations: {summary: "Settlement oracle is stale or unhealthy"}
