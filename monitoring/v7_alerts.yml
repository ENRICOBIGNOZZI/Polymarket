groups:
  - name: polymarket-v7-hard-safety
    rules:
      - alert: PolymarketV7ExporterDown
        expr: up{job="polymarket-v7"} == 0
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: V7 PAPER exporter is unreachable
          description: Prometheus cannot scrape the canonical V7 PAPER exporter.

      - alert: PolymarketV7RuntimeContractInvalid
        expr: polymarket_v7_runtime_info < 1
        for: 15s
        labels: {severity: critical}
        annotations:
          summary: Canonical runtime is not V7
          description: The monitored PAPER runtime does not identify as the canonical V7 runtime.

      - alert: PolymarketV7PaperContractInvalid
        expr: polymarket_v7_paper_only_contract_ok < 1
        for: 0s
        labels: {severity: critical}
        annotations:
          summary: V7 PAPER-only contract is not satisfied
          description: Runtime or account portfolio guard PAPER-only state is missing or false.

      - alert: PolymarketV7AuthenticatedExecutionEnabled
        expr: polymarket_v7_authenticated_execution_disabled < 1
        for: 0s
        labels: {severity: critical}
        annotations:
          summary: Authenticated execution prohibition is not satisfied
          description: Runtime or account guard no longer explicitly disables authenticated/real execution.

      - alert: PolymarketV7KillSwitchEngaged
        expr: polymarket_runtime_killed > 0
        for: 0s
        labels: {severity: critical}
        annotations:
          summary: V7 PAPER kill switch is engaged
          description: The canonical account-level PAPER guard reports a killed state.

      - alert: PolymarketV7HardDrawdownLimitBreach
        expr: polymarket_runtime_drawdown_ratio >= polymarket_v7_authority_max_drawdown_ratio
        for: 0s
        labels: {severity: critical}
        annotations:
          summary: V7 PAPER drawdown reached the current operator ceiling
          description: Account drawdown is at or above the max-drawdown value read from operator_directives.json.

      - alert: PolymarketV7ExecutionOwnerDown
        expr: polymarket_v7_execution_alive < 1
        for: 15s
        labels: {severity: critical}
        annotations:
          summary: Canonical V7 runtime process is down
          description: The exact-SHA V7 process-group owner is not alive.

      - alert: PolymarketV7ProfessionalMakerDown
        expr: polymarket_v7_component_ready{component="professional_maker"} < 1
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: Professional maker is not operational
          description: The primary PAPER maker or its exact-SHA market selector is missing, stale, unsafe or not started.

      - alert: PolymarketV7MakerRewardFallback
        expr: polymarket_v7_maker_selector_fallback_active > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Maker is using the liquidity-universe fallback
          description: PAPER quoting remains operational with reward assumptions forced to zero, but the public rewards catalog is unavailable.

      - alert: PolymarketV7MakerCohortSupervisorDown
        expr: polymarket_v7_maker_cohort_supervisor_ready < 1
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: Maker selection cohort supervisor is unavailable
          description: The PAPER maker and its two evidence observers can no longer rotate together through the flat-state handoff.

      - alert: PolymarketV7MakerRotationBlockedByInventory
        expr: polymarket_v7_maker_rotation_blocked_nonflat > 0
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: Maker universe rotation is waiting for flat inventory
          description: Runtime safety is intact, but the executable-flow candidate cannot replace the pinned maker universe until PAPER inventory is flat.

      - alert: PolymarketV7SupervisorDown
        expr: polymarket_v7_supervisor_alive < 1
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: Canonical V7 supervisor is down
          description: The bounded exact-SHA FULL-PAPER supervisor is not alive.

      - alert: PolymarketV7ResearchShadowSupervisorDown
        expr: (polymarket_v7_research_supervisor_alive < 1) or (polymarket_v7_research_manifest_fresh < 1)
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: V7 research-shadow supervisor is down
          description: Sports latency, cross-platform and wallet intelligence are no longer attached to the exact-SHA live-PAPER runtime.

      - alert: PolymarketV7LiveModelScopeIncomplete
        expr: polymarket_v7_live_model_target_operational < 1
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: Approved 12-model live-PAPER scope is incomplete
          description: One or more of the 12 approved live-PAPER models is blocked or degraded; inspect operational, external-blocker and configuration-blocker metrics.

      - alert: PolymarketV7ExternalInputImplementationMissing
        expr: polymarket_v7_external_input_implementation_complete{strategy=~"sports_latency|cross_platform"} < 1
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: V7 external input implementation is missing
          description: A required sports or cross-platform component is no longer implementation-complete.

      - alert: PolymarketV7ExternalFeedBlocked
        expr: polymarket_v7_external_input_feed_operational{strategy=~"sports_latency|cross_platform"} < 1
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: V7 external feed is blocked
          description: Inspect polymarket_v7_external_input_info for the exact provider, feed, mapping and blocker labels.

      - alert: PolymarketV7DuplicateWriter
        expr: polymarket_v7_single_writer_ok < 1
        for: 5s
        labels: {severity: critical}
        annotations:
          summary: Canonical V7 single-writer proof failed
          description: Runtime PID, live process, and canonical runtime lock no longer identify exactly one writer.

      - alert: PolymarketV7ExactShaDrift
        expr: polymarket_v7_exact_sha_ok < 1
        for: 0s
        labels: {severity: critical}
        annotations:
          summary: V7 runtime exact-SHA drift detected
          description: The runtime-reported SHA differs from the deployed repository HEAD.

      - alert: PolymarketV7CanonicalLedgerUnavailable
        expr: (polymarket_v7_ledger_present < 1) or (polymarket_v7_ledger_writable < 1)
        for: 5s
        labels: {severity: critical}
        annotations:
          summary: Canonical V7 ledger is unavailable
          description: The one append-only PAPER ledger is missing or its owned path is not writable.

      - alert: PolymarketV7GrafanaDown
        expr: polymarket_v7_monitoring_component_up{component="grafana"} < 1
        for: 60s
        labels: {severity: warning}
        annotations:
          summary: Canonical Grafana operator home is down
          description: The local Grafana listener is unavailable while exporter telemetry remains healthy.

      - alert: PolymarketV7DiskPressure
        expr: polymarket_v7_disk_free_ratio < 0.20 or polymarket_v7_disk_free_bytes < 5368709120
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: V7 runtime disk is under pressure
          description: Free disk is below 20 percent or 5 GiB; retention and immutable-ledger archival need attention.

      - alert: PolymarketV7DiskPressureCritical
        expr: polymarket_v7_disk_free_ratio < 0.10
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: V7 runtime disk pressure is critical
          description: Free disk is below 10 percent; preserve the ledger and withdraw/quarantine safely.

      - alert: PolymarketV7RestartStorm
        expr: polymarket_v7_restart_count_window >= 3
        for: 0s
        labels: {severity: critical}
        annotations:
          summary: V7 runtime is repeatedly restarting
          description: At least three bounded restart attempts occurred in the current supervision window.

      - alert: PolymarketV7StateMissing
        expr: polymarket_v7_state_present == 0
        for: 15s
        labels: {severity: critical}
        annotations:
          summary: Required V7 state surface is missing
          description: A monitored canonical V7 runtime surface is absent; inspect the surface label.

      - alert: PolymarketV7PortfolioGuardStale
        expr: polymarket_v7_state_age_seconds{surface="portfolio"} > 30
        for: 15s
        labels: {severity: critical}
        annotations:
          summary: V7 account portfolio guard is stale
          description: The account-level drawdown/kill guard has not refreshed within 30 seconds.

      - alert: PolymarketV7RuntimeStateStale
        expr: polymarket_v7_state_age_seconds{surface=~"runtime|graph|economics|trade_tape|trade_recorder"} > 180
        for: 15s
        labels: {severity: critical}
        annotations:
          summary: A canonical V7 runtime/data/economics surface is stale
          description: Runtime, Graph/RV, canonical economics, trade tape, or recorder liveness exceeds the freshness bound.

      - alert: PolymarketV7TradeTapeEmpty
        expr: (polymarket_v7_trade_tape_rows <= 0) and (polymarket_v7_trade_tape_no_standard_clob_flow < 1)
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: V7 receive-time public trade tape is empty
          description: Causal PAPER fill replay has neither public trade observations nor a fresh complete scan proving a no-standard-CLOB-flow regime.

      - alert: PolymarketV7RetentionStale
        expr: (polymarket_v7_retention_status_present < 1) or (polymarket_v7_retention_status_age_seconds > 7200)
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: V7 immutable retention/checkpoint service is stale
          description: The hourly append-only ledger checkpoint and bounded telemetry retention service has not reported within two hours.

      - alert: PolymarketV7SlowEconomicShadowDetached
        expr: (polymarket_v7_slow_economic_shadow_attached < 3) or (polymarket_v7_slow_economic_shadow_manifest_fresh < 1)
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: V7 slow economic shadow collection is detached
          description: Ranking, PCA or Local Factor is no longer continuously supervised in zero-capital shadow mode.

      - alert: PolymarketV7FeeRegistryHasNoExecutableMarket
        expr: polymarket_v7_fee_registry_executable_markets < 1
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: V7 fee registry has no executable market
          description: Every market is fail-closed because no fresh authoritative fee schedule is available.

      - alert: PolymarketV7CanonicalLedgerInvalid
        expr: (polymarket_v7_ledger_present > 0) and (polymarket_v7_ledger_valid < 1)
        for: 0s
        labels: {severity: critical}
        annotations:
          summary: Canonical V7 execution ledger is invalid
          description: The canonical ledger is present but invalid or mixed-SHA; fill and PnL evidence must not be trusted.

      - alert: PolymarketV7AccountingDivergence
        expr: polymarket_v7_portfolio_reconciled < 1
        for: 15s
        labels: {severity: critical}
        annotations:
          summary: V7 ledger, sleeve state and portfolio accounting diverged
          description: Economic promotion is fail-closed until canonical terminal PnL, sleeve realized PnL, allocation and portfolio equity reconcile.

      - alert: PolymarketV7SettlementOracleStale
        expr: (polymarket_external_fair_present > 0) and (polymarket_external_fair_oracle_healthy < 1)
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: Active settlement oracle is stale or unhealthy
          description: Only settlement-dependent contracts must be quarantined; unrelated healthy maker markets may continue.
