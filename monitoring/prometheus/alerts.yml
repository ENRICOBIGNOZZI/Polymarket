groups:
  - name: polymarket-v7-paper
    rules:
      - alert: PolymarketV7ExporterDown
        expr: up{job="polymarket-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: V7 PAPER telemetry exporter is down
          description: Prometheus has not scraped the V7 exporter for one minute.

      - alert: PolymarketV7ExecutionStale
        expr: polymarket_runtime_execution_staleness_seconds > 60
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: V7 execution telemetry is stale
          description: Canonical V7 execution state has been stale for more than 60 seconds.

      - alert: PolymarketV7DrawdownWarning
        expr: polymarket_runtime_drawdown_ratio >= 0.10
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: V7 PAPER drawdown above 10 percent
          description: V7 has crossed the pre-kill drawdown warning threshold.

      - alert: PolymarketV7HardDrawdownLimitBreach
        expr: polymarket_runtime_drawdown_ratio >= 0.15
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: V7 PAPER breached the 15 percent hard drawdown limit
          description: New PAPER risk must remain frozen at or above the operator-authorized hard drawdown ceiling.

      - alert: PolymarketV7KillSwitchActive
        expr: polymarket_runtime_kill_switch == 1
        labels:
          severity: critical
        annotations:
          summary: V7 PAPER kill switch is active
          description: New V7 risk is frozen by the persisted aggregate kill switch.

      - alert: PolymarketV7SleeveMissing
        expr: polymarket_allocator_models_alive < polymarket_allocator_models_expected
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: One or more V7 strategy sleeves are unavailable
          description: The canonical V7 allocator reports fewer live sleeves than expected.

      - alert: PolymarketV7SleeveStateStale
        expr: max(polymarket_model_alert_staleness_seconds) > 120
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: A V7 strategy sleeve is stale
          description: At least one V7 strategy status has exceeded the bounded 120 second staleness threshold.

      - alert: PolymarketV7ExecutionImbalance
        expr: polymarket_runtime_execution_imbalance_ratio > 0.50
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: V7 has severe execution imbalance
          description: Cross-leg fill imbalance exceeds 50 percentage points in the canonical V7 PAPER runtime.

      - alert: PolymarketV7ShadowStale
        expr: polymarket_v7_shadow_staleness_seconds > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: V7 shadow research state is stale
          description: Multi-frequency V7 shadow research has not refreshed for fifteen minutes.
