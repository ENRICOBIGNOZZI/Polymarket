groups:
  - name: polymarket-v7-runtime
    rules:
      - alert: PolymarketV7ExporterDown
        expr: up{job="polymarket-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: V7 telemetry exporter is down
          description: Prometheus has not been able to scrape the V7 exporter for one minute.

      - alert: PolymarketV7RuntimeDrawdownWarning
        expr: polymarket_runtime_drawdown_ratio >= 0.10
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: V7 PAPER runtime drawdown above 10%
          description: Aggregate marked drawdown has crossed the warning threshold.

      - alert: PolymarketV7RuntimeDrawdownLimit
        expr: polymarket_runtime_drawdown_ratio >= 0.15
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: V7 PAPER runtime reached the 15% drawdown limit
          description: Aggregate marked drawdown is at or above the hard PAPER drawdown limit.

      - alert: PolymarketV7KillSwitchActive
        expr: polymarket_runtime_kill_switch == 1
        labels:
          severity: critical
        annotations:
          summary: V7 runtime kill switch is active
          description: New PAPER risk must remain frozen while the aggregate kill switch is active.

      - alert: PolymarketV7ExecutionStale
        expr: polymarket_runtime_execution_staleness_seconds > 60
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: V7 execution telemetry is stale
          description: Canonical V7 execution inputs or state have been stale for more than two minutes.

      - alert: PolymarketV7ExecutionImbalance
        expr: polymarket_runtime_execution_imbalance_ratio > 0.50
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: V7 runtime has severe execution imbalance
          description: Cross-leg execution imbalance exceeds 50 percentage points.

      - alert: PolymarketV7AllocatorMissing
        expr: polymarket_allocator_state_present == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: V7 allocator state is missing
          description: Aggregate and per-strategy PAPER PnL cannot be trusted while allocator state is absent.

      - alert: PolymarketV7StrategyMissing
        expr: polymarket_allocator_models_alive < polymarket_allocator_models_expected
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: One or more V7 strategy books are unavailable
          description: At least one canonical V7 PAPER strategy book is not alive.

      - alert: PolymarketV7StrategyStateStale
        expr: max(polymarket_model_staleness_seconds) > 120
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: A V7 strategy state is stale
          description: At least one V7 strategy book has not refreshed within the accepted state-age window.

      - alert: PolymarketV7StrategyKillSwitchActive
        expr: max(polymarket_model_kill_switch) == 1
        labels:
          severity: warning
        annotations:
          summary: A V7 strategy-local kill switch is active
          description: One canonical V7 PAPER strategy has frozen new risk.

      - alert: PolymarketV7GrossLimitBreach
        expr: polymarket_allocator_global_gross_fraction > 1
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: V7 aggregate gross exposure exceeds the hard ceiling
          description: Aggregate PAPER gross exposure is above the configured 100% hard ceiling.
