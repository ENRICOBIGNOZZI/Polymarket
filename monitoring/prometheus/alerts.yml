groups:
  - name: polymarket-paper-live
    rules:
      - alert: PolymarketExporterDown
        expr: up{job="polymarket-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Polymarket telemetry exporter is down
          description: Prometheus has not been able to scrape the exporter for one minute.

      - alert: PolymarketMakerDataStale
        expr: (polymarket_maker_state_present == 0) or (polymarket_maker_staleness_seconds > 60)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Paper-maker state is stale
          description: The latest legacy maker equity snapshot is more than 60 seconds old.

      - alert: PolymarketMakerDrawdownWarning
        expr: polymarket_maker_drawdown_ratio >= 0.10
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Paper-maker drawdown above 10%
          description: Current marked drawdown has crossed the warning threshold.

      - alert: PolymarketMakerKillSwitchActive
        expr: polymarket_maker_kill_switch == 1
        labels:
          severity: critical
        annotations:
          summary: Paper-maker kill switch is active
          description: New legacy maker risk is frozen by the persisted drawdown kill switch.

  - name: polymarket-simulated-live
    rules:
      - alert: PolymarketSimulatedLiveDown
        expr: polymarket_terminal_state_present == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Simulated live paper account is down
          description: The legacy primary live-data paper simulator state is missing; displayed zero PnL must not be treated as valid performance.

      - alert: PolymarketSimulatedLiveDataStale
        expr: polymarket_terminal_staleness_seconds > 60
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Simulated live paper telemetry is stale
          description: The legacy simulated-live account has not refreshed for more than 60 seconds; risk and PnL visibility are stale.

      - alert: PolymarketSimulatedLiveDrawdownWarning
        expr: polymarket_terminal_drawdown_ratio >= 0.10
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Simulated live paper drawdown above 10%
          description: The legacy simulated-live account has crossed the pre-kill drawdown warning level.

      - alert: PolymarketSimulatedLiveKillSwitchActive
        expr: polymarket_terminal_kill_switch == 1
        labels:
          severity: critical
        annotations:
          summary: Simulated live paper kill switch is active
          description: The legacy simulated-live account has frozen new risk through its persisted kill switch.

  - name: polymarket-latest-runtime
    rules:
      - alert: PolymarketLatestExecutionStale
        expr: polymarket_runtime_execution_staleness_seconds > 60
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Latest Polymarket execution telemetry is stale
          description: The auto-selected runtime has stale execution inputs/state; escalation to real money must remain blocked.

      - alert: PolymarketLatestDrawdownWarning
        expr: polymarket_runtime_drawdown_ratio >= 0.10
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Latest Polymarket paper runtime drawdown above 10%
          description: The auto-selected runtime has crossed the pre-kill drawdown warning level.

      - alert: PolymarketLatestKillSwitchActive
        expr: polymarket_runtime_kill_switch == 1
        labels:
          severity: critical
        annotations:
          summary: Latest Polymarket runtime kill switch is active
          description: New risk must remain frozen until the latest runtime is flat and reviewed.

      - alert: PolymarketLatestExecutionImbalance
        expr: polymarket_runtime_execution_imbalance_ratio > 0.50
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Latest Polymarket runtime has severe execution imbalance
          description: Cross-leg fill imbalance exceeds 50 percentage points in the auto-selected runtime.

      - alert: PolymarketLatestOOSReportStale
        expr: (polymarket_runtime_oos_trades > 0) and (polymarket_runtime_oos_staleness_seconds > 7200)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Latest Polymarket OOS report is stale
          description: The auto-selected runtime's walk-forward gate is more than two hours old.

  - name: polymarket-v5-independent-models
    rules:
      - alert: PolymarketV5AllocatorDown
        expr: polymarket_allocator_state_present == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: V5 paper allocator state is missing
          description: Aggregate and per-strategy PnL cannot be trusted while the independent-model allocator state is absent.

      - alert: PolymarketV5ModelProcessMissing
        expr: polymarket_allocator_models_alive < polymarket_allocator_models_expected
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: One or more V5 model processes are unavailable
          description: At least one independent micro, PCA, graph, semantic, or external paper book is not running.

      - alert: PolymarketV5ModelStateStale
        expr: max(polymarket_model_alert_staleness_seconds) > 60
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: An independent V5 model state is stale
          description: At least one model book is stale outside the bounded pre-first-output startup grace; risk and PnL visibility require review.

      - alert: PolymarketV5ModelKillSwitchActive
        expr: max(polymarket_model_kill_switch) == 1
        labels:
          severity: warning
        annotations:
          summary: A V5 model-local kill switch is active
          description: One independent paper strategy has frozen new risk and requires attribution review.

      - alert: PolymarketV5GrossLimitBreach
        expr: polymarket_allocator_global_gross_fraction > polymarket_allocator_global_max_gross_fraction
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: V5 aggregate gross exposure exceeds its configured cap
          description: The capital-level allocator has breached the aggregate paper gross limit; new risk must remain blocked.

      - alert: PolymarketV5LogCompactionStale
        expr: (polymarket_log_compaction_state_present == 0) or (polymarket_log_compaction_success == 0) or (polymarket_log_compaction_staleness_seconds > 300)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: V5 bounded strategy-log compaction is missing, failed, or stale
          description: Signal, arbitrage, and PCA-history retention has not completed successfully within five minutes; disk and Grafana performance require review.
