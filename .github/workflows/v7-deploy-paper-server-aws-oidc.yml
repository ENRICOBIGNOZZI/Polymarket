name: V7 deploy PAPER server AWS OIDC

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-paper-deploy-aws-oidc-request.json
      - deploy/v7-paper-fast-restart-existing-request.json
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main SHA approved for PAPER cutover
        required: true
        type: string
      cutover_approved:
        description: Confirm PAPER-only London cutover via AWS SSM
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  checks: read
  id-token: write

concurrency:
  group: polymarket-v7-paper-server
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, 'fast restart PAPER existing')) || (github.event_name == 'workflow_dispatch' && inputs.cutover_approved == true) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
      SERVER_HOST: ${{ vars.POLYMARKET_SERVER_HOST || '100.104.183.109' }}
      LONDON_INSTANCE_ID: ${{ vars.POLYMARKET_LONDON_INSTANCE_ID || 'i-0fba2bac9fdc5cbeb' }}
      EXPECTED_DEPLOY_SHA: ${{ inputs.expected_sha }}
      REQUEST_PATH: deploy/v7-paper-deploy-aws-oidc-request.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Fail-closed exact-SHA PAPER request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD)" = "$main_sha"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            parent_sha="${{ github.event.before }}"
            changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
            test "$changed" = "$REQUEST_PATH"
            python3 - "$REQUEST_PATH" "$parent_sha" "$ROLE_ARN" "$GITHUB_OUTPUT" <<'PY'
          import json,re,sys
          from pathlib import Path
          req=Path(sys.argv[1])
          parent, role = sys.argv[2], sys.argv[3]
          v=json.loads(req.read_text(encoding='utf-8'))
          assert set(v)=={'schema','version','request_id','expected_parent_sha','role_arn','paper_only','authenticated_execution','real_order_submission','cutover_approved','trigger'}
          assert v['schema']=='polymarket_v7_aws_oidc_paper_deploy_request_v1'
          assert v['version']==1
          assert isinstance(v['request_id'],str) and re.fullmatch(r'[A-Za-z0-9._:-]{8,128}', v['request_id'])
          assert v['expected_parent_sha']==parent
          assert v['role_arn']==role
          assert v['paper_only'] is True
          assert v['authenticated_execution'] is False
          assert v['real_order_submission'] is False
          assert v['cutover_approved'] is True
          assert v['trigger']=='GITHUB_AWS_OIDC_SSM_ONE_SHOT'
          with open(sys.argv[4],'a',encoding='utf-8') as h:
              h.write(f"request_id={v['request_id']}\n")
          PY
            expected_sha="$parent_sha"
          else
            [[ "$EXPECTED_DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$EXPECTED_DEPLOY_SHA" = "$main_sha"
            expected_sha="$EXPECTED_DEPLOY_SHA"
            echo "request_id=manual-dispatch" >> "$GITHUB_OUTPUT"
          fi
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          git checkout --detach "$expected_sha"
          test "$(git rev-parse HEAD)" = "$expected_sha"
          python3 scripts/v7_cutover_contract.py --repository-root . --expected-head "$expected_sha" >/dev/null
          printf 'request_result=ready\nrequest_sha=%s\nexpected_sha=%s\n' "$main_sha" "$expected_sha" | tee deploy-evidence.txt

      - name: Wait for target exact-SHA release gates
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.expected_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          deadline=$((SECONDS + 900))
          while true; do
            set +e
            python3 scripts/v7_exact_sha_ci_gate.py \
              --repository "$GITHUB_REPOSITORY" --sha "$EXPECTED_SHA" \
              --required-check ci-v7-Release \
              --required-check ci-v7-Debug \
              --required-check sanitizer-v7 \
              --required-check security-audit-v7 \
              --required-check london-runtime-boundary-v7 \
              --required-check monitoring-v7 \
              --required-check single-writer-v7 \
              --output "$RUNNER_TEMP/exact-sha-ci-$EXPECTED_SHA.json"
            rc=$?
            set -e
            if [[ "$rc" == 0 ]]; then
              echo "exact_sha_release_gates=green" | tee -a deploy-evidence.txt
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "exact-SHA release gates did not become green" >&2
              exit "$rc"
            fi
            sleep 5
          done

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: polymarket-v7-paper-deploy
          aws-region: eu-west-2

      - name: Deploy exact SHA through AWS SSM
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          aws sts get-caller-identity --region eu-west-2 --output json | tee -a deploy-evidence.txt

          artifact_root="$RUNNER_TEMP/runtime-artifacts"
          source_root="$RUNNER_TEMP/research-source-empty"
          archive_root="$RUNNER_TEMP/research-archive-empty"
          durable_root="$RUNNER_TEMP/research-durable"
          mkdir -p "$source_root" "$archive_root" "$durable_root" "$artifact_root"
          PM_V7_RESEARCH_SOURCE_ROOT="$source_root" \
            PM_V7_RESEARCH_ARCHIVE_ROOT="$archive_root" \
            PM_V7_RESEARCH_DURABLE_ROOT="$durable_root" \
            PM_V7_RESEARCH_ARTIFACT_ROOT="$artifact_root" \
            research/build_runtime_artifacts.sh "$EXPECTED_SHA"

          bundle="$artifact_root/by-sha/$EXPECTED_SHA"
          test -s "$bundle/manifest.json"
          artifact_tgz="$RUNNER_TEMP/runtime-artifact-$EXPECTED_SHA.tgz"
          tar -C "$bundle" -czf "$artifact_tgz" .

          receipt="$RUNNER_TEMP/v7-ssm-deploy-$EXPECTED_SHA.json"
          python3 ops/v7_london_ssm_deploy.py \
            --expected-sha "$EXPECTED_SHA" \
            --expected-tailscale-ip "$SERVER_HOST" \
            --expected-instance-id "$LONDON_INSTANCE_ID" \
            --artifact "$artifact_tgz" \
            --region eu-west-2 \
            --output "$receipt" | tee -a deploy-evidence.txt
          test -s "$receipt"
          python3 - "$receipt" "$EXPECTED_SHA" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1],encoding='utf-8'))
          assert v.get('schema')=='polymarket_v7_ssm_deploy_receipt_v1'
          assert v.get('expected_sha')==sys.argv[2]
          assert v.get('paper_only') is True
          assert v.get('authenticated_execution') is False
          assert v.get('real_order_submission') is False
          assert (v.get('cutover') or {}).get('sha')==sys.argv[2]
          print('deploy_result=success_aws_oidc_ssm')
          print('deployed_sha='+sys.argv[2])
          PY
          cp "$receipt" v7-ssm-deploy-receipt.json

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v7-paper-server-aws-oidc-deploy-${{ github.run_id }}
          path: |
            deploy-evidence.txt
            v7-ssm-deploy-receipt.json
          if-no-files-found: warn
          retention-days: 14

  fast_restart:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'fast restart PAPER existing') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
      LONDON_INSTANCE_ID: ${{ vars.POLYMARKET_LONDON_INSTANCE_ID || 'i-0fba2bac9fdc5cbeb' }}
      FAST_REQUEST_PATH: deploy/v7-paper-fast-restart-existing-request.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 2

      - name: Resolve fast restart request
        id: fast
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          test "$changed" = "$FAST_REQUEST_PATH"
          python3 - "$FAST_REQUEST_PATH" "$GITHUB_OUTPUT" <<'PY'
          import json,re,sys
          from pathlib import Path
          v=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert set(v)=={'schema','version','request_id','expected_sha','paper_only','authenticated_execution','real_order_submission','restart_approved','trigger'}
          assert v['schema']=='polymarket_v7_paper_fast_restart_existing_request_v1'
          assert v['version']==1
          assert isinstance(v['request_id'],str) and re.fullmatch(r'[A-Za-z0-9._:-]{8,128}', v['request_id'])
          assert re.fullmatch(r'[0-9a-f]{40}', v['expected_sha'])
          assert v['paper_only'] is True
          assert v['authenticated_execution'] is False
          assert v['real_order_submission'] is False
          assert v['restart_approved'] is True
          assert v['trigger']=='GITHUB_AWS_OIDC_SSM_FAST_RESTART_EXISTING'
          with open(sys.argv[2],'a',encoding='utf-8') as h:
              h.write(f"expected_sha={v['expected_sha']}\n")
          PY
          echo fast_restart_request=ready | tee fast-restart-existing-evidence.txt

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: polymarket-v7-paper-fast-restart-existing
          aws-region: eu-west-2

      - name: Fast restart existing PAPER runtime
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.fast.outputs.expected_sha }}
        run: |
          set -euo pipefail
          python3 - "$EXPECTED_SHA" "$LONDON_INSTANCE_ID" <<'PY' | tee -a fast-restart-existing-evidence.txt
          import json, shlex, subprocess, sys, textwrap, time
          sha, instance = sys.argv[1], sys.argv[2]
          remote = textwrap.dedent(r'''
          set -euo pipefail
          SHA="__SHA__"
          UNIT="polymarket-v7-paper.service"
          EXPORTER="polymarket-v7-exporter.service"
          echo fast_existing=pre_restart_status
          systemctl status "$UNIT" --no-pager -l || true
          journalctl -u "$UNIT" -n 120 --no-pager || true

          APP_DIR="$(systemctl show "$UNIT" -p WorkingDirectory --value)"
          ROOT="$(systemctl show "$UNIT" -p Environment --value | python3 -c 'import shlex,sys; print(next((x.split("=",1)[1] for x in shlex.split(sys.stdin.read()) if x.startswith("PM_V7_RUN_ROOT=")), ""))')"
          [[ -n "$APP_DIR" && "$APP_DIR" == /* && -n "$ROOT" && "$ROOT" == /* ]]

          echo fast_existing=pre_supervisor_status
          cat "$ROOT/control/supervisor_status.json" || true
          echo fast_existing=pre_runtime_status
          cat "$ROOT/control/runtime_status.json" || true
          echo fast_existing=pre_kill_marker
          cat "$ROOT/control/KILL" || true
          for log in \
            "$ROOT/native_engine_manager.log" \
            "$ROOT/native_crypto_settlement_engine.log" \
            "$ROOT/ledger_router.log" \
            "$ROOT/trade_recorder.log" \
            "$ROOT/external_fair/external_assets_supervisor.log" \
            "$ROOT/external_fair/rtds_monitor.log" \
            "$ROOT/research/repricing_book_observer.log" \
            "$ROOT/canonical_economics.log" \
            "$ROOT/universe/collector.log"; do
            echo "fast_existing=pre_log:$log"
            if [[ -f "$log" ]]; then
              grep -Ei 'traceback|error|fatal|failed|exception|blocker|invalid|missing|terminate|exit' "$log" | tail -n 8 || true
              echo fast_existing=pre_log_tail_bytes
              tail -c 1000 "$log" || true
              echo
            fi
          done
          echo fast_existing=pre_processes
          ps -eo pid,ppid,stat,comm,args --sort=pid | grep -E 'v7_|polymarket|python3' | tail -n 120 || true

          if systemctl is-active --quiet "$UNIT" && python3 - "$ROOT/control/runtime_status.json" "$SHA" <<'PYHEALTH'
          import json,os,sys,time
          from pathlib import Path
          p=Path(sys.argv[1]); sha=sys.argv[2]
          try:
              v=json.loads(p.read_text(encoding='utf-8'))
          except Exception:
              raise SystemExit(1)
          if v.get('model_sha') != sha:
              raise SystemExit(1)
          if v.get('paper_only') is not True or v.get('authenticated_execution') is not False or v.get('real_order_submission') is not False:
              raise SystemExit(1)
          if v.get('state') != 'running' or v.get('killed') is True:
              raise SystemExit(1)
          pid=int(v.get('pid') or 0)
          ts=int(v.get('timestamp') or 0)
          if pid <= 0 or abs(int(time.time())-ts) > 30:
              raise SystemExit(1)
          try:
              os.kill(pid,0)
          except OSError:
              raise SystemExit(1)
          PYHEALTH
          then
            echo fast_existing=already_healthy
            curl -fsS http://127.0.0.1:9090/-/ready >/dev/null
            curl -fsS http://127.0.0.1:3000/api/health >/dev/null
            curl -fsS --get --data-urlencode 'query=up{job="polymarket-v7"}' http://127.0.0.1:9090/api/v1/query | python3 -c 'import json,sys; v=json.load(sys.stdin); r=v.get("data",{}).get("result",[]); assert len(r)==1 and r[0]["value"][1]=="1", v'
            curl -fsS http://127.0.0.1:9108/metrics | grep -E '^polymarket_v7_execution_alive(\{| )' >/dev/null
            echo V7_FAST_RESTART_EXISTING_OK="$SHA"
            exit 0
          fi

          if [[ -f "$ROOT/control/supervisor_status.json" ]] && python3 - "$ROOT/control/supervisor_status.json" <<'PYCHECK'
          import json,sys
          try:
              v=json.load(open(sys.argv[1],encoding='utf-8'))
          except Exception:
              raise SystemExit(1)
          raise SystemExit(0 if v.get('state')=='quarantined' else 1)
          PYCHECK
          then
            echo fast_existing=quarantine_reconcile
            PM_V7_MODEL_SHA="$SHA" PM_V7_AUTHENTICATED_EXECUTION=0 PM_V7_REAL_ORDER_SUBMISSION=0 \
              python3 "$APP_DIR/ops/v7_runtime_supervisor.py" \
                --repository-root "$APP_DIR" \
                --run-root "$ROOT" \
                --policy "$APP_DIR/config/v7_runtime_supervision.json" \
                --expected-sha "$SHA" \
                --reconcile-only
          fi

          RESTART_EPOCH="$(date +%s)"
          echo fast_existing=restart_begin
          systemctl reset-failed "$UNIT" || true
          systemctl reset-failed "$EXPORTER" || true
          systemctl restart "$EXPORTER" || true
          systemctl restart "$UNIT"
          for i in $(seq 1 20); do
            systemctl is-active --quiet "$UNIT" && break
            sleep 1
          done
          if ! systemctl is-active --quiet "$UNIT"; then
            echo fast_existing=paper_unit_inactive
            systemctl status "$UNIT" --no-pager -l || true
            journalctl -u "$UNIT" -n 160 --no-pager || true
            exit 20
          fi
          cat > /tmp/v7_fast_existing_check.py <<'PYREMOTE'
          import json, os, sys, time
          from pathlib import Path
          root=Path(sys.argv[1]); sha=sys.argv[2]; restart_epoch=int(sys.argv[3])
          p=root/'control'/'runtime_status.json'
          row={}
          for _ in range(35):
              if p.is_file():
                  try:
                      row=json.loads(p.read_text(encoding='utf-8'))
                  except Exception:
                      row={}
              ts=int(row.get('timestamp') or 0) if isinstance(row,dict) else 0
              if ts >= restart_epoch and row.get('state')=='running' and row.get('killed') is not True:
                  break
              time.sleep(1)
          safe={k:row.get(k) for k in ['state','killed','model_sha','paper_only','authenticated_execution','real_order_submission','pid','readiness','economic_decision_state','authorized_alpha_actions','safe_actions','timestamp']}
          print('V7_FAST_EXISTING_RUNTIME='+json.dumps(safe,sort_keys=True,separators=(',',':')))
          if safe.get('model_sha') != sha:
              raise SystemExit('sha_mismatch '+json.dumps(safe,sort_keys=True))
          if safe.get('paper_only') is not True or safe.get('authenticated_execution') is not False or safe.get('real_order_submission') is not False:
              raise SystemExit('safety_contract_failed '+json.dumps(safe,sort_keys=True))
          if safe.get('state') != 'running' or safe.get('killed') is True:
              raise SystemExit('runtime_not_running '+json.dumps(safe,sort_keys=True))
          pid=int(safe.get('pid') or 0)
          if pid <= 0:
              raise SystemExit('pid_missing '+json.dumps(safe,sort_keys=True))
          os.kill(pid,0)
          if int(time.time())-int(safe.get('timestamp') or 0)>180:
              raise SystemExit('runtime_status_stale '+json.dumps(safe,sort_keys=True))
          PYREMOTE
          if ! python3 /tmp/v7_fast_existing_check.py "$ROOT" "$SHA" "$RESTART_EPOCH"; then
            echo fast_existing=runtime_check_failed
            echo fast_existing=supervisor_status
            cat "$ROOT/control/supervisor_status.json" || true
            echo fast_existing=runtime_status
            cat "$ROOT/control/runtime_status.json" || true
            echo fast_existing=systemd_status
            systemctl status "$UNIT" --no-pager -l || true
            echo fast_existing=journal
            journalctl -u "$UNIT" -n 220 --no-pager || true
            exit 21
          fi
          echo fast_existing=metrics
          curl -fsS http://127.0.0.1:9090/-/ready >/dev/null
          curl -fsS http://127.0.0.1:3000/api/health >/dev/null
          curl -fsS --get --data-urlencode 'query=up{job="polymarket-v7"}' http://127.0.0.1:9090/api/v1/query | python3 -c 'import json,sys; v=json.load(sys.stdin); r=v.get("data",{}).get("result",[]); assert len(r)==1 and r[0]["value"][1]=="1", v'
          curl -fsS http://127.0.0.1:9108/metrics | grep -E '^polymarket_v7_execution_alive(\{| )' >/dev/null
          echo fast_existing=post_restart_processes
          ps -eo pid,ppid,stat,comm,args --sort=pid | grep -E 'v7_|polymarket|paper_v7|python3' | tail -n 120 || true
          echo V7_FAST_RESTART_EXISTING_OK="$SHA"
          ''').replace('__SHA__', sha)
          params=json.dumps({'commands':['bash -lc '+shlex.quote(remote)], 'executionTimeout':['150']})
          def run(args):
              return subprocess.run(args, text=True, capture_output=True, check=True)
          cid=run(['aws','ssm','send-command','--region','eu-west-2','--instance-ids',instance,'--document-name','AWS-RunShellScript','--parameters',params,'--comment','Polymarket V7 PAPER fast restart existing','--query','Command.CommandId','--output','text']).stdout.strip()
          deadline=time.time()+170
          last={}
          while time.time()<deadline:
              last=json.loads(run(['aws','ssm','get-command-invocation','--region','eu-west-2','--command-id',cid,'--instance-id',instance,'--output','json']).stdout)
              if last.get('Status') in {'Success','Cancelled','TimedOut','Failed','Cancelling'}:
                  break
              time.sleep(2)
          out=str(last.get('StandardOutputContent') or '')
          err=str(last.get('StandardErrorContent') or '')
          print(out[-16000:])
          if last.get('Status')!='Success':
              print(err[-10000:], file=sys.stderr)
              raise SystemExit('fast_restart_existing_failed status=%s command=%s' % (last.get('Status'), cid))
          PY

      - name: Upload fast restart evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v7-paper-fast-restart-existing-${{ github.run_id }}
          path: fast-restart-existing-evidence.txt
          if-no-files-found: warn
          retention-days: 7
