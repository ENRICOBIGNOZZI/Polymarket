name: London three-AZ latency lab

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main SHA to benchmark; empty uses current main
        required: false
        type: string
      samples:
        description: Samples per micro/network benchmark
        required: false
        default: "1000"
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/london-latency-lab.yml"
      - "ops/v7_london_latency_lab.sh"
      - "ops/v7_london_ssm_benchmark.py"
      - "include/pm/v7_clob_pair_transport.hpp"
      - "src/v7_public_paired_tls_probe.cpp"

permissions:
  contents: read
  checks: read
  id-token: write

concurrency:
  group: polymarket-v7-london-latency-lab
  cancel-in-progress: true

jobs:
  latency:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
      STACK_NAME: polymarket-v7-london-shootout
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve exact SHA
        id: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          requested="${{ inputs.expected_sha }}"
          if [[ -z "$requested" ]]; then requested="$main_sha"; fi
          [[ "$requested" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$requested^{commit}"
          git merge-base --is-ancestor "$requested" "$main_sha"
          samples="${{ inputs.samples }}"
          [[ -n "$samples" ]] || samples=1000
          [[ "$samples" =~ ^[1-9][0-9]*$ ]]
          (( samples >= 100 && samples <= 20000 ))
          git checkout --detach "$requested"
          echo "sha=$requested" >> "$GITHUB_OUTPUT"
          echo "samples=$samples" >> "$GITHUB_OUTPUT"

      - name: Wait for exact-SHA release gates
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1200))
          while true; do
            set +e
            python3 scripts/v7_exact_sha_ci_gate.py \
              --repository "$GITHUB_REPOSITORY" --sha "$EXPECTED_SHA" \
              --required-check ci-v7-Release \
              --required-check ci-v7-Debug \
              --required-check sanitizer-v7 \
              --required-check security-audit-v7 \
              --required-check london-runtime-boundary-v7 \
              --required-check monitoring-v7 \
              --required-check single-writer-v7 \
              --output "$RUNNER_TEMP/latency-ci-$EXPECTED_SHA.json"
            rc=$?
            set -e
            [[ "$rc" == 0 ]] && break
            (( SECONDS < deadline )) || exit "$rc"
            sleep 5
          done

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: polymarket-v7-latency-lab
          aws-region: eu-west-2

      - name: Verify AWS and benchmark stack access
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity --region eu-west-2 --output json >/dev/null
          aws cloudformation describe-stacks \
            --region eu-west-2 --stack-name "$STACK_NAME" --output json \
            > "$RUNNER_TEMP/latency-stack.json"
          python3 - "$RUNNER_TEMP/latency-stack.json" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1]))
          assert len(v.get("Stacks",[]))==1
          out={x.get("OutputKey"):x.get("OutputValue") for x in v["Stacks"][0].get("Outputs",[])}
          ids=[out.get("InstanceAz1"),out.get("InstanceAz2"),out.get("InstanceAz3")]
          assert all(isinstance(x,str) and x.startswith("i-") for x in ids)
          assert len(set(ids))==3
          print("three_az_stack=PASS")
          PY

      - name: Bootstrap three benchmark hosts to exact SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p latency-artifacts
          python3 ops/v7_london_ssm_bootstrap.py \
            --expected-sha "$EXPECTED_SHA" \
            --region eu-west-2 \
            --output latency-artifacts/bootstrap.json

      - name: Run exact-SHA three-AZ latency lab
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
          SAMPLES: ${{ steps.target.outputs.samples }}
        run: |
          set -euo pipefail
          python3 ops/v7_london_ssm_benchmark.py latency \
            --expected-sha "$EXPECTED_SHA" \
            --region eu-west-2 \
            --latency-samples "$SAMPLES" \
            --output-dir latency-artifacts
          test -s "latency-artifacts/latency.$EXPECTED_SHA.shootout.json"
          cat "latency-artifacts/latency.$EXPECTED_SHA.shootout.json"

      - name: Collect three-AZ WebSocket and external-feed evidence
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          python3 ops/v7_london_multipath_ssm.py \
            --expected-sha "$EXPECTED_SHA" \
            --region eu-west-2 \
            --ws-duration 120 --tls-samples 30 --feed-duration 30 \
            --output latency-artifacts/multipath.json

      - name: Publish summary
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - "$EXPECTED_SHA" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json,sys
          sha=sys.argv[1]
          v=json.load(open(f"latency-artifacts/latency.{sha}.shootout.json"))
          print("## London three-AZ latency lab")
          print(f"- exact SHA: {sha}")
          print(f"- selected physical AZ by measured public paired-TLS p99/p999: {v['selected_physical_zone_id']}")
          for x in sorted(v["measurements"],key=lambda x:x["physical_zone_id"]):
              print(f"- {x['physical_zone_id']}: pair p99={x['pair_p99_ns']} ns; p999={x['pair_p999_ns']} ns; wire skew p99={x['wire_start_skew_p99_ns']} ns; ACK skew p99={x['ack_skew_p99_ns']} ns")
          print("- authenticated order latency: NOT measured; real_order_submission=false")
          PY

      - name: Upload latency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v7-london-latency-${{ steps.target.outputs.sha }}
          path: latency-artifacts
          if-no-files-found: warn
          retention-days: 30
