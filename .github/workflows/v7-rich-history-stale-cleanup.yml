name: V7 rich-history stale research cleanup

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-rich-history-stale-cleanup.json

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: rich-history-stale-cleanup
          aws-region: eu-west-2
      - name: Kill only stale research process
        shell: bash
        run: |
          set -euo pipefail
          instance="$(python3 -c 'import json;print(json.load(open("deploy/v7-rich-history-stale-cleanup.json"))["instance_id"])')"
          stale="$(python3 -c 'import json;print(json.load(open("deploy/v7-rich-history-stale-cleanup.json"))["stale_prefix"])')"
          keep="$(python3 -c 'import json;print(json.load(open("deploy/v7-rich-history-stale-cleanup.json"))["keep_prefix"])')"
          python3 - "$stale" "$keep" <<'PY' >/tmp/params.json
          import json,shlex,sys
          stale,keep=sys.argv[1],sys.argv[2]
          assert stale.startswith('/tmp/polymarket-rich-history-')
          assert keep.startswith('/tmp/polymarket-rich-history-')
          assert stale != keep
          cmd=(
              "set -eu; "
              "echo BEFORE; ps -eo pid,etime,pcpu,pmem,rss,args | grep -F "+shlex.quote(stale)+" | grep -v grep || true; "
              "pids=$(ps -eo pid=,args= | awk -v s="+shlex.quote(stale)+" 'index($0,s){print $1}'); "
              "if [ -n \"$pids\" ]; then kill $pids || true; sleep 2; fi; "
              "pids=$(ps -eo pid=,args= | awk -v s="+shlex.quote(stale)+" 'index($0,s){print $1}'); "
              "if [ -n \"$pids\" ]; then kill -9 $pids || true; fi; "
              "rm -rf "+shlex.quote(stale)+"; "
              "echo AFTER_STALE; ps -eo pid,etime,pcpu,pmem,rss,args | grep -F "+shlex.quote(stale)+" | grep -v grep || true; "
              "echo KEEP; ps -eo pid,etime,pcpu,pmem,rss,args | grep -F "+shlex.quote(keep)+" | grep -v grep || true"
          )
          print(json.dumps({"commands":[cmd]}))
          PY
          cmdid="$(aws ssm send-command --instance-ids "$instance" --document-name AWS-RunShellScript --parameters file:///tmp/params.json --query 'Command.CommandId' --output text)"
          for i in $(seq 1 60); do
            status="$(aws ssm get-command-invocation --command-id "$cmdid" --instance-id "$instance" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 2
          done
          aws ssm get-command-invocation --command-id "$cmdid" --instance-id "$instance" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json
