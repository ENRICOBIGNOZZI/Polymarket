name: V7 tailnet encrypted CI quota cleanup

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-tailnet-encrypted-cleanup-request.json
      - .github/workflows/v7-tailnet-encrypted-cleanup.yml

# recovery-trigger
permissions:
  contents: read
  actions: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate request
        run: |
          python3 - deploy/v7-tailnet-encrypted-cleanup-request.json <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1]))
          assert v=={"schema":"polymarket_v7_tailnet_encrypted_cleanup_v1","user_authorized":True}
          PY

      - name: Decrypt bounded tailnet login
        env:
          SSH_PRIVATE_KEY: ${{ secrets.POLYMARKET_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy-key"
          python3 scripts/v7_ssh_envelope.py             --private-key "$RUNNER_TEMP/deploy-key"             --input deploy/v7-tailnet-login.envelope.json             --output "$RUNNER_TEMP/tailnet-login.json"
          rm -f "$RUNNER_TEMP/deploy-key"
          python3 - "$RUNNER_TEMP/tailnet-login.json" <<'PY'
          import json,sys
          p=sys.argv[1]
          v=json.load(open(p))
          print('SAFE_TAILNET_LOGIN_META='+json.dumps({
              'schema':v.get('schema'),
              'purpose':v.get('purpose'),
              'maximum_deletions':v.get('maximum_deletions'),
              'has_email':isinstance(v.get('email'),str) and '@' in v.get('email',''),
              'has_password':isinstance(v.get('password'),str) and bool(v.get('password')),
              'keys':sorted(v.keys()),
          },sort_keys=True))
          assert v.get('purpose')=='TAILNET_CI_QUOTA_RECOVERY'
          assert isinstance(v.get('email'),str) and '@' in v['email']
          assert isinstance(v.get('password'),str) and v['password']
          maximum=int(v.get('maximum_deletions') or 0)
          assert 1 <= maximum <= 120
          schema=v.get('schema')
          if schema=='polymarket_v7_tailnet_login_handoff_v2':
              expected=v.get('expected_parent_sha')
              assert isinstance(expected,str) and len(expected)==40
              v={
                  'schema':'polymarket_v7_tailnet_login_handoff_v1',
                  'purpose':'TAILNET_CI_QUOTA_RECOVERY',
                  'expected_main_sha':expected,
                  'email':v['email'],
                  'password':v['password'],
                  'allowed_prefixes':[
                      'gh-deploy-','gh-health-','gh-freeze-','gh-inventory-',
                      'github-runnervm','github-actions'
                  ],
                  'maximum_deletions':min(maximum,100),
              }
              with open(p,'w',encoding='utf-8') as h:
                  json.dump(v,h)
              print('TAILNET_V2_TO_BOUNDED_V1_OK=1')
          else:
              assert schema=='polymarket_v7_tailnet_login_handoff_v1'
              assert v.get('allowed_prefixes')==[
                  'gh-deploy-','gh-health-','gh-freeze-','gh-inventory-',
                  'github-runnervm','github-actions'
              ]
              assert 1 <= int(v.get('maximum_deletions') or 0) <= 100
          print('TAILNET_LOGIN_ENVELOPE_VALID=1')
          PY

      - name: Install Playwright
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check playwright
          command -v google-chrome >/dev/null 2>&1 || command -v chromium >/dev/null 2>&1

      - name: Remove stale CI nodes only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium)"
          command -v Xvfb >/dev/null 2>&1
          export DISPLAY=:99
          Xvfb :99 -screen 0 1440x1000x24 >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          xvfb_pid=$!
          profile="$RUNNER_TEMP/v7-tailnet-chrome"
          mkdir -p "$profile"
          "$chrome"             --remote-debugging-port=9222             --remote-debugging-address=127.0.0.1             --user-data-dir="$profile"             --no-first-run             --no-default-browser-check             --disable-dev-shm-usage             --no-sandbox             about:blank >"$RUNNER_TEMP/chrome.log" 2>&1 &
          chrome_pid=$!
          cleanup_browser() { kill "$chrome_pid" "$xvfb_pid" >/dev/null 2>&1 || true; }
          trap cleanup_browser EXIT
          ready=0
          for _ in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 0.1
          done
          test "$ready" = 1
          sed -i 's/timeout_s: int = 420/timeout_s: int = 900/' ops/v7_tailscale_ci_cleanup_browser.py
          PYTHONUNBUFFERED=1 python3 -u ops/v7_tailscale_ci_cleanup_browser.py             --credentials "$RUNNER_TEMP/tailnet-login.json"             --repository "$GITHUB_REPOSITORY"             --github-token "$GH_TOKEN"             --chrome "$chrome"             --cdp-url http://127.0.0.1:9222

      - name: Destroy plaintext login
        if: always()
        run: |
          set +e
          shred -u "$RUNNER_TEMP/tailnet-login.json" "$RUNNER_TEMP/deploy-key" 2>/dev/null ||             rm -f "$RUNNER_TEMP/tailnet-login.json" "$RUNNER_TEMP/deploy-key"
