name: TEMP PAPER exploration live diagnostic

on:
  push:
    branches: [ops/paper-exploration-funnel-fix-20260903]
    paths: [.github/workflows/tmp-paper-exploration-live-diagnostic.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SERVER_HOST: ${{ vars.POLYMARKET_SERVER_HOST || '100.104.183.109' }}
      SERVER_USER: ${{ vars.POLYMARKET_SERVER_USER || 'enrico' }}
      SERVER_PORT: ${{ vars.POLYMARKET_SERVER_PORT || '22' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: ops/paper-exploration-funnel-fix-20260903, fetch-depth: 0}
      - name: Select Tailscale credential mode
        id: ts
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          set -euo pipefail
          if [[ -n "${TS_AUTHKEY:-}" ]]; then echo mode=authkey >> "$GITHUB_OUTPUT";
          elif [[ -n "${TS_OAUTH_CLIENT_ID:-}" && -n "${TS_OAUTH_SECRET:-}" ]]; then echo mode=oauth >> "$GITHUB_OUTPUT";
          else exit 1; fi
      - name: Join tailnet with auth key
        if: steps.ts.outputs.mode == 'authkey'
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with: {authkey: "${{ secrets.TS_AUTHKEY }}", ping: "${{ env.SERVER_HOST }}"}
      - name: Join tailnet with OAuth
        if: steps.ts.outputs.mode == 'oauth'
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TS_TAGS || 'tag:ci' }}
          ping: ${{ env.SERVER_HOST }}
      - name: Configure SSH
        env: {SSH_PRIVATE_KEY: "${{ secrets.POLYMARKET_SERVER_SSH_KEY }}"}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -T 5 -p "$SERVER_PORT" "$SERVER_HOST" > ~/.ssh/known_hosts
      - name: Diagnose exact live funnel
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10 -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/polymarket"
          python3 - <<'PY'
          from pathlib import Path
          import json, os, subprocess, time
          root=Path.home()/"polymarket/runs/paper_v7_live"
          repo=Path.home()/"polymarket"
          def read(path):
              try:
                  v=json.loads(path.read_text(encoding="utf-8"))
                  return v if isinstance(v,dict) else {"_type":type(v).__name__}
              except Exception as e:
                  return {"_error":type(e).__name__}
          def pick(v, keys):
              return {k:v.get(k) for k in keys if k in v}
          cfg=read(repo/"config/v7_external_fair.json")
          runtime=read(root/"control/runtime_status.json")
          portfolio=read(root/"control/portfolio_state.json")
          router=read(root/"external_fair/paper_router_status.json")
          router_state=read(root/"external_fair/paper_router_state.json")
          coord=read(root/"control/global_portfolio_coordinator.json")
          source=read(root/"external_fair/source_status.json")
          fair=read(root/"external_fair/status.json")
          process_text=subprocess.run(["ps","ax","-o","pid=,etime=,command="],capture_output=True,text=True).stdout
          process_lines=[line.strip() for line in process_text.splitlines() if any(x in line for x in ("paper_v7_execution_loop","v7_external_fair_paper_router","v7_global_portfolio_coordinator","v7_external_venue_runtime"))]
          def count(pattern):
              return len(list(root.glob(pattern)))
          def mtime(rel):
              p=root/rel
              return round(time.time()-p.stat().st_mtime,3) if p.exists() else None
          reasons={}
          for name,v in (("router",router),("router_state",router_state),("coordinator",coord),("fair",fair),("source",source)):
              for key in ("last_attempt_reason","reason","state","status","last_error","error","reasons","mode","authority","execution_authority","enabled_for_execution","paper_exploration_enabled","candidates_spooled","attempts","opportunities"):
                  if key in v: reasons[f"{name}.{key}"]=v.get(key)
          diag={
              "timestamp":int(time.time()),
              "repo_sha":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
              "deployed_sha":(root/"control/deployed_sha").read_text().strip() if (root/"control/deployed_sha").exists() else None,
              "runtime":pick(runtime,["state","model_sha","timestamp","pid","paper_only","authenticated_execution","real_order_submission","economic_new_risk_ready","authorized_alpha_actions"]),
              "portfolio":pick(portfolio,["timestamp","killed","drawdown"]),
              "config":{
                  "paper_exploration":cfg.get("paper_exploration"),
                  "taker":cfg.get("taker"),
                  "enabled":cfg.get("enabled"),
                  "execution_authority":cfg.get("execution_authority"),
              },
              "reasons":reasons,
              "coordinator_last_decision":coord.get("last_decision"),
              "file_counts":{
                  "opportunity_inbox":count("opportunities/inbox/*.json"),
                  "opportunity_receipts":count("opportunities/receipts/*.json"),
                  "ledger_spool":count("ledger/spool/*.json"),
                  "external_evidence":count("external_fair/**/*.json"),
              },
              "ages_seconds":{
                  rel:mtime(rel) for rel in (
                      "external_fair/paper_router_status.json",
                      "external_fair/paper_router_state.json",
                      "control/global_portfolio_coordinator.json",
                      "control/runtime_status.json",
                      "trade_tape.csv",
                  )
              },
              "processes":process_lines,
          }
          print("PAPER_EXPLORATION_DIAG="+json.dumps(diag,sort_keys=True,separators=(",",":")))
          PY
          REMOTE
