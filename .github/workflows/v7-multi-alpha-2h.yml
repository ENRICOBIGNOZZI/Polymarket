name: V7 multi-alpha 2H research

on:
  push:
    branches:
      - multi-alpha-2h-20260921
    paths:
      - deploy/v7-multi-alpha-2h-request.json

permissions:
  contents: write
  id-token: write

concurrency:
  group: v7-multi-alpha-2h-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Validate frozen request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request=deploy/v7-multi-alpha-2h-request.json
          python3 - "$request" <<'PY'
          import json,re,sys
          v=json.load(open(sys.argv[1]))
          assert v['schema']=='polymarket_v7_multi_alpha_2h_request_v1'
          assert v['version']==1
          assert re.fullmatch(r'[A-Za-z0-9._:-]{8,128}',v['request_id'])
          assert re.fullmatch(r'i-[0-9a-f]+',v['instance_id'])
          assert re.fullmatch(r'[0-9a-f]{40}',v['expected_research_sha'])
          assert re.fullmatch(r'[0-9a-f]{40}',v['baseline_code_sha'])
          assert isinstance(v['minimum_wall_ns'],int) and v['minimum_wall_ns']>0
          assert v['output_directory']=='docs/research/multi-alpha-2h-2026-09-21'
          assert v['paper_only'] is True
          assert v['authenticated_execution'] is False
          assert v['real_order_submission'] is False
          assert v['real_capital_at_risk'] is False
          assert v['automatic_promotion'] is False
          PY
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          test "$changed" = "$request"
          expected="$(python3 -c 'import json;print(json.load(open("'"$request"'"))["expected_research_sha"])')"
          test "$expected" = "$(git rev-parse HEAD^1)"
          echo "request=$request" >> "$GITHUB_OUTPUT"
          echo "source_sha=$expected" >> "$GITHUB_OUTPUT"

      - name: Install research dependencies
        run: |
          python3 -m pip install --disable-pip-version-check -q -r research/requirements-learning.txt

      - name: Run focused unit tests
        run: |
          PYTHONPATH=. pytest -q tests/test_v7_multi_alpha_2h.py

      - name: Compile research and transport code
        run: |
          python3 -m py_compile \
            research/walk_forward_v3/multi_alpha_2h.py \
            ops/v7_multi_alpha_2h_ssm.py

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: polymarket-v7-multi-alpha-2h
          aws-region: eu-west-2

      - name: Run read-only London PAPER research
        env:
          REQUEST: ${{ steps.request.outputs.request }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 ops/v7_multi_alpha_2h_ssm.py "$REQUEST" "$SOURCE_SHA"

      - name: Validate required artifacts
        env:
          REQUEST: ${{ steps.request.outputs.request }}
        run: |
          python3 - "$REQUEST" <<'PY'
          import json,sys
          from pathlib import Path
          req=json.load(open(sys.argv[1]))
          root=Path(req['output_directory'])
          assert root.is_dir()
          required=[
            '00_executive_summary.md','01_2h_manifest.json','02_data_coverage.json',
            '03_baseline_manifest.json','04_baseline_2h.json','05_external_backfill.json',
            '06_causal_join.json','07_univariate_alpha.json','08_nested_models.json',
            '09_information_latency.json','10_entry_exit_information_cube.json',
            '11_signal_decay.json','12_momentum_reversal.json','13_dynamic_exit.json',
            '14_feature_costs.json','15_equities.json','16_feature_scorecard.json',
            '17_shortlist.json','18_rejected_features.json','19_next_stage_plan.md',
          ]
          for name in required:
            assert (root/name).is_file(), name
          manifest=json.load(open(root/'01_2h_manifest.json'))
          assert manifest['window_end_ns']-manifest['window_start_ns']==7200*10**9
          assert manifest['selection_policy']=='DATA_QUALITY_ONLY_NO_PNL'
          assert manifest['paper_only'] is True
          assert manifest['authenticated_execution'] is False
          assert manifest['real_order_submission'] is False
          shortlist=json.load(open(root/'17_shortlist.json'))
          assert shortlist['automatic_promotion'] is False
          PY

      - name: Publish research artifacts to isolated branch
        env:
          REQUEST: ${{ steps.request.outputs.request }}
        run: |
          set -euo pipefail
          output="$(python3 -c 'import json,os;print(json.load(open(os.environ["REQUEST"]))["output_directory"])')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$output"
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish frozen multi-alpha 2H research"
          git push origin HEAD:multi-alpha-2h-20260921

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v7-multi-alpha-2h-${{ github.run_id }}
          path: docs/research/multi-alpha-2h-2026-09-21
          retention-days: 30
