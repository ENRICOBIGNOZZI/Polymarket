name: pr917-diagnostics
on:
  push:
    branches: [research/v7-next-alpha]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  split-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: profit protocol
        run: python3 -m unittest tests.test_v7_profit_protocol
      - name: cohort replications
        run: python3 -m unittest tests.test_v7_profit_cohort_replications
      - name: prospective maker anchors
        run: python3 -m unittest tests.test_v7_prospective_profit_experiments
      - name: fast repricing shadow
        run: python3 -m unittest tests.test_v7_pm_repricing_fast_shadow
      - name: compatibility repricing shadow
        run: python3 -m unittest tests.test_v7_pm_repricing_shadow
      - name: residual trainer
        run: python3 -m unittest tests.test_v7_external_residual_train
      - name: maker anchor eligibility
        run: python3 -m unittest tests.test_v7_maker_anchor_eligibility
