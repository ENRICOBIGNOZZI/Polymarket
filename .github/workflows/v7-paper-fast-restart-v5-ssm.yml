name: V7 PAPER fast restart SSM v5

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-paper-fast-restart-v5-request.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: polymarket-v7-paper-fast-restart-v5
  cancel-in-progress: true

jobs:
  restart:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
      LONDON_INSTANCE_ID: i-0fba2bac9fdc5cbeb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: polymarket-v7-fast-restart-v5
          aws-region: eu-west-2

      - name: Restart and verify PAPER runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 ops/v7_fast_restart_ssm.py \
            --request deploy/v7-paper-fast-restart-v5-request.json \
            --instance-id "$LONDON_INSTANCE_ID" \
            --region eu-west-2 \
            --output v7-fast-restart-v5-receipt.json \
            --timeout-seconds 150 | tee fast-restart-v5-evidence.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v7-paper-fast-restart-v5-${{ github.run_id }}
          path: |
            fast-restart-v5-evidence.txt
            v7-fast-restart-v5-receipt.json
          if-no-files-found: warn
          retention-days: 7
