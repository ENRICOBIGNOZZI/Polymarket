name: V7 PCA single-leg stat-arb research

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/v7_pca_stat_arb_core.py"
      - "scripts/v7_pca_stat_arb_research.py"
      - "config/research_v7_pca_stat_arb.json"
      - "tests/test_v7_pca_stat_arb.py"
      - ".github/workflows/v7-pca-stat-arb-research.yml"

permissions:
  contents: read

concurrency:
  group: v7-pca-stat-arb-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Deterministic PCA contracts
        run: |
          set -euo pipefail
          python3 -m unittest tests/test_v7_pca_stat_arb.py -v
          python3 -m py_compile scripts/v7_pca_stat_arb_core.py scripts/v7_pca_stat_arb_research.py
          python3 -m json.tool config/research_v7_pca_stat_arb.json >/dev/null

      - name: Public-data single-leg PCA challenger
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pca_evidence
          # Keep the same 300-market sample as the prior smoke but use enough
          # null replications to resolve the q=0.10 BH tail for ~10 hypotheses.
          python3 scripts/v7_pca_stat_arb_research.py \
            --config config/research_v7_pca_stat_arb.json \
            --paper-config config/paper_v6.json \
            --market-limit 300 \
            --bootstrap-reps 599 \
            --output-json pca_evidence/report.json \
            | tee pca_evidence/run.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('pca_evidence/report.json').read_text())
          assert r['paper_only'] is True
          assert r['research_only'] is True
          assert r['live_intents_enabled'] is False
          assert r['submitted_orders'] == 0
          assert r['hedge_legs_allowed'] is False
          assert r['single_leg_only'] is True
          assert r['terminal_probability_interpretation'] is False
          assert r['promotion_ready'] is False
          assert r['survivorship_safe'] is False
          assert r['history_data_healthy'] is True
          assert r['histories'] >= r['history_required_market_count']
          assert r['target_hypotheses'] > 0
          assert len(r['horizons']) == 4
          assert all(item['target_excluded'] for item in r['tests'])
          PY

      - name: Publish PCA summary
        if: always()
        shell: bash
        run: |
          echo '## V7 PCA single-leg stat-arb research' >> "$GITHUB_STEP_SUMMARY"
          if test -s pca_evidence/report.json; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path('pca_evidence/report.json').read_text())
          print(f"- markets: {r['markets']}")
          print(f"- clusters: {r['clusters']}")
          print(f"- histories: {r['histories']} / required {r['history_required_market_count']}")
          print(f"- history data healthy: {r['history_data_healthy']}")
          print(f"- history chunk days: {r['history_window_days']}")
          print(f"- target hypotheses: {r['target_hypotheses']}")
          print(f"- BH-selected hypotheses: {r['bh_selected_hypotheses']}")
          print(f"- bootstrap reps: {r['bootstrap_repetitions']}")
          print(f"- hedge legs allowed: {r['hedge_legs_allowed']}")
          for h in r['horizons']:
              print(f"- {h['horizon_minutes']}m: scored={h['scored_hypotheses']}, candidates={len(h['shadow_candidates'])}")
          PY
          else
            echo '- report missing' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload PCA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-pca-stat-arb-${{ github.run_id }}
          path: pca_evidence/
          if-no-files-found: warn
          retention-days: 30
