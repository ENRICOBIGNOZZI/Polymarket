name: Apply Aggressive V5 Main Upgrade V3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/apply_aggressive_v5_scheduler_governance_20260825.py
      - .github/workflows/aggressive-v5-upgrade-v3.yml

permissions:
  actions: write
  contents: write

concurrency:
  group: aggressive-v5-main-upgrade
  cancel-in-progress: false

jobs:
  apply-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply aggressive V5 and scheduler governance
        run: python3 scripts/apply_aggressive_v5_scheduler_governance_20260825.py

      - name: Validate static surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/apply_aggressive_v5_20260825.py \
            scripts/apply_aggressive_v5_followup_20260825.py \
            scripts/apply_aggressive_v5_scheduler_governance_20260825.py \
            scripts/filter_coherent_hedges.py \
            scripts/summarize_live_smoke.py \
            scripts/multi_strategy_paper.py \
            tests/test_aggressive_v5_policy.py
          python3 -m json.tool config/paper_v5.json >/dev/null
          python3 -m json.tool config/aggressive_operations_policy.json >/dev/null
          python3 tests/test_aggressive_v5_policy.py

      - name: Build and run all tests
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev libssl-dev python3
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Publish validated upgrade directly to main
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "polymarket-operations-bot"
          git config user.email "88671442+ENRICOBIGNOZZI@users.noreply.github.com"
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git add CMakeLists.txt config src scripts tests .github/workflows
            git commit -m "Activate aggressive V5 runtime and activity-aware governance"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Start exact-SHA live paper validation
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ steps.publish.outputs.sha }}"
          gh workflow run v4-live-smoke.yml --repo "$GITHUB_REPOSITORY" --ref main -f expected_sha="$sha"
          echo "Dispatched live validation for $sha"
