name: V7 cross-sectional relative tail research

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"
  pull_request:
    branches: [main]
    paths:
      - "scripts/v7_cross_sectional_rank.py"
      - "scripts/v7_cross_sectional_rank_core.py"
      - "scripts/v7_cross_sectional_rank_fast.py"
      - "scripts/v7_cross_sectional_rank_inference.py"
      - "scripts/v7_cross_sectional_history.py"
      - "scripts/v7_cross_sectional_relative.py"
      - "scripts/v7_cross_sectional_tail_relative.py"
      - "config/research_v7_cross_sectional_rank.json"
      - "config/research_v7_cross_sectional_rank_frozen.json"
      - "tests/test_v7_cross_sectional_rank.py"
      - "tests/test_v7_cross_sectional_rank_fast.py"
      - "tests/test_v7_cross_sectional_rank_inference.py"
      - "tests/test_v7_cross_sectional_history.py"
      - "tests/test_v7_cross_sectional_relative.py"
      - "docs/V7_CROSS_SECTIONAL_RANKING.md"
      - ".github/workflows/v7-cross-sectional-ranking-research.yml"

permissions:
  contents: read

concurrency:
  group: v7-cross-sectional-relative-tail-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Deterministic relative-ranking contracts
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests/test_v7_cross_sectional_rank.py \
            tests/test_v7_cross_sectional_rank_fast.py \
            tests/test_v7_cross_sectional_rank_inference.py \
            tests/test_v7_cross_sectional_history.py \
            tests/test_v7_cross_sectional_relative.py -v
          python3 -m py_compile \
            scripts/v7_cross_sectional_rank_core.py \
            scripts/v7_cross_sectional_rank_fast.py \
            scripts/v7_cross_sectional_rank_inference.py \
            scripts/v7_cross_sectional_rank.py \
            scripts/v7_cross_sectional_history.py \
            scripts/v7_cross_sectional_relative.py \
            scripts/v7_cross_sectional_tail_relative.py
          python3 -m json.tool config/research_v7_cross_sectional_rank_frozen.json >/dev/null

      - name: Live public-data frozen 2h/6h relative holdout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ranking_evidence
          python3 scripts/v7_cross_sectional_tail_relative.py \
            --config config/research_v7_cross_sectional_rank_frozen.json \
            --market-limit 150 \
            --output-json ranking_evidence/report.json \
            --output-pairs-json ranking_evidence/pairs.json \
            | tee ranking_evidence/run.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("ranking_evidence/report.json").read_text())
          assert report["schema_version"] == 2
          assert report["paper_only"] is True
          assert report["research_only"] is True
          assert report["live_intents_enabled"] is False
          assert report["submitted_orders"] == 0
          assert report["promotion_ready"] is False
          assert report["economic_pnl_validated"] is False
          assert report["survivorship_safe"] is False
          assert report["absolute_single_leg_mapping_disabled"] is True
          assert report["relative_pair_only"] is True
          assert report["common_logit_mode_neutralized_first_order"] is True
          assert report["joint_fill_state_evidence_validated"] is False
          assert report["partial_fill_unwind_economics_validated"] is False
          assert report["fill_conditioned_cost_stressed_pnl_validated"] is False
          assert report["history_data_healthy"] is True
          assert report["forward_holdout_start_ts"] > report["discovery_cutoff_ts"]
          assert report["frozen_horizons_minutes"] == [120, 360]
          assert len(report["horizons"]) == 2
          PY

      - name: Publish relative-tail summary
        if: always()
        shell: bash
        run: |
          echo '## V7 cross-sectional relative tail research' >> "$GITHUB_STEP_SUMMARY"
          if test -s ranking_evidence/report.json; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path('ranking_evidence/report.json').read_text())
          print(f"- markets: {r['market_count']}")
          print(f"- history markets: {r['history_market_count']}")
          print(f"- history data healthy: {r['history_data_healthy']}")
          print(f"- authoritative fee books: {r['authoritative_fee_book_count']}")
          print(f"- frozen horizons: {r['frozen_horizons_minutes']}")
          print(f"- tail fraction: {r['tail_fraction']}")
          print(f"- forward days observed: {r['forward_days_observed']}")
          print(f"- current relative pair candidates: {r['current_relative_pair_candidates']}")
          print(f"- absolute single-leg mapping disabled: {r['absolute_single_leg_mapping_disabled']}")
          for h in r['horizons']:
              b=h['forward_blocked_inference']
              print(f"- {h['horizon_minutes']}m: forward_gate={h['forward_gate']}, reasons={h['forward_gate_reasons']}, days={b['days']}, daily_IC={b['mean_daily_rank_ic']:.4f}, daily_tail={b['mean_daily_top_bottom_logit_spread']:.6f}, pIC={b['rank_ic_bootstrap_p_mean_nonpositive']}, pTail={b['top_bottom_bootstrap_p_mean_nonpositive']}, pairs={h['relative_pair_candidates']}")
          PY
          else
            echo '- report missing' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload relative-ranking evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-cross-sectional-relative-tail-${{ github.run_id }}
          path: ranking_evidence/
          if-no-files-found: warn
          retention-days: 30