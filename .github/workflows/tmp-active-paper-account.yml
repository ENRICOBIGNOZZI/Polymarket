name: Temporary active PAPER account patcher

on:
  push:
    branches:
      - codex/v7-active-paper-account-20260904

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply bounded active PAPER account
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tmp_active_paper_core.py
          python3 scripts/tmp_active_paper_contract.py
          rm -f scripts/tmp_active_paper_core.py scripts/tmp_active_paper_contract.py
          rm -f .github/workflows/tmp-active-paper-account.yml
          python3 -m py_compile \
            scripts/v7_external_fair_paper_router.py \
            scripts/v7_external_fair_invariants.py \
            scripts/v7_rtds_external_fair_monitor.py \
            scripts/v7_profitability_audit.py \
            ops/v7_runtime_supervisor.py
          bash -n scripts/paper_v7_execution_loop.sh
          python3 -m json.tool config/v7_external_fair.json >/dev/null
          git diff --check
      - name: Commit repaired PAPER execution path
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: account bounded BTC M5 trades in PAPER'
          git push origin HEAD:codex/v7-active-paper-account-20260904