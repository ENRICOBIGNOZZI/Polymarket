name: V7 cancel stale PAPER cutover

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-cancel-stale-cutover-request.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: v7-cancel-stale-paper-cutover
  cancel-in-progress: true

jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
      INSTANCE_ID: ${{ vars.POLYMARKET_LONDON_INSTANCE_ID || 'i-0fba2bac9fdc5cbeb' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate request
        id: req
        run: |
          python3 - deploy/v7-cancel-stale-cutover-request.json "$GITHUB_OUTPUT" <<'PY'
          import json,re,sys
          v=json.load(open(sys.argv[1]))
          assert set(v)=={'schema','command_id','target_sha','paper_only','authenticated_execution','real_order_submission'}
          assert v['schema']=='polymarket_v7_cancel_stale_cutover_v1'
          assert re.fullmatch(r'[0-9a-f-]{36}',v['command_id'])
          assert re.fullmatch(r'[0-9a-f]{40}',v['target_sha'])
          assert v['paper_only'] is True and v['authenticated_execution'] is False and v['real_order_submission'] is False
          with open(sys.argv[2],'a') as h:
            h.write('command_id='+v['command_id']+'\n')
            h.write('target_sha='+v['target_sha']+'\n')
          PY
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: polymarket-v7-cancel-stale-cutover
          aws-region: eu-west-2
      - name: Prove and cancel stale cutover
        env:
          COMMAND_ID: ${{ steps.req.outputs.command_id }}
          TARGET_SHA: ${{ steps.req.outputs.target_sha }}
        run: |
          set -euo pipefail
          aws ssm list-commands --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --output json > commands.json
          python3 - commands.json "$COMMAND_ID" "$TARGET_SHA" <<'PY'
          import json,re,sys
          v=json.load(open(sys.argv[1])); cid=sys.argv[2]; target=sys.argv[3]
          matches=[c for c in v.get('Commands') or [] if c.get('CommandId')==cid]
          assert len(matches)==1
          c=matches[0]
          assert c.get('Comment')=='Polymarket V7 exact-SHA PAPER SSM transport'
          assert str(c.get('Status') or '') not in {'Success','Cancelled','TimedOut','Failed','Cancelling'}
          params=c.get('Parameters') or {}; payloads=params.get('commands') or []
          if isinstance(payloads,str): payloads=[payloads]
          txt='\n'.join(map(str,payloads))
          assert f'SHA={target}' in txt
          assert 'V7_SSM_CUTOVER=' in txt
          print('PROVEN_STALE_CUTOVER='+cid)
          PY
          aws ssm cancel-command --command-id "$COMMAND_ID" --instance-ids "$INSTANCE_ID" --region "$AWS_REGION" >/dev/null
          for i in $(seq 1 40); do
            status="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query Status --output text || true)"
            case "$status" in Cancelled|Failed|TimedOut|Success) echo "STALE_CUTOVER_TERMINAL=$status"; exit 0;; esac
            sleep 1
          done
          echo "stale cutover did not terminate" >&2
          exit 1
