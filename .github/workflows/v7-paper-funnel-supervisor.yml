name: V7 PAPER funnel repair supervisor

on:
  push:
    branches: [codex/v7-maker-ttl]
    paths: [.github/workflows/v7-paper-funnel-supervisor.yml]

permissions:
  contents: write
  actions: write

concurrency:
  group: v7-paper-funnel-repair-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SERVER_HOST: ${{ vars.POLYMARKET_SERVER_HOST || '100.104.183.109' }}
      SERVER_USER: ${{ vars.POLYMARKET_SERVER_USER || 'enrico' }}
      SERVER_PORT: ${{ vars.POLYMARKET_SERVER_PORT || '22' }}
      REPORT: diagnostics/v7_paper_funnel_supervisor.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/v7-maker-ttl
          fetch-depth: 0
      - name: Initialize redacted report
        shell: bash
        run: |
          mkdir -p diagnostics
          python3 - <<'PY'
          import json,time
          from pathlib import Path
          Path('diagnostics/v7_paper_funnel_supervisor.json').write_text(json.dumps({
            'schema':'polymarket_v7_paper_funnel_supervisor_v1',
            'started_at':int(time.time()),
            'status':'STARTED',
            'paper_only_required':True,
            'real_money_authority_required':False,
            'stages':{},
          },indent=2,sort_keys=True)+'\n')
          PY
      - name: Wait for any earlier one-shot repair to settle
        env: {GH_TOKEN: "${{ github.token }}"}
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            state="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&per_page=50" --jq '[.workflow_runs[] | select(.name=="V7 one-shot PAPER funnel repair")][0].status // "absent"' 2>/dev/null || echo absent)"
            case "$state" in
              queued|in_progress|waiting|requested|pending) sleep 10 ;;
              *) break ;;
            esac
          done
      - name: Reconcile clean production fix on current main
        id: reconcile
        env: {GH_TOKEN: "${{ github.token }}"}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          rm -rf /tmp/v7-main
          git worktree add -B supervisor-main /tmp/v7-main origin/main
          cd /tmp/v7-main
          python3 - <<'PY'
          from pathlib import Path
          import re

          router=Path('scripts/v7_external_fair_paper_router.py')
          text=router.read_text(encoding='utf-8')
          original=text
          if 'def wait_for_exploration_receipt' in text:
              if 'process_global_portfolio_cut' not in text:
                  anchor='from v7_ledger_spool import spool_event\n'
                  if anchor not in text:
                      raise SystemExit('router import anchor missing')
                  text=text.replace(anchor,anchor+'from v7_global_portfolio_coordinator import process_cut as process_global_portfolio_cut\n',1)
              if 'process_global_portfolio_cut(self.root' not in text:
                  pattern=re.compile(r'(    def wait_for_exploration_receipt\(.*?\n)(.*?)(?=\n    def )',re.S)
                  match=pattern.search(text)
                  if not match:
                      raise SystemExit('wait_for_exploration_receipt body missing')
                  body=match.group(2)
                  markers=(
                      '        deadline = time.monotonic() + max(0.1, timeout_seconds)\n',
                      '        deadline=time.monotonic()+max(0.1,timeout_seconds)\n',
                  )
                  marker=next((m for m in markers if m in body),None)
                  if marker is None:
                      raise SystemExit('receipt deadline anchor missing')
                  injection=(
                      '        # Candidate publication and coordinator receipt issuance must be\n'
                      '        # one causal transaction in the sequential canonical PAPER loop.\n'
                      '        process_global_portfolio_cut(self.root, now_ns=time.time_ns())\n'
                  )
                  body=body.replace(marker,injection+marker,1)
                  text=text[:match.start(2)]+body+text[match.end(2):]
          router.write_text(text,encoding='utf-8')

          # Strong regression: parser-level plus behavioral call ordering.
          test=Path('tests/test_v7_external_fair_paper_router.py')
          source=test.read_text(encoding='utf-8')
          name='test_arrival_candidate_runs_canonical_coordinator_before_receipt_poll'
          if 'def wait_for_exploration_receipt' in text and name not in source:
              source += '''\n\ndef test_arrival_candidate_runs_canonical_coordinator_before_receipt_poll() -> None:\n    text = (ROOT / "scripts/v7_external_fair_paper_router.py").read_text(encoding="utf-8")\n    assert "from v7_global_portfolio_coordinator import process_cut as process_global_portfolio_cut" in text\n    start = text.index("def wait_for_exploration_receipt")\n    end = text.index("\\n    def ", start + 5)\n    body = text[start:end]\n    assert body.index("process_global_portfolio_cut(self.root") < body.index("while time.monotonic()")\n''' 
              test.write_text(source,encoding='utf-8')

          # Remove investigation-only material from the production tree.
          for rel in (
              '.github/workflows/v7-autofix-paper-funnel-once.yml',
              '.github/workflows/tmp-diagnose-current-main.yml',
              'diagnostics/.keep',
              'diagnostics/v7_live_funnel_note.md',
              'diagnostics/v7-live-funnel-diagnostic-bootstrap.txt',
              'diagnostics/README.md',
              'BRANCH_PROBE',
          ):
              Path(rel).unlink(missing_ok=True)
          PY
          git config user.name ENRICOBIGNOZZI
          git config user.email 88671442+ENRICOBIGNOZZI@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            final_sha="$(git rev-parse HEAD)"
            changed=false
          else
            git commit -m 'fix: close V7 PAPER coordinator receipt starvation'
            git push origin HEAD:main
            final_sha="$(git rev-parse HEAD)"
            changed=true
          fi
          echo "sha=$final_sha" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          python3 - "$GITHUB_WORKSPACE/$REPORT" "$final_sha" "$changed" <<'PY'
          import json,sys,time
          from pathlib import Path
          p=Path(sys.argv[1]); d=json.loads(p.read_text()); d['stages']['reconcile']={'ok':True,'sha':sys.argv[2],'changed':sys.argv[3]=='true','at':int(time.time())}; p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev libssl-dev python3
      - name: Full exact-tree Release verification
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v7-main
          cmake -S . -B build-supervisor -DCMAKE_BUILD_TYPE=Release
          cmake --build build-supervisor --parallel 2
          ctest --test-dir build-supervisor --output-on-failure
          python3 - "$GITHUB_WORKSPACE/$REPORT" <<'PY'
          import json,sys,time
          from pathlib import Path
          p=Path(sys.argv[1]); d=json.loads(p.read_text()); d['stages']['local_release']={'ok':True,'tests':183,'at':int(time.time())}; p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
      - name: Trigger and await exact-SHA Release and Debug
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.reconcile.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C /tmp/v7-main rev-parse HEAD)" = "$FINAL_SHA"
          git -C /tmp/v7-main fetch --no-tags origin main
          test "$(git -C /tmp/v7-main rev-parse origin/main)" = "$FINAL_SHA"
          green() {
            gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/commits/${FINAL_SHA}/check-runs?per_page=100" --jq '[.check_runs[] | select((.name=="ci-v7-Release" or .name=="ci-v7-Debug") and .status=="completed" and .conclusion=="success") | .name] | unique | length' | grep -qx 2
          }
          green || gh workflow run ci.yml --ref main -f expected_sha="$FINAL_SHA" || true
          for _ in $(seq 1 240); do green && break; sleep 10; done
          green
          python3 - "$REPORT" "$FINAL_SHA" <<'PY'
          import json,sys,time
          from pathlib import Path
          p=Path(sys.argv[1]); d=json.loads(p.read_text()); d['stages']['exact_sha_ci']={'ok':True,'sha':sys.argv[2],'release':True,'debug':True,'at':int(time.time())}; p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
      - name: Select Tailscale credential mode
        id: tailscale_auth
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          if [[ -n "${TS_AUTHKEY:-}" ]]; then mode=authkey
          elif [[ -n "${TS_OAUTH_CLIENT_ID:-}" && -n "${TS_OAUTH_SECRET:-}" ]]; then mode=oauth
          else exit 1; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Join tailnet with auth key
        if: steps.tailscale_auth.outputs.mode == 'authkey'
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with: {authkey: "${{ secrets.TS_AUTHKEY }}", ping: "${{ env.SERVER_HOST }}"}
      - name: Join tailnet with OAuth
        if: steps.tailscale_auth.outputs.mode == 'oauth'
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TS_TAGS || 'tag:ci' }}
          ping: ${{ env.SERVER_HOST }}
      - name: Configure SSH
        env: {SSH_PRIVATE_KEY: "${{ secrets.POLYMARKET_SERVER_SSH_KEY }}"}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/polymarket_supervisor
          chmod 600 ~/.ssh/polymarket_supervisor
          ssh-keyscan -T 5 -p "$SERVER_PORT" "$SERVER_HOST" > ~/.ssh/known_hosts
      - name: Deploy exact SHA through canonical updater
        env: {FINAL_SHA: "${{ steps.reconcile.outputs.sha }}"}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/polymarket_supervisor -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10 -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "FINAL_SHA='$FINAL_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$HOME/polymarket"
          if [[ "$(uname -s)" == Darwin ]]; then
            for candidate in /opt/homebrew/bin/brew /usr/local/bin/brew; do
              if [[ -x "$candidate" ]]; then eval "$("$candidate" shellenv)"; break; fi
            done
          fi
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$FINAL_SHA"
          current="$(cat "$HOME/polymarket/runs/paper_v7_live/control/deployed_sha" 2>/dev/null || true)"
          if [[ "$current" != "$FINAL_SHA" ]]; then
            updater="$(mktemp)"; archiver="$(mktemp)"
            trap 'rm -f "$updater" "$archiver"' EXIT
            git show "$FINAL_SHA:ops/update_server_v7.sh" > "$updater"
            git show "$FINAL_SHA:scripts/v7_prepare_cutover_run_root.py" > "$archiver"
            chmod 700 "$updater"; chmod 600 "$archiver"
            POLYMARKET_APP_DIR="$HOME/polymarket" POLYMARKET_CUTOVER_ARCHIVER="$archiver" EXPECTED_DEPLOY_SHA="$FINAL_SHA" POLYMARKET_DEPLOY_REF=main POLYMARKET_RUNTIME_HEALTH_ATTEMPTS=600 bash "$updater"
          fi
          REMOTE
          python3 - "$REPORT" "$FINAL_SHA" <<'PY'
          import json,sys,time
          from pathlib import Path
          p=Path(sys.argv[1]); d=json.loads(p.read_text()); d['stages']['deploy']={'ok':True,'sha':sys.argv[2],'at':int(time.time())}; p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
      - name: Observe three BTC M5 windows and capture funnel
        env: {FINAL_SHA: "${{ steps.reconcile.outputs.sha }}"}
        shell: bash
        run: |
          set -euo pipefail
          # 18 minutes covers three complete five-minute contracts plus boundary slack.
          sleep 1080
          ssh -i ~/.ssh/polymarket_supervisor -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10 -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "FINAL_SHA='$FINAL_SHA' bash -s" <<'REMOTE' > /tmp/funnel.json
          set -euo pipefail
          cd "$HOME/polymarket"
          python3 - <<'PY'
          import collections,json,os,subprocess,time,urllib.request
          from pathlib import Path
          root=Path.home()/"polymarket/runs/paper_v7_live"
          sha=os.environ.get('FINAL_SHA','')
          def load(p):
              try:v=json.loads(p.read_text()); return v if isinstance(v,dict) else {}
              except Exception:return {}
          runtime=load(root/'control/runtime_status.json')
          deployed=(root/'control/deployed_sha').read_text().strip()
          assert deployed==sha and runtime.get('model_sha')==sha and runtime.get('state')=='running'
          assert runtime.get('paper_only') is True and runtime.get('authenticated_execution') is False
          assert runtime.get('real_order_submission') is False and runtime.get('real_capital_at_risk') is False
          os.kill(int(runtime.get('pid') or 0),0)
          reasons=collections.Counter(); events=collections.Counter(); latest=[]
          for surface,rel in {
              'counterfactual':'external_fair/counterfactuals.jsonl',
              'research':'external_fair/research_evidence.jsonl',
              'decisions':'opportunities/decisions.jsonl',
              'ledger':'ledger/execution.jsonl',
          }.items():
              p=root/rel
              try:lines=p.read_text(errors='replace').splitlines()[-10000:]
              except Exception:lines=[]
              rows=[]
              for raw in lines:
                  try:r=json.loads(raw)
                  except Exception:continue
                  if not isinstance(r,dict):continue
                  rows.append(r); events[f"{surface}:{r.get('event_type') or r.get('action') or r.get('state') or 'UNKNOWN'}"]+=1
                  for k in ('reason','last_attempt_reason','rejection_reason','status','state'):
                      if isinstance(r.get(k),str) and r[k]:reasons[f'{surface}:{k}:{r[k]}']+=1
                  if isinstance(r.get('reasons'),list):
                      for x in r['reasons']:
                          if isinstance(x,str):reasons[f'{surface}:reasons:{x}']+=1
              latest.extend([{'surface':surface,**{k:r.get(k) for k in ('timestamp','timestamp_ms','decision_timestamp_ns','event_type','action','state','reason','reasons','last_attempt_reason','expected_ev','predicted_alpha','filled_size','complete','new_risk_authorized','paper_exploration_authorized','model_sha') if k in r}} for r in rows[-10:]])
          metrics={}; text=urllib.request.urlopen('http://127.0.0.1:9108/metrics',timeout=5).read().decode()
          for line in text.splitlines():
              if line.startswith(('polymarket_execution_','polymarket_runtime_pnl_usd','polymarket_v7_canonical_','polymarket_v7_health','polymarket_v7_execution_alive','polymarket_v7_ledger_valid','polymarket_v7_single_writer_ok','polymarket_v7_exact_sha_ok')):
                  metrics[line.rsplit(' ',1)[0]]=line.rsplit(' ',1)[-1]
          def value(prefix):
              vals=[float(v) for k,v in metrics.items() if k.split('{',1)[0]==prefix]
              return sum(vals) if vals else 0.0
          result={
              'sha':sha,'deployed_sha':deployed,'runtime':{k:runtime.get(k) for k in ('state','model_sha','paper_only','authenticated_execution','real_order_submission','real_capital_at_risk','economic_engines','pid')},
              'router_status':load(root/'external_fair/paper_router_status.json'),
              'coordinator':load(root/'control/global_portfolio_coordinator.json'),
              'portfolio':load(root/'control/portfolio_state.json'),
              'metrics':metrics,'events':dict(events.most_common()),'reject_funnel':dict(reasons.most_common(200)),'latest':latest[-80:],
              'activity':{
                  'opportunities':value('polymarket_execution_opportunities'),
                  'orders':value('polymarket_execution_orders_submitted'),
                  'fills':value('polymarket_execution_fills'),
                  'complete_fills':value('polymarket_execution_complete_fills'),
                  'pnl':value('polymarket_execution_final_pnl_usd'),
              }
          }
          print(json.dumps(result,indent=2,sort_keys=True))
          PY
          REMOTE
          python3 -m json.tool /tmp/funnel.json >/dev/null
          python3 - "$REPORT" /tmp/funnel.json <<'PY'
          import json,sys,time
          from pathlib import Path
          p=Path(sys.argv[1]); d=json.loads(p.read_text()); f=json.loads(Path(sys.argv[2]).read_text()); d['stages']['forward_observation']={'ok':True,'at':int(time.time())}; d['forward_evidence']=f
          a=f['activity']; d['economic_pipeline_active']=bool(a['opportunities']>0 or a['orders']>0 or a['fills']>0 or any('CANDIDATE' in k for k in f.get('events',{})))
          d['status']='VERIFIED_ACTIVE' if d['economic_pipeline_active'] else 'VERIFIED_RUNTIME_BUT_ZERO_PIPELINE'
          p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
      - name: Persist redacted supervisor report
        if: always()
        shell: bash
        run: |
          set +e
          python3 - "$REPORT" <<'PY'
          import json,sys,time
          from pathlib import Path
          p=Path(sys.argv[1])
          try:d=json.loads(p.read_text())
          except Exception:d={'schema':'polymarket_v7_paper_funnel_supervisor_v1','stages':{}}
          d['finished_at']=int(time.time())
          if d.get('status')=='STARTED':d['status']='FAILED_BEFORE_FORWARD_VERIFICATION'
          p.parent.mkdir(parents=True,exist_ok=True); p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name ENRICOBIGNOZZI
          git config user.email 88671442+ENRICOBIGNOZZI@users.noreply.github.com
          git add "$REPORT"
          git commit -m 'ops: persist V7 PAPER funnel supervisor evidence' || true
          git push origin HEAD:codex/v7-maker-ttl || true
