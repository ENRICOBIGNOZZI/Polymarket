name: TEMP capture PAPER exploration diagnosis

on:
  push:
    branches: [ops/paper-exploration-funnel-fix-20260903]
    paths: [.github/workflows/tmp-paper-exploration-diagnostic-commit.yml]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SERVER_HOST: ${{ vars.POLYMARKET_SERVER_HOST || '100.104.183.109' }}
      SERVER_USER: ${{ vars.POLYMARKET_SERVER_USER || 'enrico' }}
      SERVER_PORT: ${{ vars.POLYMARKET_SERVER_PORT || '22' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: ops/paper-exploration-funnel-fix-20260903, fetch-depth: 0}
      - name: Select Tailscale mode
        id: ts
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          set -euo pipefail
          if [[ -n "${TS_AUTHKEY:-}" ]]; then echo mode=authkey >> "$GITHUB_OUTPUT";
          elif [[ -n "${TS_OAUTH_CLIENT_ID:-}" && -n "${TS_OAUTH_SECRET:-}" ]]; then echo mode=oauth >> "$GITHUB_OUTPUT";
          else exit 1; fi
      - name: Join tailnet with auth key
        if: steps.ts.outputs.mode == 'authkey'
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with: {authkey: "${{ secrets.TS_AUTHKEY }}", ping: "${{ env.SERVER_HOST }}"}
      - name: Join tailnet with OAuth
        if: steps.ts.outputs.mode == 'oauth'
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TS_TAGS || 'tag:ci' }}
          ping: ${{ env.SERVER_HOST }}
      - name: Configure SSH
        env: {SSH_PRIVATE_KEY: "${{ secrets.POLYMARKET_SERVER_SSH_KEY }}"}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -T 5 -p "$SERVER_PORT" "$SERVER_HOST" > ~/.ssh/known_hosts
      - name: Capture safe diagnosis
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          ssh -i ~/.ssh/key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10 -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" 'bash -s' > diagnostics/paper_exploration_live.json <<'REMOTE'
          set -euo pipefail
          cd "$HOME/polymarket"
          python3 - <<'PY'
          from pathlib import Path
          import json, os, subprocess, time
          root=Path.home()/"polymarket/runs/paper_v7_live"; repo=Path.home()/"polymarket"
          def read(path):
              try:
                  value=json.loads(path.read_text(encoding="utf-8"))
                  return value if isinstance(value,dict) else {"_type":type(value).__name__}
              except Exception as exc: return {"_error":type(exc).__name__}
          def files(pattern): return sorted(str(p.relative_to(root)) for p in root.glob(pattern))
          cfg=read(repo/"config/v7_external_fair.json")
          runtime=read(root/"control/runtime_status.json")
          router=read(root/"external_fair/paper_router_status.json")
          state=read(root/"external_fair/paper_router_state.json")
          coord=read(root/"control/global_portfolio_coordinator.json")
          candidate_journal=[]
          for p in sorted((root/"external_fair").glob("*.jsonl")):
              try:
                  tail=p.read_text(encoding="utf-8",errors="replace").splitlines()[-5:]
                  candidate_journal.append({"file":p.name,"tail":tail})
              except Exception: pass
          ps=subprocess.run(["ps","ax","-o","pid=,etime=,command="],capture_output=True,text=True).stdout
          process_lines=[line.strip() for line in ps.splitlines() if any(x in line for x in ("paper_v7_execution_loop","v7_external_fair_paper_router","v7_global_portfolio_coordinator","v7_external_venue_runtime"))]
          diag={
            "captured_at":int(time.time()),
            "repo_sha":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
            "deployed_sha":(root/"control/deployed_sha").read_text().strip() if (root/"control/deployed_sha").exists() else None,
            "runtime":runtime,
            "config_external_fair":cfg,
            "router_status":router,
            "router_state_summary":{k:state.get(k) for k in state if k not in {"positions","books","samples","events"}},
            "coordinator":coord,
            "counts":{
              "inbox":len(files("opportunities/inbox/*.json")),
              "receipts":len(files("opportunities/receipts/*.json")),
              "ledger_spool":len(files("ledger/spool/*.json")),
              "counterfactuals":len(files("external_fair/**/*.json")),
            },
            "inbox_files":files("opportunities/inbox/*.json")[-20:],
            "receipt_files":files("opportunities/receipts/*.json")[-20:],
            "processes":process_lines,
            "journals":candidate_journal,
          }
          print(json.dumps(diag,indent=2,sort_keys=True))
          PY
          REMOTE
          python3 -m json.tool diagnostics/paper_exploration_live.json >/dev/null
      - name: Commit diagnosis
        run: |
          set -euo pipefail
          git config user.name ENRICOBIGNOZZI
          git config user.email 88671442+ENRICOBIGNOZZI@users.noreply.github.com
          git add diagnostics/paper_exploration_live.json
          git commit -m 'diagnostics: capture live PAPER exploration funnel'
          git push origin HEAD:ops/paper-exploration-funnel-fix-20260903
