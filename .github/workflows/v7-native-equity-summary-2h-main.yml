name: V7 native 2H equity summary research

on:
  push:
    branches: [main]
    paths: [deploy/v7-native-equity-summary-2h-request.json]

permissions:
  contents: read
  id-token: write

concurrency:
  group: v7-native-equity-summary-2h
  cancel-in-progress: true

jobs:
  summary:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
      RESEARCH_BRANCH: multi-alpha-equity-gallery-20260921
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Validate request
        id: req
        run: |
          python3 - deploy/v7-native-equity-summary-2h-request.json "$GITHUB_OUTPUT" <<'PY'
          import json,re,sys
          v=json.load(open(sys.argv[1]))
          assert v['schema']=='polymarket_v7_native_equity_summary_2h_request_v1'
          assert re.fullmatch(r'i-[0-9a-f]+',v['instance_id'])
          assert re.fullmatch(r'[0-9a-f]{40}',v['expected_research_sha'])
          assert isinstance(v['minimum_wall_ns'],int) and v['minimum_wall_ns']>0
          assert v['paper_only'] is True
          assert v['authenticated_execution'] is False
          assert v['real_order_submission'] is False
          assert v['real_capital_at_risk'] is False
          with open(sys.argv[2],'a') as h:
              h.write('instance_id='+v['instance_id']+'\n')
              h.write('source_sha='+v['expected_research_sha']+'\n')
              h.write('minimum_wall_ns='+str(v['minimum_wall_ns'])+'\n')
          PY
      - name: Fetch exact research source
        env:
          SOURCE_SHA: ${{ steps.req.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch origin "$RESEARCH_BRANCH" --depth=200
          branch_sha="$(git rev-parse FETCH_HEAD)"
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" "$branch_sha"
          git checkout --detach "$SOURCE_SHA"
      - name: Install research dependencies
        run: python3 -m pip install --disable-pip-version-check -q -r research/requirements-learning.txt
      - name: Compile
        run: python3 -m py_compile research/walk_forward_v3/native_equity_grid_2h.py ops/v7_native_equity_summary_2h_ssm.py
      - name: Configure AWS OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: polymarket-v7-native-equity-summary
          aws-region: eu-west-2
      - name: Compute and print native 2H PnL summary
        env:
          INSTANCE_ID: ${{ steps.req.outputs.instance_id }}
          SOURCE_SHA: ${{ steps.req.outputs.source_sha }}
          MINIMUM_WALL_NS: ${{ steps.req.outputs.minimum_wall_ns }}
        run: |
          python3 ops/v7_native_equity_summary_2h_ssm.py \
            --instance-id "$INSTANCE_ID" \
            --source-sha "$SOURCE_SHA" \
            --minimum-wall-ns "$MINIMUM_WALL_NS"
