name: V7 unified PAPER evidence runtime

on:
  workflow_dispatch:
  schedule:
    - cron: "4,19,34,49 * * * *"

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: polymarket-v7-unified-paper-evidence
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SERVER_HOST: ${{ vars.POLYMARKET_SERVER_HOST || '100.104.183.109' }}
      SERVER_USER: ${{ vars.POLYMARKET_SERVER_USER || 'enrico' }}
      SERVER_PORT: ${{ vars.POLYMARKET_SERVER_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate isolated evidence-runtime contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool config/v7_evidence_runtime.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('config/v7_evidence_runtime.json').read_text())
          assert cfg['paper_only'] is True
          assert cfg['authenticated_execution'] is False
          assert cfg['source_pr'] == 546
          assert cfg['source_branch'] == 'research/v7-unified-final-evidence-20260826'
          assert cfg['runtime_root'].startswith('runs/')
          assert 1024 < int(cfg['proxy_port']) < 65536
          assert cfg['state_partition'] == 'source_head_sha'
          assert cfg['require_operator_directives_match_main'] is True
          assert cfg['require_source_live_champion_unchanged'] is True
          assert set(cfg['required_successful_workflows']) == {
              'ci','Polymarket Research Policy','monitoring','Private runtime single-writer validation'
          }
          PY

      - name: Resolve exact validated research head
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p v7-evidence
          SOURCE_PR="$(python3 -c 'import json; print(json.load(open("config/v7_evidence_runtime.json"))["source_pr"])')"
          SOURCE_BRANCH="$(python3 -c 'import json; print(json.load(open("config/v7_evidence_runtime.json"))["source_branch"])')"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${SOURCE_PR}" > v7-evidence/source-pr.json
          SOURCE_SHA="$(python3 - <<'PY'
          import json
          p=json.load(open('v7-evidence/source-pr.json'))
          assert p['state'] == 'open'
          assert p['draft'] is True
          print(p['head']['sha'])
          PY
          )"
          ACTUAL_BRANCH="$(python3 - <<'PY'
          import json
          print(json.load(open('v7-evidence/source-pr.json'))['head']['ref'])
          PY
          )"
          test "$ACTUAL_BRANCH" = "$SOURCE_BRANCH"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SOURCE_SHA}&per_page=100" > v7-evidence/source-runs.json
          READY="$(python3 - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('config/v7_evidence_runtime.json').read_text())
          runs=json.loads(Path('v7-evidence/source-runs.json').read_text()).get('workflow_runs') or []
          latest={}
          for row in sorted(runs,key=lambda x:(x.get('created_at') or '',int(x.get('id') or 0)),reverse=True):
              name=str(row.get('name') or '')
              if name and name not in latest:
                  latest[name]=row
          missing=[]
          evidence={}
          for name in cfg['required_successful_workflows']:
              row=latest.get(name)
              evidence[name]={
                  'id': int(row.get('id') or 0) if row else 0,
                  'status': row.get('status') if row else None,
                  'conclusion': row.get('conclusion') if row else None,
              }
              if not row or row.get('status') != 'completed' or row.get('conclusion') != 'success':
                  missing.append(name)
          payload={
              'source_sha': json.load(open('v7-evidence/source-pr.json'))['head']['sha'],
              'required': cfg['required_successful_workflows'],
              'workflow_evidence': evidence,
              'missing_or_not_green': missing,
              'ready': not missing,
          }
          Path('v7-evidence/check-gate.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          print('true' if not missing else 'false')
          PY
          )"
          echo "source_pr=$SOURCE_PR" >> "$GITHUB_OUTPUT"
          echo "source_branch=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          cat v7-evidence/check-gate.json

      - name: Select existing Tailscale credential mode
        if: steps.source.outputs.ready == 'true'
        id: tailscale_auth
        shell: bash
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TS_TAGS: ${{ vars.TS_TAGS || 'tag:ci' }}
        run: |
          set -euo pipefail
          if [[ -n "${TS_AUTHKEY:-}" ]]; then
            mode=authkey
          elif [[ -n "${TS_OAUTH_CLIENT_ID:-}" && -n "${TS_OAUTH_SECRET:-}" ]]; then
            test -n "${TS_TAGS:-}"
            mode=oauth
          else
            echo "No visible Tailscale credential set" >&2
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Join private tailnet with auth key
        if: steps.source.outputs.ready == 'true' && steps.tailscale_auth.outputs.mode == 'authkey'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: ${{ env.SERVER_HOST }}

      - name: Join private tailnet with OAuth
        if: steps.source.outputs.ready == 'true' && steps.tailscale_auth.outputs.mode == 'oauth'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TS_TAGS || 'tag:ci' }}
          ping: ${{ env.SERVER_HOST }}

      - name: Configure SSH identity
        if: steps.source.outputs.ready == 'true'
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.POLYMARKET_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}" || { echo "missing POLYMARKET_SERVER_SSH_KEY" >&2; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/polymarket_v7_evidence
          chmod 600 ~/.ssh/polymarket_v7_evidence
          ssh-keyscan -T 5 -p "$SERVER_PORT" "$SERVER_HOST" > ~/.ssh/known_hosts

      - name: Reconcile exact-SHA isolated V7 PAPER runtime
        if: steps.source.outputs.ready == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_BRANCH: ${{ steps.source.outputs.source_branch }}
        run: |
          set -euo pipefail
          PROXY_PORT="$(python3 -c 'import json; print(json.load(open("config/v7_evidence_runtime.json"))["proxy_port"])')"
          BASE_REL="$(python3 -c 'import json; print(json.load(open("config/v7_evidence_runtime.json"))["runtime_root"])')"
          ssh -i ~/.ssh/polymarket_v7_evidence -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=10 -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "SOURCE_SHA='$SOURCE_SHA' SOURCE_BRANCH='$SOURCE_BRANCH' PROXY_PORT='$PROXY_PORT' BASE_REL='$BASE_REL' bash -s" <<'REMOTE' | tee v7-evidence/server-reconcile.txt
          set -euo pipefail
          APP="$HOME/polymarket"
          BASE="$HOME/${BASE_REL}"
          WORKTREES="$BASE/worktrees"
          RUNS="$BASE/by-sha"
          ACTIVE="$BASE/active.env"
          mkdir -p "$WORKTREES" "$RUNS"
          cd "$APP"
          git fetch -q origin main "$SOURCE_BRANCH"
          test "$(git rev-parse "origin/$SOURCE_BRANCH")" = "$SOURCE_SHA"
          main_sha="$(git rev-parse origin/main)"

          # The research head may change model/runtime code but may not redefine
          # operator/control-plane authority or select itself as live champion.
          for path in \
            config/operator_directives.json \
            config/scheduler_registry.json \
            scripts/research_pr_policy.py \
            scripts/validate_scheduler_registry.py \
            tests/test_research_policy_branch_classification.py \
            .github/workflows/control-plane-event-bridge.yml \
            .github/workflows/v7-point-in-time-universe-archive.yml; do
            test "$(git rev-parse "origin/main:$path")" = "$(git rev-parse "$SOURCE_SHA:$path")"
          done
          git show "$SOURCE_SHA:config/live_champion.json" | python3 -c 'import json,sys; m=json.load(sys.stdin); assert int(m["version"]) == 6; assert m["loop"] == "scripts/paper_v6_loop.sh"'
          git show "$SOURCE_SHA:config/paper_v7.json" | python3 -c 'import json,sys; c=json.load(sys.stdin); assert c["paper_only"] is True; assert c["v7"]["authenticated_execution"] is False; assert c["fixed_dollar_trade_cap_enabled"] is False; assert c["max_trade_fraction"] == c["max_market_fraction"] == c["max_event_fraction"] == c["max_gross_fraction"] == 1.0'

          worktree="$WORKTREES/$SOURCE_SHA"
          run_root="$RUNS/$SOURCE_SHA"
          if [[ ! -d "$worktree/.git" && ! -f "$worktree/.git" ]]; then
            rm -rf "$worktree"
            git worktree add --detach "$worktree" "$SOURCE_SHA" >/dev/null
          fi
          test "$(git -C "$worktree" rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p "$run_root"

          old_sha=""; old_pid=""
          if [[ -f "$ACTIVE" ]]; then
            old_sha="$(sed -n 's/^sha=//p' "$ACTIVE" | head -n1)"
            old_pid="$(sed -n 's/^pid=//p' "$ACTIVE" | head -n1)"
          fi
          if [[ "$old_sha" != "$SOURCE_SHA" && "$old_pid" =~ ^[1-9][0-9]*$ ]] && kill -0 "$old_pid" 2>/dev/null; then
            kill -TERM "$old_pid" 2>/dev/null || true
            for _ in $(seq 1 100); do
              kill -0 "$old_pid" 2>/dev/null || break
              sleep 0.1
            done
            kill -0 "$old_pid" 2>/dev/null && kill -KILL "$old_pid" 2>/dev/null || true
          fi

          cd "$worktree"
          if [[ ! -x build/polymarket_trade_recorder || ! -x build/polymarket_engine ]]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release >/dev/null
            cmake --build build -j2 >/dev/null
          fi

          pid=""
          if [[ "$old_sha" == "$SOURCE_SHA" && "$old_pid" =~ ^[1-9][0-9]*$ ]] && kill -0 "$old_pid" 2>/dev/null; then
            pid="$old_pid"
          else
            nohup env V7_MARKET_PROXY_PORT="$PROXY_PORT" \
              python3 scripts/runtime_singleton_launcher.py \
              --lock "$run_root/runtime_owner.lock" -- \
              bash scripts/paper_v7_loop.sh config/paper_v7.json "$run_root" \
              >>"$run_root/runtime.log" 2>&1 </dev/null &
            pid=$!
            sleep 2
            kill -0 "$pid"
          fi

          tmp="$ACTIVE.tmp.$$"
          {
            printf 'sha=%s\n' "$SOURCE_SHA"
            printf 'pid=%s\n' "$pid"
            printf 'proxy_port=%s\n' "$PROXY_PORT"
            printf 'run_root=%s\n' "$run_root"
            printf 'worktree=%s\n' "$worktree"
            printf 'main_sha=%s\n' "$main_sha"
            printf 'updated_ts=%s\n' "$(date +%s)"
          } > "$tmp"
          mv "$tmp" "$ACTIVE"

          # Wait only for a bounded health sample; the runtime itself persists.
          for _ in $(seq 1 120); do
            if [[ -s "$run_root/v7_supervisor.json" && -s "$run_root/execution/v7_execution_supervisor.json" ]]; then
              break
            fi
            kill -0 "$pid" || { tail -n 100 "$run_root/runtime.log" >&2 || true; exit 1; }
            sleep 1
          done
          kill -0 "$pid"
          curl -fsS --max-time 2 "http://127.0.0.1:${PROXY_PORT}/healthz" >/dev/null
          python3 - "$run_root" "$SOURCE_SHA" "$pid" "$PROXY_PORT" <<'PY'
          import json,sys,time
          from pathlib import Path
          root=Path(sys.argv[1]); sha=sys.argv[2]; pid=int(sys.argv[3]); port=int(sys.argv[4]); now=time.time()
          sup=json.loads((root/'v7_supervisor.json').read_text())
          exe=json.loads((root/'execution'/'v7_execution_supervisor.json').read_text())
          assert now-float(sup['timestamp']) <= 60
          assert now-float(exe['timestamp']) <= 120
          payload={
              'schema':'polymarket_v7_isolated_runtime_status_v1',
              'source_sha':sha,
              'pid':pid,
              'proxy_port':port,
              'paper_only':True,
              'authenticated_execution':False,
              'runtime_alive':True,
              'supervisor_age_seconds':now-float(sup['timestamp']),
              'execution_supervisor_age_seconds':now-float(exe['timestamp']),
              'run_root':str(root),
              'timestamp':int(now),
          }
          (root/'isolated_runtime_status.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          print(json.dumps(payload,sort_keys=True))
          PY
          REMOTE

      - name: Collect current exact-SHA evidence
        if: steps.source.outputs.ready == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          BASE_REL="$(python3 -c 'import json; print(json.load(open("config/v7_evidence_runtime.json"))["runtime_root"])')"
          REMOTE_ROOT="$HOME/$BASE_REL/by-sha/$SOURCE_SHA"
          for rel in \
            isolated_runtime_status.json \
            v7_supervisor.json \
            execution/v7_execution_supervisor.json \
            execution/v7_execution_evidence.json \
            execution/v7_execution_evidence.md \
            execution/action_report.json; do
            out="v7-evidence/$(basename "$rel")"
            scp -i ~/.ssh/polymarket_v7_evidence -o IdentitiesOnly=yes -o BatchMode=yes \
              -P "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST:$REMOTE_ROOT/$rel" "$out" 2>/dev/null || true
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          gate=json.loads(Path('v7-evidence/check-gate.json').read_text())
          runtime={}
          evidence={}
          p=Path('v7-evidence/isolated_runtime_status.json')
          if p.exists(): runtime=json.loads(p.read_text())
          p=Path('v7-evidence/v7_execution_evidence.json')
          if p.exists(): evidence=json.loads(p.read_text())
          summary={
              'schema':'polymarket_v7_unified_evidence_reconcile_v1',
              'source_sha':gate['source_sha'],
              'exact_head_green':gate['ready'],
              'runtime':runtime,
              'execution_evidence_summary':evidence.get('summary') if isinstance(evidence,dict) else None,
              'models':evidence.get('models') if isinstance(evidence,dict) else None,
          }
          Path('v7-evidence/reconcile-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          echo '## V7 unified PAPER evidence runtime' >> "$GITHUB_STEP_SUMMARY"
          if test -s v7-evidence/reconcile-summary.json; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat v7-evidence/reconcile-summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          elif test -s v7-evidence/check-gate.json; then
            echo 'Exact research head is not fully green yet; incumbent V7 evidence runtime is left untouched.' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat v7-evidence/check-gate.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload exact-SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-unified-paper-evidence-${{ github.run_id }}
          path: v7-evidence/
          if-no-files-found: warn
          retention-days: 30
