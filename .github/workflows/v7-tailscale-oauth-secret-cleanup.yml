name: V7 Tailscale OAuth-secret CI cleanup

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-tailscale-oauth-secret-cleanup-request.json
      - .github/workflows/v7-tailscale-oauth-secret-cleanup.yml

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate request
        run: |
          python3 - deploy/v7-tailscale-oauth-secret-cleanup-request.json <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1]))
          assert v.get('schema')=='polymarket_v7_tailscale_oauth_secret_cleanup_v1'
          assert v.get('maximum_deletions')==1200
          assert v.get('preserve_ips')==['100.102.9.16','100.104.183.109','100.65.195.111']
          PY

      - name: Exchange OAuth client secret for API token
        env:
          OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          set -euo pipefail
          test -n "${OAUTH_CLIENT_ID:-}"
          test -n "${OAUTH_CLIENT_SECRET:-}"
          response="$(curl -fsS -X POST 'https://api.tailscale.com/api/v2/oauth/token' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$OAUTH_CLIENT_ID" \
            --data-urlencode "client_secret=$OAUTH_CLIENT_SECRET")"
          access="$(python3 -c 'import json,sys; v=json.load(sys.stdin); print(v["access_token"])' <<<"$response")"
          test -n "$access"
          echo "::add-mask::$access"
          {
            echo 'TS_ACCESS_TOKEN<<EOF_TS'
            echo "$access"
            echo 'EOF_TS'
          } >> "$GITHUB_ENV"

      - name: Delete only offline GitHub CI devices
        run: |
          set -euo pipefail
          python3 - "$TS_ACCESS_TOKEN" <<'PY'
          import json,re,sys,time,urllib.request,urllib.parse
          token=sys.argv[1]
          preserve={'100.102.9.16','100.104.183.109','100.65.195.111'}
          ci=re.compile(r'^(?:github-runner|github-runnervm|gh-(?:deploy|health|freeze|inventory)|github-actions)',re.I)

          def call(url,method='GET'):
              req=urllib.request.Request(url,method=method,headers={
                  'Authorization':'Bearer '+token,
                  'Accept':'application/json',
                  'User-Agent':'polymarket-v7-ci-cleanup',
              })
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read()
              return json.loads(raw) if raw else {}

          listing=call('https://api.tailscale.com/api/v2/tailnet/-/devices')
          devices=listing.get('devices') or []
          candidates=[]
          for d in devices:
              if not isinstance(d,dict): continue
              host=str(d.get('hostname') or d.get('name') or '')
              ips=[str(x) for x in (d.get('addresses') or d.get('tailscaleIPs') or [])]
              online=bool(d.get('online') or d.get('connectedToControl') or d.get('connected'))
              if not ci.match(host) or online or preserve.intersection(ips):
                  continue
              did=d.get('id')
              if did is not None:
                  candidates.append((str(did),host,ips))
          if len(candidates)>1200:
              raise SystemExit('too_many_candidates')
          for did,host,ips in candidates:
              call('https://api.tailscale.com/api/v2/device/'+urllib.parse.quote(did,safe=''),method='DELETE')
              time.sleep(0.03)

          after=call('https://api.tailscale.com/api/v2/tailnet/-/devices')
          remaining=[]
          for d in after.get('devices') or []:
              host=str(d.get('hostname') or d.get('name') or '')
              ips=[str(x) for x in (d.get('addresses') or d.get('tailscaleIPs') or [])]
              online=bool(d.get('online') or d.get('connectedToControl') or d.get('connected'))
              if ci.match(host) and not online and not preserve.intersection(ips):
                  remaining.append(host)
          print(json.dumps({
              'removed_count':len(candidates),
              'remaining_offline_ci_count':len(remaining),
              'preserved_ips':sorted(preserve),
          },sort_keys=True))
          if remaining:
              raise SystemExit('offline_ci_devices_remain')
          PY
