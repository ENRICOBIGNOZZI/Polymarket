name: merge-main-v4

on:
  push:
    branches: [implement/paper-live-oos-pilot-v4]

permissions:
  contents: write

concurrency:
  group: merge-main-v4
  cancel-in-progress: false

jobs:
  merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implement/paper-live-oos-pilot-v4
          fetch-depth: 0

      - name: Merge current main while preserving V4 intent outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e
          if (( rc != 0 )); then
            unresolved=$(git diff --name-only --diff-filter=U)
            echo "conflicts: $unresolved"
            allowed=$'CMakeLists.txt\nsrc/pca_stat_arb.cpp\nsrc/stat_arb.cpp'
            while IFS= read -r f; do
              [[ -z "$f" ]] && continue
              if ! grep -Fxq "$f" <<<"$allowed"; then
                echo "unexpected merge conflict: $f" >&2
                exit 1
              fi
            done <<<"$unresolved"
            git checkout --ours CMakeLists.txt src/stat_arb.cpp src/pca_stat_arb.cpp
          fi

          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/stat_arb.cpp')
          s = p.read_text()
          old = '''        auto books = api.fetch_books(tokens);\n\n        std::vector<const pm::Market*> universe;\n        universe.reserve(markets.size());\n        for (const auto& m : markets) {\n'''
          new = '''        auto books = api.fetch_books(tokens);\n        const std::int64_t now = static_cast<std::int64_t>(std::time(nullptr));\n\n        std::vector<const pm::Market*> universe;\n        universe.reserve(markets.size());\n        for (const auto& m : markets) {\n            if (!pm::pregame_market_eligible(\n                    pm::MarketTiming{m.timed_sports, m.game_start_ts, m.seconds_delay}, now)) continue;\n'''
          if old not in s:
              raise SystemExit('stat_arb insertion anchor not found')
          s = s.replace(old, new, 1)
          old_now = '''        for (auto* m : universe) yes_tokens.push_back(m->yes_token);\n        const std::int64_t now = static_cast<std::int64_t>(std::time(nullptr));\n        const std::int64_t start = now - static_cast<std::int64_t>(lookback_hours) * 3600;\n'''
          new_now = '''        for (auto* m : universe) yes_tokens.push_back(m->yes_token);\n        const std::int64_t start = now - static_cast<std::int64_t>(lookback_hours) * 3600;\n'''
          if old_now not in s:
              raise SystemExit('stat_arb now anchor not found')
          p.write_text(s.replace(old_now, new_now, 1))

          p = Path('src/pca_stat_arb.cpp')
          s = p.read_text()
          old = '''        auto books = api.fetch_books(all_tokens);\n\n        std::vector<const pm::Market*> universe;\n        for (const auto& m : markets) {\n'''
          new = '''        auto books = api.fetch_books(all_tokens);\n        const auto now = std::chrono::duration_cast<std::chrono::seconds>(\n            std::chrono::system_clock::now().time_since_epoch()).count();\n\n        std::vector<const pm::Market*> universe;\n        for (const auto& m : markets) {\n            if (!pm::pregame_market_eligible(\n                    pm::MarketTiming{m.timed_sports, m.game_start_ts, m.seconds_delay}, now)) continue;\n'''
          if old not in s:
              raise SystemExit('pca insertion anchor not found')
          s = s.replace(old, new, 1)
          old_now = '''        for (auto* m : universe) yes_tokens.push_back(m->yes_token);\n        const auto now = std::chrono::duration_cast<std::chrono::seconds>(\n            std::chrono::system_clock::now().time_since_epoch()).count();\n        const auto start = now - static_cast<std::int64_t>(lookback_hours) * 3600;\n'''
          new_now = '''        for (auto* m : universe) yes_tokens.push_back(m->yes_token);\n        const auto start = now - static_cast<std::int64_t>(lookback_hours) * 3600;\n'''
          if old_now not in s:
              raise SystemExit('pca now anchor not found')
          p.write_text(s.replace(old_now, new_now, 1))
          PY

          rm -f .github/workflows/merge-main-v4.yml
          git add -A
          git diff --cached --check
          if git diff --name-only --diff-filter=U | grep -q .; then
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

      - name: Validate merged V4
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev python3
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          python3 -m unittest tests/test_monitoring_exporter.py tests/test_monitoring_v4_exporter.py tests/test_monitoring_latest_exporter.py -v
          python3 -m py_compile monitoring/exporter.py monitoring/exporter_v4.py monitoring/exporter_latest.py scripts/merge_v4_intents.py scripts/walk_forward_v4.py scripts/tiny_live_pilot.py
          python3 -m json.tool monitoring/grafana/dashboards/polymarket-latest.json >/dev/null
          bash -n scripts/paper_v4_once.sh scripts/paper_v4_loop.sh scripts/monitoring_up.sh scripts/monitoring_down.sh
          docker compose -f docker-compose.monitoring.yml config >/dev/null

      - name: Commit merge
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "Merge main safety hotfix into V4"
          git push origin HEAD:implement/paper-live-oos-pilot-v4
