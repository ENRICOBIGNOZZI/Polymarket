name: V7 recover stale PAPER kill

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-recover-stale-paper-kill-request.json

permissions:
  contents: read
  id-token: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
      INSTANCE_ID: ${{ vars.POLYMARKET_LONDON_INSTANCE_ID || 'i-0fba2bac9fdc5cbeb' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate request
        id: req
        run: |
          python3 - deploy/v7-recover-stale-paper-kill-request.json "$GITHUB_OUTPUT" <<'PY'
          import json,re,sys
          v=json.load(open(sys.argv[1]))
          assert set(v)=={'schema','expected_sha','paper_only','authenticated_execution','real_order_submission','recover_approved'}
          assert v['schema']=='polymarket_v7_recover_stale_paper_kill_v1'
          assert re.fullmatch(r'[0-9a-f]{40}',v['expected_sha'])
          assert v['paper_only'] is True
          assert v['authenticated_execution'] is False
          assert v['real_order_submission'] is False
          assert v['recover_approved'] is True
          with open(sys.argv[2],'a') as h: h.write('sha='+v['expected_sha']+'\n')
          PY

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: polymarket-v7-recover-stale-paper-kill
          aws-region: eu-west-2

      - name: Recover and restart
        env:
          EXPECTED_SHA: ${{ steps.req.outputs.sha }}
        run: |
          set -euo pipefail
          payload="$(cat <<'SH'
          set -euo pipefail
          SHA=__SHA__
          PAPER=polymarket-v7-paper.service
          EXPORTER=polymarket-v7-exporter.service

          test "$(systemctl is-active "$PAPER" || true)" = inactive
          envs="$(systemctl show "$PAPER" -p Environment --value)"
          ROOT="$(python3 - "$envs" "$SHA" <<'PY'
          import shlex,sys
          env=dict(x.split('=',1) for x in shlex.split(sys.argv[1]) if '=' in x)
          sha=sys.argv[2]
          assert env.get('POLYMARKET_EXPECTED_SHA')==sha
          assert env.get('PM_V7_MODEL_SHA')==sha
          assert env.get('PM_V7_AUTHENTICATED_EXECUTION')=='0'
          assert env.get('PM_V7_REAL_ORDER_SUBMISSION')=='0'
          root=env.get('PM_V7_RUN_ROOT')
          assert root and root.startswith('/mnt/polymarket-data/')
          print(root)
          PY
          )"
          CONTROL="$ROOT/control"
          KILL="$CONTROL/KILL"
          test -f "$KILL"
          test ! -s "$KILL"

          python3 - "$ROOT" "$SHA" <<'PY'
          import json,sys,os
          from pathlib import Path
          root=Path(sys.argv[1]); sha=sys.argv[2]
          def load(p):
              try: return json.loads(p.read_text())
              except Exception: return {}
          portfolio=load(root/'control/portfolio_state.json')
          runtime=load(root/'control/runtime_status.json')
          supervisor=load(root/'control/supervisor_status.json')
          account=load(root/'external_fair/paper_router_status.json')
          executor=load(root/'micro_maker/authorized_make_executor_status.json')
          assert portfolio.get('paper_only') is True
          assert portfolio.get('authenticated_execution') is False
          assert portfolio.get('real_order_submission') is False
          assert portfolio.get('real_capital_at_risk') is False
          assert portfolio.get('killed') is False
          assert float(portfolio.get('drawdown') or 0.0) < float(portfolio.get('max_drawdown') or 0.15)
          details=((portfolio.get('engines') or {}).get('CRYPTO_SETTLEMENT_ENGINE') or {}).get('details') or {}
          assert int(details.get('open_order_count') or 0)==0
          assert int(details.get('ledger_records') or 0)==0
          ledger=root/'ledger/execution.jsonl'
          assert ledger.is_file()
          assert ledger.stat().st_size==0
          for obj, fields in ((account,('open_positions','pending_maker_orders')),(executor,('active_orders',))):
              if obj:
                  assert obj.get('paper_only') is True
                  assert obj.get('authenticated_execution') is False
                  for field in fields: assert int(obj.get(field) or 0)==0
          assert runtime.get('model_sha')==sha
          assert runtime.get('paper_only') is True
          assert runtime.get('authenticated_execution') is False
          assert runtime.get('real_order_submission') is False
          assert runtime.get('killed') is True
          assert supervisor.get('expected_sha')==sha
          assert supervisor.get('state')=='quarantined'
          assert set(supervisor.get('reasons') or []) <= {'runtime_killed','runtime_pid_dead','runtime_status_stale'}
          print('STALE_KILL_RECOVERY_SAFE=1')
          PY

          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          archive="$CONTROL/recovery_archive_$stamp"
          mkdir -m 0700 "$archive"
          for name in KILL runtime_status.json supervisor_status.json; do
            if [[ -e "$CONTROL/$name" ]]; then mv "$CONTROL/$name" "$archive/$name"; fi
          done
          if [[ -d "$CONTROL/runtime.lock" ]]; then
            pid="$(cat "$CONTROL/runtime.lock/pid" 2>/dev/null || echo 0)"
            if [[ "$pid" =~ ^[0-9]+$ ]] && kill -0 "$pid" 2>/dev/null; then
              echo "live runtime.lock owner $pid; refusing" >&2
              exit 1
            fi
            mv "$CONTROL/runtime.lock" "$archive/runtime.lock"
          fi

          systemctl reset-failed "$PAPER" || true
          systemctl start "$EXPORTER" || true
          systemctl start "$PAPER"

          for i in $(seq 1 120); do
            [[ "$(systemctl is-active "$PAPER" || true)" == active ]] || { sleep 1; continue; }
            STATUS="$ROOT/research/repricing_book/pure_arb_status.json"
            if [[ -s "$STATUS" ]] && python3 - "$STATUS" "$SHA" <<'PY' >/dev/null 2>&1
          import json,sys,time
          v=json.load(open(sys.argv[1])); sha=sys.argv[2]
          assert v.get('model_sha')==sha
          assert v.get('state')=='running'
          assert v.get('paper_only') is True
          assert v.get('real_order_submission') is False
          assert int(v.get('expected_contexts') or 0)==30
          assert int(v.get('fee_ready_contexts') or 0)==30
          assert int(time.time()*1000)-int(v.get('timestamp_ms') or 0)<10000
          PY
            then break
            fi
            sleep 1
          done

          test "$(systemctl is-active "$PAPER")" = active
          STATUS="$ROOT/research/repricing_book/pure_arb_status.json"
          python3 - "$STATUS" "$SHA" <<'PY'
          import json,sys,time
          v=json.load(open(sys.argv[1])); sha=sys.argv[2]
          assert v.get('model_sha')==sha and v.get('state')=='running'
          assert int(v.get('expected_contexts') or 0)==30
          assert int(v.get('fee_ready_contexts') or 0)==30
          assert int(time.time()*1000)-int(v.get('timestamp_ms') or 0)<10000
          print('PURE_ARB_RECOVERED=1')
          print('EVALUATIONS='+str(v.get('evaluations')))
          print('CYCLES='+str(v.get('cycles_total')))
          print('PNL='+str(v.get('paper_locked_pnl_pre_gas_total')))
          PY
          curl -fsS --get --data-urlencode 'query=polymarket_pure_arb_up' http://127.0.0.1:9090/api/v1/query
          echo
          SH
          )"
          payload="${payload/__SHA__/$EXPECTED_SHA}"
          encoded="$(printf '%s' "$payload" | base64 -w0)"
          wrapped="printf '%s' '$encoded' | base64 -d | bash"
          params="$(python3 -c 'import json,sys; print(json.dumps({"commands":[sys.argv[1]],"executionTimeout":["420"]},separators=(",",":")))' "$wrapped")"
          cid="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --parameters "$params" --comment "Polymarket V7 safe stale-KILL PAPER recovery" --region "$AWS_REGION" --query 'Command.CommandId' --output text)"
          for i in $(seq 1 210); do
            status="$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query Status --output text 2>/dev/null || true)"
            if [[ "$status" == Success ]]; then
              aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query StandardOutputContent --output text
              exit 0
            fi
            case "$status" in Failed|Cancelled|TimedOut)
              aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query StandardErrorContent --output text >&2 || true
              exit 1;;
            esac
            sleep 1
          done
          exit 1
