name: apply-terminal-evidence-gate

on:
  push:
    branches: ["fix/terminal-evidence-gate"]

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev python3

      - name: Apply hard terminal-evidence gate and regression test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/engine.cpp')
          s = p.read_text()
          replacements = [
              (
                  '    if (sw <= 1e-12) return {0.5, 1.0};\n',
                  '    if (sw <= 1e-12) {\n'
                  '        const double nan = std::numeric_limits<double>::quiet_NaN();\n'
                  '        return {nan, nan};\n'
                  '    }\n'
              ),
              (
                  '    std::size_t gross_positive = 0, cost_positive = 0, net_positive = 0;\n',
                  '    std::size_t gross_positive = 0, cost_positive = 0, net_positive = 0, no_terminal_evidence = 0;\n'
              ),
              (
                  '        auto [fair, uncertainty] = ensemble(preds, std::max(yi->second.spread(), ni->second.spread()));\n'
                  '        last_forecasts_[m.id].clear();\n'
                  '        for (const auto& e : preds) last_forecasts_[m.id][e.name] = e.q_yes;\n'
                  '        const FeeDetails fd = fee_for(m);\n',
                  '        auto [fair, uncertainty] = ensemble(preds, std::max(yi->second.spread(), ni->second.spread()));\n'
                  '        const bool has_terminal_evidence = std::isfinite(fair) && std::isfinite(uncertainty);\n'
                  '        last_forecasts_[m.id].clear();\n'
                  '        for (const auto& e : preds) {\n'
                  '            auto wit = cfg_.expert_weights.find(e.name);\n'
                  '            if (wit != cfg_.expert_weights.end() && wit->second > 0.0 && e.confidence > 0.0) {\n'
                  '                last_forecasts_[m.id][e.name] = e.q_yes;\n'
                  '            }\n'
                  '        }\n'
                  '        const FeeDetails fd = fee_for(m);\n'
              ),
              (
                  '        make("YES", yi->second, fair);\n'
                  '        make("NO", ni->second, 1.0 - fair);\n\n'
                  '        auto pit = positions_.find(m.id);\n'
                  '        if (pit != positions_.end()) {\n'
                  '            auto bit = books.find(pit->second.token_id);\n'
                  '            if (bit != books.end()) maybe_exit(m, bit->second, fair, fd);\n'
                  '        }\n',
                  '        if (has_terminal_evidence) {\n'
                  '            make("YES", yi->second, fair);\n'
                  '            make("NO", ni->second, 1.0 - fair);\n'
                  '        } else {\n'
                  '            ++no_terminal_evidence;\n'
                  '        }\n\n'
                  '        auto pit = positions_.find(m.id);\n'
                  '        if (pit != positions_.end()) {\n'
                  '            auto bit = books.find(pit->second.token_id);\n'
                  '            // Missing terminal evidence is a hard entry gate, not an instruction to\n'
                  '            // liquidate. Use the live market midpoint only for conservative exit\n'
                  '            // management of an already-open position.\n'
                  '            const double exit_fair = has_terminal_evidence ? fair : mid;\n'
                  '            if (bit != books.end()) maybe_exit(m, bit->second, exit_fair, fd);\n'
                  '        }\n'
              ),
              (
                  '    std::cout << "discovered=" << markets.size() << " tradable=" << tradable.size() << " candidates=" << candidates.size()\n'
                  '              << " gross_pos=" << gross_positive << " cost_pos=" << cost_positive << " net_pos=" << net_positive\n'
                  '              << " best_net=" << (std::isfinite(best_net) ? best_net : 0.0) << " pca=" << pca.size() << " graph=" << graph.size()\n',
                  '    std::cout << "discovered=" << markets.size() << " tradable=" << tradable.size() << " candidates=" << candidates.size()\n'
                  '              << " no_terminal_evidence=" << no_terminal_evidence\n'
                  '              << " gross_pos=" << gross_positive << " cost_pos=" << cost_positive << " net_pos=" << net_positive\n'
                  '              << " best_net=" << (candidates.empty() ? 0.0 : best_net) << " pca=" << pca.size() << " graph=" << graph.size()\n'
              ),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'engine.cpp patch pattern not found: {old[:100]!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('tests/integration_mock.sh')
          s = p.read_text()
          old = '''grep -q '"open_positions":1' "$TMP/run/status.json"
          touch "$STATE"
          '''
          new = '''grep -q '"open_positions":1' "$TMP/run/status.json"

          # Regression: experts whose configured terminal weights are all zero must
          # not fall back to a 0.5 fair value or create a paper trade.
          cat > "$TMP/config_zero.json" <<E
          {
           "gamma_url":"http://127.0.0.1:$PORT",
           "clob_url":"http://127.0.0.1:$PORT",
           "run_dir":"$TMP/run_zero",
           "external_signals_file":"$TMP/ext.csv",
           "market_limit":10,"books_batch_size":10,"starting_capital":10000,
           "min_liquidity":0,"min_net_edge":0.01,"uncertainty_penalty":0.05,"slippage_bps":0,
           "fractional_kelly":0.10,"max_trade_usd":100,"max_market_fraction":0.1,
           "max_event_fraction":0.1,"max_gross_fraction":0.2,"max_drawdown":0.15,
           "pca_window":10,"pca_min_history":3,"pca_universe":10,
           "expert_weights":{"micro":0.0,"pca":0.0,"graph":0.0,"semantic":0.0,"external":0.0}
          }
          E
          "$BIN" --config "$TMP/config_zero.json" --once --paper
          ZERO_FILLS=$(($(wc -l < "$TMP/run_zero/fills.csv")-1))
          ZERO_SIGNALS=$(($(wc -l < "$TMP/run_zero/signals.csv")-1))
          test "$ZERO_FILLS" -eq 0
          test "$ZERO_SIGNALS" -eq 0
          grep -q '"open_positions":0' "$TMP/run_zero/status.json"

          touch "$STATE"
          '''
          if old not in s:
              raise SystemExit('integration_mock.sh patch anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build and test patched engine
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Commit tested patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/engine.cpp tests/integration_mock.sh
          git diff --cached --check
          git commit -m "Fix terminal fallback without active evidence"
          git push origin HEAD:fix/terminal-evidence-gate
