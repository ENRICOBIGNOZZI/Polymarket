name: V7 mamma Grafana minimal probe

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-mamma-grafana-minimal-probe-request.json

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SERVER_HOST: ${{ vars.POLYMARKET_SERVER_HOST || '100.104.183.109' }}
      SERVER_USER: ${{ vars.POLYMARKET_SERVER_USER || 'enrico' }}
      SERVER_PORT: ${{ vars.POLYMARKET_SERVER_PORT || '22' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate
        run: |
          python3 - deploy/v7-mamma-grafana-minimal-probe-request.json <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1]))=={"schema":"polymarket_v7_mamma_grafana_minimal_probe_v1","read_only":True}
          PY
      - name: Select Tailscale credential
        id: ts
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          set -euo pipefail
          if [[ -n "${TS_AUTHKEY:-}" ]]; then echo mode=authkey >> "$GITHUB_OUTPUT"
          elif [[ -n "${TS_OAUTH_CLIENT_ID:-}" && -n "${TS_OAUTH_SECRET:-}" ]]; then echo mode=oauth >> "$GITHUB_OUTPUT"
          else exit 1; fi
      - name: Join tailnet authkey
        if: steps.ts.outputs.mode == 'authkey'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: ${{ env.SERVER_HOST }}
      - name: Join tailnet oauth
        if: steps.ts.outputs.mode == 'oauth'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TS_TAGS || 'tag:ci' }}
          ping: ${{ env.SERVER_HOST }}
      - name: SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.POLYMARKET_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -T 5 -p "$SERVER_PORT" "$SERVER_HOST" > ~/.ssh/known_hosts
      - name: Probe active Grafana
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/key -o IdentitiesOnly=yes -o BatchMode=yes -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            'python3 -c '"'"'import os,glob,json,subprocess,urllib.request; base=os.path.expanduser("~/.cache/polymarket-grafana-london"); print("PROCESS"); subprocess.run(["pgrep","-af","grafana"]); print("PROVIDERS"); [print("---",p,"\n"+open(p).read()) for p in glob.glob(base+"/config/provisioning/dashboards/*") if os.path.isfile(p)]; print("FILES"); [print(p) for p in glob.glob(base+"/**/polymarket-v7-pure-arb.json",recursive=True)]; print("SEARCH");
try:
 print(urllib.request.urlopen("http://127.0.0.1:3000/api/search?query=Pure%20Arbitrage",timeout=5).read().decode())
except Exception as e: print(type(e).__name__,e)
print("UID");
try:
 print(urllib.request.urlopen("http://127.0.0.1:3000/api/dashboards/uid/polymarket-v7-pure-arb",timeout=5).read().decode()[:2000])
except Exception as e: print(type(e).__name__,e)
print("LOGS"); [print("---",p,"\n"+"\n".join(open(p,errors="replace").read().splitlines()[-300:])) for p in glob.glob(base+"/logs/*.log")]'"'"''
