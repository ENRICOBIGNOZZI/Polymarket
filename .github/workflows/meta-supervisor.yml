name: Polymarket Scheduler Meta Supervisor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "config/scheduler_registry.json"
      - "scripts/scheduler_meta_supervisor.py"
      - "scripts/validate_scheduler_registry.py"
      - "tests/test_scheduler_periodicity.py"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "config/scheduler_registry.json"
      - "scripts/scheduler_meta_supervisor.py"
      - "scripts/validate_scheduler_registry.py"
      - "tests/test_scheduler_periodicity.py"
      - ".github/workflows/**"

permissions:
  actions: write
  contents: read

concurrency:
  group: polymarket-scheduler-meta-supervisor
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      SERVER_DEPLOY_ENABLED: ${{ vars.POLYMARKET_SERVER_DEPLOY || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0

      - name: Validate periodic scheduler contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_scheduler_registry.py \
            --root . \
            --registry config/scheduler_registry.json \
            --output scheduler-registry-report.md
          python3 -m unittest tests/test_scheduler_periodicity.py -v
          python3 -m py_compile scripts/scheduler_meta_supervisor.py

      - name: Build recovery plan
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main paper-validated
          main_sha="$(git rev-parse origin/main)"
          validated_sha="$(git rev-parse origin/paper-validated)"
          relation=diverged
          if [[ "$main_sha" == "$validated_sha" ]]; then
            relation=current
          elif git merge-base --is-ancestor "$validated_sha" "$main_sha"; then
            relation=pending_validation
          fi
          {
            echo "MAIN_SHA=$main_sha"
            echo "VALIDATED_SHA=$validated_sha"
            echo "VALIDATION_RELATION=$relation"
          } >> "$GITHUB_ENV"

          gh run list --limit 500 \
            --json databaseId,workflowName,status,conclusion,headBranch,headSha,event,createdAt,updatedAt,url \
            > scheduler-runs.json

          set +e
          python3 scripts/scheduler_meta_supervisor.py \
            --registry config/scheduler_registry.json \
            --runs scheduler-runs.json \
            --main-sha "$main_sha" \
            --validated-sha "$validated_sha" \
            --validation-relation "$relation" \
            --deploy-enabled "$SERVER_DEPLOY_ENABLED" \
            --plan scheduler-recovery-plan.json \
            --markdown scheduler-meta-report.md
          planner_rc=$?
          set -e
          echo "PLANNER_RC=$planner_rc" >> "$GITHUB_ENV"

      - name: Record pull-request validation
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          cat > scheduler-meta-report.md <<EOF
          # Scheduler meta-supervisor

          - event: \`pull_request\`
          - decision: periodic contracts validated; recovery dispatch is disabled on pull requests
          EOF
          printf '[]\n' > scheduler-recovery-plan.json
          printf '[]\n' > scheduler-runs.json
          echo 'PLANNER_RC=0' >> "$GITHUB_ENV"

      - name: Dispatch stale schedulers
        if: github.event_name != 'pull_request' && env.PLANNER_RC == '0'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > scheduler-recovery-plan.tsv
          import json
          from pathlib import Path

          plan = json.loads(Path("scheduler-recovery-plan.json").read_text(encoding="utf-8"))
          for item in plan:
              expected = item.get("inputs", {}).get("expected_sha", "")
              reason = str(item.get("reason", "")).replace("\t", " ").replace("\n", " ")
              print(f"{item['workflow']}\t{expected}\t{reason}")
          PY

          : > scheduler-dispatches.txt
          while IFS=$'\t' read -r workflow expected_sha reason; do
            [[ -n "${workflow:-}" ]] || continue
            if [[ -n "${expected_sha:-}" ]]; then
              gh workflow run "$workflow" --ref main -f expected_sha="$expected_sha"
            else
              gh workflow run "$workflow" --ref main
            fi
            printf 'workflow=%s expected_sha=%s reason=%s\n' \
              "$workflow" "${expected_sha:-current-main}" "$reason" \
              | tee -a scheduler-dispatches.txt
          done < scheduler-recovery-plan.tsv

          {
            echo
            echo '## Recovery dispatches executed'
            echo '```text'
            cat scheduler-dispatches.txt
            echo '```'
          } >> scheduler-meta-report.md

      - name: Publish meta-supervisor report
        if: always()
        shell: bash
        run: |
          cat scheduler-registry-report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          cat scheduler-meta-report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload scheduler recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-meta-supervisor-${{ github.run_id }}
          path: |
            scheduler-registry-report.md
            scheduler-meta-report.md
            scheduler-runs.json
            scheduler-recovery-plan.json
            scheduler-recovery-plan.tsv
            scheduler-dispatches.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Fail closed on scheduler topology blocker
        if: always() && env.PLANNER_RC != '0'
        run: exit 1
