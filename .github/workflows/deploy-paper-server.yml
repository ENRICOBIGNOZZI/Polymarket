name: deploy-paper-server

on:
  workflow_dispatch:
  schedule:
    - cron: "12,42 * * * *"
  workflow_run:
    workflows: ["V7 live PAPER smoke"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: polymarket-paper-server
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.POLYMARKET_SERVER_DEPLOY == 'true') ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event != 'pull_request'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SERVER_HOST: ${{ vars.POLYMARKET_SERVER_HOST || '100.104.183.109' }}
      SERVER_USER: ${{ vars.POLYMARKET_SERVER_USER || 'enrico' }}
      SERVER_PORT: ${{ vars.POLYMARKET_SERVER_PORT || '22' }}
      EXPECTED_VALIDATED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select existing Tailscale credential mode
        id: tailscale_auth
        shell: bash
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TS_TAGS: ${{ vars.TS_TAGS || 'tag:ci' }}
        run: |
          set -euo pipefail
          if [[ -n "${TS_AUTHKEY:-}" ]]; then mode=authkey
          elif [[ -n "${TS_OAUTH_CLIENT_ID:-}" && -n "${TS_OAUTH_SECRET:-}" ]]; then test -n "${TS_TAGS:-}"; mode=oauth
          else echo "No visible Tailscale credential set" >&2; exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Join private tailnet with auth key
        if: steps.tailscale_auth.outputs.mode == 'authkey'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: ${{ env.SERVER_HOST }}

      - name: Join private tailnet with OAuth
        if: steps.tailscale_auth.outputs.mode == 'oauth'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TS_TAGS || 'tag:ci' }}
          ping: ${{ env.SERVER_HOST }}

      - name: Configure SSH identity
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.POLYMARKET_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/polymarket_deploy
          chmod 600 ~/.ssh/polymarket_deploy
          for i in {1..20}; do
            ssh-keyscan -T 3 -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 2
          done
          test -s ~/.ssh/known_hosts

      - name: Determine whether reconciliation is required
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            state="$(ssh -i ~/.ssh/polymarket_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10 \
              -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/polymarket
          git fetch origin main paper-validated
          target_sha="$(git rev-parse origin/paper-validated)"
          head_sha="$(git rev-parse HEAD 2>/dev/null || true)"
          printf 'reconcile_event=periodic\nserver_head=%s\npaper_validated=%s\n' "${head_sha:-missing}" "$target_sha"
          [[ "$head_sha" == "$target_sha" ]] && printf 'need_deploy=false\n' || printf 'need_deploy=true\n'
          REMOTE
            )"
            printf '%s\n' "$state" | tee deploy-evidence.txt
            need_deploy="$(printf '%s\n' "$state" | sed -n 's/^need_deploy=//p' | tail -n1)"
          else
            need_deploy=true
            printf 'reconcile_event=%s\nneed_deploy=true\n' "$GITHUB_EVENT_NAME" | tee deploy-evidence.txt
          fi
          [[ "$need_deploy" == "true" || "$need_deploy" == "false" ]]
          echo "NEED_DEPLOY=$need_deploy" >> "$GITHUB_ENV"

      - name: Deploy exact validated V7 ref
        if: env.NEED_DEPLOY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$EXPECTED_VALIDATED_SHA" || "$EXPECTED_VALIDATED_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh -i ~/.ssh/polymarket_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "EXPECTED_VALIDATED_SHA='$EXPECTED_VALIDATED_SHA' bash -s" <<'REMOTE' | tee -a deploy-evidence.txt
          set -euo pipefail
          cd ~/polymarket
          git fetch origin main paper-validated
          main_sha="$(git rev-parse origin/main)"
          validated_sha="$(git rev-parse origin/paper-validated)"
          git merge-base --is-ancestor "$validated_sha" "$main_sha"
          [[ -z "${EXPECTED_VALIDATED_SHA:-}" ]] || test "$validated_sha" = "$EXPECTED_VALIDATED_SHA"
          git show "$validated_sha:config/live_champion.json" | python3 -c 'import json,sys; m=json.load(sys.stdin); assert int(m["version"])==7; assert m["loop"]=="scripts/paper_v7_loop.sh"; assert m["config"]=="config/paper_v7.json"; assert m["run_root"]=="runs/paper_v7_live"'
          printf 'predeploy_origin_main=%s\npredeploy_paper_validated=%s\n' "$main_sha" "$validated_sha"
          case "$(uname -s)" in
            Darwin) updater_path=ops/update_server_macos.sh ;;
            Linux) updater_path=ops/update_server.sh ;;
            *) exit 1 ;;
          esac
          updater="$(mktemp)"; trap 'rm -f "$updater"' EXIT
          git show "$validated_sha:$updater_path" > "$updater"
          chmod 700 "$updater"
          POLYMARKET_DEPLOY_REF=paper-validated bash "$updater"
          REMOTE

      - name: Verify V7 PAPER production services
        if: env.NEED_DEPLOY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/polymarket_deploy -o IdentitiesOnly=yes -o BatchMode=yes -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "EXPECTED_VALIDATED_SHA='$EXPECTED_VALIDATED_SHA' bash -s" <<'REMOTE' | tee -a deploy-evidence.txt
          set -euo pipefail
          fail_verify() { printf 'verify_failure=%s\n' "$1" >&2; exit 1; }
          require_equal() { [[ "$2" == "$3" ]] || { printf 'verify_failure=%s actual=%s expected=%s\n' "$1" "$2" "$3" >&2; exit 1; }; }
          require_metric() { grep -q "$2" <<<"$metrics" || fail_verify "$1"; }
          require_file() { test -s "$2" || fail_verify "$1"; }

          cd ~/polymarket
          git fetch origin main paper-validated || fail_verify git_fetch_refs
          head_sha="$(git rev-parse HEAD)"; main_sha="$(git rev-parse origin/main)"; validated_sha="$(git rev-parse origin/paper-validated)"
          require_equal server_head_matches_validated "$head_sha" "$validated_sha"
          git merge-base --is-ancestor "$validated_sha" "$main_sha" || fail_verify validated_not_ancestor_of_main
          [[ -z "${EXPECTED_VALIDATED_SHA:-}" ]] || require_equal validated_matches_trigger_sha "$validated_sha" "$EXPECTED_VALIDATED_SHA"

          python3 - <<'PY' || exit 1
          import json
          m=json.load(open('config/live_champion.json'))
          assert int(m['version']) == 7
          assert m['loop'] == 'scripts/paper_v7_loop.sh'
          assert m['config'] == 'config/paper_v7.json'
          assert m['run_root'] == 'runs/paper_v7_live'
          PY

          curl -fsS http://127.0.0.1:9108/healthz >/dev/null || fail_verify exporter_healthz
          metrics="$(curl -fsS http://127.0.0.1:9108/metrics)" || fail_verify exporter_metrics_fetch
          require_metric runtime_info_schema '^polymarket_runtime_info{adapter="v7",run_root="paper_v7_live",version="v7"} 1$'
          require_metric v7_runtime_info_metric '^polymarket_v7_runtime_info 1$'
          require_metric runtime_pnl_metric '^polymarket_runtime_pnl_usd '
          require_metric runtime_equity_metric '^polymarket_runtime_equity_usd '
          require_metric allocator_state_metric '^polymarket_allocator_state_present 1$'
          require_metric allocator_models_expected_metric '^polymarket_allocator_models_expected 5$'
          require_metric allocator_models_alive_metric '^polymarket_allocator_models_alive 5$'
          require_metric model_info_metric '^polymarket_model_info{'
          require_metric model_fills_metric '^polymarket_model_fills_total{'
          require_metric model_gross_exposure_metric '^polymarket_model_gross_exposure_usd{'
          require_metric model_drawdown_metric '^polymarket_model_drawdown_ratio{'
          require_metric model_alive_metric '^polymarket_model_alive{'
          require_metric model_staleness_metric '^polymarket_model_staleness_seconds{'

          root=runs/paper_v7_live
          ex="$root/execution"
          require_file v7_supervisor_file "$root/v7_supervisor.json"
          require_file v7_execution_supervisor_file "$ex/v7_execution_supervisor.json"
          require_file v7_runtime_status_file "$ex/runtime_status.json"
          require_file v7_allocator_status_file "$ex/allocator_status.json"
          require_file v7_strategy_status_file "$ex/strategy_status.csv"
          require_file v7_market_proxy_status_file "$ex/market_proxy_status.json"
          require_file v7_hard_arb_status_file "$ex/hard_arb/status.json"

          python3 - "$root" <<'PY' || fail_verify v7_runtime_contract
          import csv,json,sys,time
          from pathlib import Path
          root=Path(sys.argv[1]); ex=root/'execution'; now=time.time()
          sup=json.load(open(root/'v7_supervisor.json')); exe=json.load(open(ex/'v7_execution_supervisor.json'))
          runtime=json.load(open(ex/'runtime_status.json')); allocator=json.load(open(ex/'allocator_status.json')); proxy=json.load(open(ex/'market_proxy_status.json'))
          rows=list(csv.DictReader(open(ex/'strategy_status.csv')))
          assert sup['execution_alive'] is True and sup['shadow_alive'] is True and now-float(sup['timestamp']) <= 60
          assert exe['paper_only'] is True and now-float(exe['timestamp']) <= 120
          assert runtime['schema']=='polymarket_v7_runtime_status_v1' and runtime['version']==7 and runtime['paper_only'] is True and runtime['authenticated_execution'] is False
          assert float(runtime['drawdown']) <= 0.15 + 1e-12
          assert allocator['schema']=='polymarket_v7_allocator_status_v1' and int(allocator['models_expected'])==5 and int(allocator['models_alive'])==5
          assert {r['name'] for r in rows} == {'micro_maker','micro_taker','relative_value','hard_arb','external'}
          assert proxy['schema']=='polymarket_v7_market_proxy_status_v1' and now-float(proxy['timestamp']) <= 180
          PY

          curl -fsS http://127.0.0.1:9090/-/ready >/dev/null || fail_verify prometheus_ready
          curl -fsS http://127.0.0.1:3000/api/health >/dev/null || fail_verify grafana_health
          grafana_search="$(curl -fsS http://127.0.0.1:3000/api/search)" || fail_verify grafana_search_fetch
          grep -q 'polymarket-multi-strategy' <<<"$grafana_search" || fail_verify grafana_dashboard_missing
          case "$(uname -s)" in
            Darwin) bash ops/macos_service_control.sh status || fail_verify macos_service_status ;;
            Linux)
              systemctl is-active --quiet polymarket-paper.service || fail_verify linux_paper_service
              systemctl is-active --quiet polymarket-monitoring.service || fail_verify linux_monitoring_service
              ;;
            *) fail_verify unsupported_server_os ;;
          esac
          printf 'verify_result=success\nserver_head=%s\npaper_validated=%s\norigin_main=%s\nchampion_version=7\nchampion_run_root=paper_v7_live\n' "$head_sha" "$validated_sha" "$main_sha"
          REMOTE

      - name: Record no-op reconciliation
        if: env.NEED_DEPLOY == 'false'
        run: echo 'reconciliation_result=already_current' | tee -a deploy-evidence.txt

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-server-deploy-${{ github.run_id }}
          path: deploy-evidence.txt
          if-no-files-found: warn
          retention-days: 7
