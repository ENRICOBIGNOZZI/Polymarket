name: Polymarket Meta-Supervisor

on:
  workflow_dispatch:
  schedule:
    - cron: "29 * * * *"
  push:
    branches: [main]
    paths:
      - "config/alpha_factory.json"
      - "config/research_director.json"
      - "config/promotion_policy.json"
      - "scripts/meta_supervisor.py"
      - "scripts/meta_supervisor_v2.py"
      - "scripts/research_director.py"
      - "tests/test_meta_supervisor.py"
      - "tests/test_autonomous_meta_supervisor.py"
      - "tests/test_research_director.py"
      - ".github/workflows/control-plane.yml"
      - ".github/workflows/alpha-factory.yml"
      - ".github/workflows/research-queue.yml"
      - ".github/workflows/research-policy.yml"
      - ".github/workflows/promotion-controller.yml"
      - ".github/workflows/v7-live-paper-validation.yml"
      - "docs/ALPHA_FACTORY.md"
  pull_request:
    branches: [main]
    paths:
      - "config/alpha_factory.json"
      - "config/research_director.json"
      - "config/promotion_policy.json"
      - "scripts/meta_supervisor.py"
      - "scripts/meta_supervisor_v2.py"
      - "scripts/research_director.py"
      - "tests/test_meta_supervisor.py"
      - "tests/test_autonomous_meta_supervisor.py"
      - "tests/test_research_director.py"
      - ".github/workflows/control-plane.yml"
      - ".github/workflows/alpha-factory.yml"
      - ".github/workflows/research-queue.yml"
      - ".github/workflows/research-policy.yml"
      - ".github/workflows/promotion-controller.yml"
      - ".github/workflows/v7-live-paper-validation.yml"
      - "docs/ALPHA_FACTORY.md"

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: polymarket-meta-supervisor
  cancel-in-progress: false

jobs:
  coordinate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate control-plane invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests/test_meta_supervisor.py tests/test_autonomous_meta_supervisor.py tests/test_research_director.py -v
          python3 -m py_compile scripts/meta_supervisor.py scripts/meta_supervisor_v2.py scripts/research_director.py
          python3 -m json.tool config/alpha_factory.json >/dev/null
          python3 -m json.tool config/research_director.json >/dev/null
          python3 -m json.tool config/promotion_policy.json >/dev/null

      - name: Capture workflow graph, research product and validated-ref state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p control_plane
          git fetch --no-tags origin main paper-validated
          git fetch --no-tags origin telemetry:refs/remotes/origin/telemetry || true
          MAIN_SHA="$(git rev-parse origin/main)"
          VALIDATED_SHA="$(git rev-parse origin/paper-validated)"
          VALIDATED_ANCESTOR=false
          if git merge-base --is-ancestor "$VALIDATED_SHA" "$MAIN_SHA"; then VALIDATED_ANCESTOR=true; fi
          MAIN_PROTECTED="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.protected // false')"
          gh run list --limit 100 --json databaseId,workflowName,status,conclusion,headSha,headBranch,event,createdAt,updatedAt,url > control_plane/runs.json
          if git show origin/telemetry:telemetry/latest-research-director.json > control_plane/research-director.json 2>/dev/null; then
            test -s control_plane/research-director.json || printf '{}\n' > control_plane/research-director.json
          else
            printf '{}\n' > control_plane/research-director.json
          fi
          MAIN_SHA="$MAIN_SHA" VALIDATED_SHA="$VALIDATED_SHA" VALIDATED_ANCESTOR="$VALIDATED_ANCESTOR" MAIN_PROTECTED="$MAIN_PROTECTED" python3 - <<'PY'
          import json, os
          from pathlib import Path
          snapshot = {
              "main_sha": os.environ["MAIN_SHA"],
              "paper_validated_sha": os.environ["VALIDATED_SHA"],
              "paper_validated_is_ancestor": os.environ["VALIDATED_ANCESTOR"] == "true",
              "main_branch_protected": os.environ["MAIN_PROTECTED"] == "true",
              "runs": json.loads(Path("control_plane/runs.json").read_text(encoding="utf-8")),
              "products": {
                  "autonomous_research": json.loads(Path("control_plane/research-director.json").read_text(encoding="utf-8"))
              },
          }
          Path("control_plane/snapshot.json").write_text(json.dumps(snapshot, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Coordinate V7 research, validation, and promotion decisions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/meta_supervisor_v2.py \
            --config config/alpha_factory.json \
            --snapshot control_plane/snapshot.json \
            --output-json control_plane/latest-control-plane.json \
            --output-markdown control_plane/latest-control-plane.md \
            --dispatch-file control_plane/dispatch-plan.txt \
            | tee control_plane/meta-supervisor.log

      - name: Execute bounded allowlisted remediation and promotion-decision dispatch
        if: github.event_name != 'pull_request' && success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > control_plane/dispatch-results.txt
          while IFS= read -r workflow; do
            [[ -n "$workflow" ]] || continue
            case "$workflow" in
              ci.yml|monitoring.yml|v7-live-paper-validation.yml|forward-maker-research.yml|alpha-factory.yml|research-queue.yml|research-policy.yml|promotion-controller.yml)
                gh workflow run "$workflow" --ref main
                printf 'dispatched=%s ref=main\n' "$workflow" | tee -a control_plane/dispatch-results.txt
                ;;
              *)
                printf 'forbidden_dispatch=%s\n' "$workflow" >&2
                exit 1
                ;;
            esac
          done < control_plane/dispatch-plan.txt
          if grep -Eq 'integration-merge|deploy-paper-server|server-health' control_plane/dispatch-results.txt; then
            echo 'merge, deployment, or private health dispatch escaped the decision-layer allowlist' >&2
            exit 1
          fi

      - name: Publish coordination summary
        if: always()
        shell: bash
        run: |
          echo '## Polymarket Meta-Supervisor' >> "$GITHUB_STEP_SUMMARY"
          if test -s control_plane/latest-control-plane.md; then cat control_plane/latest-control-plane.md >> "$GITHUB_STEP_SUMMARY"; else echo 'Control-plane report is missing.' >> "$GITHUB_STEP_SUMMARY"; fi
          if test -s control_plane/research-director.json; then
            echo '## Autonomous research product' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat control_plane/research-director.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -s control_plane/dispatch-results.txt; then
            echo '## Dispatch results' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat control_plane/dispatch-results.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish latest coordination evidence to telemetry
        if: github.event_name != 'pull_request' && success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          publish_file() {
            local local_path="$1" remote_path="$2" message="$3"
            local endpoint="repos/${GITHUB_REPOSITORY}/contents/${remote_path}" content current_sha attempt publish_error
            content="$(base64 -w0 "$local_path")"
            publish_error="$(mktemp)"
            for attempt in 1 2 3 4 5; do
              current_sha="$(gh api "${endpoint}?ref=telemetry" --jq .sha 2>/dev/null || true)"
              local args=("$endpoint" --method PUT -f message="$message" -f content="$content" -f branch=telemetry)
              if [[ -n "$current_sha" ]]; then args+=(-f sha="$current_sha"); fi
              if gh api "${args[@]}" >/dev/null 2>"$publish_error"; then
                rm -f "$publish_error"
                return 0
              fi
              if ! grep -q 'HTTP 409' "$publish_error"; then
                cat "$publish_error" >&2
                rm -f "$publish_error"
                return 1
              fi
              if [[ "$attempt" -eq 5 ]]; then
                cat "$publish_error" >&2
                rm -f "$publish_error"
                return 1
              fi
              sleep $((attempt * 2))
            done
          }
          publish_file control_plane/latest-control-plane.json telemetry/latest-control-plane.json "Update Polymarket control-plane evidence"
          publish_file control_plane/latest-control-plane.md telemetry/latest-control-plane.md "Update Polymarket control-plane report"

      - name: Upload durable coordination evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-control-plane-${{ github.run_id }}
          path: control_plane/
          if-no-files-found: error
          retention-days: 30
