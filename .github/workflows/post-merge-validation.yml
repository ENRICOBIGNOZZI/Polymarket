name: Polymarket Post-Merge Validation

on:
  repository_dispatch:
    types: [champion-integration-merged]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main SHA to validate; defaults to the current event SHA
        required: false
        type: string
      pr_number:
        description: Source integration PR number
        required: false
        type: string
  schedule:
    - cron: "6,21,36,51 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/post-merge-validation.yml"
      - "config/scheduler_registry.json"
      - "scripts/validate_scheduler_registry.py"
      - "tests/test_model_governance.py"

permissions:
  actions: write
  contents: read
  pull-requests: write

concurrency:
  group: polymarket-post-merge-validation
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sha || github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
      PR_NUMBER: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.pr_number || github.event_name == 'workflow_dispatch' && inputs.pr_number || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sha || github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
          fetch-depth: 0

      - name: Bind recovery or dispatch to the exact main revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          validated_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/paper-validated" --jq .sha)"
          dispatch_validation=false
          decision=audit_only
          case "$GITHUB_EVENT_NAME" in
            repository_dispatch|workflow_dispatch)
              [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
              test "$checked_out_sha" = "$EXPECTED_SHA"
              test "$main_sha" = "$EXPECTED_SHA"
              dispatch_validation=true
              decision=explicit_exact_sha_dispatch
              ;;
            schedule)
              EXPECTED_SHA="$checked_out_sha"
              echo "EXPECTED_SHA=$EXPECTED_SHA" >> "$GITHUB_ENV"
              if [[ "$checked_out_sha" != "$main_sha" ]]; then
                decision=superseded_by_new_main
              elif [[ "$main_sha" == "$validated_sha" ]]; then
                decision=current_no_recovery_needed
              else
                git fetch --no-tags origin main paper-validated
                git merge-base --is-ancestor "$validated_sha" "$checked_out_sha"
                dispatch_validation=true
                decision=recover_pending_main_validation
              fi
              ;;
            push)
              EXPECTED_SHA="$checked_out_sha"
              echo "EXPECTED_SHA=$EXPECTED_SHA" >> "$GITHUB_ENV"
              [[ "$checked_out_sha" == "$main_sha" ]] && decision=bootstrap_audit_after_cadence_change || decision=superseded_by_new_main
              ;;
            *) exit 1 ;;
          esac
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$checked_out_sha" = "$EXPECTED_SHA"
          if [[ "$decision" != "superseded_by_new_main" ]]; then test "$main_sha" = "$EXPECTED_SHA"; fi
          echo "DISPATCH_VALIDATION=$dispatch_validation" >> "$GITHUB_ENV"
          {
            echo '# Post-merge V7 validation dispatch'
            echo "- event: \`$GITHUB_EVENT_NAME\`"
            echo "- checked-out revision: \`$checked_out_sha\`"
            echo "- main revision: \`$main_sha\`"
            echo "- paper-validated revision: \`$validated_sha\`"
            echo "- decision: \`$decision\`"
          } > post-merge-validation-report.md

      - name: Dispatch V7 validation schedulers
        if: env.DISPATCH_VALIDATION == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in ci.yml monitoring.yml v7-live-paper-smoke.yml; do
            current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
            if [[ "$current_main_sha" != "$EXPECTED_SHA" ]]; then
              echo "main advanced to $current_main_sha; newer validation cycle owns it" | tee -a post-merge-validation-report.md
              exit 0
            fi
            gh workflow run "$workflow" --ref main -f expected_sha="$EXPECTED_SHA"
            echo "- dispatched \`$workflow\` for \`$EXPECTED_SHA\`" | tee -a post-merge-validation-report.md
          done
          if [[ -n "${PR_NUMBER:-}" ]]; then
            gh pr comment "$PR_NUMBER" --body "Post-merge V7 validation dispatched CI, monitoring and V7 live PAPER smoke for exact main revision \`$EXPECTED_SHA\`."
          fi

      - name: Publish validation dispatch
        if: always()
        run: cat post-merge-validation-report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload validation-dispatch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-merge-validation-${{ github.run_id }}
          path: post-merge-validation-report.md
          if-no-files-found: warn
          retention-days: 30
