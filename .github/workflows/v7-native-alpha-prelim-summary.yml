name: V7 native alpha preliminary grid summary

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-native-alpha-prelim-summary.json

permissions:
  contents: read
  id-token: write

jobs:
  summary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: native-alpha-prelim-summary
          aws-region: eu-west-2
      - name: Summarize newest completed native alpha grid
        shell: bash
        run: |
          set -euo pipefail
          instance="$(python3 -c 'import json;print(json.load(open("deploy/v7-native-alpha-prelim-summary.json"))["instance_id"])')"
          cat >/tmp/summary.py <<'PY'
          import csv,json,statistics
          from pathlib import Path
          cands=[]
          for p in Path('/tmp').glob('polymarket-native-alpha-2h-*/output/21_native_alpha_grid.csv'):
              if p.is_file():
                  cands.append((p.stat().st_mtime_ns,p))
          if not cands:
              raise SystemExit('NO_GRID')
          p=max(cands)[1]
          rows=list(csv.DictReader(p.open()))
          by={}
          for r in rows:
              try:
                  pnl=float(r['total_pnl'])
              except Exception:
                  continue
              r['_pnl']=pnl
              by.setdefault(r['alpha'],[]).append(r)
          summary=[]
          for a,rr in by.items():
              vals=[x['_pnl'] for x in rr]
              best=max(rr,key=lambda x:x['_pnl'])
              worst=min(rr,key=lambda x:x['_pnl'])
              summary.append({
                  'alpha':a,
                  'cells':len(vals),
                  'median_pnl':statistics.median(vals),
                  'mean_pnl':statistics.fmean(vals),
                  'positive_fraction':sum(v>0 for v in vals)/len(vals),
                  'nonnegative_fraction':sum(v>=0 for v in vals)/len(vals),
                  'best':{'latency':int(best['entry_latency_ms']),'exit':int(best['exit_horizon_ms']),'pnl':best['_pnl'],'selected':int(float(best.get('selected') or 0)),'observed':int(float(best.get('observed') or 0)),'fills':int(float(best.get('fills') or 0))},
                  'worst':{'latency':int(worst['entry_latency_ms']),'exit':int(worst['exit_horizon_ms']),'pnl':worst['_pnl']},
                  'median_observed':statistics.median([int(float(x.get('observed') or 0)) for x in rr]),
                  'median_fills':statistics.median([int(float(x.get('fills') or 0)) for x in rr]),
              })
          summary.sort(key=lambda x:(x['median_pnl'],x['positive_fraction'],x['mean_pnl']),reverse=True)
          allrows=[r for rr in by.values() for r in rr]
          top=sorted(allrows,key=lambda x:x['_pnl'],reverse=True)[:20]
          bottom=sorted(allrows,key=lambda x:x['_pnl'])[:20]
          baseline=by.get('baseline_continuation',[])
          def cells_compact(seq):
              return [{'alpha':r['alpha'],'latency':int(r['entry_latency_ms']),'exit':int(r['exit_horizon_ms']),'pnl':r['_pnl'],'selected':int(float(r.get('selected') or 0)),'observed':int(float(r.get('observed') or 0)),'fills':int(float(r.get('fills') or 0)),'hit_rate':None if not r.get('hit_rate') else float(r['hit_rate']),'max_drawdown':None if not r.get('max_drawdown') else float(r['max_drawdown'])} for r in seq]
          out={
              'grid':str(p),
              'alpha_count':len(by),
              'row_count':len(rows),
              'top_alpha_median':summary[:25],
              'bottom_alpha_median':summary[-15:],
              'top_cells':cells_compact(top),
              'bottom_cells':cells_compact(bottom),
              'baseline_cells':cells_compact(sorted(baseline,key=lambda x:(int(x['entry_latency_ms']),int(x['exit_horizon_ms'])))),
          }
          print(json.dumps(out,separators=(',',':'),sort_keys=True))
          PY
          b64="$(base64 -w0 /tmp/summary.py)"
          params="$(python3 - "$b64" <<'PY'
          import json,shlex,sys
          b=sys.argv[1]
          print(json.dumps({'commands':[f"printf %s {shlex.quote(b)} | base64 -d | python3"]}))
          PY
          )"
          cmd="$(aws ssm send-command --instance-ids "$instance" --document-name AWS-RunShellScript --parameters "$params" --query 'Command.CommandId' --output text)"
          for i in $(seq 1 60); do
            status="$(aws ssm get-command-invocation --command-id "$cmd" --instance-id "$instance" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 2
          done
          aws ssm get-command-invocation --command-id "$cmd" --instance-id "$instance" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json
