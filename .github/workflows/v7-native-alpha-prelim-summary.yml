name: V7 native alpha preliminary grid summary

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-native-alpha-prelim-summary.json

permissions:
  contents: read
  id-token: write

jobs:
  summary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: native-alpha-prelim-summary
          aws-region: eu-west-2
      - name: Summarize newest completed native alpha grid
        shell: bash
        run: |
          set -euo pipefail
          instance="$(python3 -c 'import json;print(json.load(open("deploy/v7-native-alpha-prelim-summary.json"))["instance_id"])')"
          cmd="$(aws ssm send-command --instance-ids "$instance" --document-name AWS-RunShellScript --parameters commands='[
            "python3 - <<\x27PY\x27\nimport csv,json,statistics\nfrom pathlib import Path\ncands=[]\nfor p in Path(\x27/tmp\x27).glob(\x27polymarket-*alpha*/output/21_native_alpha_grid.csv\x27):\n    if p.is_file(): cands.append((p.stat().st_mtime_ns,p))\nif not cands: raise SystemExit(\x27NO_GRID\x27)\np=max(cands)[1]\nrows=list(csv.DictReader(p.open()))\nby={}\nfor r in rows:\n    try: pnl=float(r[\x27total_pnl\x27])\n    except: continue\n    r[\x27_pnl\x27]=pnl\n    by.setdefault(r[\x27alpha\x27],[]).append(r)\nsummary=[]\nfor a,rr in by.items():\n    vals=[x[\x27_pnl\x27] for x in rr]\n    fills=sum(int(float(x.get(\x27fills\x27) or 0)) for x in rr)\n    obs=sum(int(float(x.get(\x27observed\x27) or 0)) for x in rr)\n    best=max(rr,key=lambda x:x[\x27_pnl\x27])\n    worst=min(rr,key=lambda x:x[\x27_pnl\x27])\n    summary.append({\x27alpha\x27:a,\x27cells\x27:len(vals),\x27median_pnl\x27:statistics.median(vals),\x27mean_pnl\x27:statistics.fmean(vals),\x27positive_fraction\x27:sum(v>0 for v in vals)/len(vals),\x27best\x27:{\x27latency\x27:best[\x27entry_latency_ms\x27],\x27exit\x27:best[\x27exit_horizon_ms\x27],\x27pnl\x27:best[\x27_pnl\x27]},\x27worst\x27:{\x27latency\x27:worst[\x27entry_latency_ms\x27],\x27exit\x27:worst[\x27exit_horizon_ms\x27],\x27pnl\x27:worst[\x27_pnl\x27]},\x27fills_sum_cells\x27:fills,\x27observed_sum_cells\x27:obs})\nsummary.sort(key=lambda x:(x[\x27median_pnl\x27],x[\x27mean_pnl\x27]),reverse=True)\nallrows=[r for rr in by.values() for r in rr]\ntop=sorted(allrows,key=lambda x:x[\x27_pnl\x27],reverse=True)[:15]\nbottom=sorted(allrows,key=lambda x:x[\x27_pnl\x27])[:15]\nout={\x27grid\x27:str(p),\x27alpha_count\x27:len(by),\x27row_count\x27:len(rows),\x27top_alpha_median\x27:summary[:20],\x27bottom_alpha_median\x27:summary[-10:],\x27top_cells\x27:[{k:r[k] for k in (\x27alpha\x27,\x27entry_latency_ms\x27,\x27exit_horizon_ms\x27,\x27total_pnl\x27,\x27selected\x27,\x27observed\x27,\x27fills\x27)} for r in top],\x27bottom_cells\x27:[{k:r[k] for k in (\x27alpha\x27,\x27entry_latency_ms\x27,\x27exit_horizon_ms\x27,\x27total_pnl\x27,\x27selected\x27,\x27observed\x27,\x27fills\x27)} for r in bottom]}\nprint(json.dumps(out,sort_keys=True))\nPY"
          ]' --query 'Command.CommandId' --output text)"
          for i in $(seq 1 60); do
            status="$(aws ssm get-command-invocation --command-id "$cmd" --instance-id "$instance" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 2
          done
          aws ssm get-command-invocation --command-id "$cmd" --instance-id "$instance" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json
