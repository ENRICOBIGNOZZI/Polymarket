name: forward-maker-alpha-research

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/forward_maker_probe.py"
      - "scripts/apply_reward_payout_floor.py"
      - "src/rewards_scan.cpp"
      - "include/pm/rewards.hpp"
      - "tests/test_forward_maker_probe.py"
      - "CMakeLists.txt"
      - ".github/workflows/forward-maker-research.yml"
  push:
    branches: [main]
    paths:
      - "scripts/forward_maker_probe.py"
      - "scripts/apply_reward_payout_floor.py"
      - "src/rewards_scan.cpp"
      - "include/pm/rewards.hpp"
      - "tests/test_forward_maker_probe.py"
      - "CMakeLists.txt"
      - ".github/workflows/forward-maker-research.yml"
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: forward-maker-alpha-research
  cancel-in-progress: false

jobs:
  forward-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev python3

      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Run forward read-only maker experiment
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          R=forward_maker
          mkdir -p "$R"

          DURATION=360
          MARKETS=12
          POLL=10
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            DURATION=90
            MARKETS=6
            POLL=10
          fi

          ./build/polymarket_rewards_scan \
            --config config/paper_v4.json --markets 1500 --top 40 \
            --quote-shares 50 --max-notional 100 --improve-ticks 0 \
            --competition-multiplier 2.0 --reward-haircut 0.25 \
            --native-reward-unit-usd 1.0 --annual-capital-rate 0.20 \
            --adverse-bps 50 --one-sided-fills-per-day 1.0 \
            --csv "$R/reward_opportunities.csv" \
            | tee "$R/reward_scan.log"

          python3 scripts/apply_reward_payout_floor.py \
            --csv "$R/reward_opportunities.csv" --minimum-daily-payout-usd 1.0 \
            | tee -a "$R/reward_scan.log"

          python3 scripts/forward_maker_probe.py \
            --opportunities "$R/reward_opportunities.csv" \
            --output "$R/forward_maker_probe.json" \
            --csv "$R/forward_maker_probe.csv" \
            --markets "$MARKETS" --duration-seconds "$DURATION" --poll-seconds "$POLL" \
            --policies join,improve1,fade1 \
            --arrival-latency-ms 250 --max-quote-shares 50 --max-notional 100 \
            --exit-slippage-bps 10 \
            | tee "$R/forward_maker_probe.log"

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("forward_maker")
          payload = json.loads((root / "forward_maker_probe.json").read_text(encoding="utf-8"))
          compact = {
              "schema": payload.get("schema"),
              "generated_ts": payload.get("generated_ts"),
              "git_sha": "${{ github.sha }}",
              "github_run_id": "${{ github.run_id }}",
              "eligible_markets": payload.get("eligible_markets", 0),
              "quote_definitions": payload.get("quote_definitions", 0),
              "aggregate_by_policy": payload.get("aggregate_by_policy", {}),
              "results": payload.get("results", []),
          }
          (root / "forward_maker_history_line.jsonl").write_text(
              json.dumps(compact, separators=(",", ":")) + "\n", encoding="utf-8"
          )
          PY

      - name: Publish experiment summary
        if: always()
        shell: bash
        run: |
          R=forward_maker
          echo '## Forward maker alpha experiment' >> "$GITHUB_STEP_SUMMARY"
          echo 'No orders are submitted. All policies are read-only counterfactuals.' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 5 "$R/forward_maker_probe.log" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if test -s "$R/forward_maker_probe.json"; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = json.loads(Path("forward_maker/forward_maker_probe.json").read_text())
          print(json.dumps(p.get("aggregate_by_policy", {}), indent=2, sort_keys=True))
          PY
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish latest and bounded empirical history
        if: github.event_name != 'pull_request' && success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          R=forward_maker
          test -s "$R/forward_maker_probe.json"
          test -s "$R/forward_maker_history_line.jsonl"

          publish_file() {
            local local_path="$1"
            local remote_path="$2"
            local message="$3"
            local endpoint="repos/${GITHUB_REPOSITORY}/contents/${remote_path}"
            local content
            content="$(base64 -w0 "$local_path")"
            local current_sha
            current_sha="$(gh api "${endpoint}?ref=telemetry" --jq .sha 2>/dev/null || true)"
            local args=("$endpoint" --method PUT -f message="$message" -f content="$content" -f branch=telemetry)
            if [[ -n "$current_sha" ]]; then
              args+=(-f sha="$current_sha")
            fi
            gh api "${args[@]}" >/dev/null
          }

          publish_file "$R/forward_maker_probe.json" \
            "telemetry/latest-forward-maker.json" \
            "Update latest forward maker experiment"

          history_endpoint="repos/${GITHUB_REPOSITORY}/contents/telemetry/forward-maker-history.jsonl"
          : > "$R/history_existing.jsonl"
          gh api "${history_endpoint}?ref=telemetry" --jq .content 2>/dev/null \
            | tr -d '\n' | base64 -d > "$R/history_existing.jsonl" 2>/dev/null || true
          cat "$R/history_existing.jsonl" "$R/forward_maker_history_line.jsonl" \
            | tail -n 336 > "$R/forward-maker-history.jsonl"
          publish_file "$R/forward-maker-history.jsonl" \
            "telemetry/forward-maker-history.jsonl" \
            "Append bounded forward maker evidence"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forward-maker-alpha-${{ github.run_id }}
          path: forward_maker/
          if-no-files-found: error
          retention-days: 14
