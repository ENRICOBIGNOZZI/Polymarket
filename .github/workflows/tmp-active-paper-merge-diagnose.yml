name: Temporary active PAPER merge and diagnosis

on:
  push:
    branches:
      - codex/v7-active-paper-account-20260904

permissions:
  contents: write

concurrency:
  group: tmp-active-paper-merge-diagnose
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Merge current main and preserve causal PAPER timestamps
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --no-tags origin main
          git merge --no-edit -X ours origin/main
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/v7_external_fair_paper_router.py')
          text=path.read_text(encoding='utf-8')
          if 'canonical_order_recorded_ms = max(now_ms(), arrival_decision_ms)' not in text:
              anchor='''        canonical_metadata = {
                      **arrival_metadata, "coordinator_receipt": receipt, "paper_exploration": True,'''
              start=text.index(anchor)
              end=text.index('\n        spool_event(self.root, LedgerEvent(', start)
              text=text[:end]+'\n        canonical_order_recorded_ms = max(now_ms(), arrival_decision_ms)'+text[end:]
          order='''            model_version=MODEL_VERSION, candidate_id=counterfactual_id,
                      order_id=order_id, position_id=position_id, market_id=market_id,'''
          order_new='''            model_version=MODEL_VERSION, candidate_id=counterfactual_id,
                      recorded_ts_ms=canonical_order_recorded_ms,
                      order_id=order_id, position_id=position_id, market_id=market_id,'''
          if order_new not in text:
              if text.count(order) < 1: raise SystemExit('canonical order anchor missing')
              text=text.replace(order,order_new,1)
          fill='''            model_version=MODEL_VERSION, candidate_id=counterfactual_id, order_id=order_id,
                      position_id=position_id, fill_id=fill_id, market_id=market_id,'''
          fill_new='''            model_version=MODEL_VERSION, candidate_id=counterfactual_id, order_id=order_id,
                      recorded_ts_ms=canonical_order_recorded_ms + 1,
                      position_id=position_id, fill_id=fill_id, market_id=market_id,'''
          if fill_new not in text:
              if text.count(fill) < 1: raise SystemExit('canonical fill anchor missing')
              text=text.replace(fill,fill_new,1)
          path.write_text(text,encoding='utf-8')
          PY
          git diff --check
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev libssl-dev python3
      - name: Build and diagnose tests
        shell: bash
        run: |
          set -u
          cmake -S . -B build-diagnose -DCMAKE_BUILD_TYPE=Release
          cmake --build build-diagnose --parallel 2
          set +e
          ctest --test-dir build-diagnose --output-on-failure --output-junit /tmp/active-paper-junit.xml > /tmp/active-paper-ctest.log 2>&1
          rc=$?
          set -e
          python3 - "$rc" <<'PY'
          import json,sys,time,xml.etree.ElementTree as ET
          from pathlib import Path
          rc=int(sys.argv[1]); xml=Path('/tmp/active-paper-junit.xml')
          failures=[]
          if xml.exists():
              root=ET.parse(xml).getroot()
              for case in root.iter('testcase'):
                  nodes=list(case.findall('failure'))+list(case.findall('error'))
                  if nodes:
                      failures.append({
                          'name':case.get('name'),
                          'classname':case.get('classname'),
                          'time':case.get('time'),
                          'details':'\n'.join((n.text or n.get('message') or '') for n in nodes)[-12000:],
                      })
          log=Path('/tmp/active-paper-ctest.log').read_text(encoding='utf-8',errors='replace')
          out={
              'schema':'polymarket_v7_active_paper_test_diagnosis_v1',
              'timestamp':int(time.time()),'ctest_returncode':rc,
              'failure_count':len(failures),'failures':failures,
              'ctest_tail':log[-20000:],
          }
          target=Path('artifacts/tmp_active_paper_test_diagnosis.json')
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps({'returncode':rc,'failures':[x['name'] for x in failures]},sort_keys=True))
          PY
      - name: Commit merge and diagnosis
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-active-paper-merge-diagnose.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'test: diagnose active PAPER account contract'
          fi
          git push origin HEAD:codex/v7-active-paper-account-20260904