name: V7 native worker evidence probe

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-native-worker-evidence-probe-request.json

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
      INSTANCE_ID: i-04042ca7da7a23215
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate request
        run: |
          python3 - deploy/v7-native-worker-evidence-probe-request.json <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1]))
          assert v=={"schema":"polymarket_v7_native_worker_evidence_probe_v1","read_only":True}
          PY
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: polymarket-v7-native-worker-probe
          aws-region: eu-west-2
      - name: Read native worker evidence
        run: |
          set -euo pipefail
          python3 - "$INSTANCE_ID" <<'PY'
          import json,re,sys
          sys.path.insert(0,'ops')
          from v7_london_ssm_deploy import run,REGION
          instance=sys.argv[1]
          command=r'''set -euo pipefail
          ROOT=/mnt/polymarket-data/paper_v7_london
          python3 - "$ROOT" <<'PYREMOTE'
          import json,re,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          def load(p):
              try:return json.loads(p.read_text(encoding="utf-8"))
              except Exception:return {}
          status=load(root/"control/native_engine_manager_status.json")
          keys=("schema","model_sha","state","blocker","expected_context_count","target_context_count",
                "active_worker_count","managed_context_count","launch_retry_count","launch_retry_contexts",
                "target_contexts","partitioned_native_workers","single_native_portfolio_owner",
                "global_budget_microdollars","partition_total_microdollars","timestamp_ms")
          out={k:status.get(k) for k in keys}
          out["workers"]=[{k:w.get(k) for k in ("context","market_id","state","engine_pid","settlement_pid",
              "budget_microdollars","last_error","blocker","launch_attempts")} for w in status.get("workers") or [] if isinstance(w,dict)]
          print("NATIVE_STATUS="+json.dumps(out,sort_keys=True,separators=(",",":")))
          for p in sorted(root.glob("native_crypto_settlement_engine_*.log")):
              try:
                  lines=p.read_text(encoding="utf-8",errors="replace").splitlines()
                  st=p.stat()
              except OSError:
                  continue
              last={}
              for line in reversed(lines[-20:]):
                  try:
                      value=json.loads(line)
                  except Exception:
                      continue
                  if isinstance(value,dict):
                      last=value; break
              pure=last.get("pure_arb_native_shadow") if isinstance(last.get("pure_arb_native_shadow"),dict) else {}
              pm=last.get("polymarket") if isinstance(last.get("polymarket"),dict) else {}
              bn=last.get("binance") if isinstance(last.get("binance"),dict) else {}
              by=last.get("bybit_confirmation") if isinstance(last.get("bybit_confirmation"),dict) else {}
              compact={
                  "file":p.name,"bytes":st.st_size,"json_summary":bool(last),
                  "asset":last.get("asset"),"horizon":last.get("horizon"),
                  "evaluations":last.get("evaluations"),
                  "adapter_healthy":last.get("adapter_healthy"),
                  "evidence_healthy":last.get("evidence_healthy"),
                  "clean_capture":last.get("clean_capture"),
                  "slow_context_failures":last.get("slow_context_failures"),
                  "pm_messages":pm.get("messages"),"pm_errors":pm.get("errors"),
                  "pm_reconnects":pm.get("reconnects"),"pm_drops":pm.get("drops"),
                  "binance_transport_failures":bn.get("transport_failures"),"binance_drops":bn.get("drops"),
                  "bybit_transport_failures":by.get("transport_failures"),"bybit_drops":by.get("drops"),
                  "pure_arb_evaluations":pure.get("evaluations"),
                  "pure_arb_stale_pair_rejections":pure.get("stale_pair_rejections"),
                  "pure_arb_latency_max_ns":(pure.get("receive_to_decision") or {}).get("max_ns") if isinstance(pure.get("receive_to_decision"),dict) else None,
              }
              print("WORKER_SUMMARY="+json.dumps(compact,sort_keys=True,separators=(",",":")))
          for rel in ("native_engine_manager.log","universe/collector.log","portfolio_guard.log","ledger_router.log"):
              p=root/rel
              try: rows=p.read_text(encoding="utf-8",errors="replace").splitlines()[-20:]
              except OSError: rows=[]
              print("TAIL="+json.dumps({"file":rel,"lines":rows},sort_keys=True,separators=(",",":")))
          PYREMOTE
          echo "JOURNAL_BEGIN"
          journalctl -u polymarket-v7-paper.service --since '2026-09-24 18:22:00' --until '2026-09-24 18:33:30' --no-pager -o short-iso | tail -n 120 || true
          echo "JOURNAL_END"
          '''
          stdout,stderr=run(REGION,instance,command,180)
          print(stdout)
          if stderr: print(stderr,file=sys.stderr)
          PY
