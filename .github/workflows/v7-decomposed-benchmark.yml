name: V7 decomposed Direct Action horse race

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-decomposed-benchmark-request.json
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: v7-decomposed-direct-action-horse-race
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Validate research-only request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request=deploy/v7-decomposed-benchmark-request.json
          test -s "$request"
          python3 - "$request" <<'PY'
          import json,re,sys
          v=json.load(open(sys.argv[1],encoding='utf-8'))
          assert v.get('schema')=='polymarket_v7_decomposed_benchmark_ssm_request_v1'
          assert v.get('version')==1
          assert re.fullmatch(r'[A-Za-z0-9._:-]{8,128}',v['request_id'])
          assert re.fullmatch(r'i-[0-9a-f]+',v['instance_id'])
          assert re.fullmatch(r'[0-9a-f]{40}',v['expected_research_sha'])
          assert v['paper_only'] is True
          assert v['authenticated_execution'] is False
          assert v['real_order_submission'] is False
          assert v['real_capital_at_risk'] is False
          assert v['automatic_promotion'] is False
          assert v['folds']==3
          assert v['latency_ms']==50
          assert float(v['capital_budget'])==10000.0
          assert v['output_directory']=='docs/research/decomposed-horse-race-2026-09-21'
          PY
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
            test "$changed" = "$request"
          fi
          research_sha="$(python3 -c 'import json; print(json.load(open("'"$request"'"))["expected_research_sha"])')"
          git fetch --no-tags origin main
          git cat-file -e "$research_sha^{commit}"
          git merge-base --is-ancestor "$research_sha" origin/main
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            parent="$(git rev-parse HEAD^1)"
            test "$research_sha" = "$parent"
          fi
          echo "request=$request" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: polymarket-v7-decomposed-horse-race
          aws-region: eu-west-2

      - name: Run chronological A0 A1 A2 benchmark on London evidence
        env:
          REQUEST: ${{ steps.request.outputs.request }}
        run: |
          set -euo pipefail
          python3 ops/v7_decomposed_benchmark_ssm.py "$REQUEST"

      - name: Validate complete backtest performance report
        env:
          REQUEST: ${{ steps.request.outputs.request }}
        run: |
          set -euo pipefail
          python3 - "$REQUEST" <<'PY'
          import json,sys
          from pathlib import Path
          req=json.load(open(sys.argv[1],encoding='utf-8'))
          path=Path(req['output_directory'])/'horse_race.json'
          v=json.load(open(path,encoding='utf-8'))
          assert v['schema']=='polymarket_v7_decomposed_action_horse_race_v1'
          assert v['state']=='READY'
          assert v['paper_only'] is True
          assert v['authenticated_execution'] is False
          assert v['real_order_submission'] is False
          assert v['real_capital_at_risk'] is False
          assert v['automatic_promotion'] is False
          assert v['research_source_sha']==req['expected_research_sha']
          policies=v['policies']
          assert set(policies)=={'A0_BASELINE','A1_DIRECT_CHALLENGER','A2_DECOMPOSED'}
          required={
              'opportunities','selected_trades','trade_rate',
              'selected_trades_per_day','observed_selected_trades',
              'censored_selected_trades','fill_count','fill_rate_given_selected',
              'positive_observed_trades','zero_observed_trades',
              'negative_observed_trades','total_observed_net_pnl',
              'net_pnl_per_day','turnover_notional',
              'net_pnl_per_dollar_turnover','max_drawdown',
              'var95','cvar95','var99','cvar99','max_gross_notional',
          }
          for name,policy in policies.items():
              perf=policy['aggregate_oos']
              assert required.issubset(perf)
              assert int(perf['opportunities'])>0
              assert len(policy['folds'])==3
          assert set(v['comparisons'])=={'A1_vs_A0','A2_vs_A0','A2_vs_A1'}
          print(json.dumps({
              name:{
                  key:policy['aggregate_oos'].get(key)
                  for key in (
                      'selected_trades','selected_trades_per_day',
                      'fill_count','total_observed_net_pnl','net_pnl_per_day',
                      'net_pnl_per_dollar_turnover','max_drawdown',
                      'cvar95','cvar99','max_gross_notional',
                  )
              }
              for name,policy in policies.items()
          },sort_keys=True))
          PY

      - name: Publish immutable horse-race result
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST: ${{ steps.request.outputs.request }}
        run: |
          set -euo pipefail
          output="$(python3 -c 'import json,os; print(json.load(open(os.environ["REQUEST"]))["output_directory"])')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$output"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Horse-race result unchanged."
            exit 0
          fi
          git commit -m "Publish decomposed Direct Action horse-race result"
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v7-decomposed-horse-race-${{ github.run_id }}
          path: docs/research/decomposed-horse-race-2026-09-21/horse_race.json
          retention-days: 30
