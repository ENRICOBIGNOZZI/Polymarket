name: V7 native alpha research progress probe

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-native-alpha-progress-probe.json

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: native-alpha-progress-probe
          aws-region: eu-west-2
      - name: Probe research processes and outputs
        shell: bash
        run: |
          set -euo pipefail
          instance="$(python3 -c 'import json;print(json.load(open("deploy/v7-native-alpha-progress-probe.json"))["instance_id"])')"
          command_id="$(aws ssm send-command \
            --instance-ids "$instance" \
            --document-name AWS-RunShellScript \
            --parameters commands='[
              "set -eu",
              "echo ===PROCESSES===",
              "ps -eo pid,etime,pcpu,pmem,args | grep -E \"native_2h_alpha|multi_alpha_2h|polymarket-native-alpha-2h\" | grep -v grep || true",
              "echo ===OUTPUTS===",
              "find /tmp -maxdepth 4 -type f \\( -path \"*polymarket-native-alpha-2h*/output/*\" -o -path \"*polymarket-multi-alpha-2h*/output/*\" \\) -printf \"%TY-%Tm-%Td %TH:%TM:%TS %s %p\\n\" 2>/dev/null | sort || true",
              "echo ===DISK===",
              "df -h /tmp"
            ]' \
            --query 'Command.CommandId' --output text)"
          for i in $(seq 1 30); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" --query Status --output text)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 2
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json
