name: TEMP V7 PAPER exploration runner

on:
  push:
    branches:
      - codex/v7-paper-exploration

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'ops: trigger V7 PAPER exploration patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v7-paper-exploration
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/tmp_patch_v7_paper_exploration.py
      - name: Run focused tests
        run: >-
          python3 -m pytest -q
          tests/test_v7_paper_exploration_authority.py
          tests/test_v7_opportunity.py
          tests/test_v7_global_portfolio_coordinator.py
          tests/test_v7_ledger_spool.py
          tests/test_v7_external_fair_invariants.py
          tests/test_v7_external_fair_paper_router.py
          tests/test_v7_maker_exploration_policy_fallback.py
      - name: Commit patch
        run: |
          git config user.name ENRICOBIGNOZZI
          git config user.email 88671442+ENRICOBIGNOZZI@users.noreply.github.com
          git add config scripts tests
          git commit -m 'feat: enable bounded V7 PAPER exploration'
          git push origin HEAD:codex/v7-paper-exploration
