name: V7 export envelope recipient public key

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-export-envelope-recipient-request.json
      - .github/workflows/v7-export-envelope-recipient.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate
        run: |
          python3 - deploy/v7-export-envelope-recipient-request.json <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1]))=={"schema":"polymarket_v7_export_envelope_recipient_v1"}
          PY
      - name: Export public recipient material only
        env:
          SSH_PRIVATE_KEY: ${{ secrets.POLYMARKET_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/key"
          python3 - "$RUNNER_TEMP/key" <<'PY'
          import base64,hashlib,sys
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import ed25519,x25519
          p=sys.argv[1]
          key=serialization.load_ssh_private_key(open(p,'rb').read(),password=None)
          assert isinstance(key,ed25519.Ed25519PrivateKey)
          public_line=key.public_key().public_bytes(serialization.Encoding.OpenSSH,serialization.PublicFormat.OpenSSH)
          fp=hashlib.sha256(public_line.strip()).hexdigest()
          seed=key.private_bytes(serialization.Encoding.Raw,serialization.PrivateFormat.Raw,serialization.NoEncryption())
          h=hashlib.sha512(seed).digest()
          scalar=bytearray(h[:32]); scalar[0]&=248; scalar[31]&=127; scalar[31]|=64
          xpriv=x25519.X25519PrivateKey.from_private_bytes(bytes(scalar))
          xpub=xpriv.public_key().public_bytes(serialization.Encoding.Raw,serialization.PublicFormat.Raw)
          print("RECIPIENT_FINGERPRINT="+fp)
          print("RECIPIENT_X25519_PUBLIC_B64="+base64.b64encode(xpub).decode())
          PY
          rm -f "$RUNNER_TEMP/key"
