name: V7 raw opportunity funnel audit

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-raw-opportunity-funnel-audit.json

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: raw-opportunity-funnel-audit
          aws-region: eu-west-2
      - name: Audit raw kind2 opportunity gates
        shell: bash
        run: |
          set -euo pipefail
          instance="$(python3 -c 'import json;print(json.load(open("deploy/v7-raw-opportunity-funnel-audit.json"))["instance_id"])')"
          cat >/tmp/audit.py <<'PY'
          import gzip,json
          from pathlib import Path
          from collections import Counter,defaultdict

          roots=[]
          for hft in list(Path('/mnt/polymarket-data').glob('*/research/hft_permanent'))+list(Path('/home').glob('*/polymarket-runs/*/research/hft_permanent')):
              files=[p for folder in ('compact','compact_closed') for p in (hft/folder).glob('*.jsonl*') if p.is_file() and not p.is_symlink()]
              if files: roots.append((sum(p.stat().st_size for p in files),hft,files))
          _,hft,files=max(roots)

          total=Counter(); by_asset=defaultdict(Counter); reasons=Counter()
          samples=[]
          for p in sorted(files):
              opener=gzip.open if str(p).endswith('.gz') else open
              with opener(p,'rt',encoding='utf-8') as f:
                  for line in f:
                      if '"kind":2' not in line and '"kind": 2' not in line:
                          continue
                      try:r=json.loads(line)
                      except:continue
                      if r.get('kind')!=2:continue
                      asset=str(r.get('asset') or 'UNKNOWN')
                      total['kind2']+=1; by_asset[asset]['kind2']+=1
                      signal=bool(r.get('signal_valid') is True)
                      confirmed=bool(r.get('confirmed_non_opposing') is True)
                      book=bool(r.get('book_valid') is True)
                      pretrigger=bool(r.get('pm_book_pre_signal') is True or r.get('require_pm_book_pre_signal') is not True)
                      direction=r.get('direction') in (-1,1)
                      try:
                          bid=int(r.get('bid_e4') or 0); ask=int(r.get('ask_e4') or 0)
                          price=0<bid<ask<10000
                      except: price=False
                      tte=r.get('tte_ns')
                      tte_ok=isinstance(tte,int) and 30_000_000_000<=tte<=120_000_000_000
                      gates={
                          'signal_valid':signal,'confirmed':confirmed,'book_valid':book,
                          'pretrigger':pretrigger,'direction_valid':direction,
                          'price_sane':price,'tte_30_120':tte_ok,
                      }
                      for k,v in gates.items():
                          if v:
                              total[k]+=1;by_asset[asset][k]+=1
                      if all((signal,book,pretrigger,direction,price,tte_ok)):
                          total['causal_without_confirmation']+=1;by_asset[asset]['causal_without_confirmation']+=1
                          if confirmed:
                              total['causal_with_confirmation']+=1;by_asset[asset]['causal_with_confirmation']+=1
                          else:
                              total['causal_unconfirmed_candidate']+=1;by_asset[asset]['causal_unconfirmed_candidate']+=1
                      if signal and confirmed and book and pretrigger and direction and price and tte_ok:
                          total['current_research_gate']+=1;by_asset[asset]['current_research_gate']+=1
                      reasons[str(r.get('reason'))]+=1
                      if len(samples)<15 and signal and not confirmed and book and direction and price and tte_ok:
                          samples.append({
                              'asset':asset,'horizon':r.get('horizon'),'signal_version':r.get('signal_version'),
                              'repricing_origin_signal_version':r.get('repricing_origin_signal_version'),
                              'confirmed_non_opposing':r.get('confirmed_non_opposing'),
                              'signal_valid':r.get('signal_valid'),'book_valid':r.get('book_valid'),
                              'accepted':r.get('accepted'),'reason':r.get('reason'),
                              'direction':r.get('direction'),'tte_ns':r.get('tte_ns'),
                          })
          out={
              'root':str(hft.parent.parent),
              'counts':dict(total),
              'by_asset':{a:dict(c) for a,c in sorted(by_asset.items())},
              'top_reason_codes':reasons.most_common(30),
              'unconfirmed_samples':samples,
          }
          print('RAW_OPPORTUNITY_AUDIT='+json.dumps(out,separators=(',',':'),sort_keys=True))
          PY
          b64="$(base64 -w0 /tmp/audit.py)"
          params="$(python3 - "$b64" <<'PY'
          import json,shlex,sys
          print(json.dumps({'commands':[f"printf %s {shlex.quote(sys.argv[1])} | base64 -d | nice -n 18 python3"]}))
          PY
          )"
          cmd="$(aws ssm send-command --instance-ids "$instance" --document-name AWS-RunShellScript --timeout-seconds 1500 --parameters "$params" --query 'Command.CommandId' --output text)"
          for i in $(seq 1 180); do
            status="$(aws ssm get-command-invocation --command-id "$cmd" --instance-id "$instance" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$cmd" --instance-id "$instance" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json
