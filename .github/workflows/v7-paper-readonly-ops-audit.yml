name: V7 PAPER readonly ops audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v7-paper-readonly-ops-audit.yml

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
      LONDON_INSTANCE_ID: ${{ vars.POLYMARKET_LONDON_INSTANCE_ID || 'i-0fba2bac9fdc5cbeb' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: polymarket-v7-paper-readonly-audit
          aws-region: eu-west-2

      - name: Read live PAPER counters through SSM
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/audit.py" <<'PY'
          import json, os, re, shlex, subprocess, time
          from pathlib import Path

          def sh(args):
              p=subprocess.run(args,text=True,capture_output=True,check=False)
              if p.returncode:
                  raise SystemExit(f"command_failed:{args[0]}:{p.stderr[-500:]}")
              return p.stdout.strip()

          unit='polymarket-v7-paper.service'
          active=sh(['systemctl','is-active',unit])
          envraw=sh(['systemctl','show',unit,'-p','Environment','--value'])
          env={}
          for item in shlex.split(envraw):
              if '=' in item:
                  k,v=item.split('=',1); env[k]=v
          root=Path(env['PM_V7_RUN_ROOT'])
          runtime=json.loads((root/'control/runtime_status.json').read_text())
          manager=json.loads((root/'control/native_engine_manager_status.json').read_text())
          metrics=sh(['curl','-fsS','http://127.0.0.1:9108/metrics'])

          families=[
            'polymarket_execution_opportunities',
            'polymarket_execution_orders_submitted',
            'polymarket_execution_fills',
            'polymarket_execution_complete_fills',
            'polymarket_execution_final_pnl_usd',
            'polymarket_runtime_pnl_usd',
            'polymarket_v7_native_accepted_decision_observations_total',
            'polymarket_v7_native_rejected_decision_observations_total',
            'polymarket_v7_native_active_workers',
            'polymarket_v7_native_target_contexts',
            'polymarket_v7_native_missing_contexts',
            'polymarket_v7_native_observations_published',
            'polymarket_v7_native_observations_written',
            'polymarket_v7_native_observations_dropped',
            'polymarket_v7_native_observations_queue_depth',
            'polymarket_v7_native_engine_operational',
            'polymarket_v7_native_engine_ready',
            'polymarket_v7_book_data_runtime_ready',
            'polymarket_v7_external_data_ready',
            'polymarket_v7_exporter_snapshot_usable',
          ]
          values={}
          for fam in families:
              vals=[]
              for line in metrics.splitlines():
                  if line.startswith('#'): continue
                  if re.match(r'^'+re.escape(fam)+r'(\{|\s)',line):
                      try: vals.append(float(line.rsplit(None,1)[1]))
                      except Exception: pass
              values[fam]={'series':len(vals),'sum':sum(vals) if vals else None,'max':max(vals) if vals else None}

          ledger=root/'ledger/execution.jsonl'
          event_counts={}
          last_ts=None
          valid_rows=0
          if ledger.exists():
              with ledger.open(errors='replace') as f:
                  for line in f:
                      try: row=json.loads(line)
                      except Exception: continue
                      if not isinstance(row,dict): continue
                      valid_rows+=1
                      kind=str(row.get('event_type') or row.get('type') or row.get('state') or 'UNKNOWN')
                      event_counts[kind]=event_counts.get(kind,0)+1
                      for k in ('timestamp_ms','ts_ms','timestamp'):
                          v=row.get(k)
                          if isinstance(v,(int,float)):
                              ts=float(v)/(1000 if float(v)>1e11 else 1)
                              last_ts=max(last_ts or ts,ts)
                              break

          out={
            'unit_active':active=='active',
            'runtime_state':runtime.get('state'),
            'runtime_sha':runtime.get('model_sha'),
            'runtime_pid':runtime.get('pid'),
            'paper_only':runtime.get('paper_only'),
            'authenticated_execution':runtime.get('authenticated_execution'),
            'real_order_submission':runtime.get('real_order_submission'),
            'runtime_age_seconds':max(0,time.time()-float(runtime.get('timestamp') or 0)),
            'manager_state':manager.get('state'),
            'active_worker_count':manager.get('active_worker_count'),
            'target_context_count':manager.get('target_context_count'),
            'expected_context_count':manager.get('expected_context_count'),
            'launch_retry_count':manager.get('launch_retry_count'),
            'settlement_blocked_count':manager.get('settlement_blocked_count'),
            'pending_settlement_count':manager.get('pending_settlement_count'),
            'metrics':values,
            'ledger_valid_rows':valid_rows,
            'ledger_event_counts':event_counts,
            'ledger_last_event_age_seconds':(max(0,time.time()-last_ts) if last_ts else None),
          }
          print('V7_READONLY_OPS_AUDIT='+json.dumps(out,sort_keys=True,separators=(',',':')))
          PY

          payload="$(base64 -w0 "$RUNNER_TEMP/audit.py")"
          python3 - "$payload" > "$RUNNER_TEMP/params.json" <<'PY'
          import json,sys
          payload=sys.argv[1]
          import shlex
          inner=f"set -euo pipefail; printf '%s' '{payload}' | base64 -d > /tmp/v7-readonly-audit.py; python3 /tmp/v7-readonly-audit.py; rm -f /tmp/v7-readonly-audit.py"
          command="bash -lc "+shlex.quote(inner)
          print(json.dumps({"commands":[command],"executionTimeout":["120"]}))
          PY
          cid="$(aws ssm send-command --instance-ids "$LONDON_INSTANCE_ID" --document-name AWS-RunShellScript --parameters file://"$RUNNER_TEMP/params.json" --comment "Polymarket V7 PAPER read-only ops audit" --query 'Command.CommandId' --output text)"
          status=""
          for _ in {1..30}; do
            status="$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$LONDON_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 2
          done
          aws ssm get-command-invocation --command-id "$cid" --instance-id "$LONDON_INSTANCE_ID" --query StandardOutputContent --output text | tee audit.txt
          if [[ "$status" != "Success" ]]; then
            echo "ssm_status=$status" >&2
            aws ssm get-command-invocation --command-id "$cid" --instance-id "$LONDON_INSTANCE_ID" --query StandardErrorContent --output text >&2 || true
            exit 1
          fi
          grep -q '^V7_READONLY_OPS_AUDIT=' audit.txt
