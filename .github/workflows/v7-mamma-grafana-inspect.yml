name: V7 mamma Grafana inspect

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-mamma-grafana-inspect-request.json

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SERVER_HOST: ${{ vars.POLYMARKET_SERVER_HOST || '100.104.183.109' }}
      SERVER_USER: ${{ vars.POLYMARKET_SERVER_USER || 'enrico' }}
      SERVER_PORT: ${{ vars.POLYMARKET_SERVER_PORT || '22' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate request
        run: |
          python3 - deploy/v7-mamma-grafana-inspect-request.json <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1]))=={"schema":"polymarket_v7_mamma_grafana_inspect_v1","read_only":True}
          PY

      - name: Select Tailscale credential
        id: ts
        shell: bash
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TS_TAGS: ${{ vars.TS_TAGS || 'tag:ci' }}
        run: |
          set -euo pipefail
          if [[ -n "${TS_AUTHKEY:-}" ]]; then
            echo mode=authkey >> "$GITHUB_OUTPUT"
          elif [[ -n "${TS_OAUTH_CLIENT_ID:-}" && -n "${TS_OAUTH_SECRET:-}" ]]; then
            echo mode=oauth >> "$GITHUB_OUTPUT"
          else
            echo "No Tailscale secret available" >&2
            exit 1
          fi

      - name: Join tailnet with auth key
        if: steps.ts.outputs.mode == 'authkey'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: ${{ env.SERVER_HOST }}

      - name: Join tailnet with OAuth
        if: steps.ts.outputs.mode == 'oauth'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TS_TAGS || 'tag:ci' }}
          ping: ${{ env.SERVER_HOST }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.POLYMARKET_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/polymarket_mamma
          chmod 600 ~/.ssh/polymarket_mamma
          ssh-keyscan -T 5 -p "$SERVER_PORT" "$SERVER_HOST" > ~/.ssh/known_hosts

      - name: Inspect mamma Grafana
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/polymarket_mamma -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=10 -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "HOST=$(hostname)"
          echo "OS=$(uname -s)"
          echo "=== GRAFANA HEALTH ==="
          curl -fsS http://127.0.0.1:3000/api/health || true
          echo
          echo "=== GRAFANA PROCESS ==="
          ps aux | grep -i '[g]rafana' || true
          echo "=== CONFIG ==="
          for p in "$HOME/.config/polymarket/grafana.ini" /opt/homebrew/etc/grafana/grafana.ini /usr/local/etc/grafana/grafana.ini; do
            if [[ -f "$p" ]]; then echo "--- $p"; grep -E '^(provisioning|root_url|http_addr|http_port|paths|data|logs|plugins|provisioning)' "$p" || true; fi
          done
          echo "=== ACTIVE CACHE TREE ==="
          find "$HOME/.cache/polymarket-grafana-london" -maxdepth 5 -type f \
            \( -name '*.yml' -o -name '*.yaml' -o -name '*.json' -o -name '*.ini' -o -name '*.log' \) 2>/dev/null | sort | head -300 || true
          echo "=== ACTIVE DASHBOARD PROVIDERS ==="
          for p in "$HOME/.cache/polymarket-grafana-london/config/provisioning/dashboards/"*.yml "$HOME/.cache/polymarket-grafana-london/config/provisioning/dashboards/"*.yaml; do
            [[ -f "$p" ]] || continue
            echo "--- $p"
            cat "$p"
          done
          echo "=== ACTIVE DASHBOARD FILES ==="
          find "$HOME/.cache/polymarket-grafana-london" -type f -name '*.json' 2>/dev/null | while read -r p; do
            python3 - "$p" <<'PY'
import json,sys,os
try:
    v=json.load(open(sys.argv[1]))
except Exception:
    raise SystemExit(0)
if isinstance(v,dict) and (v.get('uid') or v.get('title')):
    print(os.path.abspath(sys.argv[1]), 'uid='+str(v.get('uid')), 'title='+str(v.get('title')))
PY
          done
          echo "=== GRAFANA API SEARCH ==="
          curl -sS -w '\nHTTP_SEARCH=%{http_code}\n' 'http://127.0.0.1:3000/api/search?query=Pure%20Arbitrage' || true
          echo "=== GRAFANA UID LOOKUP ==="
          curl -sS -w '\nHTTP_UID=%{http_code}\n' 'http://127.0.0.1:3000/api/dashboards/uid/polymarket-v7-pure-arb' || true
          echo "=== GRAFANA LOG TAIL ==="
          for p in "$HOME/.cache/polymarket-grafana-london/logs/"*.log; do
            [[ -f "$p" ]] || continue
            echo "--- $p"
            tail -n 250 "$p" | grep -Ei 'provision|dashboard|error|warn|folder|pure' || true
          done
          echo "=== SERVICE CONTROL STATUS ==="
          sudo -n /usr/local/sbin/polymarket-service-control status || true
          echo "=== DASHBOARD UIDS ==="
          python3 - <<'PY'
          import sqlite3,os,json
          candidates=[
            os.path.expanduser('~/.config/polymarket/grafana.db'),
            '/opt/homebrew/var/lib/grafana/grafana.db',
            '/usr/local/var/lib/grafana/grafana.db',
          ]
          for db in candidates:
              if not os.path.isfile(db): continue
              print('DB='+db)
              con=sqlite3.connect('file:'+db+'?mode=ro',uri=True)
              tabs={r[0] for r in con.execute("select name from sqlite_master where type='table'")}
              if 'dashboard' in tabs:
                  try:
                      rows=con.execute("select uid,title from dashboard order by title").fetchall()
                      print(json.dumps(rows[:200]))
                  except Exception as e: print('dashboard_error='+str(e))
              con.close()
          PY
          echo "=== LOCAL PORTS ==="
          lsof -nP -iTCP -sTCP:LISTEN 2>/dev/null | grep -E ':(3000|9090|9108)\b' || true
          echo "=== TAILSCALE ==="
          TS=/Applications/Tailscale.app/Contents/MacOS/Tailscale
          [[ -x "$TS" ]] || TS="$(command -v tailscale || true)"
          if [[ -n "$TS" ]]; then "$TS" status || true; "$TS" serve status || true; fi
          REMOTE
