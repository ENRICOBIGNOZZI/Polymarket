name: One-shot supported tailnet source repair
on:
  push:
    branches: [fix/v7-tailnet-cli-20260905]
    paths: [.github/workflows/v7-one-shot-tailnet-source-repair.yml]
permissions:
  contents: write
jobs:
  prepare-reviewed-source:
    if: github.repository == 'ENRICOBIGNOZZI/Polymarket' && github.ref == 'refs/heads/fix/v7-tailnet-cli-20260905'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Patch only four reviewed workflows and the existing regression
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 16d312b3ea1df62ae9bbe2ff3dcaec6195b6919b
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/v7-one-shot-tailnet-source-repair.yml
          python3 - <<'PY'
          import ast, hashlib, json, os, runpy, subprocess, urllib.request
          from pathlib import Path
          names = ('v7-deploy-paper-server.yml','v7-paper-server-health.yml',
                   'v7-maker-fillability-evidence.yml','v7-point-in-time-universe-archive.yml')
          paths = []
          for name in names:
              path=Path('.github/workflows')/name
              text=path.read_text()
              bad='          args: --ephemeral\n'
              version='          version: 1.94.2\n'
              if text.count(bad)!=1 or text.count(version)!=3:
                  raise SystemExit('Unexpected reviewed tailnet input structure: '+name)
              text=text.replace(bad,'').replace(version, version+"          statedir: ''\n")
              text=text.replace('The workflow also forces --ephemeral.',
                                'The workflow uses in-memory daemon state for ephemeral nodes.')
              if '--ephemeral' in text:
                  raise SystemExit('Unsupported CLI flag remains: '+name)
              path.write_text(text); paths.append(path)
          tests=Path('tests/test_v7_workflow_hygiene.py')
          text=tests.read_text()
          old='        assert "args: --ephemeral" in workflow\n'
          new='        assert "--ephemeral" not in workflow\n' + '        assert workflow.count("statedir: \'\'") == workflow.count("uses: tailscale/github-action@") == 3\n'
          if text.count(old)!=1:
              raise SystemExit('Unexpected tailnet regression context')
          updated=text.replace(old,new)
          ast.parse(updated); tests.write_text(updated); paths.append(tests)
          namespace=runpy.run_path(str(tests))
          count=0
          for name, test in namespace.items():
              if name.startswith('test_') and callable(test):
                  test(); count+=1
          print('PASS workflow hygiene tests:',count)
          subprocess.run(['git','diff','--check'],check=True)
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          if changed!={str(p) for p in paths}:
              raise SystemExit('Unexpected changed files')

          # Store reviewed Git objects only. This job does not move the source
          # branch, merge a PR, contact the trading server or trigger a deploy.
          root='https://api.github.com/repos/ENRICOBIGNOZZI/Polymarket/'
          def api(path, value=None, method='POST'):
              body=None if value is None else json.dumps(value).encode()
              req=urllib.request.Request(root+path,data=body,method=method,headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json','Content-Type':'application/json',
                  'X-GitHub-Api-Version':'2022-11-28',
              })
              with urllib.request.urlopen(req,timeout=20) as response:
                  raw=response.read()
                  return json.loads(raw) if raw else None
          tree=[]
          for path in paths:
              raw=path.read_bytes()
              expected=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              blob=api('git/blobs',{'content':raw.decode(),'encoding':'utf-8'})
              if blob['sha']!=expected: raise SystemExit('Git blob mismatch')
              tree.append({'path':str(path),'mode':'100644','type':'blob','sha':blob['sha']})
          parent=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          base_tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          created_tree=api('git/trees',{'base_tree':base_tree,'tree':tree})
          commit=api('git/commits',{'message':'fix: use supported in-memory state for ephemeral Tailscale workflows',
                                 'tree':created_tree['sha'],'parents':[parent]})
          print('PATCH_COMMIT_SHA='+commit['sha'])
          print('PATCH_PARENT_SHA='+parent)
          # Remove only our redundant diagnostic branch, after proving that
          # the same commit is preserved in its compliant fix/v7 successor.
          old_ref=api('git/ref/heads/ops/v7-readonly-diagnostic-20260905',method='GET')
          saved_ref=api('git/ref/heads/fix/v7-readonly-diagnostic-20260905',method='GET')
          expected_old='c56f454eb9ff04ac7aec71e50df8845364ccafef'
          if old_ref['object']['sha']==expected_old:
              comparison=api('compare/'+expected_old+'...'+saved_ref['object']['sha'],method='GET')
              if comparison['status'] not in ('ahead','identical'):
                  raise SystemExit('Diagnostic history preservation not proven')
              api('git/refs/heads/ops/v7-readonly-diagnostic-20260905',method='DELETE')
              print('Removed redundant ops diagnostic ref; history preserved under fix/v7')
          else:
              print('Skipped diagnostic ref cleanup because its head moved')
          PY
