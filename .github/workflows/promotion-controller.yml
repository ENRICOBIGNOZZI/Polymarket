name: Polymarket Promotion Controller

on:
  workflow_dispatch:
  schedule:
    - cron: "1,16,31,46 * * * *"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/promotion-controller.yml"
      - ".github/workflows/integration-merge.yml"
      - "config/promotion_policy.json"
      - "config/alpha_factory.json"
      - "scripts/promotion_gate.py"
      - "scripts/research_pr_policy.py"
      - "tests/test_promotion_gate.py"
      - "tests/test_promotion_evidence_binding.py"
      - "tests/test_research_verdict_provenance.py"
      - "config/scheduler_registry.json"

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: polymarket-promotion-controller
  cancel-in-progress: true

# TEMPORARY V7 FIXED-SHA PAPER EVIDENCE FREEZE.
# Contract markers preserved for registry validation only:
# scripts/promotion_gate.py
# autonomous-promotion-approved
# source-match-files.txt
# Promotion decisions are hard-skipped while the one true V7 model accumulates
# same-SHA PAPER fills, completion states, markouts and audited post-cost PnL.

jobs:
  decide:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo "V7 fixed-SHA freeze: automatic promotion decisions disabled."
