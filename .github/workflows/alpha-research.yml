name: continuous-alpha-research

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  schedule:
    - cron: "7 */6 * * *"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: polymarket-continuous-alpha-research
  cancel-in-progress: false

jobs:
  research:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.POLYMARKET_SERVER_DEPLOY == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SERVER_HOST: ${{ vars.POLYMARKET_SERVER_HOST || '100.104.183.109' }}
      SERVER_USER: ${{ vars.POLYMARKET_SERVER_USER || 'enrico' }}
      SERVER_PORT: ${{ vars.POLYMARKET_SERVER_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4

      - name: Join private tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: ${{ env.SERVER_HOST }}

      - name: Configure SSH identity
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.POLYMARKET_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}" || { echo "missing POLYMARKET_SERVER_SSH_KEY" >&2; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/polymarket_deploy
          chmod 600 ~/.ssh/polymarket_deploy
          ssh-keyscan -T 5 -p "$SERVER_PORT" "$SERVER_HOST" > ~/.ssh/known_hosts

      - name: Run bounded alpha research on validated paper node
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/polymarket_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=10 -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/polymarket
          git fetch -q origin main paper-validated
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/paper-validated)"
          test -x build/polymarket_stat_arb
          test -x build/polymarket_pca_stat_arb
          source_sha="$(git rev-parse HEAD)"
          python3 scripts/alpha_research.py \
            --config config/alpha_research.json \
            --run-root runs/paper_v4_live \
            --build-dir build \
            --paper-config config/paper_v4.json \
            --source-sha "$source_sha" \
            --execute \
            > runs/paper_v4_live/alpha_research/latest.stdout.json
          test -s runs/paper_v4_live/alpha_research/latest.json
          test -s runs/paper_v4_live/alpha_research/latest.md
          REMOTE

      - name: Fetch alpha research evidence
        shell: bash
        run: |
          set -euo pipefail
          scp -i ~/.ssh/polymarket_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            -P "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST:polymarket/runs/paper_v4_live/alpha_research/latest.json" alpha-research.json
          scp -i ~/.ssh/polymarket_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            -P "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST:polymarket/runs/paper_v4_live/alpha_research/latest.md" alpha-research.md
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('alpha-research.json').read_text())
          assert report['schema'] == 'polymarket_alpha_research_v1'
          assert report['production_modified'] is False
          Path('promotion-count.txt').write_text(str(int(report['promotion_ready_count'])))
          Path('source-sha.txt').write_text(str(report.get('source_sha', '')))
          PY

      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          cat alpha-research.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo 'Alpha research report unavailable.' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish latest public alpha checkpoint
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint="repos/${GITHUB_REPOSITORY}/contents/telemetry/latest-alpha-research.json"
          content="$(base64 -w0 alpha-research.json)"
          current_sha="$(gh api "${endpoint}?ref=telemetry" --jq .sha 2>/dev/null || true)"
          args=("$endpoint" --method PUT -f message="Update continuous alpha research telemetry" -f content="$content" -f branch=telemetry)
          if [[ -n "$current_sha" ]]; then args+=(-f sha="$current_sha"); fi
          gh api "${args[@]}" >/dev/null

      - name: Open or update promotion ticket
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count="$(cat promotion-count.txt)"
          if [[ "$count" -le 0 ]]; then
            echo "No challenger passed the promotion gate."
            exit 0
          fi
          title="[alpha-research] promotion-ready challenger"
          existing="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          body_file="$(mktemp)"
          {
            echo 'A scheduled challenger passed executable screening and the configured OOS promotion gate.'
            echo
            cat alpha-research.md
            echo
            echo 'This ticket is evidence only. Production changes still require a reviewed pull request and the normal paper validation/deployment gates.'
          } > "$body_file"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body-file "$body_file"
          else
            gh issue create --title "$title" --body-file "$body_file"
          fi

      - name: Open draft promotion PR
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count="$(cat promotion-count.txt)"
          if [[ "$count" -le 0 ]]; then
            exit 0
          fi
          report_sha="$(cat source-sha.txt)"
          checkout_sha="$(git rev-parse HEAD)"
          if [[ -z "$report_sha" || "$report_sha" != "$checkout_sha" ]]; then
            echo "Promotion PR skipped: research source $report_sha does not match checked-out main $checkout_sha."
            exit 0
          fi

          selection="$(python3 scripts/promote_alpha_candidate.py \
            --report alpha-research.json \
            --config config/alpha_research.json \
            --expected-source-sha "$checkout_sha")"
          printf '%s\n' "$selection" > promotion-selection.json
          candidate_id="$(python3 -c 'import json; print(json.load(open("promotion-selection.json"))["candidate_id"])')"
          family="$(python3 -c 'import json; print(json.load(open("promotion-selection.json"))["family"])')"
          title="[alpha-auto] Promote ${candidate_id} as ${family} champion"
          existing="$(gh pr list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            echo "Promotion PR #$existing already open."
            exit 0
          fi

          branch="alpha-auto/${candidate_id}-${GITHUB_RUN_ID}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -b "$branch"
          git add config/alpha_research.json
          git commit -m "Promote ${candidate_id} after alpha research gate"
          git push --set-upstream origin "$branch"

          body_file="$(mktemp)"
          {
            echo "Promotes \`${candidate_id}\` to the \`${family}\` champion configuration."
            echo
            echo 'The scheduled research report passed executable screening, challenger-specific OOS, cost stress, drawdown, fold-stability and multiplicity gates.'
            echo
            cat alpha-research.md
            echo
            echo 'This PR is draft-only. It must pass CI and public live-paper smoke; deployment remains bound to the paper-validated ref.'
          } > "$body_file"
          gh pr create --draft --base main --head "$branch" --title "$title" --body-file "$body_file"

      - name: Upload alpha research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuous-alpha-research-${{ github.run_id }}
          path: |
            alpha-research.json
            alpha-research.md
          if-no-files-found: warn
          retention-days: 30

  candidate-config-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev python3

      - name: Build and test candidate configuration
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

          eval "$(python3 scripts/alpha_config_env.py --config config/alpha_research.json)"
          R=alpha_candidate_smoke
          mkdir -p "$R"
          ./build/polymarket_stat_arb \
            --config config/paper_v4.json \
            --markets "$B1_MARKETS" --history-universe "$B1_HISTORY_UNIVERSE" \
            --lookback-hours "$B1_LOOKBACK_HOURS" --fidelity-minutes "$B1_FIDELITY_MINUTES" \
            --min-z "$B1_MIN_Z" --max-half-life-hours "$B1_MAX_HALF_LIFE_HOURS" \
            --min-t-reversion "$B1_MIN_T_REVERSION" --top "$B1_TOP" \
            --csv "$R/stat_arb_pairs.csv" | tee "$R/b1.log"
          ./build/polymarket_pca_stat_arb \
            --config config/paper_v4.json \
            --markets "$B2_MARKETS" --universe "$B2_UNIVERSE" \
            --lookback-hours "$B2_LOOKBACK_HOURS" --fidelity-minutes "$B2_FIDELITY_MINUTES" \
            --factors "$B2_FACTORS" --max-hedges "$B2_MAX_HEDGES" --min-z "$B2_MIN_Z" \
            --max-half-life-hours "$B2_MAX_HALF_LIFE_HOURS" --min-t-reversion "$B2_MIN_T_REVERSION" \
            --max-factor-hedge-error "$B2_MAX_FACTOR_HEDGE_ERROR" --top "$B2_TOP" \
            --csv "$R/stat_arb_pca.csv" | tee "$R/b2.log"
          python3 scripts/build_v4_intents.py --strategy B1 \
            --input "$R/stat_arb_pairs.csv" --output "$R/b1_intents.csv" \
            --config config/paper_v4.json --min-edge "$B1_EXECUTION_MIN_EDGE"
          python3 scripts/build_v4_intents.py --strategy B2 \
            --input "$R/stat_arb_pca.csv" --output "$R/b2_intents.csv" \
            --config config/paper_v4.json --min-edge "$B2_EXECUTION_MIN_EDGE"
          python3 scripts/merge_v4_intents.py \
            --input "$R/b1_intents.csv" --input "$R/b2_intents.csv" \
            --output "$R/intents.csv" --min-edge "$ALPHA_MERGE_MIN_EDGE" \
            --max-age-seconds 600 --max-bundles 20
          test -s "$R/stat_arb_pairs.csv"
          test -s "$R/stat_arb_pca.csv"
          test -s "$R/intents.csv"

      - name: Upload candidate smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-candidate-smoke-${{ github.run_id }}
          path: alpha_candidate_smoke/
          if-no-files-found: warn
          retention-days: 14

