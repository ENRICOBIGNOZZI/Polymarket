name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "52 * * * *"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit SHA to validate; defaults to the event SHA
        required: false
        type: string

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VALIDATION_SHA: ${{ github.event.inputs.expected_sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.expected_sha || github.sha }}
      - name: Verify exact validation revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VALIDATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"
      - name: Backfill missing exact-head PR CI
        if: github.event_name == 'schedule' && matrix.build_type == 'Release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"; page=1
          while :; do
            rows="$(gh api "repos/${repo}/pulls?state=open&per_page=100&page=${page}" --jq '.[] | [.number,.head.ref,.head.sha,.head.repo.full_name] | @tsv')"
            count=0
            while IFS=$'\t' read -r pr head_ref head_sha head_repo; do
              [[ -n "${pr:-}" ]] || continue; count=$((count+1)); [[ "$head_repo" == "$repo" ]] || continue; [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || continue
              run_count="$(gh api "repos/${repo}/actions/workflows/ci.yml/runs?head_sha=${head_sha}&per_page=1" --jq '.total_count')"
              (( run_count == 0 )) || continue
              [[ "$(gh api "repos/${repo}/pulls/${pr}" --jq '.head.sha')" == "$head_sha" ]] || continue
              gh workflow run ci.yml --ref "$head_ref" -f expected_sha="$head_sha"
            done <<< "$rows"
            (( count == 100 )) || break; page=$((page+1))
          done
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev python3
      - name: Configure (${{ matrix.build_type }})
        run: cmake -S . -B build-${{ matrix.build_type }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build (${{ matrix.build_type }})
        run: cmake --build build-${{ matrix.build_type }} --parallel 2
      - name: Unit and mock integration tests (${{ matrix.build_type }})
        run: ctest --test-dir build-${{ matrix.build_type }} --output-on-failure
      - name: V7 deployment and control-plane contracts
        run: |
          set -euo pipefail
          bash -n \
            scripts/paper_v7_loop.sh scripts/paper_v7_execution_loop.sh \
            ops/bootstrap_server.sh ops/update_server.sh ops/bootstrap_macos.sh ops/update_server_macos.sh \
            ops/macos_service_control.sh ops/install_autoupdate_macos.sh ops/finish_bootstrap_macos.sh ops/apply_runtime_config_macos.sh
          python3 -m py_compile \
            scripts/compact_strategy_logs.py scripts/project_context_snapshot.py scripts/validate_project_context.py scripts/validate_scheduler_registry.py \
            scripts/v7_*.py monitoring/exporter.py monitoring/exporter_v7.py monitoring/exporter_latest_v7.py
          python3 -m json.tool config/paper_v7.json >/dev/null
          python3 -m json.tool config/v7_execution_evidence.json >/dev/null
          python3 -m json.tool config/live_champion.json >/dev/null
          python3 -m json.tool config/project_context.json >/dev/null
          python3 -m json.tool monitoring/grafana/dashboards/polymarket-multi-strategy.json >/dev/null
          python3 scripts/validate_scheduler_registry.py --root . --registry config/scheduler_registry.json --output /tmp/scheduler-registry-report.md
          python3 scripts/validate_project_context.py --root . --output /tmp/project-context-validation.md
          python3 scripts/project_context_snapshot.py --root . --manifest config/project_context.json --output-json /tmp/project-context.json --output-markdown /tmp/project-context.md
          test -s /tmp/project-context.json
          python3 -m unittest \
            tests/test_v7_execution_evidence.py tests/test_v7_authorized_paper_envelope.py tests/test_v7_unified_runtime.py \
            tests/test_v7_point_in_time_archive_workflow.py tests/test_monitoring_v7_exporter.py tests/test_compact_strategy_logs.py \
            tests/test_ops_macos.py tests/test_macos_deploy_mutex.py tests/test_server_health_diagnostics.py \
            tests/test_server_health_readonly.py tests/test_workflow_yaml_contracts.py -v
      - name: Reject V3-V6 runtime surfaces
        run: |
          set -euo pipefail
          if find scripts monitoring tests config .github/workflows -type f \( -iname '*v3*' -o -iname '*v4*' -o -iname '*v5*' -o -iname '*v6*' \) -print | grep -q .; then
            echo 'retired version-named files remain:' >&2
            find scripts monitoring tests config .github/workflows -type f \( -iname '*v3*' -o -iname '*v4*' -o -iname '*v5*' -o -iname '*v6*' \) -print >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          forbidden=(
              'paper_v3','paper_v4','paper_v5','paper_v6',
              'exporter_v4','exporter_v5','exporter_v6',
              'v4-live-paper-smoke','v6-live-data-research','v6-market-cache-relay',
              'scripts/v4_','scripts/v5_','scripts/v6_',
          )
          roots=[Path('ops'),Path('.github/workflows'),Path('monitoring'),Path('config/scheduler_registry.json')]
          bad=[]
          for root in roots:
              files=[root] if root.is_file() else [p for p in root.rglob('*') if p.is_file()]
              for path in files:
                  text=path.read_text(encoding='utf-8',errors='ignore')
                  for token in forbidden:
                      if token in text:
                          bad.append((str(path),token))
          if bad:
              raise SystemExit('retired compatibility references remain: '+repr(bad[:50]))
          PY
