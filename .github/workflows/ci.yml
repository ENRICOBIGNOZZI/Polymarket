name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev python3

      - name: Configure (${{ matrix.build_type }})
        run: >-
          cmake -S . -B build-${{ matrix.build_type }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build (${{ matrix.build_type }})
        run: cmake --build build-${{ matrix.build_type }} --parallel 2

      - name: Unit and mock integration tests (${{ matrix.build_type }})
        run: ctest --test-dir build-${{ matrix.build_type }} --output-on-failure

      - name: Deployment script syntax
        run: |
          bash -n scripts/paper_latest_loop.sh \
            ops/bootstrap_server.sh ops/update_server.sh \
            ops/bootstrap_macos.sh ops/update_server_macos.sh ops/macos_service_control.sh \
            ops/install_autoupdate_macos.sh ops/finish_bootstrap_macos.sh
