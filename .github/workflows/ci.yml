name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "52 * * * *"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit SHA to validate; defaults to the event SHA
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VALIDATION_SHA: ${{ github.event.inputs.expected_sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.expected_sha || github.sha }}

      - name: Verify exact validation revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VALIDATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"
          echo "validation_sha=$VALIDATION_SHA"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev python3

      - name: Configure (${{ matrix.build_type }})
        run: >-
          cmake -S . -B build-${{ matrix.build_type }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build (${{ matrix.build_type }})
        run: cmake --build build-${{ matrix.build_type }} --parallel 2

      - name: Unit and mock integration tests (${{ matrix.build_type }})
        run: ctest --test-dir build-${{ matrix.build_type }} --output-on-failure

      - name: Deployment script syntax and contracts
        run: |
          bash -n scripts/paper_latest_loop.sh \
            scripts/cross_venue_loop.sh scripts/prediction_market_system_loop.sh \
            scripts/install_cross_venue_credentials.sh \
            ops/bootstrap_server.sh ops/update_server.sh \
            ops/bootstrap_macos.sh ops/update_server_macos.sh ops/macos_service_control.sh \
            ops/install_autoupdate_macos.sh ops/finish_bootstrap_macos.sh \
            ops/apply_runtime_config_macos.sh ops/install_cross_venue_macos.sh
          python3 -m py_compile scripts/portfolio_supervisor.py
          python3 -m unittest tests/test_ops_macos.py -v
