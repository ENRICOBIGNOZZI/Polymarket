name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VALIDATION_SHA: ${{ github.event.inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact V7 revision
        run: |
          set -euo pipefail
          [[ "$VALIDATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev libssl-dev python3
      - name: Build V7
        run: |
          cmake -S . -B build-${{ matrix.build_type }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          cmake --build build-${{ matrix.build_type }} --parallel 2
      - name: Test V7 only
        run: ctest --test-dir build-${{ matrix.build_type }} --output-on-failure
      - name: Static V7 contract
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/v7_*.py monitoring/exporter_v7.py monitoring/exporter_v7_fillability.py monitoring/v7_ledger_metrics.py monitoring/v7_maker_fillability.py
          python3 -m json.tool config/live_champion.json >/dev/null
          python3 -m json.tool config/operator_directives.json >/dev/null
          python3 -m json.tool config/paper_v7.json >/dev/null
          python3 -m json.tool config/v7_professional_market_maker.json >/dev/null
          python3 -m json.tool config/v7_maker_fillability_experiments.json >/dev/null
          python3 -m json.tool monitoring/v7_monitoring_manifest.json >/dev/null
          python3 -m json.tool monitoring/grafana/dashboards/polymarket-v7-maker-fillability.json >/dev/null
          bash -n scripts/paper_v7_execution_loop.sh
          bash -n ops/update_server_v7.sh
          python3 tests/test_no_legacy_runtime.py
