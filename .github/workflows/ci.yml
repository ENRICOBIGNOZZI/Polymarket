name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev python3
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j2
      - name: Unit and mock integration tests
        run: ctest --test-dir build --output-on-failure

  live-api-smoke:
    runs-on: ubuntu-24.04
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
      - name: Live Gamma + CLOB scan (no paper fills)
        run: |
          ./build/polymarket_engine --config config/paper.example.json --once --scan-only --markets 5 --min-liquidity 100 --run-dir /tmp/polymarket-live-smoke
          test -s /tmp/polymarket-live-smoke/status.json
          test -s /tmp/polymarket-live-smoke/signals.csv
      - name: Live multi-horizon statistical arbitrage diagnostic (read-only)
        run: |
          ./build/polymarket_stat_arb --config config/paper_v3.json --markets 240 --history-universe 100 --lookback-hours 336 --fidelity-minutes 30 --min-z 1.5 --top 25 --csv /tmp/stat_arb.csv
          test -s /tmp/stat_arb.csv
