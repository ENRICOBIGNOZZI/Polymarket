name: ci

on:
  push:
    # Exact SHA verification for V7 review branches is safe to run before a
    # pull request exists. Deployment remains separately restricted to main.
    branches: [main, "codex/v7-*"]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  surface-audit-regenerate:
    name: surface-audit-regenerate
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Regenerate only if audited surface changed
        id: regenerate
        run: |
          set -euo pipefail
          python3 scripts/v7_surface_classification.py --repository-root . --output /tmp/path_classification.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          old = json.loads(Path('artifacts/v7_unification/path_classification.json').read_text())
          new = json.loads(Path('/tmp/path_classification.json').read_text())
          def signature(value):
              return {
                  row['surface_id']: (row['object_type'], row['classification'])
                  for row in value['entries']
              }
          old_coverage = {k: v for k, v in old['coverage'].items() if k != 'ref_count'}
          new_coverage = {k: v for k, v in new['coverage'].items() if k != 'ref_count'}
          changed = signature(old) != signature(new) or old_coverage != new_coverage
          Path('/tmp/surface_changed').write_text('1' if changed else '0')
          if changed:
              Path('artifacts/v7_unification/path_classification.json').write_text(
                  json.dumps(new, sort_keys=True, indent=2) + '\n'
              )
          PY
      - name: Commit generated audit snapshot
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [ "$(cat /tmp/surface_changed)" != 1 ]; then
            echo "surface snapshot already matches"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/v7_unification/path_classification.json
          git commit -m "governance: regenerate V7 surface audit snapshot"
          git push origin "HEAD:${HEAD_BRANCH}"

  security-audit:
    name: security-audit-v7
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Block on full-history V7 secret findings
        run: |
          set -euo pipefail
          python3 scripts/v7_secret_scan.py --repository-root . --history --fail-on-findings
          python3 scripts/v7_entropy_secret_scan.py --repository-root . --history --fail-on-findings

  sanitizer:
    name: sanitizer-v7
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VALIDATION_SHA: ${{ github.event.inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact V7 revision
        run: |
          set -euo pipefail
          [[ "$VALIDATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev libssl-dev python3
      - name: ASan and UBSan V7 suite
        run: |
          set -euo pipefail
          cmake -S . -B build-ASan-UBSan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-ASan-UBSan --parallel 2
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ctest --test-dir build-ASan-UBSan --output-on-failure

  build-test:
    name: ci-v7-${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VALIDATION_SHA: ${{ github.event.inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact V7 revision
        run: |
          set -euo pipefail
          [[ "$VALIDATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev libssl-dev python3
      - name: Build V7
        run: |
          cmake -S . -B build-${{ matrix.build_type }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          cmake --build build-${{ matrix.build_type }} --parallel 2
      - name: Test V7 only
        run: ctest --test-dir build-${{ matrix.build_type }} --output-on-failure
      - name: Enforce V7 internal latency SLO
        if: matrix.build_type == 'Release'
        run: |
          set -euo pipefail
          build-Release/polymarket_v7_maker_replay_bench 200000 > build-Release/v7-latency-benchmark.json
          python3 scripts/v7_latency_gate.py \
            --config config/v7_latency_slo.json \
            --benchmark build-Release/v7-latency-benchmark.json \
            --output build-Release/v7-latency-gate.json
      - name: Static V7 contract
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/v7_*.py monitoring/exporter_v7.py monitoring/exporter_v7_fillability.py monitoring/v7_ledger_metrics.py monitoring/v7_maker_fillability.py monitoring/v7_maker_fillability_exact.py
          python3 -m json.tool config/live_champion.json >/dev/null
          python3 -m json.tool config/operator_directives.json >/dev/null
          python3 -m json.tool config/paper_v7.json >/dev/null
          python3 -m json.tool config/v7_authority_registry.json >/dev/null
          python3 -m json.tool config/v7_professional_market_maker.json >/dev/null
          python3 -m json.tool config/v7_maker_fillability_experiments.json >/dev/null
          python3 -m json.tool config/v7_strategy_registry.json >/dev/null
          python3 -m json.tool config/v7_scheduler_freeze.json >/dev/null
          python3 -m json.tool config/v7_capability_matrix.json >/dev/null
          python3 -m json.tool config/v7_incumbent_identity.json >/dev/null
          python3 -m json.tool config/v7_latency_slo.json >/dev/null
          python3 -m json.tool artifacts/github_main_ruleset.json >/dev/null
          python3 -m json.tool artifacts/v7_repository_convergence_audit.json >/dev/null
          python3 -m json.tool monitoring/v7_monitoring_manifest.json >/dev/null
          python3 -m json.tool monitoring/grafana/dashboards/polymarket-v7-latency.json >/dev/null
          python3 -m json.tool schemas/v7/opportunity_envelope.schema.json >/dev/null
          bash -n scripts/paper_v7_execution_loop.sh
          bash -n ops/update_server_v7.sh
          python3 scripts/v7_authority_contract.py
          python3 scripts/v7_protocol_fuzz.py --iterations 5000
          python3 tests/test_v7_repository_shape.py
          python3 scripts/v7_convergence_audit.py --repository-root . >/dev/null
          python3 scripts/v7_final_convergence_audit.py --repository-root . >/dev/null
