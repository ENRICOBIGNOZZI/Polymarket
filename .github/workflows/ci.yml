name: ci

on:
  push:
    # Exact SHA verification for V7 review branches is safe to run before a
    # pull request exists. Deployment remains separately restricted to main.
    branches: [main, "codex/v7-*"]
    paths-ignore:
      - deploy/v7-paper-deploy-aws-oidc-request.json
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: false
        type: string
      full_validation:
        description: Run the complete Release/Debug/Sanitizer sweep
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  # Exact-SHA CI must be allowed to finish even if another agent advances main.
  # Deployment gates bind to a specific immutable SHA, so cross-SHA cancellation
  # creates false negatives and can starve a valid release indefinitely.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify-v7-change
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      cpp_required: ${{ steps.diff.outputs.cpp_required }}
      full_required: ${{ steps.diff.outputs.full_required }}
      latency_required: ${{ steps.diff.outputs.latency_required }}
      london_required: ${{ steps.diff.outputs.london_required }}
      research_required: ${{ steps.diff.outputs.research_required }}
    env:
      VALIDATION_SHA: ${{ github.event.inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - id: diff
        name: Classify exact-SHA change
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VALIDATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"

          force_full=false
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event.inputs.full_validation || 'false' }}" == "true" ]]; then
            force_full=true
          fi

          if git rev-parse HEAD^1 >/dev/null 2>&1; then
            changed="$(git diff --name-only HEAD^1 HEAD)"
          else
            changed="$(git ls-tree -r --name-only HEAD)"
          fi
          printf '%s\n' "$changed" > "$RUNNER_TEMP/v7-changed-paths.txt"

          cpp=false
          full=false
          latency=false
          london=false
          research=false

          if grep -Eq '^(src/|include/|tests/.*\.(cpp|cc|cxx|h|hpp)$|CMakeLists\.txt$)' "$RUNNER_TEMP/v7-changed-paths.txt"; then
            cpp=true
            london=true
          fi
          if grep -Eq '^(CMakeLists\.txt|include/|src/(http|api|event_api|config|boost_json|fast_arb|fast_ws|v7_market_state|v7_market_ws|v7_maker_fillability_observer)\.cpp)' "$RUNNER_TEMP/v7-changed-paths.txt"; then
            full=true
          fi
          if grep -Eq '^(src/v7_(maker|crypto_decision|external|ingress|market_ws)|include/.*v7_(maker|crypto_decision|external|ingress|market_ws)|config/v7_latency_slo\.json|scripts/v7_latency_gate\.py)' "$RUNNER_TEMP/v7-changed-paths.txt"; then
            latency=true
          fi
          if grep -Eq '^(\.gitignore$|ops/build_london_runtime_bundle\.py|ops/update_server_v7\.sh|deploy/london/|config/paper_v7\.json|config/v7_|monitoring/v7_hft|monitoring/v7_london_buffer_retention)' "$RUNNER_TEMP/v7-changed-paths.txt"; then
            london=true
          fi
          if [[ "$force_full" == true ]]; then
            cpp=true
            full=true
            latency=true
            london=true
            research=true
          fi
          if grep -Eq '^(research/|tests/test_v7_cumulative_learning.py|tests/test_v7_learning_models.py|tests/test_v7_simple_backtest.py|tests/test_historical_walk_forward_v2.py|tests/test_direct_action_value.py|tests/test_decomposed_action_value.py|tests/test_decomposed_benchmark.py|tests/test_v7_executable_markout_forward_shadow.py|scripts/v7_executable_markout_forward_shadow.py|tests/test_v7_executable_markout_forward_evaluate.py|scripts/v7_executable_markout_forward_evaluate.py|tests/test_v7_hft_data_pipeline.py|monitoring/v7_hft|monitoring/v7_london_buffer_retention|ops/.*research)' "$RUNNER_TEMP/v7-changed-paths.txt"; then
            research=true
          fi

          echo "cpp_required=$cpp" >> "$GITHUB_OUTPUT"
          echo "full_required=$full" >> "$GITHUB_OUTPUT"
          echo "latency_required=$latency" >> "$GITHUB_OUTPUT"
          echo "london_required=$london" >> "$GITHUB_OUTPUT"
          echo "research_required=$research" >> "$GITHUB_OUTPUT"
          printf 'cpp_required=%s\nfull_required=%s\nlatency_required=%s\nlondon_required=%s\n' "$cpp" "$full" "$latency" "$london"

  research-learning:
    name: causal-learning-v7
    needs: classify
    if: needs.classify.outputs.research_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
      - name: Isolated offline research dependencies and causal regression tests
        run: |
          python3 -m venv /tmp/v7-learning
          /tmp/v7-learning/bin/pip install -r research/requirements-learning.txt
          /tmp/v7-learning/bin/python -m pytest tests/test_v7_cumulative_learning.py tests/test_v7_learning_models.py tests/test_v7_simple_backtest.py tests/test_historical_walk_forward_v2.py tests/test_direct_action_value.py tests/test_decomposed_action_value.py tests/test_decomposed_benchmark.py tests/test_v7_executable_markout_forward_shadow.py tests/test_v7_executable_markout_forward_evaluate.py tests/test_v7_hft_data_pipeline.py tests/test_v7_london_buffer_observation.py tests/test_v7_native_repricing_dataset.py tests/test_v7_native_repricing_identity.py -q

  security-audit:
    name: security-audit-v7
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Block on full-history V7 secret findings
        run: |
          set -euo pipefail
          python3 scripts/v7_secret_scan.py --repository-root . --history --fail-on-findings
          python3 scripts/v7_entropy_secret_scan.py --repository-root . --history --fail-on-findings

  sanitizer:
    name: sanitizer-v7
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VALIDATION_SHA: ${{ github.event.inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Verify exact V7 revision
        run: |
          set -euo pipefail
          [[ "$VALIDATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"
      - name: Fast-path no C++ sanitizer
        if: needs.classify.outputs.cpp_required != 'true'
        run: echo "sanitizer_fast_path=no_cpp_change"
      - name: Install sanitizer dependencies
        if: needs.classify.outputs.cpp_required == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache ninja-build build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev libssl-dev libsecp256k1-dev python3 python3-pytest python3-numpy
      - name: Restore sanitizer compiler cache
        if: needs.classify.outputs.cpp_required == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: v7-asan-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'include/**', 'src/**') }}
          restore-keys: |
            v7-asan-${{ runner.os }}-
      - name: ASan and UBSan V7 gate
        if: needs.classify.outputs.cpp_required == 'true'
        run: |
          set -euo pipefail
          ccache --max-size=1G
          cmake -S . -B build-ASan-UBSan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DPython3_EXECUTABLE=/usr/bin/python3 \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          if [[ "${{ needs.classify.outputs.full_required }}" == "true" ]]; then
            cmake --build build-ASan-UBSan --parallel "$(nproc)"
            # This integration-test helper is EXCLUDE_FROM_ALL but its CTest is
            # part of the full suite, so build it explicitly before ctest.
            cmake --build build-ASan-UBSan --parallel "$(nproc)" --target \
              pm_v7_native_clob_order_lane_driver \
            pm_v7_clob_rate_limit_tests
            ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
              ctest --test-dir build-ASan-UBSan --parallel "$(nproc)" --output-on-failure
          else
            cmake --build build-ASan-UBSan --parallel "$(nproc)" --target \
              polymarket_v7_crypto_settlement_engine \
              pm_v7_native_runtime_evidence_tests pm_v7_execution_mode_tests \
              pm_v7_native_paper_execution_tests pm_v7_execution_admission_tests \
              pm_v7_native_settlement_authority_tests pm_v7_paper_queue_tests pm_v7_oms_tests
            ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
              ctest --test-dir build-ASan-UBSan --parallel "$(nproc)" --output-on-failure \
              -R 'pm_v7_(native_runtime_evidence_tests|execution_mode_tests|native_paper_execution_tests|execution_admission_tests|native_settlement_authority_tests|paper_queue_tests|oms_tests|crypto_settlement_native_candidate_validate)'
          fi
          ccache --show-stats

  build-test:
    name: ci-v7-${{ matrix.build_type }}
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VALIDATION_SHA: ${{ github.event.inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Verify exact V7 revision
        run: |
          set -euo pipefail
          [[ "$VALIDATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"
      - name: Static V7 contract
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/v7_*.py monitoring/exporter_v7.py monitoring/exporter_v7_fillability.py monitoring/v7_ledger_metrics.py monitoring/v7_maker_fillability.py monitoring/v7_maker_fillability_exact.py
          python3 -m json.tool config/operator_directives.json >/dev/null
          python3 -m json.tool config/paper_v7.json >/dev/null
          python3 -m json.tool config/v7_authority_registry.json >/dev/null
          python3 -m json.tool config/v7_professional_market_maker.json >/dev/null
          python3 -m json.tool config/v7_strategy_registry.json >/dev/null
          python3 -m json.tool config/v7_latency_slo.json >/dev/null
          python3 -m json.tool config/v7_exact_arb_relations.json >/dev/null
          python3 -m json.tool config/v7_exchange_semantics.json >/dev/null
          python3 -m json.tool config/v7_pure_arb_capital_policy.json >/dev/null
          python3 -m json.tool config/v7_pure_arb_performance_slo.json >/dev/null
          python3 -m json.tool artifacts/github_main_ruleset.json >/dev/null
          python3 -m json.tool monitoring/v7_monitoring_manifest.json >/dev/null
          python3 -m json.tool monitoring/grafana/dashboards/polymarket-v7-latency.json >/dev/null
          python3 -m json.tool schemas/v7/opportunity_envelope.schema.json >/dev/null
          bash -n scripts/paper_v7_execution_loop.sh
          bash -n scripts/v7_collection_plane.sh
          bash -n ops/update_server_v7.sh
          python3 scripts/v7_authority_contract.py
          python3 tests/test_v7_repository_shape.py
          python3 tests/test_v7_collection_plane.py
          python3 tests/test_v7_pure_arb_frequency.py
          python3 tests/test_v7_pure_arb_exchange_native.py
          python3 tests/test_v7_pure_arb_sota.py
          python3 tests/test_v7_pure_arb_ultra_sota.py
          python3 tests/test_v7_pure_arb_native_engine_shadow.py
          python3 -m unittest tests/test_v7_chaos_runtime.py -v
      - name: Fast-path no C++ build
        if: needs.classify.outputs.cpp_required != 'true'
        run: echo "cpp_build_fast_path=skipped_no_cpp_change"
      - name: Install C++ dependencies
        if: needs.classify.outputs.cpp_required == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache ninja-build build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev libssl-dev libsecp256k1-dev python3 python3-pytest python3-numpy
      - name: Restore compiler cache
        if: needs.classify.outputs.cpp_required == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: v7-${{ matrix.build_type }}-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'include/**', 'src/**') }}
          restore-keys: |
            v7-${{ matrix.build_type }}-${{ runner.os }}-
      - name: Build and test V7
        if: needs.classify.outputs.cpp_required == 'true'
        run: |
          set -euo pipefail
          ccache --max-size=1G
          cmake -S . -B build-${{ matrix.build_type }} -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DPython3_EXECUTABLE=/usr/bin/python3 \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          if [[ "${{ needs.classify.outputs.full_required }}" == "true" ]]; then
            cmake --build build-${{ matrix.build_type }} --parallel "$(nproc)"
            ctest --test-dir build-${{ matrix.build_type }} --parallel "$(nproc)" --output-on-failure
          else
            cmake --build build-${{ matrix.build_type }} --parallel "$(nproc)" --target \
              polymarket_v7_crypto_settlement_engine \
              pm_v7_native_runtime_evidence_tests pm_v7_execution_mode_tests \
              pm_v7_native_paper_execution_tests pm_v7_execution_admission_tests \
              pm_v7_native_settlement_authority_tests pm_v7_paper_queue_tests pm_v7_oms_tests \
              pm_v7_crypto_decision_lane_tests pm_v7_maker_paper_tests pm_v7_external_execution_tests
            ctest --test-dir build-${{ matrix.build_type }} --parallel "$(nproc)" --output-on-failure \
              -R 'pm_v7_(native_runtime_evidence_tests|execution_mode_tests|native_paper_execution_tests|execution_admission_tests|native_settlement_authority_tests|paper_queue_tests|oms_tests|crypto_decision_lane_tests|maker_paper_tests|external_execution_tests|crypto_settlement_native_candidate_validate)'
          fi
          ccache --show-stats
      - name: Enforce V7 internal latency SLO
        if: matrix.build_type == 'Release' && needs.classify.outputs.latency_required == 'true'
        run: |
          set -euo pipefail
          cmake --build build-Release --parallel "$(nproc)" --target polymarket_v7_maker_replay_bench
          build-Release/polymarket_v7_maker_replay_bench 200000 > build-Release/v7-latency-benchmark.json
          python3 scripts/v7_latency_gate.py \
            --config config/v7_latency_slo.json \
            --benchmark build-Release/v7-latency-benchmark.json \
            --output build-Release/v7-latency-gate.json

  pure-arb-sota:
    name: pure-arb-sota-${{ matrix.build_type }}
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    env:
      VALIDATION_SHA: ${{ github.event.pull_request.head.sha }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Verify exact SOTA revision
        run: |
          set -euo pipefail
          [[ "$VALIDATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"
      - name: Install SOTA build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache ninja-build build-essential cmake pkg-config \
            libcurl4-openssl-dev libboost-all-dev libssl-dev libsecp256k1-dev \
            python3 python3-pytest python3-numpy
      - name: Pure-arb semantic and runtime contracts
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/v7_pure_arb_economics.py \
            scripts/v7_pure_arb_exchange_execution_shadow.py \
            scripts/v7_pure_arb_capital_allocator.py \
            scripts/v7_pure_arb_deep_sizing_shadow.py \
            scripts/v7_pure_arb_venue_mode.py \
            scripts/v7_complete_set_merge_shadow.py \
            scripts/v7_fee_reward_registry.py \
            scripts/v7_causal_book.py \
            scripts/v7_clob_public_batch.py \
            scripts/v7_exact_relation_discovery.py \
            scripts/v7_combo_market_source.py \
            scripts/v7_combo_rfq_gateway_readonly.py \
            scripts/v7_combo_rfq_shadow.py \
            scripts/v7_combo_collateral_return_shadow.py \
            scripts/v7_clock_guard.py \
            scripts/v7_maker_self_fill_calibration.py \
            scripts/v7_multi_az_fencing_guard.py \
            scripts/v7_multi_az_fencing_supervisor.py \
            ops/v7_aws_fencing_lease.py
          python3 tests/test_v7_pure_arb_sota.py
          python3 tests/test_v7_pure_arb_frequency.py
          python3 tests/test_v7_pure_arb_exchange_native.py
          python3 tests/test_v7_process_manifest.py
          python3 -m pytest \
            tests/test_v7_fee_reward_registry.py \
            tests/test_v7_hotpath_architecture_contract.py \
            tests/test_v7_hotpath_data_plane.py \
            tests/test_v7_runtime_research_boundary.py -q
          python3 tests/test_v7_canonical_economics_health_loop.py
          bash -n scripts/paper_v7_execution_loop.sh
      - name: Restore SOTA compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: v7-pure-arb-sota-${{ matrix.build_type }}-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'include/**', 'src/**') }}
          restore-keys: |
            v7-pure-arb-sota-${{ matrix.build_type }}-${{ runner.os }}-
      - name: Build pure-arb affected C++ surface
        run: |
          set -euo pipefail
          ccache --max-size=1G
          cmake -S . -B build-pure-arb-${{ matrix.build_type }} -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DPython3_EXECUTABLE=/usr/bin/python3 \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-pure-arb-${{ matrix.build_type }} --parallel "$(nproc)" --target \
            polymarket_v7_maker_fillability_observer \
            polymarket_v7_crypto_settlement_engine \
            pm_v7_causal_book_observer_tests \
            pm_v7_market_state_tests \
            pm_v7_pure_arb_lane_tests \
            pm_v7_market_ws_tests \
            pm_v7_oms_tests \
            pm_v7_native_runtime_evidence_tests \
            pm_v7_execution_mode_tests \
            pm_v7_native_paper_execution_tests \
            pm_v7_execution_admission_tests \
            pm_v7_native_settlement_authority_tests \
            pm_v7_paper_queue_tests \
            pm_v7_native_clob_order_lane_driver \
            pm_v7_clob_rate_limit_tests
          ctest --test-dir build-pure-arb-${{ matrix.build_type }} --output-on-failure \
            -R 'pm_v7_(causal_book_observer_tests|market_state_tests|pure_arb_lane_tests|market_ws_tests|oms_tests|native_runtime_evidence_tests|execution_mode_tests|native_paper_execution_tests|execution_admission_tests|native_settlement_authority_tests|paper_queue_tests|clob_rate_limit_tests)'
          ccache --show-stats

      - name: Pure-arb native performance gate
        if: matrix.build_type == 'Release'
        run: |
          set -euo pipefail
          cmake --build build-pure-arb-Release --parallel "$(nproc)" --target \
            polymarket_v7_native_clob_full_prewire_bench \
            polymarket_v7_crypto_to_oms_bench
          build-pure-arb-Release/polymarket_v7_native_clob_full_prewire_bench 100000 \
            > build-pure-arb-Release/pure-arb-prewire-bench.json
          build-pure-arb-Release/polymarket_v7_crypto_to_oms_bench --samples 100000 \
            > build-pure-arb-Release/pure-arb-signal-to-oms-bench.json
          python3 scripts/v7_pure_arb_performance_gate.py \
            --config config/v7_pure_arb_performance_slo.json \
            --prewire build-pure-arb-Release/pure-arb-prewire-bench.json \
            --signal-to-oms build-pure-arb-Release/pure-arb-signal-to-oms-bench.json \
            --output build-pure-arb-Release/pure-arb-performance-gate.json
          cat build-pure-arb-Release/pure-arb-prewire-bench.json
          cat build-pure-arb-Release/pure-arb-signal-to-oms-bench.json
          cat build-pure-arb-Release/pure-arb-performance-gate.json

  pure-arb-sota-sanitizer:
    name: pure-arb-sota-sanitizer
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VALIDATION_SHA: ${{ github.event.pull_request.head.sha }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Verify exact SOTA revision
        run: |
          set -euo pipefail
          [[ "$VALIDATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"
      - name: Install sanitizer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache ninja-build build-essential cmake pkg-config \
            libcurl4-openssl-dev libboost-all-dev libssl-dev libsecp256k1-dev \
            python3 python3-pytest python3-numpy
      - name: Restore sanitizer cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: v7-pure-arb-sota-asan-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'include/**', 'src/**') }}
          restore-keys: |
            v7-pure-arb-sota-asan-${{ runner.os }}-
      - name: ASan UBSan pure-arb gate
        run: |
          set -euo pipefail
          ccache --max-size=1G
          cmake -S . -B build-pure-arb-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DPython3_EXECUTABLE=/usr/bin/python3 \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-pure-arb-asan --parallel "$(nproc)" --target \
            polymarket_v7_maker_fillability_observer \
            pm_v7_causal_book_observer_tests \
            pm_v7_market_state_tests \
            pm_v7_pure_arb_lane_tests \
            pm_v7_market_ws_tests \
            pm_v7_oms_tests \
            pm_v7_native_runtime_evidence_tests \
            pm_v7_execution_mode_tests \
            pm_v7_native_paper_execution_tests \
            pm_v7_execution_admission_tests \
            pm_v7_native_settlement_authority_tests \
            pm_v7_paper_queue_tests \
            pm_v7_clob_rate_limit_tests
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ctest --test-dir build-pure-arb-asan --output-on-failure \
            -R 'pm_v7_(causal_book_observer_tests|market_state_tests|pure_arb_lane_tests|market_ws_tests|oms_tests|native_runtime_evidence_tests|execution_mode_tests|native_paper_execution_tests|execution_admission_tests|native_settlement_authority_tests|paper_queue_tests|clob_rate_limit_tests)'
          ccache --show-stats

  london-runtime-boundary:
    name: london-runtime-boundary-v7
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      VALIDATION_SHA: ${{ github.event.inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Verify exact V7 revision
        run: |
          set -euo pipefail
          [[ "$VALIDATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"
      - name: Fast-path unchanged London runtime
        if: needs.classify.outputs.london_required != 'true'
        run: echo "london_runtime_fast_path=unchanged"
      - name: Install runtime build dependencies
        if: needs.classify.outputs.london_required == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache ninja-build build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev libssl-dev libsecp256k1-dev python3
      - name: Restore London compiler cache
        if: needs.classify.outputs.london_required == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: v7-london-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'include/**', 'src/**') }}
          restore-keys: |
            v7-london-${{ runner.os }}-
      - name: Build minimal London binaries
        if: needs.classify.outputs.london_required == 'true'
        run: |
          set -euo pipefail
          ccache --max-size=1G
          cmake -S . -B build-london -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPM_LONDON_RUNTIME_ONLY=ON -DBUILD_TESTING=OFF -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-london --parallel "$(nproc)"
          ccache --show-stats
      - name: Materialize research-free runtime bundle
        if: needs.classify.outputs.london_required == 'true'
        run: |
          set -euo pipefail
          python3 ops/build_london_runtime_bundle.py \
            --repository-root . --build-dir build-london \
            --expected-sha "$VALIDATION_SHA" --output build/london-runtime
          test "$(cat build/london-runtime/deploy/london/runtime_sha)" = "$VALIDATION_SHA"
          test ! -e build/london-runtime/research
          test ! -e build/london-runtime/tests
          ! find build/london-runtime -type f | grep -Eq 'v7_(external_rich_train|external_residual_train|maker_durable_learning|pm_repricing_shadow|generate_economic_artifacts|profit_attribution|profit_report|economic_decision_report|lossless_data_compaction|permanent_evidence)\.py'
          python3 - <<'PY'
          from pathlib import Path
          import py_compile
          root=Path('build/london-runtime')
          for path in root.rglob('*.py'):
              py_compile.compile(str(path),doraise=True)
          print('london_runtime_python_files',sum(1 for _ in root.rglob('*.py')))
          PY
