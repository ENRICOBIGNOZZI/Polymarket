name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev python3
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j2
      - name: Unit and mock integration tests
        run: ctest --test-dir build --output-on-failure

  live-api-smoke:
    runs-on: ubuntu-24.04
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
      - name: Live Gamma + CLOB scan (no paper fills)
        run: |
          ./build/polymarket_engine --config config/paper.example.json --once --scan-only --markets 5 --min-liquidity 100 --run-dir /tmp/polymarket-live-smoke
          test -s /tmp/polymarket-live-smoke/status.json
          test -s /tmp/polymarket-live-smoke/signals.csv

  v3-maker-forward:
    runs-on: ubuntu-24.04
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev python3
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
      - name: Eight queue-aware maker paper snapshots
        run: |
          set -euo pipefail
          RUN=/tmp/polymarket-v3-maker
          rm -rf "$RUN" && mkdir -p "$RUN"
          for i in $(seq 1 8); do
            echo "===== MAKER TICK $i/8 ====="
            ./build/polymarket_engine \
              --config config/paper.example.json \
              --once --paper --markets 600 --min-liquidity 100 \
              --run-dir "$RUN"
            cat "$RUN/maker_status.json"
            if [ "$i" -lt 8 ]; then sleep 10; fi
          done
          echo "===== FINAL ====="
          cat "$RUN/status.json"
          cat "$RUN/maker_status.json"
          wc -l "$RUN"/*.csv || true
          echo "===== MAKER FILL ROWS ====="
          grep 'MAKER_BUY' "$RUN/fills.csv" || true
          python3 - <<'PY'
          import csv, pathlib
          root=pathlib.Path('/tmp/polymarket-v3-maker')
          q=list(csv.DictReader((root/'maker_quotes.csv').open()))
          q.sort(key=lambda r: float(r['maker_edge']), reverse=True)
          print('maker_quote_rows',len(q))
          print('maker_edge_positive_50bp',sum(float(r['maker_edge'])>0.005 for r in q))
          print('top maker candidates')
          for r in q[:25]:
              print(r['slug'],r['side'],'bid',r['bid'],'ask',r['ask'],'quote',r['quote'],'fair',r['fair_side'],'edge',r['maker_edge'],'queue',r['queue_ahead'])
          PY
      - name: Upload maker-forward logs
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-v3-maker-${{ github.run_id }}
          path: /tmp/polymarket-v3-maker
          retention-days: 7
