name: V7 pure arb exact-SHA PAPER deploy

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-pure-arb-exact-deploy-request.json
      - .github/workflows/v7-pure-arb-exact-deploy.yml

permissions:
  contents: read
  checks: read
  id-token: write

concurrency:
  group: polymarket-v7-pure-arb-exact
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
      SERVER_HOST: ${{ vars.POLYMARKET_SERVER_HOST || '100.104.183.109' }}
      LONDON_INSTANCE_ID: i-04042ca7da7a23215
      SELECTED_PHYSICAL_ZONE_ID: euw2-az1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve exact target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          python3 - deploy/v7-pure-arb-exact-deploy-request.json "$GITHUB_OUTPUT" <<'PY'
          import json,re,sys
          v=json.load(open(sys.argv[1],encoding='utf-8'))
          assert set(v)=={'schema','version','request_id','target_sha','paper_only','authenticated_execution','real_order_submission','cutover_approved'}
          assert v['schema']=='polymarket_v7_pure_arb_exact_deploy_request_v1'
          assert v['version']==1
          assert re.fullmatch(r'[A-Za-z0-9._:-]{8,128}',v['request_id'])
          assert re.fullmatch(r'[0-9a-f]{40}',v['target_sha'])
          assert v['paper_only'] is True
          assert v['authenticated_execution'] is False
          assert v['real_order_submission'] is False
          assert v['cutover_approved'] is True
          with open(sys.argv[2],'a') as h:
              h.write('sha='+v['target_sha']+'\n')
          PY
          target="$(python3 -c 'import json; print(json.load(open("deploy/v7-pure-arb-exact-deploy-request.json"))["target_sha"])')"
          git cat-file -e "$target^{commit}"
          git checkout --detach "$target"
          test "$(git rev-parse HEAD)" = "$target"
          python3 scripts/v7_cutover_contract.py --repository-root . --expected-head "$target" >/dev/null

      - name: Verify exact-SHA release gates
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/v7_exact_sha_ci_gate.py             --repository "$GITHUB_REPOSITORY" --sha "$TARGET_SHA"             --required-check ci-v7-Release             --required-check ci-v7-Debug             --required-check sanitizer-v7             --required-check security-audit-v7             --required-check london-runtime-boundary-v7             --required-check monitoring-v7             --required-check single-writer-v7             --output "$RUNNER_TEMP/pure-arb-exact-gates.json"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: polymarket-v7-pure-arb-exact
          aws-region: eu-west-2

      - name: Prove selected-AZ instance binding
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation describe-stacks --region eu-west-2 --stack-name polymarket-v7-london-shootout --output json > "$RUNNER_TEMP/stack.json"
          python3 - "$RUNNER_TEMP/stack.json" "$SELECTED_PHYSICAL_ZONE_ID" "$LONDON_INSTANCE_ID" <<'PY'
          import json,sys
          sys.path.insert(0,"ops")
          from v7_london_ssm_benchmark import stack_instances
          value=json.load(open(sys.argv[1],encoding="utf-8"))
          mapping=stack_instances(value)
          assert mapping[sys.argv[2]]==sys.argv[3],(mapping,sys.argv[2],sys.argv[3])
          print("selected_az_binding=verified")
          PY

      - name: Deploy exact PAPER SHA
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/runtime-artifacts"
          source_root="$RUNNER_TEMP/research-source-empty"
          archive_root="$RUNNER_TEMP/research-archive-empty"
          durable_root="$RUNNER_TEMP/research-durable"
          mkdir -p "$source_root" "$archive_root" "$durable_root" "$artifact_root"
          PM_V7_RESEARCH_SOURCE_ROOT="$source_root"             PM_V7_RESEARCH_ARCHIVE_ROOT="$archive_root"             PM_V7_RESEARCH_DURABLE_ROOT="$durable_root"             PM_V7_RESEARCH_ARTIFACT_ROOT="$artifact_root"             research/build_runtime_artifacts.sh "$TARGET_SHA"
          bundle="$artifact_root/by-sha/$TARGET_SHA"
          test -s "$bundle/manifest.json"
          reviewed="$GITHUB_WORKSPACE/docs/research/pure-arb-champion-2026-09-23/reviewed_paper_activation_evidence.json"
          test -s "$reviewed"
          cp "$reviewed" "$bundle/reviewed_backtest_report"
          python3 - "$bundle" "$TARGET_SHA" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          sys.path.insert(0,"scripts")
          from v7_model_runtime_approval import economic_identity
          root=Path(sys.argv[1]); target=sys.argv[2]
          manifest=json.loads((root/"manifest.json").read_text())
          maker=json.loads((root/"maker_execution_model.json").read_text())
          review=json.loads((root/"reviewed_backtest_report").read_text())
          assert review["champion_semantic_sha"]=="6003f263937a75f83a12e8d1e13f72743f5716b0"
          assert review["safety_contract"]=={
              "paper_only":True,"authenticated_execution":False,
              "real_order_submission":False,"real_capital_at_risk":False,
              "automatic_promotion":False}
          assert maker.get("model_state")=="COLD_START"
          assert (manifest.get("rich_research_model") or {}).get("state")=="UNAVAILABLE"
          identity=economic_identity(root/"manifest.json",root)
          report_hash=hashlib.sha256((root/"reviewed_backtest_report").read_bytes()).hexdigest()
          approval={
              "schema":"polymarket_v7_model_runtime_approval_v1","version":1,
              "approved":True,"approval_scope":"PAPER_RUNTIME_NEW_MODEL_ACTIVATION",
              "explicit_user_approval_required":True,"review_backtest_before_approval":True,
              "automatic_promotion":False,"target_model_sha":target,
              "bundle_id":manifest["bundle_id"],
              "economic_model_identity_sha256":identity["economic_model_identity_sha256"],
              "approval_id":"pure-arb-champion-paper-20260923",
              "backtest_report_path":"reviewed_backtest_report",
              "backtest_report_sha256":report_hash,
              "operator_authorization":"EXPLICIT_USER_FREEZE_AND_PAPER_24_7_2026_09_23",
              "champion_semantic_sha":"6003f263937a75f83a12e8d1e13f72743f5716b0",
              "paper_only":True,"authenticated_execution":False,
              "real_order_submission":False,"real_capital_at_risk":False
          }
          (root/"model_runtime_approval.json").write_text(
              json.dumps(approval,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          PY
          python3 scripts/v7_model_runtime_approval.py \
            --manifest "$bundle/manifest.json" --artifact-root "$bundle" \
            --approval "$bundle/model_runtime_approval.json" \
            --reviewed-report "$bundle/reviewed_backtest_report" \
            --target-sha "$TARGET_SHA" >/dev/null
          artifact_tgz="$RUNNER_TEMP/runtime-artifact-$TARGET_SHA.tgz"
          tar -C "$bundle" -czf "$artifact_tgz" .
          receipt="$RUNNER_TEMP/pure-arb-deploy-$TARGET_SHA.json"
          python3 ops/v7_london_ssm_deploy.py             --expected-sha "$TARGET_SHA"             --expected-tailscale-ip "$SERVER_HOST"             --expected-instance-id "$LONDON_INSTANCE_ID"             --artifact "$artifact_tgz"             --region eu-west-2             --output "$receipt"
          python3 - "$receipt" "$TARGET_SHA" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1]))
          assert v.get('expected_sha')==sys.argv[2]
          assert v.get('paper_only') is True
          assert v.get('authenticated_execution') is False
          assert v.get('real_order_submission') is False
          assert (v.get('cutover') or {}).get('sha')==sys.argv[2]
          print('PURE_ARB_EXACT_DEPLOY_OK='+sys.argv[2])
          PY
          cp "$receipt" pure-arb-deploy-receipt.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v7-pure-arb-exact-deploy-${{ github.run_id }}
          path: pure-arb-deploy-receipt.json
          if-no-files-found: warn
          retention-days: 14
