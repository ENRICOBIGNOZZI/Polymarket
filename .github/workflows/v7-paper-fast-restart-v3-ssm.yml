name: V7 PAPER fast restart SSM v3

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-paper-fast-restart-v3-request.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: polymarket-v7-paper-fast-restart-v3
  cancel-in-progress: true

jobs:
  restart:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
      LONDON_INSTANCE_ID: ${{ vars.POLYMARKET_LONDON_INSTANCE_ID || 'i-0fba2bac9fdc5cbeb' }}
      REQUEST_PATH: deploy/v7-paper-fast-restart-v3-request.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: polymarket-v7-fast-restart-v3
          aws-region: eu-west-2

      - name: Restart and verify PAPER runtime
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(python3 - "$REQUEST_PATH" <<'PY'
          import json,re,sys
          v=json.load(open(sys.argv[1],encoding='utf-8'))
          assert v.get('schema')=='polymarket_v7_paper_fast_restart_v3_request_v1'
          assert v.get('version')==1
          assert re.fullmatch(r'[0-9a-f]{40}', v.get('expected_sha',''))
          assert v.get('paper_only') is True
          assert v.get('authenticated_execution') is False
          assert v.get('real_order_submission') is False
          assert v.get('restart_approved') is True
          assert v.get('trigger')=='GITHUB_AWS_OIDC_SSM_FAST_RESTART_V3'
          print(v['expected_sha'])
          PY
          )"
          echo "expected_sha=$EXPECTED_SHA" | tee fast-restart-v3-evidence.txt
          cat > "$RUNNER_TEMP/remote-fast-restart.sh" <<'REMOTE'
          set -euo pipefail
          SHA="__SHA__"
          UNIT="polymarket-v7-paper.service"
          EXPORTER="polymarket-v7-exporter.service"
          echo fast_v3=restart_begin
          systemctl reset-failed "$UNIT" || true
          systemctl reset-failed "$EXPORTER" || true
          systemctl restart "$EXPORTER" || true
          systemctl restart "$UNIT"
          for i in $(seq 1 20); do
            systemctl is-active --quiet "$UNIT" && break
            sleep 1
          done
          if ! systemctl is-active --quiet "$UNIT"; then
            echo fast_v3=paper_unit_inactive
            systemctl status "$UNIT" --no-pager -l || true
            journalctl -u "$UNIT" -n 160 --no-pager || true
            exit 20
          fi
          ROOT="$(systemctl show "$UNIT" -p Environment --value | python3 -c 'import shlex,sys; print(next((x.split("=",1)[1] for x in shlex.split(sys.stdin.read()) if x.startswith("PM_V7_RUN_ROOT=")), ""))')"
          [[ -n "$ROOT" && "$ROOT" == /* ]]
          cat > /tmp/v7_fast_v3_check.py <<'PYREMOTE'
          import json, os, sys, time
          from pathlib import Path
          root=Path(sys.argv[1]); sha=sys.argv[2]
          p=root/'control'/'runtime_status.json'
          if not p.is_file():
              raise SystemExit('runtime_status_missing')
          row={}
          for _ in range(20):
              row=json.loads(p.read_text(encoding='utf-8'))
              if row.get('state')=='running' and row.get('killed') is not True:
                  break
              time.sleep(1)
          safe={k:row.get(k) for k in ['state','killed','model_sha','paper_only','authenticated_execution','real_order_submission','pid','readiness','economic_decision_state','authorized_alpha_actions','safe_actions','timestamp']}
          print('V7_FAST_V3_RUNTIME='+json.dumps(safe,sort_keys=True,separators=(',',':')))
          if safe.get('model_sha') != sha:
              raise SystemExit('sha_mismatch '+json.dumps(safe,sort_keys=True))
          if safe.get('paper_only') is not True or safe.get('authenticated_execution') is not False or safe.get('real_order_submission') is not False:
              raise SystemExit('safety_contract_failed '+json.dumps(safe,sort_keys=True))
          if safe.get('state') != 'running' or safe.get('killed') is True:
              raise SystemExit('runtime_not_running '+json.dumps(safe,sort_keys=True))
          pid=int(safe.get('pid') or 0)
          if pid <= 0:
              raise SystemExit('pid_missing '+json.dumps(safe,sort_keys=True))
          os.kill(pid,0)
          if int(time.time())-int(safe.get('timestamp') or 0)>180:
              raise SystemExit('runtime_status_stale '+json.dumps(safe,sort_keys=True))
          PYREMOTE
          python3 /tmp/v7_fast_v3_check.py "$ROOT" "$SHA"
          curl -fsS http://127.0.0.1:9090/-/ready >/dev/null
          curl -fsS http://127.0.0.1:3000/api/health >/dev/null
          curl -fsS --get --data-urlencode 'query=up{job="polymarket-v7"}' http://127.0.0.1:9090/api/v1/query | python3 -c 'import json,sys; v=json.load(sys.stdin); r=v.get("data",{}).get("result",[]); assert len(r)==1 and r[0]["value"][1]=="1", v'
          curl -fsS http://127.0.0.1:9108/metrics | grep -E '^polymarket_v7_execution_alive(\{| )' >/dev/null
          echo V7_FAST_RESTART_V3_OK="$SHA"
          REMOTE
          sed -i "s/__SHA__/$EXPECTED_SHA/g" "$RUNNER_TEMP/remote-fast-restart.sh"
          REMOTE_CMD="bash -lc $(printf '%q' "$(cat "$RUNNER_TEMP/remote-fast-restart.sh")")"
          PARAMS="$(python3 - "$REMOTE_CMD" <<'PY'
          import json,sys
          print(json.dumps({'commands':[sys.argv[1]], 'executionTimeout':['150']}))
          PY
          )"
          CID="$(aws ssm send-command --region eu-west-2 --instance-ids "$LONDON_INSTANCE_ID" --document-name AWS-RunShellScript --parameters "$PARAMS" --comment 'Polymarket V7 PAPER fast restart v3' --query Command.CommandId --output text)"
          deadline=$((SECONDS+170))
          while true; do
            aws ssm get-command-invocation --region eu-west-2 --command-id "$CID" --instance-id "$LONDON_INSTANCE_ID" --output json > "$RUNNER_TEMP/ssm.json"
            STATUS="$(python3 - "$RUNNER_TEMP/ssm.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1])).get('Status',''))
          PY
          )"
            case "$STATUS" in Success|Cancelled|TimedOut|Failed|Cancelling) break;; esac
            if (( SECONDS >= deadline )); then echo "fast_v3=timeout cid=$CID"; exit 124; fi
            sleep 2
          done
          python3 - "$RUNNER_TEMP/ssm.json" <<'PY' | tee -a fast-restart-v3-evidence.txt
          import json,sys
          v=json.load(open(sys.argv[1]))
          print(v.get('StandardOutputContent','')[-16000:])
          if v.get('Status')!='Success':
              print(v.get('StandardErrorContent','')[-10000:], file=sys.stderr)
              raise SystemExit('ssm_status_'+str(v.get('Status')))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v7-paper-fast-restart-v3-${{ github.run_id }}
          path: fast-restart-v3-evidence.txt
          if-no-files-found: warn
          retention-days: 7
