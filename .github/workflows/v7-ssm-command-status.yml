name: V7 exact SSM command status

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-ssm-command-status-request.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: v7-ssm-command-status
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
      INSTANCE_ID: ${{ vars.POLYMARKET_LONDON_INSTANCE_ID || 'i-0fba2bac9fdc5cbeb' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate request
        id: req
        run: |
          python3 - deploy/v7-ssm-command-status-request.json "$GITHUB_OUTPUT" <<'PY'
          import json,re,sys
          v=json.load(open(sys.argv[1]))
          assert set(v)=={'schema','command_id','expected_sha'}
          assert v['schema']=='polymarket_v7_ssm_command_status_request_v1'
          assert re.fullmatch(r'[0-9a-f-]{36}',v['command_id'])
          assert re.fullmatch(r'[0-9a-f]{40}',v['expected_sha'])
          with open(sys.argv[2],'a') as h:
              h.write('command_id='+v['command_id']+'\n')
              h.write('expected_sha='+v['expected_sha']+'\n')
          PY
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: polymarket-v7-ssm-command-status
          aws-region: eu-west-2
      - name: Read exact SSM invocation
        env:
          COMMAND_ID: ${{ steps.req.outputs.command_id }}
          EXPECTED_SHA: ${{ steps.req.outputs.expected_sha }}
        run: |
          set -euo pipefail
          for delay in 2 4 8 12; do
            if aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --output json > invocation.json; then
              break
            fi
            sleep "$delay"
          done
          python3 - invocation.json "$EXPECTED_SHA" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1])); sha=sys.argv[2]
          out=str(v.get('StandardOutputContent') or '')
          err=str(v.get('StandardErrorContent') or '')
          print('SSM_STATUS='+str(v.get('Status') or ''))
          print('STATUS_DETAILS='+str(v.get('StatusDetails') or ''))
          print('STDOUT_TAIL='+repr(out[-10000:]))
          print('STDERR_TAIL='+repr(err[-10000:]))
          if out:
              assert sha in out or 'V7_SSM_CUTOVER=' not in out
          PY
