name: Polymarket Research Director

on:
  workflow_dispatch:
  schedule:
    - cron: "13,43 * * * *"
  pull_request:
    branches: [main]
    paths:
      - "config/research_director.json"
      - "config/alpha_factory.json"
      - "scripts/research_director.py"
      - "scripts/research_queue_report.py"
      - "tests/test_research_director.py"
      - ".github/workflows/research-queue.yml"
      - ".github/workflows/control-plane.yml"

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: polymarket-research-director
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 1

      - name: Validate research-director contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests/test_research_director.py -v
          python3 -m py_compile scripts/research_director.py scripts/research_queue_report.py
          python3 -m json.tool config/research_director.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('config/research_director.json').read_text())
          assert cfg['paper_only'] is True
          assert cfg['allow_authenticated_execution'] is False
          assert cfg['allow_direct_champion_mutation'] is False
          forbidden=set(cfg['forbidden_workflows'])
          owners=set(cfg['owner_workflows'])
          assert not owners & forbidden
          assert set(owners) == {
              'forward-maker-research.yml',
              'external-intelligence.yml',
              'fast-arb-hourly.yml',
              'arb-theory-hourly.yml',
          }
          PY

      - name: Materialize durable research evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research-director/input research-director/output
          git fetch --no-tags origin telemetry:refs/remotes/origin/telemetry || true
          if git show origin/telemetry:telemetry/latest-alpha-factory.json > research-director/input/latest-alpha-factory.json 2>/dev/null; then
            test -s research-director/input/latest-alpha-factory.json || printf '{}\n' > research-director/input/latest-alpha-factory.json
          else
            printf '{}\n' > research-director/input/latest-alpha-factory.json
          fi
          if git show origin/telemetry:telemetry/research-director-state.json > research-director/input/research-director-state.json 2>/dev/null; then
            test -s research-director/input/research-director-state.json || printf '{}\n' > research-director/input/research-director-state.json
          else
            printf '{}\n' > research-director/input/research-director-state.json
          fi

      - name: Collect research queue and workflow context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr list --state open --base main --limit 100 \
            --json number,title,url,headRefName,isDraft,labels,mergeStateStatus,statusCheckRollup,body,createdAt,updatedAt \
            > research-director/input/research-prs.json
          gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
            > research-director/input/research-branches.json
          gh run list --limit 200 \
            --json databaseId,workflowName,status,conclusion,headSha,headBranch,event,createdAt,updatedAt,url \
            > research-director/input/workflow-runs.json
          python3 scripts/research_queue_report.py \
            --prs research-director/input/research-prs.json \
            --branches research-director/input/research-branches.json \
            --output research-director/output/research-queue-report.md

      - name: Allocate adaptive V7 research budget
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/research_director.py \
            --config config/research_director.json \
            --alpha-report research-director/input/latest-alpha-factory.json \
            --state-in research-director/input/research-director-state.json \
            --runs research-director/input/workflow-runs.json \
            --state-out research-director/output/research-director-state.json \
            --output-json research-director/output/latest-research-director.json \
            --output-markdown research-director/output/latest-research-director.md \
            --dispatch-file research-director/output/dispatch-plan.txt \
            | tee research-director/output/research-director.log

      - name: Dispatch bounded V7 evidence-producing workers
        if: github.event_name != 'pull_request' && success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > research-director/output/dispatch-results.txt
          while IFS= read -r workflow; do
            [[ -n "$workflow" ]] || continue
            case "$workflow" in
              forward-maker-research.yml|external-intelligence.yml|fast-arb-hourly.yml|arb-theory-hourly.yml)
                gh workflow run "$workflow" --ref main
                printf 'dispatched=%s ref=main\n' "$workflow" | tee -a research-director/output/dispatch-results.txt
                ;;
              *)
                printf 'forbidden_research_dispatch=%s\n' "$workflow" >&2
                exit 1
                ;;
            esac
          done < research-director/output/dispatch-plan.txt
          if grep -Eq 'integration-merge|deploy-paper-server|server-health|promotion-controller|post-merge-validation|live-paper-validation' research-director/output/dispatch-results.txt; then
            echo 'non-research authority escaped the Research Director allowlist' >&2
            exit 1
          fi

      - name: Publish research-director summary
        if: always()
        shell: bash
        run: |
          cat research-director/output/latest-research-director.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          cat research-director/output/research-queue-report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          if test -s research-director/output/dispatch-results.txt; then
            echo '## Dispatch results' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat research-director/output/dispatch-results.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish durable research-director state to telemetry
        if: github.event_name != 'pull_request' && success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          publish_file() {
            local local_path="$1" remote_path="$2" message="$3"
            local endpoint="repos/${GITHUB_REPOSITORY}/contents/${remote_path}" content current_sha error_file
            content="$(base64 -w0 "$local_path")"
            error_file="$(mktemp)"
            for attempt in 1 2 3 4 5; do
              current_sha="$(gh api "${endpoint}?ref=telemetry" --jq .sha 2>/dev/null || true)"
              local args=("$endpoint" --method PUT -f message="$message" -f content="$content" -f branch=telemetry)
              if [[ -n "$current_sha" ]]; then args+=(-f sha="$current_sha"); fi
              if gh api "${args[@]}" >/dev/null 2>"$error_file"; then
                rm -f "$error_file"
                return 0
              fi
              if [[ "$attempt" -eq 5 ]]; then cat "$error_file" >&2; rm -f "$error_file"; return 1; fi
              sleep $((attempt * 2))
            done
          }
          publish_file research-director/output/latest-research-director.json \
            telemetry/latest-research-director.json \
            "Update autonomous V7 Research Director product"
          publish_file research-director/output/latest-research-director.md \
            telemetry/latest-research-director.md \
            "Update autonomous V7 Research Director report"
          publish_file research-director/output/research-director-state.json \
            telemetry/research-director-state.json \
            "Update adaptive V7 Research Director state"

      - name: Upload research-director evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-director-${{ github.run_id }}
          path: research-director/
          if-no-files-found: warn
          retention-days: 30
