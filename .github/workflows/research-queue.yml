name: Polymarket Research Director

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: polymarket-research-director
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Build research queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/research-director
          gh pr list --state open --limit 100 --json number,title,headRefName,baseRefName,isDraft,labels,statusCheckRollup,updatedAt > /tmp/research-director/prs.json
          gh issue list --state open --limit 100 --json number,title,labels,updatedAt > /tmp/research-director/issues.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" > /tmp/research-director/runs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" > /tmp/research-director/workflows.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          workflows=json.loads(Path('/tmp/research-director/workflows.json').read_text()).get('workflows',[])
          retired={
              'forward-maker-research.yml',
              'deploy-paper-server.yml',
              'server-health.yml',
              'grafana-access.yml',
          }
          enabled=[]
          for workflow in workflows:
              path=str(workflow.get('path') or '')
              name=Path(path).name
              if name in retired and str(workflow.get('state') or '').lower()=='active':
                  raise SystemExit(f'retired workflow unexpectedly active: {name}')
              if str(workflow.get('state') or '').lower()=='active':
                  enabled.append(name)
          Path('/tmp/research-director/enabled-workflows.json').write_text(json.dumps(enabled))
          PY
          python3 scripts/research_director.py \
            --prs /tmp/research-director/prs.json \
            --issues /tmp/research-director/issues.json \
            --runs /tmp/research-director/runs.json \
            --root . \
            --output-json /tmp/research-director/report.json \
            --output-markdown /tmp/research-director/report.md
          cat /tmp/research-director/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish/update director issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Polymarket Research Director — hourly queue"
          body="$(cat /tmp/research-director/report.md)"
          issue="$(gh issue list --state open --search 'in:title Polymarket Research Director hourly queue' --limit 1 --json number --jq '.[0].number // empty')"
          if [[ -z "$issue" ]]; then
            gh issue create --title "$title" --body "$body"
          else
            gh issue edit "$issue" --body "$body"
          fi

      - name: Enforce read-only scheduler
        run: |
          set -euo pipefail
          git diff --exit-code
          git status --porcelain --untracked-files=no | tee /tmp/research-director/git-status.txt
          test ! -s /tmp/research-director/git-status.txt
