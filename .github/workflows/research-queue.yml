name: Polymarket Research Queue

on:
  workflow_dispatch:
  schedule:
    - cron: "13 */2 * * *"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: polymarket-research-queue
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Load shared scheduler context
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_scheduler_context.py \
            --context config/scheduler_context.json \
            --scheduler-id research-queue \
            --output scheduler-context.md \
            --output-json scheduler-context.json \
            --github-env "$GITHUB_ENV"

      - name: Collect research queue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr list --state open --base main --limit 100 \
            --json number,title,url,headRefName,isDraft,labels,mergeStateStatus,statusCheckRollup,body,createdAt,updatedAt \
            > research-prs.json
          gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" > research-branches.json
          python3 scripts/research_queue_report.py \
            --prs research-prs.json \
            --branches research-branches.json \
            --output research-queue-report.md
          {
            echo
            echo '## Shared decision contract'
            echo "- context SHA256: \`$POLYMARKET_SCHEDULER_CONTEXT_SHA\`"
            echo '- candidates must preserve the five-expert universal architecture and executable-edge rule'
            echo '- research readiness is not production or real-money authorization'
          } >> research-queue-report.md

      - name: Publish research queue
        if: always()
        shell: bash
        run: |
          cat scheduler-context.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          cat research-queue-report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload research queue evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-queue-${{ github.run_id }}
          path: |
            scheduler-context.md
            scheduler-context.json
            research-queue-report.md
            research-prs.json
            research-branches.json
          if-no-files-found: warn
          retention-days: 30
