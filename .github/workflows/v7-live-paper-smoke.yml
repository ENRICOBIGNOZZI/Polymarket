name: V7 live PAPER smoke

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit SHA to validate; defaults to the event SHA
        required: false
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: v7-live-paper-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-paper-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VALIDATION_SHA: ${{ github.event.inputs.expected_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.expected_sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact V7 validation revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VALIDATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('config/live_champion.json').read_text())
          assert int(m['version']) == 7
          assert m['loop'] == 'scripts/paper_v7_loop.sh'
          assert m['config'] == 'config/paper_v7.json'
          assert m['run_root'] == 'runs/paper_v7_live'
          cfg=json.loads(Path('config/paper_v7.json').read_text())
          assert cfg['paper_only'] is True
          assert cfg['v7']['authenticated_execution'] is False
          PY

      - name: Build and validate V7 only
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev python3
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          python3 -m py_compile scripts/v7_*.py monitoring/exporter_v7.py monitoring/exporter_latest_v7.py
          bash -n scripts/paper_v7_loop.sh scripts/paper_v7_execution_loop.sh
          python3 -m json.tool config/paper_v7.json >/dev/null

      - name: Fresh public-data V7 PAPER runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          R=runs/paper_v7_smoke
          rm -rf "$R"
          mkdir -p "$R"
          set +e
          timeout --signal=TERM --kill-after=15s 120s \
            bash scripts/paper_v7_loop.sh config/paper_v7.json "$R" \
            >"$R/live-smoke.log" 2>&1
          rc=$?
          set -e
          if [[ "$rc" -ne 0 && "$rc" -ne 124 && "$rc" -ne 143 ]]; then
            tail -n 200 "$R/live-smoke.log" >&2 || true
            exit "$rc"
          fi
          test -s "$R/v7_supervisor.json"
          test -s "$R/execution/v7_execution_supervisor.json"
          test -s "$R/execution/runtime_status.json"
          test -s "$R/execution/allocator_status.json"
          test -s "$R/execution/strategy_status.csv"
          test -s "$R/execution/market_proxy_status.json"
          python3 - "$R" <<'PY'
          import json,sys,time
          from pathlib import Path
          root=Path(sys.argv[1]); ex=root/'execution'
          sup=json.loads((root/'v7_supervisor.json').read_text())
          exe=json.loads((ex/'v7_execution_supervisor.json').read_text())
          runtime=json.loads((ex/'runtime_status.json').read_text())
          proxy=json.loads((ex/'market_proxy_status.json').read_text())
          assert sup['execution_alive'] is True
          assert exe['paper_only'] is True
          assert runtime['schema'] == 'polymarket_v7_runtime_status_v1'
          assert runtime['version'] == 7
          assert runtime['paper_only'] is True
          assert runtime['authenticated_execution'] is False
          assert float(runtime['drawdown']) <= 0.15 + 1e-12
          assert proxy['schema'] == 'polymarket_v7_market_proxy_status_v1'
          assert time.time()-float(proxy['timestamp']) <= 180
          PY
          PYTHONPATH=monitoring python3 - "$R" <<'PY'
          import sys
          from pathlib import Path
          from exporter_v7 import V7Collector
          root=Path(sys.argv[1])
          collector=V7Collector(root,Path('config/paper_v7.json'),20)
          healthy,detail=collector.health()
          assert healthy, detail
          text=collector.collect()
          assert 'polymarket_runtime_info{adapter="v7",run_root="paper_v7_smoke",version="v7"} 1' in text
          assert 'polymarket_allocator_state_present 1' in text
          assert 'polymarket_v7_runtime_info 1' in text
          (root/'metrics.prom').write_text(text)
          PY

      - name: Publish V7 smoke summary
        if: always()
        shell: bash
        run: |
          echo "## V7 live PAPER smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "validation_sha=$VALIDATION_SHA" >> "$GITHUB_STEP_SUMMARY"
          if test -s runs/paper_v7_smoke/execution/runtime_status.json; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat runs/paper_v7_smoke/execution/runtime_status.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -s runs/paper_v7_smoke/live-smoke.log; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 30 runs/paper_v7_smoke/live-smoke.log >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload V7 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-live-paper-smoke-${{ github.run_id }}
          path: runs/paper_v7_smoke/
          if-no-files-found: error
          retention-days: 7

      - name: Advance paper validated ref
        if: github.event_name != 'pull_request' && success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          validated_sha="$(git rev-parse HEAD)"
          test "$validated_sha" = "$VALIDATION_SHA"
          git fetch --no-tags origin main paper-validated
          main_sha="$(git rev-parse origin/main)"
          current_validated_sha="$(git rev-parse origin/paper-validated)"
          test "$validated_sha" = "$main_sha"
          merged_pr=""
          for attempt in {1..10}; do
            merged_pr="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${validated_sha}/pulls" --jq '[.[] | select(.base.ref == "main" and .merged_at != null)] | first | .number // empty')"
            [[ -n "$merged_pr" ]] && break
            sleep 3
          done
          [[ -n "$merged_pr" ]] || { echo "refusing paper-validated promotion without merged PR provenance" >&2; exit 1; }
          if [[ "$current_validated_sha" != "$validated_sha" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/paper-validated" -f sha="$validated_sha" -F force=false >/dev/null
          fi
          echo "paper_validated_sha=$validated_sha"
