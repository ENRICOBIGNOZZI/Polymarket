name: apply-v4-payload

on:
  push:
    branches: ["implement/paper-live-oos-pilot-v4"]

permissions:
  contents: write

concurrency:
  group: apply-v4-payload
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and apply validated payload
        shell: bash
        run: |
          set -euo pipefail
          cat .v4payload/00 .v4payload/01 .v4payload/02 .v4payload/03 .v4payload/04 | base64 -d > /tmp/v4_payload.tgz
          echo "12b8ca32ced3f40ee712ee376b3f9596d10545aba321febf45ececb012b2e117  /tmp/v4_payload.tgz" | sha256sum -c -
          tar -xzf /tmp/v4_payload.tgz
          rm -rf .v4payload
          rm -f .github/workflows/source-export-v4.yml
          rm -f .github/workflows/apply-v4-payload.yml
          rm -f NONEXISTENT

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev python3

      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          python3 -m py_compile scripts/merge_v4_intents.py scripts/walk_forward_v4.py scripts/tiny_live_pilot.py tests/test_v4_research.py
          bash -n scripts/paper_v4_once.sh scripts/paper_v4_loop.sh

      - name: Commit tested implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Implement realistic multi-leg paper validation and tiny pilot"
          git push origin HEAD:implement/paper-live-oos-pilot-v4
