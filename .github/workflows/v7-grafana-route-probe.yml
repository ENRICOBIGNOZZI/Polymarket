name: V7 Grafana route probe

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-grafana-route-probe-request.json

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
      INSTANCE_ID: ${{ vars.POLYMARKET_LONDON_INSTANCE_ID || 'i-0fba2bac9fdc5cbeb' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate
        run: |
          python3 - deploy/v7-grafana-route-probe-request.json <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1]))=={"schema":"polymarket_v7_grafana_route_probe_v1","read_only":True}
          PY
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: polymarket-v7-grafana-route-probe
          aws-region: eu-west-2
      - name: Probe routes and unified resource
        run: |
          set -euo pipefail
          command="$(cat <<'SH'
          set -euo pipefail
          echo '=== ROUTES ==='
          for path in             '/d/polymarket-v7-pure-arb'             '/d/polymarket-v7-pure-arb/polymarket-v7-crypto-pure-arbitrage-paper'             '/dashboards/f/afyms0c1xjabkf/polymarket-london'
          do
            echo "--- $path"
            curl -sS -o /tmp/body -D /tmp/head "http://127.0.0.1:3000$path" || true
            head -20 /tmp/head || true
            printf 'BODY_PREFIX='
            head -c 240 /tmp/body | tr '\n' ' ' || true
            echo
          done
          echo '=== UNIFIED RESOURCE PINPOINT ==='
          python3 - <<'PY'
          import sqlite3,json
          db='/var/lib/grafana/grafana.db'
          con=sqlite3.connect(f'file:{db}?mode=ro',uri=True)
          cols=[r[1] for r in con.execute('pragma table_info(resource)')]
          idx={c:i for i,c in enumerate(cols)}
          rows=con.execute('select * from resource where name in (?,?)',('polymarket-v7-pure-arb','afyms0c1xjabkf')).fetchall()
          out=[]
          for row in rows:
              item={c:row[i] for c,i in idx.items() if c in {'group','resource','namespace','name','folder','action','resource_version'}}
              v=row[idx['value']]
              if isinstance(v,(bytes,bytearray)):
                  try:
                      doc=json.loads(v)
                      meta=doc.get('metadata') or {}
                      ann=meta.get('annotations') or {}
                      spec=doc.get('spec') or {}
                      item['title']=spec.get('title')
                      item['annotation_folder']=ann.get('grafana.app/folder')
                      item['manager_id']=ann.get('grafana.app/managerId')
                      item['source_path']=ann.get('grafana.app/sourcePath')
                  except Exception as e:
                      item['decode_error']=str(e)
              out.append(item)
          print(json.dumps(out,sort_keys=True,default=str))
          con.close()
          PY
          echo '=== SEARCH INDEX FILES ==='
          find /var/lib/grafana -maxdepth 3 -type f | grep -E 'search|bleve|index' | head -100 || true
          echo '=== GRAFANA JOURNAL DASHBOARD LINES ==='
          journalctl -u grafana-server.service -n 300 --no-pager | grep -Ei 'dashboard|provision|search|bleve|folder' | tail -180 || true
          SH
          )"
          encoded="$(printf '%s' "$command" | base64 -w0)"
          wrapped="printf '%s' '$encoded' | base64 -d | bash"
          params="$(python3 -c 'import json,sys; print(json.dumps({"commands":[sys.argv[1]],"executionTimeout":["120"]},separators=(",",":")))' "$wrapped")"
          cid="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --parameters "$params" --comment "Polymarket V7 Grafana route read-only probe" --region "$AWS_REGION" --query 'Command.CommandId' --output text)"
          for i in $(seq 1 60); do
            status="$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query Status --output text 2>/dev/null || true)"
            if [[ "$status" == "Success" ]]; then
              aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query StandardOutputContent --output text
              exit 0
            fi
            case "$status" in Failed|Cancelled|TimedOut)
              aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query StandardErrorContent --output text >&2 || true
              exit 1;;
            esac
            sleep 1
          done
          exit 1
