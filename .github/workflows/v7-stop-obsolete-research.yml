name: V7 stop obsolete research workers

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-stop-obsolete-research.json

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: stop-obsolete-research
          aws-region: eu-west-2
      - name: Stop exact obsolete research workers only
        shell: bash
        run: |
          set -euo pipefail
          instance="$(python3 -c 'import json;print(json.load(open("deploy/v7-stop-obsolete-research.json"))["instance_id"])')"
          command_id="$(aws ssm send-command \
            --instance-ids "$instance" \
            --document-name AWS-RunShellScript \
            --parameters commands='[
              "python3 - <<'"'"'PY'"'"'",
              "import os,signal",
              "targets={\"/tmp/polymarket-multi-alpha-2h-0c8e165b22e8\",\"/tmp/polymarket-native-alpha-2h-42dce601751e\"}",
              "killed=[]",
              "for name in os.listdir('/proc'):",
              "    if not name.isdigit(): continue",
              "    pid=int(name)",
              "    try:",
              "        cwd=os.path.realpath(f'/proc/{pid}/cwd')",
              "        cmd=open(f'/proc/{pid}/cmdline','rb').read().replace(b'\\x00',b' ').decode(errors='replace')",
              "    except Exception:",
              "        continue",
              "    if cwd in targets and ('native_2h_alpha_library' in cmd or 'multi_alpha_2h' in cmd):",
              "        os.kill(pid,signal.SIGTERM); killed.append((pid,cwd,cmd))",
              "print('KILLED_OBSOLETE_RESEARCH='+repr(killed))",
              "PY"
            ]' \
            --query 'Command.CommandId' --output text)"
          for i in $(seq 1 30); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" --query Status --output text)"
            case "$status" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 2
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json
