name: V7 stop obsolete research workers

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-stop-obsolete-research.json

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: stop-obsolete-research
          aws-region: eu-west-2
      - name: Stop exact obsolete research workers only
        shell: bash
        run: |
          set -euo pipefail
          instance="$(python3 -c 'import json;print(json.load(open("deploy/v7-stop-obsolete-research.json"))["instance_id"])')"
          cat >/tmp/ssm-params.json <<'JSON'
          {
            "commands": [
              "pkill -TERM -f 'research.walk_forward_v3.[n]ative_2h_alpha_library' || true",
              "pkill -TERM -f 'research.walk_forward_v3.[m]ulti_alpha_2h' || true",
              "sleep 2",
              "pgrep -af 'research.walk_forward_v3.(native_2h_alpha_library|multi_alpha_2h)' || true"
            ]
          }
          JSON
          command_id="$(aws ssm send-command \
            --instance-ids "$instance" \
            --document-name AWS-RunShellScript \
            --parameters file:///tmp/ssm-params.json \
            --query 'Command.CommandId' --output text)"
          for i in $(seq 1 60); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" --query Status --output text)"
            case "$status" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 2
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json
