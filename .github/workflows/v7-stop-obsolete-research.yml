name: V7 stop obsolete research workers

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-stop-obsolete-research.json

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: stop-obsolete-research
          aws-region: eu-west-2
      - name: Cancel exact obsolete SSM research commands
        shell: bash
        run: |
          set -euo pipefail
          instance="$(python3 -c 'import json;print(json.load(open("deploy/v7-stop-obsolete-research.json"))["instance_id"])')"
          aws ssm list-commands --instance-id "$instance" --max-results 50 --no-paginate --output json >/tmp/commands.json
          python3 - "$instance" <<'PY'
          import json,subprocess,sys
          instance=sys.argv[1]
          targets=(
              "/tmp/polymarket-multi-alpha-2h-0c8e165b22e8",
              "/tmp/polymarket-native-alpha-2h-42dce601751e",
          )
          data=json.load(open("/tmp/commands.json"))
          cancelled=[]
          for command in data.get("Commands",[]):
              status=str(command.get("Status") or "")
              params=json.dumps(command.get("Parameters") or {},sort_keys=True)
              if status not in {"Pending","InProgress","Delayed"}:
                  continue
              if not any(target in params for target in targets):
                  continue
              cid=str(command["CommandId"])
              subprocess.run(
                  ["aws","ssm","cancel-command","--command-id",cid,"--instance-ids",instance],
                  check=True,
              )
              cancelled.append(cid)
          print("CANCELLED_OBSOLETE_SSM="+json.dumps(cancelled))
          PY
          sleep 3
          aws ssm list-commands --instance-id "$instance" --max-results 50 --no-paginate \
            --query 'Commands[?Status==`InProgress` || Status==`Pending`].[CommandId,Status,RequestedDateTime,Parameters]' \
            --output json
