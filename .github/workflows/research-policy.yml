name: Polymarket Research Policy

on:
  workflow_dispatch:
  schedule:
    - cron: "6,36 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/research-policy.yml"
      - ".github/workflows/control-plane.yml"
      - "config/scheduler_registry.json"
      - "scripts/research_pr_policy.py"
      - "scripts/scheduler_meta_supervisor.py"
      - "scripts/validate_scheduler_registry.py"
      - "tests/test_model_governance.py"
      - "tests/test_scheduler_periodicity.py"
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, labeled, unlabeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: polymarket-research-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate scheduler registry and periodicity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_scheduler_registry.py \
            --root . \
            --registry config/scheduler_registry.json \
            --output scheduler-registry-report.md
          python3 -m unittest tests/test_scheduler_periodicity.py -v

      - name: Ensure governance labels exist
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ensure_label() {
            local name="$1" color="$2" description="$3"
            if ! gh api "repos/${GITHUB_REPOSITORY}/labels/${name}" >/dev/null 2>&1; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/labels" \
                -f name="$name" -f color="$color" -f description="$description" >/dev/null
            fi
          }
          ensure_label research-approved 0e8a16 "Research evidence approved; integration into the champion is required"
          ensure_label approved-for-integration 1d76db "Unified integration implementation approved for gated merge"
          ensure_label single-model-reviewed 5319e7 "Reviewed for one orchestrator, config, risk and execution path"
          ensure_label administrator-approved b60205 "Project administrator explicitly authorizes this unified integration"
          ensure_label shadow-isolated fbca04 "Measurement-only code isolated from production decisions, PnL and risk"

      - name: Enforce pull-request lifecycle
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git diff --name-only origin/main...HEAD | sort -u > changed-files.txt
          manifest_existed=false
          if git cat-file -e origin/main:config/live_champion.json 2>/dev/null; then
            manifest_existed=true
          fi
          python3 scripts/research_pr_policy.py \
            --event "$GITHUB_EVENT_PATH" \
            --changed-files changed-files.txt \
            --manifest-existed-on-base "$manifest_existed" \
            --output research-policy-report.md

      - name: Write non-PR policy report
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          {
            echo '# Research pull-request policy'
            echo
            echo "- event: \`$GITHUB_EVENT_NAME\`"
            echo '- policy scripts, labels, scheduler registry and periodic timers validated'
            echo '- no pull request was evaluated in this run'
          } > research-policy-report.md

      - name: Publish policy report
        if: always()
        shell: bash
        run: |
          cat scheduler-registry-report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          cat research-policy-report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload policy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-policy-${{ github.run_id }}
          path: |
            scheduler-registry-report.md
            research-policy-report.md
            changed-files.txt
          if-no-files-found: warn
          retention-days: 14
