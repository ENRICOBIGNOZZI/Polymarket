name: Polymarket Research Policy

on:
  workflow_dispatch:
  schedule:
    - cron: "9,24,39,54 * * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, labeled, unlabeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: polymarket-research-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce pull-request provenance for main pushes
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "main"
          merged_pr=""
          for attempt in {1..10}; do
            merged_pr="$(
              gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
                --jq '[.[] | select(.base.ref == "main" and .merged_at != null)] | first | .number // empty'
            )"
            if [[ -n "$merged_pr" ]]; then
              break
            fi
            sleep 3
          done
          if [[ -z "$merged_pr" ]]; then
            echo "::error::main commit $GITHUB_SHA has no merged pull-request provenance; direct pushes to main violate repository change policy"
            exit 1
          fi
          echo "main_push_pr=$merged_pr"

      - name: Validate scheduler registry
        run: >-
          python3 scripts/validate_scheduler_registry.py
          --root .
          --registry config/scheduler_registry.json
          --output scheduler-registry-report.md

      - name: Validate complete scheduler project context
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_project_context.py --root . --output project-context-validation.md
          python3 scripts/project_context_snapshot.py \
            --root . \
            --manifest config/project_context.json \
            --output-json project-context.json \
            --output-markdown project-context.md

      - name: Test research and promotion policy regressions
        run: >-
          python3 -m unittest
          tests/test_research_policy_cross_venue.py
          tests/test_v5_allocator_policy.py
          tests/test_promotion_gate.py
          -v

      - name: Ensure research-isolation labels exist
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ensure_label() {
            local name="$1" color="$2" description="$3"
            if ! gh api "repos/${GITHUB_REPOSITORY}/labels/${name}" >/dev/null 2>&1; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/labels" \
                -f name="$name" -f color="$color" -f description="$description" >/dev/null
            fi
          }
          ensure_label research-approved 0e8a16 "Optional research-evidence annotation; not a paper-promotion gate"
          ensure_label shadow-isolated fbca04 "Measurement-only code isolated from production decisions, PnL and risk"

      - name: Enforce pull-request lifecycle
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git diff --name-only origin/main...HEAD | sort -u > changed-files.txt
          manifest_existed=false
          if git cat-file -e origin/main:config/live_champion.json 2>/dev/null; then manifest_existed=true; fi
          python3 scripts/research_pr_policy.py \
            --event "$GITHUB_EVENT_PATH" \
            --changed-files changed-files.txt \
            --manifest-existed-on-base "$manifest_existed" \
            --output research-policy-report.md

      - name: Write non-PR policy report
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          {
            echo '# Research pull-request policy'
            echo
            echo "- event: \`$GITHUB_EVENT_NAME\`"
            echo '- research, promotion policy, scheduler registry and full-project context validated'
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              echo '- main push has merged pull-request provenance'
            fi
            echo '- legacy manual paper-promotion labels are not provisioned or required'
            echo '- no pull request was evaluated in this run'
          } > research-policy-report.md

      - name: Publish policy report
        if: always()
        shell: bash
        run: |
          cat scheduler-registry-report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          cat project-context-validation.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          cat project-context.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          cat research-policy-report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload policy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-policy-${{ github.run_id }}
          path: |
            scheduler-registry-report.md
            project-context-validation.md
            project-context.md
            project-context.json
            research-policy-report.md
            changed-files.txt
          if-no-files-found: warn
          retention-days: 14
