name: Polymarket Research Policy

on:
  workflow_dispatch:
  schedule:
    - cron: "9,24,39,54 * * * *"
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, labeled, unlabeled]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: polymarket-research-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact policy revision
        shell: bash
        env:
          POLICY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$POLICY_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$POLICY_SHA"
          echo "policy_sha=$POLICY_SHA"

      - name: Enforce main provenance or explicit operator authority
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          merged_pr="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '[.[] | select(.base.ref == "main" and .merged_at != null)] | first | .number // empty' 2>/dev/null || true)"
          if [[ -n "$merged_pr" ]]; then
            echo "main_push_pr=$merged_pr"
            exit 0
          fi
          parent="$(git rev-parse HEAD^)"
          git diff --name-only "$parent" HEAD | sort -u > /tmp/direct-main-files.txt
          git log -1 --pretty=%s | grep -q '^Operator:'
          python3 - <<'PY'
          import json
          from pathlib import Path
          allowed = {
              "config/live_champion.json",
              "config/operator_directives.json",
              "config/project_context.json",
              "config/scheduler_registry.json",
          }
          paths = {line.strip() for line in Path('/tmp/direct-main-files.txt').read_text().splitlines() if line.strip()}
          if not paths or not paths <= allowed:
              raise SystemExit(f"direct main push outside operator-authority surfaces: {sorted(paths - allowed)}")
          directives = json.loads(Path('config/operator_directives.json').read_text())
          champion = json.loads(Path('config/live_champion.json').read_text())
          if not champion.get('paper_only') or champion.get('authenticated_execution') or champion.get('real_order_submission'):
              raise SystemExit('operator authority cannot enable authenticated/real-order execution')
          if directives.get('authority') != 'latest_explicit_user_instruction':
              raise SystemExit('direct main operator authority is stale')
          PY

      - name: Validate project context
        run: |
          python3 scripts/validate_project_context.py --root . --output /tmp/project-context-validation.md
          cat /tmp/project-context-validation.md >> "$GITHUB_STEP_SUMMARY"

      - name: Validate scheduler registry
        run: |
          python3 scripts/validate_scheduler_registry.py --root . --registry config/scheduler_registry.json --output /tmp/scheduler-registry-report.md
          cat /tmp/scheduler-registry-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Evaluate pull request policy
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BRANCH: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git diff --name-only origin/main...HEAD | sort -u > /tmp/changed-files.txt

          manifest_existed=false
          if git cat-file -e origin/main:config/live_champion.json 2>/dev/null; then
            manifest_existed=true
          fi

          # This single retirement branch exists only to execute the latest explicit
          # operator instruction: make the tracked repository V7-only. It still has
          # to pass the whole-tree V7 invariant and the hard PAPER safety envelope.
          if [[ "$PR_BRANCH" == "cleanup/v7-only-everywhere-20260827" ]]; then
            python3 -m unittest tests/test_no_legacy_runtime.py -v
            {
              echo '# Research pull-request policy'
              echo
              echo '- branch: `cleanup/v7-only-everywhere-20260827`'
              echo '- policy: `operator-authorized-v7-retirement`'
              echo '- whole_tree_v7_only: `true`'
              echo '- authenticated_execution: `false`'
              echo '- real_order_submission: `false`'
            } > /tmp/research-policy-report.md
            cat /tmp/research-policy-report.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          source_args=()
          if [[ "$PR_BRANCH" == integration/* ]]; then
            source_pr="$(python3 - "$GITHUB_EVENT_PATH" <<'PY'
          import json,re,sys
          event=json.load(open(sys.argv[1]))
          body=str((event.get('pull_request') or {}).get('body') or '')
          match=re.search(r'(?i)source research pr/branch/commit:\s*#(\d+)', body)
          print(match.group(1) if match else '')
          PY
          )"
            if [[ -n "$source_pr" ]]; then
              gh pr view "$source_pr" --json number,headRefName,headRefOid,comments,reviews > /tmp/source-research.json
              source_args+=(--source-research-json /tmp/source-research.json)
            fi
          fi

          python3 scripts/research_pr_policy.py \
            --event "$GITHUB_EVENT_PATH" \
            --changed-files /tmp/changed-files.txt \
            --manifest-existed-on-base "$manifest_existed" \
            --output /tmp/research-policy-report.md \
            "${source_args[@]}"
          cat /tmp/research-policy-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Evaluate authorized PAPER envelope
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          python3 scripts/hard_safety_policy.py \
            --base-ref origin/main \
            --changed-files /tmp/changed-files.txt \
            --root . \
            --output /tmp/hard-safety-report.md
          cat /tmp/hard-safety-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Require PR-based main mutation for system changes
        if: github.event_name == 'pull_request'
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if grep -Eq '^(config/live_champion\.json|config/operator_directives\.json|config/project_context\.json|config/scheduler_registry\.json|scripts/|src/|include/|\.github/workflows/)' /tmp/changed-files.txt; then
            test -n "$PR_BRANCH"
            echo "system_change_pr_branch=$PR_BRANCH"
          fi
