name: V7 alpha-driven maker shadow smoke

on:
  push:
    branches: [research/alpha-driven-maker-shadow]
    paths:
      - scripts/v7_alpha_driven_maker_shadow.py
      - tests/test_v7_alpha_driven_maker_shadow.py
      - deploy/v7-alpha-maker-shadow-smoke-request.json
      - .github/workflows/v7-alpha-maker-shadow-smoke.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: v7-alpha-driven-maker-shadow-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}

      - name: Validate research-only request
        run: |
          python3 - <<'PY'
          import json,re
          v=json.load(open("deploy/v7-alpha-maker-shadow-smoke-request.json"))
          assert v["schema"]=="polymarket_v7_alpha_maker_shadow_smoke_request_v1"
          assert v["version"]==1
          assert re.fullmatch(r"[A-Za-z0-9._:-]{8,128}",v["request_id"])
          assert re.fullmatch(r"i-[0-9a-f]+",v["instance_id"])
          assert 5 <= int(v["duration_seconds"]) <= 120
          assert 100 <= int(v["sample_ms"]) <= 5000
          assert 0 < float(v["quantity_shares"]) <= 20
          assert v["ttl_arms_ms"]==[250,500,1000]
          assert v["markout_horizons_ms"]==[250,500,1000,2000,5000]
          assert v["paper_only"] is True
          assert v["authenticated_execution"] is False
          assert v["real_order_submission"] is False
          assert v["real_capital_at_risk"] is False
          assert v["automatic_promotion"] is False
          PY

      - name: Unit test shadow safety
        run: |
          PYTHONPATH=scripts python3 tests/test_v7_alpha_driven_maker_shadow.py
          python3 -m py_compile scripts/v7_alpha_driven_maker_shadow.py

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: polymarket-alpha-maker-shadow
          aws-region: eu-west-2

      - name: Run bounded zero-authority shadow on London PAPER evidence
        run: |
          python3 - <<'PY'
          import base64,json,shlex,sys
          from pathlib import Path
          sys.path.insert(0,"ops")
          from v7_london_ssm_deploy import run, REGION

          req=json.load(open("deploy/v7-alpha-maker-shadow-smoke-request.json"))
          instance=req["instance_id"]
          payload=base64.b64encode(Path("scripts/v7_alpha_driven_maker_shadow.py").read_bytes()).decode()
          request_id=req["request_id"]
          ttls=",".join(str(x) for x in req["ttl_arms_ms"])
          marks=",".join(str(x) for x in req["markout_horizons_ms"])
          duration=float(req["duration_seconds"])
          sample=int(req["sample_ms"])
          quantity=float(req["quantity_shares"])
          remote=f"""set -euo pipefail
          UNIT=polymarket-v7-paper.service
          systemctl is-active --quiet "$UNIT"
          ENVIRONMENT="$(systemctl show "$UNIT" -p Environment --value)"
          ROOT="$(printf '%s' "$ENVIRONMENT" | python3 -c 'import shlex,sys;v=shlex.split(sys.stdin.read());print(next(x.split("=",1)[1] for x in v if x.startswith("PM_V7_RUN_ROOT=")))')"
          APP="$(printf '%s' "$ENVIRONMENT" | python3 -c 'import shlex,sys;v=shlex.split(sys.stdin.read());print(next(x.split("=",1)[1] for x in v if x.startswith("POLYMARKET_APP_DIR=")))')"
          SHA="$(printf '%s' "$ENVIRONMENT" | python3 -c 'import shlex,sys;v=shlex.split(sys.stdin.read());print(next(x.split("=",1)[1] for x in v if x.startswith("POLYMARKET_EXPECTED_SHA=")))')"
          test -d "$APP"
          test -d "$ROOT"
          test -x "$APP/build/polymarket_v7_maker_research_replay"
          test -s "$ROOT/research/repricing_book/book_observations/current.jsonl"
          test -s "$ROOT/research/repricing_book/fillability_ws_status.json"
          OUT="/tmp/{request_id}"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          printf '%s' {shlex.quote(payload)} | base64 -d > "$OUT/v7_alpha_driven_maker_shadow.py"
          cd "$APP"
          PYTHONPATH="$APP/scripts:$APP" python3 "$OUT/v7_alpha_driven_maker_shadow.py" \
            --run-root "$ROOT" \
            --book-tape "$ROOT/research/repricing_book/book_observations/current.jsonl" \
            --book-status "$ROOT/research/repricing_book/fillability_ws_status.json" \
            --binary "$APP/build/polymarket_v7_maker_research_replay" \
            --model-sha "$SHA" \
            --output "$OUT/shadow.jsonl" \
            --status "$OUT/status.json" \
            --duration-seconds {duration} \
            --sample-ms {sample} \
            --quantity-shares {quantity} \
            --ttl-arms-ms {shlex.quote(ttls)} \
            --markout-horizons-ms {shlex.quote(marks)}
          echo SHADOW_STATUS_BEGIN
          cat "$OUT/status.json"
          echo SHADOW_STATUS_END
          echo SHADOW_ROWS="$(wc -l < "$OUT/shadow.jsonl")"
          """
          stdout,stderr=run(REGION,instance,remote,240)
          print(stdout)
          if stderr:
              print(stderr,file=sys.stderr)
          PY
