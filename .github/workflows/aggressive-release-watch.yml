name: Aggressive V5 Release Watch

on:
  workflow_run:
    workflows: ["Release Aggressive V5 Runtime"]
    types: [completed]

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: aggressive-v5-release-watch
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish release status
        shell: bash
        run: |
          set -euo pipefail
          conclusion='${{ github.event.workflow_run.conclusion }}'
          run_id='${{ github.event.workflow_run.id }}'
          attempt='${{ github.event.workflow_run.run_attempt }}'
          head_sha='${{ github.event.workflow_run.head_sha }}'
          now="$(date +%s)"
          status="$(jq -n \
            --arg conclusion "$conclusion" \
            --arg run_id "$run_id" \
            --arg attempt "$attempt" \
            --arg head_sha "$head_sha" \
            --argjson generated_ts "$now" \
            '{schema:"aggressive_v5_release_status_v1",generated_ts:$generated_ts,conclusion:$conclusion,run_id:$run_id,run_attempt:($attempt|tonumber),head_sha:$head_sha}')"
          endpoint="repos/${GITHUB_REPOSITORY}/contents/telemetry/aggressive-v5-release-status.json"
          current_sha="$(gh api "${endpoint}?ref=telemetry" --jq .sha 2>/dev/null || true)"
          content="$(base64 -w0 <<<"$status")"
          args=("$endpoint" --method PUT -f message="Update aggressive V5 release status" -f content="$content" -f branch=telemetry)
          if [[ -n "$current_sha" ]]; then args+=(-f sha="$current_sha"); fi
          gh api "${args[@]}" >/dev/null

      - name: Retry failed release
        if: github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.run_attempt < 3
        shell: bash
        run: gh run rerun '${{ github.event.workflow_run.id }}' --repo "$GITHUB_REPOSITORY" --failed

      - name: Open incident after repeated failure
        if: github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.run_attempt >= 3
        shell: bash
        run: |
          set -euo pipefail
          title="Aggressive V5 release failed after three attempts"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          body="Release run ${{ github.event.workflow_run.id }} failed on SHA ${{ github.event.workflow_run.head_sha }} after attempt ${{ github.event.workflow_run.run_attempt }}. The production upgrade was not published. Inspect the workflow logs before treating the runtime as healthy."
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
