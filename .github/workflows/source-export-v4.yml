name: source-export-v4

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  edge-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev python3
      - name: Build Release scanners
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Run A B1 B2 and maker paper scan
        run: |
          mkdir -p live-scan-output
          bash scripts/paper_v3_once.sh config/paper_v3.json live-scan-output
      - name: Upload current scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-current-edge-scan
          path: live-scan-output/
          if-no-files-found: warn
          retention-days: 1
