name: source-export-v4

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: tar --exclude=.git --exclude=polymarket-source.tgz -czf /tmp/polymarket-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: polymarket-source-v4
          path: /tmp/polymarket-source.tgz
          retention-days: 1
