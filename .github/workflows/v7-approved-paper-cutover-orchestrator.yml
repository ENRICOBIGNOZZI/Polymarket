name: V7 approved PAPER cutover orchestrator

on:
  pull_request:
    types: [closed]
  push:
    tags:
      - 'v7-paper-cutover-*'

permissions:
  actions: write
  contents: read

concurrency:
  group: v7-approved-paper-cutover
  cancel-in-progress: false

jobs:
  exact-sha-cutover:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.user.login == github.repository_owner &&
       startsWith(github.event.pull_request.title, 'V7 PAPER CUTOVER APPROVED:')) ||
      (github.event_name == 'push' &&
       github.actor == github.repository_owner &&
       github.ref_name == format('v7-paper-cutover-{0}', github.sha))
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      TRIGGER_EVENT: ${{ github.event_name }}
      TRIGGER_REF: ${{ github.ref_name }}
      TRIGGER_ACTOR: ${{ github.actor }}
      REPOSITORY_OWNER: ${{ github.repository_owner }}
    steps:
      - name: Validate explicit owner approval and exact main SHA
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$TRIGGER_EVENT" == "push" ]]; then
            test "$TRIGGER_ACTOR" = "$REPOSITORY_OWNER"
            test "$TRIGGER_REF" = "v7-paper-cutover-$TARGET_SHA"
          fi
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          test "$main_sha" = "$TARGET_SHA"

      - name: Dispatch exact-SHA technical gates
        run: |
          set -euo pipefail
          max_exact_run_id() {
            local workflow="$1"
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&event=workflow_dispatch&per_page=50" \
              --jq "(.workflow_runs | map(select(.head_sha == \"$TARGET_SHA\")) | map(.id) | max) // 0"
          }
          CI_PRIOR_RUN_ID="$(max_exact_run_id ci.yml)"
          MONITORING_PRIOR_RUN_ID="$(max_exact_run_id monitoring.yml)"
          SINGLE_WRITER_PRIOR_RUN_ID="$(max_exact_run_id private-runtime-single-writer-validation.yml)"
          printf 'CI_PRIOR_RUN_ID=%s\nMONITORING_PRIOR_RUN_ID=%s\nSINGLE_WRITER_PRIOR_RUN_ID=%s\n' \
            "$CI_PRIOR_RUN_ID" "$MONITORING_PRIOR_RUN_ID" "$SINGLE_WRITER_PRIOR_RUN_ID" >> "$GITHUB_ENV"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main -f expected_sha="$TARGET_SHA"
          gh workflow run monitoring.yml --repo "$GITHUB_REPOSITORY" --ref main -f expected_sha="$TARGET_SHA"
          gh workflow run private-runtime-single-writer-validation.yml \
            --repo "$GITHUB_REPOSITORY" --ref main -f expected_sha="$TARGET_SHA"

      - name: Require all exact-SHA gates green
        run: |
          set -euo pipefail
          wait_for_workflow() {
            local workflow="$1" label="$2" prior_run_id="$3" selected="" state=""
            for _ in $(seq 1 150); do
              selected="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&event=workflow_dispatch&per_page=50" \
                --jq ".workflow_runs | map(select(.head_sha == \"$TARGET_SHA\" and .id > $prior_run_id)) | sort_by(.id) | last | [.id,.status,(.conclusion // \"\")] | @tsv")"
              if [[ -n "$selected" ]]; then
                IFS=$'\t' read -r run_id state conclusion <<< "$selected"
                if [[ "$state" == "completed" ]]; then
                  if [[ "$conclusion" == "success" ]]; then
                    printf '%s_run_id=%s\n' "$label" "$run_id" >> "$GITHUB_STEP_SUMMARY"
                    return 0
                  fi
                  gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed || true
                  echo "$label exact-SHA gate failed: run=$run_id conclusion=$conclusion" >&2
                  return 1
                fi
              fi
              sleep 10
            done
            echo "$label exact-SHA gate timed out" >&2
            return 1
          }
          wait_for_workflow ci.yml ci "$CI_PRIOR_RUN_ID"
          wait_for_workflow monitoring.yml monitoring "$MONITORING_PRIOR_RUN_ID"
          wait_for_workflow private-runtime-single-writer-validation.yml single_writer "$SINGLE_WRITER_PRIOR_RUN_ID"

      - name: Dispatch canonical approved exact-main validation
        run: |
          set -euo pipefail
          prior_run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/v7-live-paper-validation.yml/runs?branch=main&event=workflow_dispatch&per_page=50" \
            --jq "(.workflow_runs | map(select(.head_sha == \"$TARGET_SHA\")) | map(.id) | max) // 0")"
          [[ "$prior_run_id" =~ ^[0-9]+$ ]]
          gh workflow run v7-live-paper-validation.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f expected_sha="$TARGET_SHA"
          validation_complete=0
          for _ in $(seq 1 240); do
            selected="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/v7-live-paper-validation.yml/runs?branch=main&event=workflow_dispatch&per_page=50" \
              --jq ".workflow_runs | map(select(.head_sha == \"$TARGET_SHA\" and .id > $prior_run_id)) | sort_by(.id) | last | [.id,.status,(.conclusion // \"\")] | @tsv")"
            if [[ -n "$selected" ]]; then
              IFS=$'\t' read -r run_id state conclusion <<< "$selected"
              if [[ "$state" == "completed" ]]; then
                if [[ "$conclusion" != "success" ]]; then
                  gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed || true
                  exit 1
                fi
                echo "paper_validation_run_id=$run_id" >> "$GITHUB_STEP_SUMMARY"
                validation_complete=1
                break
              fi
            fi
            sleep 10
          done
          test "$validation_complete" = 1
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          test "$main_sha" = "$TARGET_SHA"

      - name: Dispatch canonical PAPER server deploy
        run: |
          set -euo pipefail
          prior_run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/v7-deploy-paper-server.yml/runs?branch=main&event=workflow_dispatch&per_page=50" \
            --jq "(.workflow_runs | map(select(.head_sha == \"$TARGET_SHA\")) | map(.id) | max) // 0")"
          [[ "$prior_run_id" =~ ^[0-9]+$ ]]
          gh workflow run v7-deploy-paper-server.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f expected_sha="$TARGET_SHA" -f cutover_approved=true
          for _ in $(seq 1 300); do
            selected="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/v7-deploy-paper-server.yml/runs?branch=main&event=workflow_dispatch&per_page=50" \
              --jq ".workflow_runs | map(select(.head_sha == \"$TARGET_SHA\" and .id > $prior_run_id)) | sort_by(.id) | last | [.id,.status,(.conclusion // \"\")] | @tsv")"
            if [[ -n "$selected" ]]; then
              IFS=$'\t' read -r run_id state conclusion <<< "$selected"
              if [[ "$state" == "completed" ]]; then
                if [[ "$conclusion" != "success" ]]; then
                  gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed || true
                  exit 1
                fi
                echo "paper_deploy_run_id=$run_id" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "canonical PAPER deploy timed out" >&2
          exit 1

      - name: Dispatch exact-SHA PAPER server health
        run: |
          set -euo pipefail
          prior_run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/v7-paper-server-health.yml/runs?branch=main&event=workflow_dispatch&per_page=50" \
            --jq "(.workflow_runs | map(select(.head_sha == \"$TARGET_SHA\")) | map(.id) | max) // 0")"
          [[ "$prior_run_id" =~ ^[0-9]+$ ]]
          gh workflow run v7-paper-server-health.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f expected_sha="$TARGET_SHA"
          for _ in $(seq 1 180); do
            selected="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/v7-paper-server-health.yml/runs?branch=main&event=workflow_dispatch&per_page=50" \
              --jq ".workflow_runs | map(select(.head_sha == \"$TARGET_SHA\" and .id > $prior_run_id)) | sort_by(.id) | last | [.id,.status,(.conclusion // \"\")] | @tsv")"
            if [[ -n "$selected" ]]; then
              IFS=$'\t' read -r run_id state conclusion <<< "$selected"
              if [[ "$state" == "completed" ]]; then
                if [[ "$conclusion" != "success" ]]; then
                  gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed || true
                  exit 1
                fi
                echo "paper_health_run_id=$run_id" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "exact-SHA PAPER server health timed out" >&2
          exit 1

      - name: Start proven-merged branch cleanup
        if: success()
        run: |
          gh workflow run v7-merged-branch-hygiene.yml --repo "$GITHUB_REPOSITORY" --ref main -f apply=true
