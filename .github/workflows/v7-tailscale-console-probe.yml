name: V7 Tailscale console read-only probe

on:
  push:
    branches:
      - ops/v7-aws-envelope-probe-20260920
    paths:
      - .github/workflows/v7-tailscale-console-probe.yml
      - scripts/v7_decrypt_tailscale_admin_envelope.py
      - scripts/v7_tailscale_console_probe.mjs
      - deploy/v7-tailscale-admin-envelope.json

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Decrypt short-lived admin envelope
        id: decrypt
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.POLYMARKET_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}"
          key="$RUNNER_TEMP/deploy_key"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          chmod 600 "$key"
          python3 scripts/v7_decrypt_tailscale_admin_envelope.py             --envelope deploy/v7-tailscale-admin-envelope.json             --ssh-private-key "$key"             --github-env "$GITHUB_ENV"             --github-output "$GITHUB_OUTPUT"
          rm -f "$key"
      - name: Install browser driver
        if: steps.decrypt.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome >/dev/null 2>&1
          npm install --no-save --no-package-lock playwright-core@1.55.0 >/dev/null
      - name: Probe Tailscale console without mutations
        if: steps.decrypt.outputs.ready == 'true'
        shell: bash
        env:
          CHROME_BIN: /usr/bin/google-chrome
          V7_TS_CDP_URL: http://127.0.0.1:9222
        run: |
          set -euo pipefail
          command -v Xvfb >/dev/null 2>&1
          export DISPLAY=:99
          Xvfb :99 -screen 0 1440x1000x24 >/tmp/v7-xvfb.log 2>&1 &
          xvfb_pid=$!
          profile="$RUNNER_TEMP/v7-standard-chrome"
          mkdir -p "$profile"
          google-chrome             --remote-debugging-port=9222             --user-data-dir="$profile"             --no-first-run             --no-default-browser-check             --disable-dev-shm-usage             about:blank >/tmp/v7-chrome.log 2>&1 &
          chrome_pid=$!
          cleanup() { kill "$chrome_pid" "$xvfb_pid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 0.1
          done
          test "$ready" = 1
          node scripts/v7_tailscale_console_probe.mjs
