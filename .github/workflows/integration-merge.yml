name: Polymarket Integration Merge

on:
  workflow_dispatch:
  schedule:
    - cron: "3,18,33,48 * * * *"

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: polymarket-integration-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require current main to be publicly paper-validated
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main paper-validated
          main_sha="$(git rev-parse origin/main)"
          validated_sha="$(git rev-parse origin/paper-validated)"
          test "$main_sha" = "$validated_sha"
          test "$(git rev-parse HEAD)" = "$main_sha"
          echo "validated_base_sha=$main_sha"

      - name: Select exactly one controller-authorized integration
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p integration-merge
          gh pr list --state open --base main --limit 100 \
            --label autonomous-promotion-approved \
            --json number,title,url,headRefName,headRefOid,baseRefOid,isDraft,labels,mergeStateStatus,statusCheckRollup,body \
            > integration-merge/authorized.json
          count="$(python3 -c 'import json; print(len(json.load(open("integration-merge/authorized.json"))))')"
          echo "AUTHORIZED_COUNT=$count" >> "$GITHUB_ENV"
          if [[ "$count" -gt 1 ]]; then
            echo 'More than one controller authorization is active; fail closed.' >&2
            exit 1
          fi
          if [[ "$count" -eq 1 ]]; then
            number="$(python3 -c 'import json; print(json.load(open("integration-merge/authorized.json"))[0]["number"])')"
            echo "PR_NUMBER=$number" >> "$GITHUB_ENV"
          fi

      - name: Revalidate authorization against current evidence and base
        if: env.AUTHORIZED_COUNT == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" \
            --json number,title,url,headRefName,headRefOid,baseRefOid,isDraft,labels,mergeStateStatus,statusCheckRollup,body \
            > integration-merge/candidate.json
          source_number="$(python3 - <<'PY'
          import json,re
          body = json.load(open('integration-merge/candidate.json')).get('body') or ''
          match = re.search(r'source research pr/branch/commit:\s*#(\d+)\b', body, re.I)
          print(match.group(1) if match else '')
          PY
          )"
          test -n "$source_number"
          echo "SOURCE_PR_NUMBER=$source_number" >> "$GITHUB_ENV"
          gh pr view "$source_number" \
            --json number,headRefName,headRefOid,isDraft,labels,state,body,statusCheckRollup,comments,reviews \
            > integration-merge/source.json
          gh pr diff "$PR_NUMBER" --name-only > integration-merge/changed-files.txt

          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          base_sha="$(python3 -c 'import json; print(json.load(open("integration-merge/candidate.json"))["baseRefOid"])')"
          test "$base_sha" = "$current_main" || {
            echo "Authorized PR base $base_sha is stale versus main $current_main; wait for fresh checks." >&2
            exit 1
          }

          evidence_path="$(python3 - <<'PY'
          import json,re
          body = json.load(open('integration-merge/candidate.json')).get('body') or ''
          match = re.search(r'promotion evidence file:\s*([^\s`]+\.json)\b', body, re.I)
          print(match.group(1) if match else '')
          PY
          )"
          gate_args=(
            python3 scripts/promotion_gate.py
            --candidate integration-merge/candidate.json
            --source integration-merge/source.json
            --changed-files integration-merge/changed-files.txt
            --alpha-config config/alpha_factory.json
            --policy config/promotion_policy.json
            --report integration-merge/promotion-gate.md
            --json-output integration-merge/promotion-gate.json
            --require-approval-label
          )
          if [[ -n "$evidence_path" ]]; then
            source_sha="$(python3 -c 'import json; print(json.load(open("integration-merge/source.json"))["headRefOid"])')"
            gh api "repos/${GITHUB_REPOSITORY}/contents/${evidence_path}?ref=${source_sha}" \
              --jq .content > integration-merge/evidence.b64
            base64 -d integration-merge/evidence.b64 > integration-merge/evidence.json
            gate_args+=(--evidence integration-merge/evidence.json)
          fi
          "${gate_args[@]}"

          candidate_head="$(python3 -c 'import json; print(json.load(open("integration-merge/candidate.json"))["headRefOid"])')"
          source_head="$(python3 -c 'import json; print(json.load(open("integration-merge/source.json"))["headRefOid"])')"
          python3 - <<'PY' > integration-merge/source-match-files.txt
          import json
          for path in json.load(open('integration-merge/promotion-gate.json')).get('source_content_match_files', []):
              print(path)
          PY
          : > integration-merge/provenance.tsv
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            candidate_blob="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${candidate_head}" --jq .sha 2>/dev/null || echo __missing__)"
            source_blob="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${source_head}" --jq .sha 2>/dev/null || echo __missing__)"
            printf '%s\t%s\t%s\n' "$path" "$candidate_blob" "$source_blob" >> integration-merge/provenance.tsv
            test "$candidate_blob" = "$source_blob" || {
              echo "Economic source-content mismatch: $path" >&2
              exit 1
            }
          done < integration-merge/source-match-files.txt

      - name: Merge controller-authorized automatic paper-champion promotion
        if: env.AUTHORIZED_COUNT == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" \
            --json headRefOid,baseRefOid,mergeStateStatus,labels \
            > integration-merge/candidate-final.json
          expected_head="$(python3 -c 'import json; print(json.load(open("integration-merge/candidate-final.json"))["headRefOid"])')"
          expected_base="$(python3 -c 'import json; print(json.load(open("integration-merge/candidate-final.json"))["baseRefOid"])')"
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          test "$expected_base" = "$current_main"
          test "$(python3 -c 'import json; print(json.load(open("integration-merge/candidate-final.json"))["mergeStateStatus"])')" = CLEAN
          python3 - <<'PY'
          import json
          labels = {x.get('name') for x in json.load(open('integration-merge/candidate-final.json')).get('labels', [])}
          assert 'autonomous-promotion-approved' in labels
          PY

          gh pr merge "$PR_NUMBER" --squash --delete-branch --match-head-commit "$expected_head" \
            | tee integration-merge/merge-result.txt
          merged_sha="$(gh pr view "$PR_NUMBER" --json mergeCommit --jq .mergeCommit.oid)"
          [[ "$merged_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" = "$merged_sha"
          echo "MERGED_SHA=$merged_sha" >> "$GITHUB_ENV"

          python3 - "$merged_sha" "$PR_NUMBER" > integration-merge/integration-dispatch.json <<'PY'
          import json
          import sys
          print(json.dumps({
              'event_type': 'champion-integration-merged',
              'client_payload': {
                  'sha': sys.argv[1],
                  'pr_number': int(sys.argv[2]),
                  'automatic_promotion': True,
              },
          }))
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            --input integration-merge/integration-dispatch.json
          gh pr comment "$PR_NUMBER" --body \
            "Automatically promoted at \`$merged_sha\` after Promotion Controller authorization and immediate fail-closed revalidation. Post-merge exact-SHA validation now owns \`paper-validated\` and deployment. Authenticated real-money execution remains disabled."

      - name: Publish integration action
        if: always()
        shell: bash
        run: |
          echo '## Automatic integration merge' >> "$GITHUB_STEP_SUMMARY"
          echo "- controller-authorized candidates: ${AUTHORIZED_COUNT:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "- merged PR: ${PR_NUMBER:-none}" >> "$GITHUB_STEP_SUMMARY"
          echo "- source research PR: ${SOURCE_PR_NUMBER:-none}" >> "$GITHUB_STEP_SUMMARY"
          echo "- merged SHA: ${MERGED_SHA:-none}" >> "$GITHUB_STEP_SUMMARY"
          cat integration-merge/promotion-gate.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-merge-${{ github.run_id }}
          path: integration-merge/
          if-no-files-found: warn
          retention-days: 30
