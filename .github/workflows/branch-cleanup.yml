name: merged branch cleanup

on:
  pull_request:
    types: [closed]
  push:
    branches: [main]
    paths:
      - deploy/v7-branch-cleanup-request.json
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-merged-pr-branch:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-24.04
    steps:
      - name: Delete merged head branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$HEAD_REF" && "$HEAD_REF" != "main" ]]
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$(python3 -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["HEAD_REF"],safe=""))')"

  prune-contained-branches:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Validate cleanup request
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          value=json.load(open('deploy/v7-branch-cleanup-request.json',encoding='utf-8'))
          assert value.get('schema')=='polymarket_v7_branch_cleanup_request_v1'
          assert value.get('apply') is True
          assert value.get('preserve_open_prs') is True
          assert value.get('prefixes')==['codex/','research/']
          PY

      - name: Delete only fully-contained stale branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          deleted=0
          skipped_open=0
          skipped_divergent=0
          while IFS= read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            [[ "$branch" == "main" || "$branch" == "HEAD" ]] && continue
            case "$branch" in
              codex/*|research/*) ;;
              *) continue ;;
            esac

            open_count="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq 'length')"
            if [[ "$open_count" != "0" ]]; then
              echo "preserve_open_pr=$branch"
              skipped_open=$((skipped_open+1))
              continue
            fi

            if git merge-base --is-ancestor "$ref" origin/main; then
              echo "delete_contained_branch=$branch"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=""))' "$branch")"
              deleted=$((deleted+1))
            else
              echo "preserve_divergent_branch=$branch"
              skipped_divergent=$((skipped_divergent+1))
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/ | sort)
          {
            echo "deleted=$deleted"
            echo "preserved_open_pr=$skipped_open"
            echo "preserved_divergent=$skipped_divergent"
          } >> "$GITHUB_STEP_SUMMARY"
