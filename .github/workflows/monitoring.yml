name: monitoring

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VALIDATION_SHA: ${{ github.event.inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact V7 revision
        run: |
          set -euo pipefail
          [[ "$VALIDATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"
      - name: Validate V7 monitoring only
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests/test_no_legacy_runtime.py \
            tests/test_monitoring_v7_native.py \
            tests/test_monitoring_v7_ledger.py \
            tests/test_monitoring_v7_fill_rate_integrity.py \
            tests/test_monitoring_v7_dashboard_completion.py -v
          python3 -m py_compile monitoring/exporter_v7.py monitoring/v7_ledger_metrics.py
          python3 -m json.tool monitoring/v7_monitoring_manifest.json >/dev/null
          python3 -m json.tool monitoring/grafana/dashboards/polymarket-v7.json >/dev/null
          bash -n ops/apply_v7_monitoring_config_macos.sh
          test -s monitoring/prometheus_v7.yml
          test -s monitoring/v7_alerts.yml
          test -s monitoring/grafana/provisioning/dashboards/v7.yml
          test -s monitoring/grafana/provisioning/datasources/prometheus-v7.yml
