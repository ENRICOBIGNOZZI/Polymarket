name: monitoring

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VALIDATION_SHA: ${{ github.event.inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact V7 revision
        run: |
          set -euo pipefail
          [[ "$VALIDATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"
      - name: Validate V7 monitoring only
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests/test_v7_repository_shape.py \
            tests/test_monitoring_v7_native.py \
            tests/test_monitoring_v7_ledger.py \
            tests/test_monitoring_v7_fill_rate_integrity.py \
            tests/test_monitoring_v7_dashboard_completion.py \
            tests/test_v7_semantic_mapping.py \
            tests/test_v7_external_input_collectors.py \
            tests/test_v7_research_shadow_supervisor.py \
            tests/test_v7_maker_fillability.py \
            tests/test_v7_maker_fillability_monitoring.py -v
          python3 -m py_compile \
            monitoring/exporter_v7.py \
            monitoring/exporter_v7_fillability.py \
            monitoring/v7_ledger_metrics.py \
            monitoring/v7_maker_fillability.py \
            monitoring/v7_maker_fillability_exact.py \
            scripts/v7_semantic_mapping.py \
            scripts/v7_osint_mapping_collector.py \
            scripts/v7_sports_collector.py \
            scripts/v7_cross_platform_collector.py \
            scripts/v7_maker_fillability_report.py
          python3 -m json.tool monitoring/v7_monitoring_manifest.json >/dev/null
          python3 -m json.tool monitoring/grafana/dashboards/polymarket-v7.json >/dev/null
          python3 -m json.tool monitoring/grafana/dashboards/polymarket-v7-maker-fillability.json >/dev/null
          python3 -m json.tool monitoring/grafana/dashboards/polymarket-v7-latency.json >/dev/null
          python3 -m json.tool config/v7_maker_fillability_experiments.json >/dev/null
          python3 -m json.tool config/v7_external_inputs.json >/dev/null
          python3 -m json.tool config/v7_external_mappings.json >/dev/null
          bash -n ops/apply_v7_monitoring_config_macos.sh
          test -s monitoring/prometheus_v7.yml
          test -s monitoring/v7_alerts.yml
          test -s monitoring/grafana/provisioning/dashboards/v7.yml
          test -s monitoring/grafana/provisioning/datasources/prometheus-v7.yml
