name: monitoring

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "14,29,44,59 * * * *"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit SHA to validate; defaults to the event SHA
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: monitoring-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VALIDATION_SHA: ${{ github.event.inputs.expected_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.expected_sha || github.sha }}

      - name: Verify exact validation revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VALIDATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"
          echo "validation_sha=$VALIDATION_SHA"

      - name: Validate latest exporter and total/per-strategy dashboards
        run: |
          python3 -m unittest \
            tests/test_compact_strategy_logs.py \
            tests/test_monitoring_exporter.py \
            tests/test_monitoring_v4_exporter.py \
            tests/test_monitoring_latest_exporter.py \
            tests/test_monitoring_v5_exporter.py \
            tests/test_v4_monitoring_contract.py \
            tests/test_v6_runtime_contract.py \
            tests/test_grafana_fast_paper_contract.py \
            tests/test_grafana_multi_strategy_contract.py \
            tests/test_server_health_readonly.py -v
          python3 -m py_compile \
            scripts/compact_strategy_logs.py scripts/v6_runtime_status.py \
            monitoring/exporter.py monitoring/exporter_v4.py \
            monitoring/exporter_v5.py monitoring/exporter_v6.py monitoring/exporter_latest.py
          python3 -m json.tool monitoring/grafana/dashboards/polymarket-latest.json >/dev/null
          python3 -m json.tool monitoring/grafana/dashboards/polymarket-fast-paper.json >/dev/null
          python3 -m json.tool monitoring/grafana/dashboards/polymarket-multi-strategy.json >/dev/null
          python3 -m json.tool config/paper_v6.json >/dev/null
          bash -n scripts/monitoring_up.sh scripts/monitoring_down.sh scripts/v6_live_smoke_once.sh
          docker compose -f docker-compose.monitoring.yml config >/dev/null
