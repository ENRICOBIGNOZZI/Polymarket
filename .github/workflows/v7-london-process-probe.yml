name: V7 London deploy process probe

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-london-process-probe-request.json

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
      INSTANCE_ID: i-04042ca7da7a23215
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate request
        run: |
          python3 - deploy/v7-london-process-probe-request.json <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1]))
          assert v=={"schema":"polymarket_v7_london_process_probe_v1","read_only":True}
          PY
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: polymarket-v7-process-probe
          aws-region: eu-west-2
      - name: Inspect London runtime and quarantine
        run: |
          set -euo pipefail
          echo "=== AWS INSTANCE ==="
          aws ec2 describe-instances --region "$AWS_REGION" --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].{InstanceId:InstanceId,InstanceType:InstanceType,State:State.Name,AvailabilityZone:Placement.AvailabilityZone,PrivateIp:PrivateIpAddress,CpuOptions:CpuOptions}' \
            --output json
          payload="$(cat <<'SH'
          set -euo pipefail
          echo "=== PROMETHEUS SCRAPE DEBUG ==="
          systemctl is-active prometheus.service || true
          systemctl show prometheus.service -p MainPID -p ExecMainStatus -p Result -p Environment --no-pager 2>/dev/null || true
          systemctl cat prometheus.service 2>/dev/null || true
          echo "--- prometheus ready ---"
          curl -sS http://127.0.0.1:9090/-/ready 2>/dev/null || true
          echo
          echo "--- exporter health ---"
          curl -sS http://127.0.0.1:9108/healthz 2>/dev/null || true
          echo
          echo "--- exporter sample ---"
          curl -sS http://127.0.0.1:9108/metrics 2>/dev/null | head -40 || true
          echo "--- prometheus targets ---"
          curl -sS http://127.0.0.1:9090/api/v1/targets 2>/dev/null || true
          echo
          echo "--- prometheus up query ---"
          curl -sS --get --data-urlencode 'query=up{job="polymarket-v7"}' http://127.0.0.1:9090/api/v1/query 2>/dev/null || true
          echo
          echo "=== GRAFANA HEALTH ==="
          curl -sS -w '\nHTTP_HEALTH=%{http_code}\n' http://127.0.0.1:3000/api/health || true
          curl -sS -w '\nHTTP_SEARCH=%{http_code}\n' 'http://127.0.0.1:3000/api/search?query=Pure%20Arbitrage' || true
          curl -sS -w '\nHTTP_UID=%{http_code}\n' 'http://127.0.0.1:3000/api/dashboards/uid/polymarket-v7-pure-arb' || true
          echo "=== CPU VISIBILITY ==="
          echo "nproc=$(nproc 2>/dev/null || true) nproc_all=$(nproc --all 2>/dev/null || true)"
          lscpu -e=CPU,ONLINE,NODE,CORE,SOCKET 2>/dev/null || true
          main_pid="$(systemctl show polymarket-v7-paper.service -p MainPID --value 2>/dev/null || true)"
          echo "paper_main_pid=$main_pid"
          if [[ "$main_pid" =~ ^[1-9][0-9]*$ ]]; then
            taskset -pc "$main_pid" 2>/dev/null || true
            grep -E '^(Cpus_allowed|Cpus_allowed_list):' "/proc/$main_pid/status" 2>/dev/null || true
          fi
          echo -n "service_cpuset_effective="
          cat /sys/fs/cgroup/system.slice/polymarket-v7-paper.service/cpuset.cpus.effective 2>/dev/null || true
          echo -n "root_cpuset_effective="
          cat /sys/fs/cgroup/cpuset.cpus.effective 2>/dev/null || true
          systemctl show polymarket-v7-paper.service -p AllowedCPUs -p CPUAccounting -p CPUWeight --no-pager 2>/dev/null || true
          echo "=== SYSTEMD CPU POLICY ==="
          systemctl cat polymarket-v7-paper.service 2>/dev/null || true
          systemctl show polymarket-v7-paper.service -p CPUAffinityFromNUMA -p NUMAPolicy -p NUMAMask --no-pager 2>/dev/null || true
          grep -R --line-number -E '^[[:space:]]*(Default)?CPUAffinity=' /etc/systemd/system.conf /etc/systemd/system.conf.d /etc/systemd/system/polymarket-v7-paper.service.d 2>/dev/null || true
          echo "pid1_affinity:"
          taskset -pc 1 2>/dev/null || true
          grep -E '^(Cpus_allowed|Cpus_allowed_list):' /proc/1/status 2>/dev/null || true
          echo "=== LOCKS ==="
          lslocks -o COMMAND,PID,TYPE,MODE,PATH 2>/dev/null | grep -E "polymarket-v7-london-deploy|COMMAND" || true
          echo "=== PROCESSES ==="
          ps -eo pid,ppid,etime,stat,pcpu,pmem,args --sort=-etime | grep -E "v7_runtime_supervisor|v7_maker_fillability_observer|paper_v7_execution_loop|polymarket_v7_e|v7_london_stage_release|v7_london_cutover" | grep -v grep | tail -120 || true
          echo "=== SERVICE ==="
          systemctl is-active polymarket-v7-paper.service || true
          systemctl show polymarket-v7-paper.service -p ActiveEnterTimestamp -p ExecMainStatus -p ExecMainCode -p Result -p MainPID -p Environment --no-pager | head -30 || true
          echo "=== PAPER STATUS ==="
          systemctl --no-pager --full status polymarket-v7-paper.service || true
          echo "=== ENTRYPOINT EXEC DIAGNOSTICS ==="
          ENTRY=/home/ubuntu/polymarket-runtime/current/ops/v7_service_entrypoint.sh
          echo "entry=$ENTRY"
          readlink -f "$ENTRY" || true
          stat -Lc 'mode=%A octal=%a owner=%U group=%G type=%F path=%n' "$ENTRY" 2>&1 || true
          namei -l "$ENTRY" 2>&1 || true
          findmnt -T "$ENTRY" -o TARGET,SOURCE,FSTYPE,OPTIONS -n 2>&1 || true
          sudo -u ubuntu test -r "$ENTRY"; echo "ubuntu_readable=$?" || true
          sudo -u ubuntu test -x "$ENTRY"; echo "ubuntu_executable=$?" || true
          head -1 "$ENTRY" 2>&1 || true
          echo "=== SUPERVISOR CONTROL ==="
          ROOT="$(systemctl show polymarket-v7-paper.service -p Environment --value | python3 -c 'import shlex,sys; print(next(v.split("=",1)[1] for v in shlex.split(sys.stdin.read()) if v.startswith("PM_V7_RUN_ROOT=")))')"
          echo "--- KILL EARLY ---"
          cat "$ROOT/control/KILL" 2>/dev/null || echo ABSENT
          for name in supervisor_status.json supervisor_restarts.json runtime_status.json portfolio_state.json runtime_artifact_receipt.json runtime_resource_plan.json fencing_supervisor_status.json clock_guard.json; do
            echo "--- $name ---"
            cat "$ROOT/control/$name" 2>/dev/null || true
            echo
          done
          echo "--- native_engine_manager_status.summary ---"
          python3 - "$ROOT/control/native_engine_manager_status.json" <<'PYNATIVE'
          import json,sys
          try:
              v=json.load(open(sys.argv[1],encoding="utf-8"))
          except Exception:
              v={}
          keys=("schema","model_sha","state","blocker","active_worker_count","managed_context_count",
                "target_context_count","hot_cpuset","native_observations_written",
                "native_observations_dropped","slow_context_failures","launch_retry_count",
                "pending_settlement_count","paper_only","authenticated_execution","real_order_submission")
          print(json.dumps({k:v.get(k) for k in keys},sort_keys=True))
          PYNATIVE
          echo "=== PURE ARB COLLECTOR DIAGNOSTICS ==="
          for pattern in \
            v7_pure_arb_arrival_survival_shadow.py \
            v7_pure_arb_deep_sizing_shadow.py \
            v7_pure_arb_exchange_execution_shadow.py \
            v7_two_sided_complete_set_shadow.py
          do
            echo "--- process:$pattern ---"
            ps -eo pid=,ppid=,etime=,stat=,args= | grep -F "$pattern" | grep -v -F "grep -F" || true
          done
          PURE="$ROOT/research/repricing_book"
          for name in \
            pure_arb_trades.jsonl \
            pure_arb_arrival_survival_status.json pure_arb_arrival_survival.log \
            pure_arb_deep_sizing_status.json pure_arb_deep_sizing.log \
            exchange_execution_status.json exchange_execution.log \
            capital_allocator_status.json capital_allocator.log
          do
            p="$PURE/$name"
            echo "--- file:$name ---"
            stat -c 'bytes=%s mtime=%y mode=%a owner=%U group=%G' "$p" 2>/dev/null || echo MISSING
            case "$name" in *.json) cat "$p" 2>/dev/null || true;; *.log) tail -30 "$p" 2>/dev/null || true;; esac
          done
          echo "=== PURE ARB COMPACT STATUS ==="
          python3 - "$ROOT/research/repricing_book/pure_arb_status.json" <<'PYPURE'
          import json,sys
          try:
              v=json.load(open(sys.argv[1],encoding="utf-8"))
          except Exception:
              v={}
          keys=("schema","model_sha","state","expected_contexts","fee_ready_contexts","evaluations",
                "fee_blocked_evaluations","cycles_total","paper_locked_pnl_pre_gas_total",
                "conservative_locked_pnl_after_reserve_total","deep_candidates_total",
                "deep_evaluations_total","deep_queue_drops_total","last_decision_compute_ns",
                "max_decision_compute_ns","last_receive_to_decision_ns","max_receive_to_decision_ns")
          print("PURE_ARB_COMPACT="+json.dumps({k:v.get(k) for k in keys},sort_keys=True,separators=(",",":")))
          PYPURE
          echo "=== RETENTION DIAGNOSTICS ==="
          systemctl is-enabled polymarket-v7-retention.timer 2>/dev/null || true
          systemctl is-active polymarket-v7-retention.timer 2>/dev/null || true
          systemctl status polymarket-v7-retention.timer --no-pager -l 2>/dev/null || true
          systemctl status polymarket-v7-retention.service --no-pager -l 2>/dev/null || true
          cat "$ROOT/control/london_buffer_retention_status.json" 2>/dev/null || true
          echo "=== PURE ARB EVIDENCE GROWTH ==="
          python3 - "$ROOT" <<'PYEVID'
          import json,sys,time
          from pathlib import Path
          root=Path(sys.argv[1]); base=root/"research/repricing_book"
          rels=[
            "book_observations/current.jsonl",
            "pure_arb_deep_book_snapshots.jsonl",
            "pure_arb_trades.jsonl",
            "pure_arb_arrival_survival_cycles.jsonl",
            "pure_arb_deep_sizing_cycles.jsonl",
            "exchange_execution_cycles.jsonl",
          ]
          def sample():
              out={}
              for rel in rels:
                  p=base/rel
                  try:
                      st=p.stat()
                      out[rel]={"bytes":st.st_size,"mtime_ns":st.st_mtime_ns}
                  except OSError:
                      out[rel]={"bytes":None,"mtime_ns":None}
              return out
          a=sample(); time.sleep(10); b=sample()
          print(json.dumps({"t0":a,"t1":b,
              "growth":{k:None if a[k]["bytes"] is None or b[k]["bytes"] is None
                        else b[k]["bytes"]-a[k]["bytes"] for k in rels}},sort_keys=True))
          for name in (
              "pure_arb_status.json","pure_arb_arrival_survival_status.json",
              "pure_arb_deep_sizing_status.json","exchange_execution_status.json",
              "fillability_ws_status.json"):
              p=base/name
              try:v=json.loads(p.read_text(encoding="utf-8"))
              except Exception:v={}
              keep=("schema","model_sha","state","cycles","evaluated","candidates","scenarios",
                    "status_window_size","observations","events","paper_only",
                    "authenticated_execution","real_order_submission")
              print(name+"="+json.dumps({k:v.get(k) for k in keep if k in v},sort_keys=True))
          PYEVID
          echo "=== FATAL CHILD LOG TAILS ==="
          for rel in \
            public_https_proxy.log \
            external_fair/rtds_monitor.log \
            external_fair/external_assets_supervisor.log \
            universe/collector.log \
            clock_guard.log \
            fencing_supervisor.log \
            trade_recorder.log \
            ledger_router.log \
            native_engine_manager.log \
            native_crypto_settlement_engine.log \
            canonical_economics.log \
            portfolio_guard.log
          do
            path="$ROOT/$rel"
            echo "--- $rel ---"
            if [[ -f "$path" ]]; then
              stat -c 'mtime=%y bytes=%s' "$path" 2>/dev/null || true
              tail -80 "$path" 2>/dev/null || true
            else
              echo MISSING
            fi
          done
          echo "=== RUN ROOT BOOTSTRAP MATERIAL ==="
          find "$ROOT" -maxdepth 3 \( -type f -o -type l \) -printf '%P\n' 2>/dev/null | sort | head -400 || true
          echo "--- bootstrap_receipt ---"
          cat "$ROOT/bootstrap_receipt.json" 2>/dev/null || true
          echo
          echo "--- runtime_status ---"
          cat "$ROOT/control/runtime_status.json" 2>/dev/null || true
          echo "--- deployed_sha ---"
          cat "$ROOT/control/deployed_sha" 2>/dev/null || true
          echo "--- cutover_lineage ---"
          cat "$ROOT/control/cutover_lineage.json" 2>/dev/null || true
          echo "--- ledger bytes ---"
          wc -c "$ROOT/ledger/execution.jsonl" 2>/dev/null || true
          echo "--- spool files ---"
          find "$ROOT/ledger/spool" -type f -printf '%P %s\n' 2>/dev/null | sort | head -100 || true
          echo "=== FATAL CHILD LOG TAILS ==="
          for rel in \
            public_https_proxy.log \
            external_fair/rtds_monitor.log \
            external_fair/external_assets_supervisor.log \
            universe/collector.log \
            clock_guard.log \
            fencing_supervisor.log \
            trade_recorder.log \
            ledger_router.log \
            native_engine_manager.log \
            canonical_economics.log \
            portfolio_guard.log
          do
            echo "--- $rel ---"
            tail -80 "$ROOT/$rel" 2>/dev/null || true
          done
          echo "=== ACTIVE MODEL IDENTITY ==="
          python3 - "$ROOT/control/runtime_artifact_receipt.json" "$ROOT/micro_maker/execution_model.json" <<'PYMODEL'
          import hashlib,json,sys
          from pathlib import Path
          rp,mp=map(Path,sys.argv[1:3])
          if not mp.is_file():
              print(json.dumps({"maker_model_present":False},sort_keys=True)); raise SystemExit(0)
          m=json.loads(mp.read_text())
          r=json.loads(rp.read_text()) if rp.is_file() else {}
          ignored={"version","generated_ts_ms","model_sha","code_sha","training_source_model_shas","training_window","validation_window"}
          payload={k:v for k,v in m.items() if k not in ignored}
          mh=hashlib.sha256(json.dumps(payload,sort_keys=True,separators=(",",":"),ensure_ascii=True,allow_nan=False).encode()).hexdigest()
          rich_state=str(r.get("rich_model_state") or "UNAVAILABLE")
          rich_hash=r.get("rich_model_hash")
          ident_payload={"maker_economic_sha256":mh,"rich_state":rich_state,"rich_model_hash":rich_hash}
          eid=hashlib.sha256(json.dumps(ident_payload,sort_keys=True,separators=(",",":"),ensure_ascii=True,allow_nan=False).encode()).hexdigest()
          print(json.dumps({"maker_model_present":True,"maker_model_sha":m.get("model_sha"),"maker_model_state":m.get("model_state"),
                            "maker_policy_hash":m.get("policy_hash"),"maker_config_hash":m.get("config_hash"),
                            "maker_economic_sha256":mh,"runtime_artifact_receipt_present":rp.is_file(),
                            "rich_model_state":rich_state,"rich_model_path":r.get("rich_model_path"),
                            "economic_model_identity_sha256":eid},sort_keys=True,separators=(",",":")))
          PYMODEL
          echo "--- KILL ---"
          if [[ -e "$ROOT/control/KILL" ]]; then
            ls -l "$ROOT/control/KILL"
            cat "$ROOT/control/KILL" || true
          else
            echo ABSENT
          fi
          echo "=== PAPER JOURNAL ==="
          journalctl -u polymarket-v7-paper.service -n 160 --no-pager || true
          SH
          )"
          encoded="$(printf '%s' "$payload" | base64 -w0)"
          wrapped="printf '%s' '$encoded' | base64 -d | bash"
          params="$(python3 -c 'import json,sys; print(json.dumps({"commands":[sys.argv[1]],"executionTimeout":["90"]},separators=(",",":")))' "$wrapped")"
          cid=""
          for delay in 2 4 8 12 16; do
            cid="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --parameters "$params" --comment "Polymarket V7 read-only process probe" --region "$AWS_REGION" --query 'Command.CommandId' --output text 2>/dev/null || true)"
            if [[ -n "$cid" && "$cid" != "None" ]]; then break; fi
            sleep "$delay"
          done
          [[ -n "$cid" && "$cid" != "None" ]]
          for i in $(seq 1 60); do
            status="$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query Status --output text 2>/dev/null || true)"
            if [[ "$status" == "Success" ]]; then
              aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query StandardOutputContent --output text
              exit 0
            fi
            case "$status" in Failed|Cancelled|TimedOut)
              aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query StandardErrorContent --output text >&2 || true
              exit 1;;
            esac
            sleep 2
          done
          exit 1
