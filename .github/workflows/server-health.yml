name: paper-server-health

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/server-health.yml"
  workflow_run:
    workflows: ["deploy-paper-server", "Grafana Permanent Access"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read

concurrency:
  group: polymarket-paper-server
  cancel-in-progress: false

jobs:
  health:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SERVER_HOST: ${{ vars.POLYMARKET_SERVER_HOST || '100.104.183.109' }}
      SERVER_USER: ${{ vars.POLYMARKET_SERVER_USER || 'enrico' }}
      SERVER_PORT: ${{ vars.POLYMARKET_SERVER_PORT || '22' }}
      GRAFANA_HOSTNAME: mamma-portfolio
      GRAFANA_FQDN: mamma-portfolio.tail1bae85.ts.net
      GRAFANA_URL: http://mamma-portfolio.tail1bae85.ts.net
    steps:
      - name: Select existing Tailscale credential mode
        id: tailscale_auth
        shell: bash
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TS_TAGS: ${{ vars.TS_TAGS || 'tag:ci' }}
        run: |
          set -euo pipefail
          if [[ -n "${TS_AUTHKEY:-}" ]]; then mode=authkey
          elif [[ -n "${TS_OAUTH_CLIENT_ID:-}" && -n "${TS_OAUTH_SECRET:-}" ]]; then
            test -n "${TS_TAGS:-}" || { echo "OAuth credentials visible but TS_TAGS empty" >&2; exit 1; }
            mode=oauth
          else
            echo "No visible Tailscale credential set" >&2; exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Join private tailnet with auth key
        if: steps.tailscale_auth.outputs.mode == 'authkey'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: ${{ env.SERVER_HOST }}

      - name: Join private tailnet with OAuth
        if: steps.tailscale_auth.outputs.mode == 'oauth'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TS_TAGS || 'tag:ci' }}
          ping: ${{ env.SERVER_HOST }}

      - name: Configure SSH identity
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.POLYMARKET_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}" || { echo "missing POLYMARKET_SERVER_SSH_KEY" >&2; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/polymarket_deploy
          chmod 600 ~/.ssh/polymarket_deploy
          ssh-keyscan -T 5 -p "$SERVER_PORT" "$SERVER_HOST" > ~/.ssh/known_hosts

      - name: Verify V7 Grafana route
        shell: bash
        run: |
          set -euo pipefail
          tailscale ping --until-direct=false --c 1 --timeout=10s "$GRAFANA_HOSTNAME"
          getent hosts "$GRAFANA_FQDN"
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-all-errors "$GRAFANA_URL/api/health" | tee grafana-health.json
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$GRAFANA_URL/api/search" > grafana-search.json
          python3 - <<'PY'
          import json
          dashboards=json.load(open('grafana-search.json', encoding='utf-8'))
          assert any(item.get('uid') == 'polymarket-v7-paper' for item in dashboards), dashboards
          PY

      - name: Inspect exact deployed V7 PAPER runtime
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/polymarket_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=10 -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE' | tee server-health.txt
          set -euo pipefail
          fail(){ printf 'health_failure=%s\n' "$1" >&2; exit 1; }
          exactly_one(){ local pattern="$1" label="$2" count; count="$(pgrep -f "$pattern" 2>/dev/null | wc -l | tr -d ' ')"; [[ "$count" == "1" ]] || fail "$label:$count"; printf '%s=1\n' "$label"; }

          cd ~/polymarket
          printf 'timestamp=%s\nos=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$(uname -s)"
          head_sha="$(git rev-parse HEAD)"
          git fetch -q origin main paper-validated
          main_sha="$(git rev-parse origin/main)"
          validated_sha="$(git rev-parse origin/paper-validated)"
          printf 'head=%s\norigin_main=%s\npaper_validated=%s\n' "$head_sha" "$main_sha" "$validated_sha"
          [[ "$head_sha" == "$validated_sha" ]] || fail deployed_head_not_paper_validated
          git merge-base --is-ancestor "$validated_sha" "$main_sha" || fail validated_not_ancestor_of_main

          champion_meta="$(python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('config/live_champion.json').read_text())
          print(f"{int(m['version'])}\t{m['run_root']}\t{m['config']}\t{m['loop']}\t{str(m.get('paper_only')).lower()}\t{str(m.get('authenticated_execution')).lower()}")
          PY
          )"
          IFS=$'\t' read -r version run_root_rel config_rel loop_rel paper_only authenticated <<<"$champion_meta"
          [[ "$version" == "7" ]] || fail champion_not_v7
          [[ "$run_root_rel" == "runs/paper_v7_live" ]] || fail v7_run_root_mismatch
          [[ "$config_rel" == "config/paper_v7.json" ]] || fail v7_config_mismatch
          [[ "$loop_rel" == "scripts/paper_v7_loop.sh" ]] || fail v7_loop_mismatch
          [[ "$paper_only" == "true" && "$authenticated" == "false" ]] || fail v7_execution_boundary_mismatch
          run_root="$HOME/polymarket/$run_root_rel"
          printf 'champion_version=7\nchampion_run_root=%s\n' "$run_root_rel"

          curl -fsS http://127.0.0.1:9108/healthz >/dev/null || fail exporter_healthz
          curl -fsS http://127.0.0.1:9090/-/ready >/dev/null || fail prometheus_ready
          curl -fsS http://127.0.0.1:3000/api/health >/dev/null || fail grafana_health
          grafana_search="$(curl -fsS http://127.0.0.1:3000/api/search)" || fail grafana_search
          grep -q 'polymarket-v7-paper' <<<"$grafana_search" || fail grafana_v7_dashboard_missing

          metrics="$(curl -fsS http://127.0.0.1:9108/metrics)" || fail exporter_metrics
          grep -q '^polymarket_runtime_info{adapter="v7",run_root="paper_v7_live",version="v7"} 1$' <<<"$metrics" || fail runtime_info_schema
          grep -q '^polymarket_v7_runtime_info 1$' <<<"$metrics" || fail v7_exporter_info
          grep -q '^polymarket_runtime_pnl_usd ' <<<"$metrics" || fail runtime_pnl_metric
          grep -q '^polymarket_runtime_equity_usd ' <<<"$metrics" || fail runtime_equity_metric
          grep -q '^polymarket_allocator_state_present 1$' <<<"$metrics" || fail allocator_state_metric
          grep -q '^polymarket_allocator_models_expected 5$' <<<"$metrics" || fail allocator_models_expected
          grep -q '^polymarket_allocator_models_alive 5$' <<<"$metrics" || fail allocator_models_alive
          grep -q '^polymarket_model_info{' <<<"$metrics" || fail per_strategy_metrics

          test -s "$run_root/v7_supervisor.json" || fail v7_supervisor_missing
          test -s "$run_root/execution/runtime_status.json" || fail v7_runtime_status_missing
          test -s "$run_root/execution/allocator_status.json" || fail v7_allocator_status_missing
          test -s "$run_root/execution/strategy_status.csv" || fail v7_strategy_status_missing
          test -s "$run_root/execution/hard_arb/status.json" || fail v7_hard_arb_status_missing
          python3 - "$run_root" <<'PY'
          import csv,json,sys,time
          from pathlib import Path
          root=Path(sys.argv[1])
          supervisor=json.loads((root/'v7_supervisor.json').read_text())
          runtime=json.loads((root/'execution'/'runtime_status.json').read_text())
          allocator=json.loads((root/'execution'/'allocator_status.json').read_text())
          rows=list(csv.DictReader((root/'execution'/'strategy_status.csv').open()))
          assert supervisor.get('execution_alive') is True, supervisor
          assert supervisor.get('shadow_alive') is True, supervisor
          assert runtime.get('version') == 7, runtime
          assert runtime.get('paper_only') is True, runtime
          assert runtime.get('authenticated_execution') is False, runtime
          assert float(runtime.get('drawdown', 1.0)) <= 0.15 + 1e-12, runtime
          assert time.time()-float(runtime['timestamp']) <= 180, runtime
          assert int(allocator.get('models_expected', 0)) == 5, allocator
          assert int(allocator.get('models_alive', 0)) == 5, allocator
          assert {row['name'] for row in rows} == {'micro_maker','micro_taker','relative_value','hard_arb','external'}, rows
          PY

          exactly_one 'scripts/paper_v7_loop.sh' v7_supervisor_processes
          exactly_one 'polymarket_trade_recorder.*paper_v7_live/execution' v7_recorder_processes
          exactly_one 'v7_multileg_broker_runner.py' v7_broker_processes
          exactly_one 'v7_market_proxy.py' v7_market_proxy_processes
          if pgrep -f 'paper_v[3-6]|scripts/v6_' >/dev/null 2>&1; then fail legacy_runtime_process_present; fi
          printf 'legacy_runtime_processes=0\n'

          case "$(uname -s)" in
            Darwin)
              bash ops/macos_service_control.sh status || fail macos_service_status
              /bin/launchctl print system/com.polymarket.autoupdate >/dev/null 2>&1 || true
              ;;
            Linux)
              systemctl is-active --quiet polymarket-paper.service || fail linux_paper_service
              systemctl is-active --quiet polymarket-monitoring.service || fail linux_monitoring_service
              ;;
            *) fail unsupported_server_os ;;
          esac

          python3 scripts/runtime_action_report.py \
            --run-root "$run_root/execution" --external-signals "$run_root/execution/external_signals.csv" \
            --window-seconds 3600 --production-edge 0.00005 \
            --output-json "$run_root/execution/action_report.json" \
            --output-markdown "$run_root/execution/action_report.md" >/dev/null || true
          printf 'health_result=success\n'
          REMOTE

      - name: Publish health summary
        if: always()
        shell: bash
        run: |
          {
            echo '## V7 paper server health'
            echo '```text'
            cat server-health.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-paper-server-health-${{ github.run_id }}
          path: |
            server-health.txt
            grafana-health.json
            grafana-search.json
          if-no-files-found: warn
          retention-days: 7
