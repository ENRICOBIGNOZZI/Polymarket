name: paper-server-health

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/server-health.yml"
  workflow_run:
    workflows: ["deploy-paper-server", "Grafana Permanent Access"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read

concurrency:
  group: polymarket-paper-server
  cancel-in-progress: false

jobs:
  health:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SERVER_HOST: ${{ vars.POLYMARKET_SERVER_HOST || '100.104.183.109' }}
      SERVER_USER: ${{ vars.POLYMARKET_SERVER_USER || 'enrico' }}
      SERVER_PORT: ${{ vars.POLYMARKET_SERVER_PORT || '22' }}
      GRAFANA_HOSTNAME: mamma-portfolio
      GRAFANA_FQDN: mamma-portfolio.tail1bae85.ts.net
      GRAFANA_URL: http://mamma-portfolio.tail1bae85.ts.net
    steps:
      - name: Select existing Tailscale credential mode
        id: tailscale_auth
        shell: bash
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TS_TAGS: ${{ vars.TS_TAGS || 'tag:ci' }}
        run: |
          set -euo pipefail
          if [[ -n "${TS_AUTHKEY:-}" ]]; then mode=authkey
          elif [[ -n "${TS_OAUTH_CLIENT_ID:-}" && -n "${TS_OAUTH_SECRET:-}" ]]; then test -n "${TS_TAGS:-}"; mode=oauth
          else echo "No visible Tailscale credential set" >&2; exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Join private tailnet with auth key
        if: steps.tailscale_auth.outputs.mode == 'authkey'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: ${{ env.SERVER_HOST }}

      - name: Join private tailnet with OAuth
        if: steps.tailscale_auth.outputs.mode == 'oauth'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TS_TAGS || 'tag:ci' }}
          ping: ${{ env.SERVER_HOST }}

      - name: Configure SSH identity
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.POLYMARKET_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/polymarket_health
          chmod 600 ~/.ssh/polymarket_health
          ssh-keyscan -T 5 -p "$SERVER_PORT" "$SERVER_HOST" > ~/.ssh/known_hosts

      - name: Verify operator Grafana route
        shell: bash
        run: |
          set -euo pipefail
          tailscale ping --until-direct=false --c 1 --timeout=10s "$GRAFANA_HOSTNAME"
          getent hosts "$GRAFANA_FQDN"
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-all-errors "$GRAFANA_URL/api/health" | tee grafana-health.json
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$GRAFANA_URL/api/search" > grafana-search.json
          python3 - <<'PY'
          import json
          dashboards=json.load(open('grafana-search.json'))
          assert any('polymarket-multi-strategy' in str(item.get('uid') or '') or 'Polymarket' in str(item.get('title') or '') for item in dashboards), dashboards
          PY

      - name: Inspect V7 paper server read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/polymarket_health -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10 \
            -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE' | tee server-health.txt
          set -euo pipefail
          cd ~/polymarket
          printf 'timestamp=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          head_sha="$(git rev-parse HEAD)"
          git fetch -q origin main paper-validated
          main_sha="$(git rev-parse origin/main)"
          validated_sha="$(git rev-parse origin/paper-validated)"
          printf 'head=%s\norigin_main=%s\npaper_validated=%s\n' "$head_sha" "$main_sha" "$validated_sha"
          test "$head_sha" = "$validated_sha"
          git merge-base --is-ancestor "$validated_sha" "$main_sha"

          champion_meta="$(python3 - <<'PY'
          import json
          m=json.load(open('config/live_champion.json'))
          assert int(m['version']) == 7, m
          assert m['loop'] == 'scripts/paper_v7_loop.sh', m
          assert m['config'] == 'config/paper_v7.json', m
          assert m['run_root'] == 'runs/paper_v7_live', m
          print('7\t'+m['run_root'])
          PY
          )"
          IFS=$'\t' read -r version run_root_rel <<<"$champion_meta"
          test "$version" = 7
          run_root="$HOME/polymarket/$run_root_rel"
          execution="$run_root/execution"
          printf 'champion_version=7\nchampion_run_root=%s\n' "$run_root_rel"

          exporter_healthz_file="$(mktemp)"
          trap 'rm -f "$exporter_healthz_file"' EXIT
          exporter_healthz_code="$(curl --silent --show-error --output "$exporter_healthz_file" --write-out '%{http_code}' http://127.0.0.1:9108/healthz || true)"
          printf 'exporter_healthz_http=%s\nexporter_healthz_body_begin\n' "${exporter_healthz_code:-000}"
          cat "$exporter_healthz_file" || true
          printf '\nexporter_healthz_body_end\n'
          exporter_healthz_failed=0
          [[ "$exporter_healthz_code" == "200" ]] || exporter_healthz_failed=1

          curl -fsS http://127.0.0.1:9090/-/ready >/dev/null
          curl -fsS http://127.0.0.1:3000/api/health >/dev/null
          metrics="$(curl -fsS http://127.0.0.1:9108/metrics)"
          grep -q '^polymarket_runtime_info{adapter="v7",run_root="paper_v7_live",version="v7"} 1$' <<<"$metrics"
          grep -q '^polymarket_v7_runtime_info 1$' <<<"$metrics"
          grep -q '^polymarket_runtime_pnl_usd ' <<<"$metrics"
          grep -q '^polymarket_runtime_equity_usd ' <<<"$metrics"
          grep -q '^polymarket_allocator_state_present 1$' <<<"$metrics"
          grep -q '^polymarket_allocator_models_expected 5$' <<<"$metrics"
          grep -q '^polymarket_allocator_models_alive 5$' <<<"$metrics"
          grep -q '^polymarket_model_info{' <<<"$metrics"

          test -s "$run_root/v7_supervisor.json"
          test -s "$execution/v7_execution_supervisor.json"
          test -s "$execution/runtime_status.json"
          test -s "$execution/allocator_status.json"
          test -s "$execution/strategy_status.csv"
          test -s "$execution/market_proxy_status.json"
          test -s "$execution/trade_recorder.log"
          test -s "$execution/multileg.log"

          python3 - "$run_root" <<'PY'
          import json,sys,time,csv
          from pathlib import Path
          root=Path(sys.argv[1]); ex=root/'execution'; now=time.time()
          sup=json.load(open(root/'v7_supervisor.json'))
          exe=json.load(open(ex/'v7_execution_supervisor.json'))
          runtime=json.load(open(ex/'runtime_status.json'))
          allocator=json.load(open(ex/'allocator_status.json'))
          proxy=json.load(open(ex/'market_proxy_status.json'))
          rows=list(csv.DictReader(open(ex/'strategy_status.csv')))
          assert sup['execution_alive'] is True and sup['shadow_alive'] is True
          assert now-float(sup['timestamp']) <= 60
          assert exe['paper_only'] is True and now-float(exe['timestamp']) <= 120
          assert runtime['schema'] == 'polymarket_v7_runtime_status_v1'
          assert runtime['version'] == 7 and runtime['paper_only'] is True and runtime['authenticated_execution'] is False
          assert float(runtime['drawdown']) <= 0.15 + 1e-12
          assert allocator['schema'] == 'polymarket_v7_allocator_status_v1'
          assert int(allocator['models_expected']) == 5 and int(allocator['models_alive']) == 5
          assert {r['name'] for r in rows} == {'micro_maker','micro_taker','relative_value','hard_arb','external'}
          assert proxy['schema'] == 'polymarket_v7_market_proxy_status_v1'
          assert now-float(proxy['timestamp']) <= 180
          PY

          printf 'trade_recorder_tail_begin\n'
          tail -n 20 "$execution/trade_recorder.log" || true
          printf 'trade_recorder_tail_end\nmultileg_tail_begin\n'
          tail -n 20 "$execution/multileg.log" || true
          printf 'multileg_tail_end\nhard_arb_tail_begin\n'
          tail -n 20 "$execution/hard_arb.log" || true
          printf 'hard_arb_tail_end\nmicro_taker_tail_begin\n'
          tail -n 20 "$execution/micro_taker.log" || true
          printf 'micro_taker_tail_end\n'

          recorder_tail="$(tail -n 20 "$execution/trade_recorder.log" 2>/dev/null || true)"
          recorder_tail_lines="$(printf '%s\n' "$recorder_tail" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')"
          recorder_success_ticks="$(printf '%s\n' "$recorder_tail" | grep -c '^trade_recorder markets=' || true)"
          recorder_http_failures="$(printf '%s\n' "$recorder_tail" | grep -c '^fatal: HTTP request failed:' || true)"
          recorder_proxy_failures="$(printf '%s\n' "$recorder_tail" | grep -c '^fatal: Gamma markets HTTP 503:' || true)"
          recorder_data_failures=$(( recorder_http_failures + recorder_proxy_failures ))
          printf 'recorder_tail_lines=%s\nrecorder_success_ticks=%s\nrecorder_http_failures=%s\nrecorder_proxy_failures=%s\nrecorder_data_failures=%s\n' "$recorder_tail_lines" "$recorder_success_ticks" "$recorder_http_failures" "$recorder_proxy_failures" "$recorder_data_failures"
          if [[ "$recorder_tail_lines" -ge 5 && "$recorder_success_ticks" -eq 0 && "$recorder_data_failures" -eq "$recorder_tail_lines" ]]; then
            echo "private recorder data path unhealthy: recent recorder tail contains only data failures" >&2
            exit 1
          fi

          latest_runtime_failure() {
            local runtime_tail="$1" success_pattern="$2" last_success last_failure
            last_success="$(printf '%s\n' "$runtime_tail" | grep -nE "$success_pattern" | tail -n1 | cut -d: -f1 || true)"
            last_failure="$(printf '%s\n' "$runtime_tail" | grep -nE 'fatal: Cannot replace state file:|another V7 multi-leg broker already owns|FileNotFoundError:' | tail -n1 | cut -d: -f1 || true)"
            [[ -n "$last_failure" ]] || return 1
            [[ -z "$last_success" || "$last_failure" -ge "$last_success" ]]
          }
          multileg_tail="$(tail -n 20 "$execution/multileg.log" 2>/dev/null || true)"
          hard_arb_tail="$(tail -n 20 "$execution/hard_arb.log" 2>/dev/null || true)"
          micro_taker_tail="$(tail -n 20 "$execution/micro_taker.log" 2>/dev/null || true)"
          if latest_runtime_failure "$multileg_tail" '^multileg_tick '; then echo 'private runtime state integrity unhealthy: multileg' >&2; exit 1; fi
          if latest_runtime_failure "$hard_arb_tail" '^\{.*"equity"'; then echo 'private runtime state integrity unhealthy: hard_arb' >&2; exit 1; fi
          if latest_runtime_failure "$micro_taker_tail" '^\{.*"equity"'; then echo 'private runtime state integrity unhealthy: micro_taker' >&2; exit 1; fi

          status_file="$HOME/.config/polymarket/autoupdate_status.env"
          test -s "$status_file"
          status_ref="$(sed -n 's/^deploy_ref=//p' "$status_file" | head -n1)"
          status_head="$(sed -n 's/^head=//p' "$status_file" | head -n1)"
          status_validated="$(sed -n 's/^validated=//p' "$status_file" | head -n1)"
          test "$status_ref" = "paper-validated"
          test "$status_head" = "$head_sha"
          test "$status_validated" = "$validated_sha"

          case "$(uname -s)" in
            Darwin)
              for label in com.polymarket.awake com.polymarket.paper com.polymarket.exporter com.polymarket.prometheus com.polymarket.grafana; do
                /bin/launchctl print "system/$label" | grep -q 'state = running'
              done
              /bin/launchctl print system/com.polymarket.autoupdate >/dev/null
              ;;
          esac

          if [[ "$exporter_healthz_failed" -ne 0 ]]; then
            echo "private exporter healthz unhealthy: HTTP ${exporter_healthz_code:-000}" >&2
            exit 1
          fi
          echo 'server_health=ok'
          REMOTE

      - name: Publish server health
        if: always()
        run: |
          echo '## V7 paper server health' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat server-health.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-server-health-${{ github.run_id }}
          path: |
            server-health.txt
            grafana-health.json
            grafana-search.json
          if-no-files-found: warn
          retention-days: 7
