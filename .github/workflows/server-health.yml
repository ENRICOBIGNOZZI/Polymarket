name: paper-server-health

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["deploy-paper-server"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read

concurrency:
  group: polymarket-paper-server-health
  cancel-in-progress: true

jobs:
  health:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        vars.POLYMARKET_SERVER_DEPLOY == 'true' &&
        (
          github.event_name == 'schedule' ||
          (
            github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success'
          )
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SERVER_HOST: ${{ vars.POLYMARKET_SERVER_HOST || '100.104.183.109' }}
      SERVER_USER: ${{ vars.POLYMARKET_SERVER_USER || 'enrico' }}
      SERVER_PORT: ${{ vars.POLYMARKET_SERVER_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Load shared scheduler and remote context
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_scheduler_context.py \
            --context config/scheduler_context.json \
            --scheduler-id paper-server-health \
            --server-host "$SERVER_HOST" \
            --server-user "$SERVER_USER" \
            --server-port "$SERVER_PORT" \
            --output scheduler-context.md \
            --output-json scheduler-context.json \
            --github-env "$GITHUB_ENV"

      - name: Join private tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: ${{ env.SERVER_HOST }}

      - name: Configure SSH identity
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.POLYMARKET_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}" || { echo "missing POLYMARKET_SERVER_SSH_KEY" >&2; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/polymarket_deploy
          chmod 600 ~/.ssh/polymarket_deploy
          ssh-keyscan -T 5 -p "$SERVER_PORT" "$SERVER_HOST" > ~/.ssh/known_hosts

      - name: Verify operator Grafana route
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-all-errors \
            "http://$SERVER_HOST:3000/api/health" | tee grafana-health.json
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            "http://$SERVER_HOST:3000/api/search" > grafana-search.json

      - name: Inspect server and write action report
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/polymarket_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=10 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "REMOTE_REPO_REL='$POLYMARKET_REMOTE_REPO_REL' DEPLOYMENT_REF='$POLYMARKET_DEPLOYMENT_REF' SCHEDULER_CONTEXT_SHA='$POLYMARKET_SCHEDULER_CONTEXT_SHA' bash -s" <<'REMOTE' | tee server-health.txt
          set -euo pipefail
          cd "$HOME/$REMOTE_REPO_REL"
          printf 'timestamp=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf 'os=%s\n' "$(uname -s)"
          printf 'scheduler_context_sha=%s\n' "$SCHEDULER_CONTEXT_SHA"
          printf 'remote_repository=%s\n' "$HOME/$REMOTE_REPO_REL"
          printf 'deployment_ref=%s\n' "$DEPLOYMENT_REF"
          head_sha="$(git rev-parse HEAD)"
          git fetch -q origin main "$DEPLOYMENT_REF"
          main_sha="$(git rev-parse origin/main)"
          validated_sha="$(git rev-parse "origin/$DEPLOYMENT_REF")"
          printf 'head=%s\n' "$head_sha"
          printf 'origin_main=%s\n' "$main_sha"
          printf 'paper_validated=%s\n' "$validated_sha"
          printf 'branch=%s\n' "$(git branch --show-current)"
          test "$head_sha" = "$validated_sha"
          git merge-base --is-ancestor "$validated_sha" "$main_sha"

          curl -fsS http://127.0.0.1:9108/healthz >/dev/null
          curl -fsS http://127.0.0.1:9090/-/ready >/dev/null
          curl -fsS http://127.0.0.1:3000/api/health >/dev/null
          curl -fsS http://127.0.0.1:3000/api/search >/dev/null

          metrics="$(curl -fsS http://127.0.0.1:9108/metrics)"
          grep -q '^polymarket_runtime_info' <<<"$metrics"
          printf '%s\n' "$metrics" | grep -E '^polymarket_(runtime_info|runtime_equity_usd|runtime_pnl_usd|runtime_drawdown_ratio|runtime_kill_switch|runtime_realized_pnl_usd_total|runtime_execution_imbalance_ratio|runtime_oos_net_pnl_usd|runtime_oos_stressed_net_pnl_usd|runtime_oos_eligible|trade_recorder_staleness_seconds|multileg_live_bundles)' || true

          run_root="$HOME/$REMOTE_REPO_REL/runs/paper_v4_live"
          supervisor="$run_root/runtime_supervisor.csv"
          test -s "$supervisor"
          supervisor_row="$(tail -n 1 "$supervisor")"
          IFS=, read -r supervisor_ts recorder_alive broker_alive recorder_restarts broker_restarts recorder_pid broker_pid <<<"$supervisor_row"
          now="$(date +%s)"
          test "$recorder_alive" = "1"
          test "$broker_alive" = "1"
          test $(( now - supervisor_ts )) -le 60
          printf 'supervisor_timestamp=%s\n' "$supervisor_ts"
          printf 'recorder_alive=%s\n' "$recorder_alive"
          printf 'broker_alive=%s\n' "$broker_alive"
          printf 'recorder_restarts=%s\n' "$recorder_restarts"
          printf 'broker_restarts=%s\n' "$broker_restarts"
          printf 'recorder_pid=%s\n' "$recorder_pid"
          printf 'broker_pid=%s\n' "$broker_pid"

          python3 scripts/runtime_action_report.py \
            --run-root "$run_root" --external-signals data/external_signals.csv \
            --window-seconds 3600 --production-edge 0.001 \
            --output-json "$run_root/action_report.json" \
            --output-markdown "$run_root/action_report.md" >/dev/null
          test -s "$run_root/action_report.json"
          test -s "$run_root/action_report.md"
          printf '%s\n' 'action_report_begin'
          cat "$run_root/action_report.md"
          printf '%s\n' 'action_report_end'

          printf '%s\n' 'trade_recorder_tail_begin'
          tail -n 20 "$run_root/trade_recorder.log" 2>/dev/null || true
          printf '%s\n' 'trade_recorder_tail_end'
          printf '%s\n' 'multileg_tail_begin'
          tail -n 20 "$run_root/multileg.log" 2>/dev/null || true
          printf '%s\n' 'multileg_tail_end'

          case "$(uname -s)" in
            Darwin)
              sudo -n /usr/local/sbin/polymarket-service-control status
              sudo -n launchctl print system/com.polymarket.autoupdate >/dev/null
              status_file="$HOME/.config/polymarket/autoupdate_status.env"
              test -s "$status_file"
              cat "$status_file"
              checked_ts="$(awk -F= '$1=="checked_ts"{print $2}' "$status_file")"
              deploy_status="$(awk -F= '$1=="status"{print $2}' "$status_file")"
              status_head="$(awk -F= '$1=="head"{print $2}' "$status_file")"
              status_validated="$(awk -F= '$1=="validated"{print $2}' "$status_file")"
              status_ref="$(awk -F= '$1=="deploy_ref"{print $2}' "$status_file")"
              now="$(date +%s)"
              test -n "$checked_ts"
              test $(( now - checked_ts )) -le 900
              case "$deploy_status" in up_to_date|deployed|repaired) ;; *) exit 1 ;; esac
              test "$status_ref" = "$DEPLOYMENT_REF"
              test "$status_head" = "$head_sha"
              test "$status_validated" = "$validated_sha"
              ;;
            Linux)
              systemctl is-active --quiet polymarket-paper.service
              systemctl is-active --quiet polymarket-monitoring.service
              ;;
          esac
          REMOTE

      - name: Fetch structured action report
        shell: bash
        run: |
          set -euo pipefail
          scp -i ~/.ssh/polymarket_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            -P "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST:$POLYMARKET_REMOTE_REPO_REL/runs/paper_v4_live/action_report.md" \
            runtime-action-report.md
          scp -i ~/.ssh/polymarket_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            -P "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST:$POLYMARKET_REMOTE_REPO_REL/runs/paper_v4_live/action_report.json" \
            runtime-action-report.json

      - name: Publish health summary
        if: always()
        shell: bash
        run: |
          cat scheduler-context.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '## Polymarket private paper server' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat server-health.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo 'health output missing' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '## What the system did and why' >> "$GITHUB_STEP_SUMMARY"
          cat runtime-action-report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo 'action report missing' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-server-health-${{ github.run_id }}
          path: |
            scheduler-context.md
            scheduler-context.json
            server-health.txt
            runtime-action-report.md
            runtime-action-report.json
            grafana-health.json
            grafana-search.json
          if-no-files-found: warn
          retention-days: 7
