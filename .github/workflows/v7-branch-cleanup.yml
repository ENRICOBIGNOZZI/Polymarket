name: V7 branch cleanup

on:
  pull_request:
    types:
      - closed
  push:
    branches:
      - main
    paths:
      - deploy/v7-branch-cleanup-request.json
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Delete merged or stale V7 branches
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_MERGED: ${{ github.event.pull_request.merged || false }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
        shell: bash
        run: |
          set -euo pipefail

          delete_branch() {
            local branch="$1"
            [[ -n "$branch" && "$branch" != "main" ]]
            encoded="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=""))' "$branch")"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded"
          }

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$PR_MERGED" == "true" && "$PR_HEAD_REPO" == "$GITHUB_REPOSITORY" && "$PR_HEAD_REF" != "main" ]]; then
              echo "delete_merged_branch=$PR_HEAD_REF"
              delete_branch "$PR_HEAD_REF"
            else
              echo "no_merged_branch_to_delete=true"
            fi
            exit 0
          fi

          force_file="$(mktemp)"
          : > "$force_file"
          if [[ "$EVENT_NAME" == "push" ]]; then
            python3 - "$force_file" <<'PY'
          import json,sys
          value=json.load(open('deploy/v7-branch-cleanup-request.json',encoding='utf-8'))
          assert value.get('schema')=='polymarket_v7_branch_cleanup_request_v1'
          assert value.get('apply') is True
          assert value.get('preserve_open_prs') is True
          assert value.get('prefixes')==['codex/','research/']
          force=value.get('force_delete') or []
          assert isinstance(force,list)
          assert all(isinstance(branch,str) and branch and branch!='main' for branch in force)
          with open(sys.argv[1],'w',encoding='utf-8') as out:
              for branch in force:
                  out.write(branch+'\n')
          PY
          fi

          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          deleted_contained=0
          deleted_abandoned=0
          preserved_open=0
          preserved_divergent=0

          while IFS= read -r branch; do
            [[ -z "$branch" || "$branch" == "main" ]] && continue
            open_count="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq 'length')"
            if [[ "$open_count" != "0" ]]; then
              echo "preserve_force_candidate_open_pr=$branch"
              preserved_open=$((preserved_open+1))
              continue
            fi
            if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              echo "force_delete_abandoned_branch=$branch"
              delete_branch "$branch"
              deleted_abandoned=$((deleted_abandoned+1))
            fi
          done < "$force_file"

          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          while IFS= read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            [[ "$branch" == "main" || "$branch" == "HEAD" ]] && continue
            case "$branch" in
              codex/*|research/*) ;;
              *) continue ;;
            esac

            open_count="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq 'length')"
            if [[ "$open_count" != "0" ]]; then
              echo "preserve_open_pr=$branch"
              preserved_open=$((preserved_open+1))
              continue
            fi

            if git merge-base --is-ancestor "$ref" origin/main; then
              echo "delete_contained_branch=$branch"
              delete_branch "$branch"
              deleted_contained=$((deleted_contained+1))
              continue
            fi

            # Squash merges do not make the original branch tip an ancestor of
            # main. Delete only when a closed merged PR proves that its exact
            # head OID equals the current remote branch tip. Any post-merge
            # commits therefore keep the branch protected.
            tip="$(git rev-parse "$ref")"
            closed_class="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state closed --limit 100 --json headRefOid,mergedAt,title,body | python3 -c '
import json,sys
tip=sys.argv[1]
rows=json.load(sys.stdin)
result="NONE"
for row in rows:
    if row.get("headRefOid") != tip:
        continue
    if row.get("mergedAt"):
        result="MERGED_EXACT"
        break
    text=((row.get("title") or "")+"\n"+(row.get("body") or "")).lower()
    if "superseded" in text:
        result="SUPERSEDED_EXACT"
        break
print(result)
' "$tip")"
            if [[ "$closed_class" == "MERGED_EXACT" ]]; then
              echo "delete_exact_squash_merged_branch=$branch"
              delete_branch "$branch"
              deleted_contained=$((deleted_contained+1))
            elif [[ "$closed_class" == "SUPERSEDED_EXACT" ]]; then
              echo "delete_exact_superseded_branch=$branch"
              delete_branch "$branch"
              deleted_contained=$((deleted_contained+1))
            else
              echo "preserve_divergent_branch=$branch"
              preserved_divergent=$((preserved_divergent+1))
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/ | sort)

          {
            echo "deleted_contained=$deleted_contained"
            echo "deleted_abandoned=$deleted_abandoned"
            echo "preserved_open_pr=$preserved_open"
            echo "preserved_divergent=$preserved_divergent"
          } >> "$GITHUB_STEP_SUMMARY"
