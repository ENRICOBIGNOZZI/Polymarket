name: Arbitrage Theory Hourly Research

on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: arbitrage-theory-hourly
  cancel-in-progress: false

jobs:
  research-cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download same-SHA fast-shadow evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          target_sha="$(git rev-parse HEAD)"
          echo "TARGET_SHA=$target_sha" >> "$GITHUB_ENV"
          gh run list \
            --workflow fast-arb-hourly.yml \
            --branch main \
            --status success \
            --limit 100 \
            --json databaseId,headSha \
            --jq ".[] | select(.headSha == \"$target_sha\") | .databaseId" > evidence/run-ids.txt
          while IFS= read -r run_id; do
            [[ -n "$run_id" ]] || continue
            mkdir -p "evidence/run-$run_id"
            gh run download "$run_id" \
              --name "fast-arb-evidence-$run_id" \
              --dir "evidence/run-$run_id" || true
          done < evidence/run-ids.txt
          TARGET_SHA="$target_sha" python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          valid = 0
          target_sha = os.environ["TARGET_SHA"]
          for status_path in list(Path("evidence").rglob("fast_arb_status.json")):
              try:
                  status = json.loads(status_path.read_text())
                  candidate_path = status_path.parent / "fast_arb_candidate.json"
                  candidate = json.loads(candidate_path.read_text()) if candidate_path.is_file() else {}
              except (OSError, json.JSONDecodeError):
                  status, candidate = {}, {}
              is_valid = (
                  status.get("mode") == "shadow"
                  and status.get("real_order_submission") is False
                  and int(status.get("ws_messages", 0)) > 0
                  and int(status.get("book_updates", 0)) > 0
                  and candidate.get("model_sha") == target_sha
                  and candidate.get("promotion_ready") is False
              )
              if is_valid:
                  valid += 1
              else:
                  shutil.rmtree(status_path.parent, ignore_errors=True)
          print(f"valid same-SHA fast-shadow evidence runs: {valid} sha={target_sha}")
          PY

      - name: Re-derive identities, stress costs and materialize candidate code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research-output/include/pm/generated research-output/config/candidates research-output/docs/generated
          python3 scripts/arb_theory_scheduler.py \
            --evidence-root evidence \
            --base-policy config/fast_arb_policy.json \
            --stress-bps 10 \
            --output-json research-output/config/candidates/fast_arb_candidate.json \
            --output-markdown research-output/docs/generated/fast_arb_theory_report.md \
            --output-header research-output/include/pm/generated/fast_arb_candidate_policy.hpp
          python3 scripts/v7_fast_structural_gate.py \
            --candidate research-output/config/candidates/fast_arb_candidate.json \
            --expected-sha "$TARGET_SHA" \
            --generated-header research-output/include/pm/generated/fast_arb_candidate_policy.hpp
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report_path = Path("research-output/config/candidates/fast_arb_candidate.json")
          report = json.loads(report_path.read_text())
          base_policy = json.loads(Path("config/fast_arb_policy.json").read_text())
          assert report["real_order_submission"] is False
          assert report["candidate_policy"]["real_order_submission"] is False
          assert report["candidate_policy"]["min_net_edge"] >= base_policy["min_net_edge"]
          assert report["model_sha"] == os.environ["TARGET_SHA"]
          assert report["promotion_ready"] is False
          assert "joint_execution_evidence_missing" in report["promotion_gate"]["reasons"]
          with Path("research-output/gates.env").open("w") as handle:
              handle.write(f"RESEARCH_READY={str(report['research_ready']).lower()}\n")
              handle.write("PROMOTION_READY=false\n")
          with Path("research-output/docs/generated/fast_arb_theory_report.md").open("a", encoding="utf-8") as handle:
              handle.write("\n## Authoritative V7 economic promotion gate\n\n")
              handle.write(f"- model_sha: `{report['model_sha']}`\n")
              handle.write(f"- quoted_theory_promotion_ready: `{report['quoted_theory_promotion_ready']}`\n")
              handle.write("- promotion_ready: `false`\n")
              handle.write("- reason: same-SHA realized joint-state PAPER execution evidence is required; quoted snapshot profit cannot promote.\n")
          PY
          cat research-output/gates.env >> "$GITHUB_ENV"
          cat research-output/docs/generated/fast_arb_theory_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update one persistent research issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="[System Watch] Hourly fast-arbitrage theory"
          issue_number="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [[ -z "$issue_number" ]]; then
            gh issue create \
              --title "$title" \
              --body-file research-output/docs/generated/fast_arb_theory_report.md
          else
            gh issue edit "$issue_number" \
              --body-file research-output/docs/generated/fast_arb_theory_report.md
          fi

      - name: Update research-only candidate branch and draft PR
        if: env.RESEARCH_READY == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="research/auto-fast-arb-policy"
          git config user.name "polymarket-system-watch[bot]"
          git config user.email "polymarket-system-watch[bot]@users.noreply.github.com"
          git switch -C "$branch" origin/main
          mkdir -p include/pm/generated config/candidates docs/generated
          cp research-output/include/pm/generated/fast_arb_candidate_policy.hpp \
            include/pm/generated/fast_arb_candidate_policy.hpp
          cp research-output/config/candidates/fast_arb_candidate.json \
            config/candidates/fast_arb_candidate.json
          cp research-output/docs/generated/fast_arb_theory_report.md \
            docs/generated/fast_arb_theory_report.md
          git add include/pm/generated/fast_arb_candidate_policy.hpp \
            config/candidates/fast_arb_candidate.json \
            docs/generated/fast_arb_theory_report.md
          if git diff --cached --quiet; then
            echo "research candidate unchanged"
          else
            git commit -m "Refresh hourly fast-arbitrage research candidate"
          fi
          git push --force origin "HEAD:refs/heads/$branch"

          gh label create shadow-isolated \
            --color fbca04 \
            --description "Measurement-only code isolated from production decisions, PnL and risk" \
            --force
          pr_number="$(gh pr list --state open --head "$branch" --base main --json number --jq '.[0].number // empty')"
          cat > research-output/pr-body.md <<'EOF'
          ## Automated research candidate

          This draft is regenerated from same-SHA hourly read-only/shadow evidence.

          - It updates only generated candidate policy code, candidate evidence, and a research report.
          - It cannot submit orders and does not change `config/live_champion.json`.
          - `research_ready` is only a quoted/depth-walk research pre-screen.
          - `promotion_ready` is fail-closed unless same-SHA realized joint-state PAPER execution evidence exists, includes partial/unwind accounting, and remains positive at 1.5x and 2x cost stress.
          - It must remain a research PR until evidence is reviewed and a separate `integration/*` PR is approved.

          Source research branch: research/auto-fast-arb-policy
          EOF
          if [[ -z "$pr_number" ]]; then
            set +e
            pr_create_output="$(
              gh pr create --draft \
                --base main \
                --head "$branch" \
                --title "research: hourly fast-arbitrage candidate" \
                --body-file research-output/pr-body.md \
                --label shadow-isolated 2>&1
            )"
            pr_create_rc=$?
            set -e
            if (( pr_create_rc != 0 )); then
              if grep -Fq "GitHub Actions is not permitted to create or approve pull requests" <<<"$pr_create_output"; then
                {
                  echo "draft_pr_creation=blocked_by_repository_actions_setting"
                  echo "research_branch=$branch"
                  echo "promotion_authorized=false"
                } | tee research-output/pr-publication-status.txt
                {
                  echo "## Research PR publication"
                  echo
                  echo "GitHub Actions cannot create pull requests under the current repository setting."
                  echo "The research branch and issue evidence were published, but this candidate remains non-promotable until a draft research PR exists through the normal governance path."
                  echo "No production or champion state was changed."
                } >> "$GITHUB_STEP_SUMMARY"
              else
                printf '%s\n' "$pr_create_output" >&2
                exit "$pr_create_rc"
              fi
            else
              printf '%s\n' "$pr_create_output" | tee research-output/pr-publication-status.txt
            fi
          else
            gh pr edit "$pr_number" \
              --body-file research-output/pr-body.md \
              --add-label shadow-isolated
            {
              echo "draft_pr_creation=existing"
              echo "pr_number=$pr_number"
              echo "promotion_authorized=false"
            } > research-output/pr-publication-status.txt
          fi

      - name: Upload theory-cycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arb-theory-cycle-${{ github.run_id }}
          path: research-output
          if-no-files-found: warn
          retention-days: 30
