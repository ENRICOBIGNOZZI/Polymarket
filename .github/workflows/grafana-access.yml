name: Grafana Permanent Access

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ops/apply_runtime_config_macos.sh
      - .github/workflows/grafana-access.yml

permissions:
  contents: write

concurrency:
  group: polymarket-grafana-access
  cancel-in-progress: false

jobs:
  deploy-grafana-access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SERVER_HOST: ${{ vars.POLYMARKET_SERVER_HOST || '100.104.183.109' }}
      SERVER_USER: ${{ vars.POLYMARKET_SERVER_USER || 'enrico' }}
      SERVER_PORT: ${{ vars.POLYMARKET_SERVER_PORT || '22' }}
      GRAFANA_HOSTNAME: mamma-portfolio
      GRAFANA_FQDN: mamma-portfolio.tail1bae85.ts.net
      GRAFANA_URL: http://mamma-portfolio.tail1bae85.ts.net
    steps:
      - uses: actions/checkout@v4

      - name: Join private tailnet
        id: tailnet
        continue-on-error: true
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: ${{ env.SERVER_HOST }}

      - name: Configure SSH identity
        id: ssh
        continue-on-error: true
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.POLYMARKET_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          {
            test -n "${SSH_PRIVATE_KEY:-}" || { echo "POLYMARKET_SERVER_SSH_KEY secret is required" >&2; exit 1; }
            install -d -m 700 ~/.ssh
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/polymarket_grafana
            chmod 600 ~/.ssh/polymarket_grafana
            for i in {1..20}; do
              if ssh-keyscan -T 3 -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
                break
              fi
              sleep 2
            done
            test -s ~/.ssh/known_hosts
          } 2>&1 | tee grafana-ssh.log

      - name: Apply Grafana and Tailscale access only
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            scp -i ~/.ssh/polymarket_grafana -o IdentitiesOnly=yes -o BatchMode=yes \
              -P "$SERVER_PORT" ops/apply_runtime_config_macos.sh \
              "$SERVER_USER@$SERVER_HOST:/tmp/polymarket-apply-grafana.sh"

            ssh -i ~/.ssh/polymarket_grafana -o IdentitiesOnly=yes -o BatchMode=yes \
              -o ConnectTimeout=10 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
              -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "bash -s" <<'REMOTE'
            set -euo pipefail
            chmod 700 /tmp/polymarket-apply-grafana.sh
            POLYMARKET_TAILSCALE_HOSTNAME=mamma-portfolio \
            POLYMARKET_TAILSCALE_FQDN=mamma-portfolio.tail1bae85.ts.net \
            POLYMARKET_GRAFANA_URL=http://mamma-portfolio.tail1bae85.ts.net \
              bash /tmp/polymarket-apply-grafana.sh
            rm -f /tmp/polymarket-apply-grafana.sh

            sudo -n /usr/local/sbin/polymarket-service-control restart

            for i in {1..30}; do
              if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1 && \
                 curl -fsS http://127.0.0.1:3000/api/search >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            curl -fsS http://127.0.0.1:3000/api/health
            curl -fsS http://127.0.0.1:3000/api/search >/dev/null
            grep -F 'root_url = http://mamma-portfolio.tail1bae85.ts.net/' "$HOME/.config/polymarket/grafana.ini"

            TS=/Applications/Tailscale.app/Contents/MacOS/Tailscale
            if [[ ! -x "$TS" ]]; then TS="$(command -v tailscale)"; fi
            "$TS" status || true
            "$TS" serve status || true
          REMOTE
          } 2>&1 | tee grafana-apply.log

      - name: Verify permanent operator URL from another tailnet node
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            tailscale ping -c 3 "$GRAFANA_HOSTNAME"
            getent hosts "$GRAFANA_FQDN"
            for i in {1..30}; do
              if curl -fsS --max-time 5 "$GRAFANA_URL/api/health" >/tmp/grafana-health.json 2>/dev/null; then
                break
              fi
              sleep 2
            done
            cat /tmp/grafana-health.json
            grep -q '"database"' /tmp/grafana-health.json
            curl -fsSI --max-time 5 "$GRAFANA_URL/" | sed -n '1,12p'
            echo "canonical_operator_url=$GRAFANA_URL" | tee -a "$GITHUB_STEP_SUMMARY"
          } 2>&1 | tee grafana-verify.log

      - name: Publish access deployment evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAILNET_OUTCOME: ${{ steps.tailnet.outcome }}
          SSH_OUTCOME: ${{ steps.ssh.outcome }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          def tail(path):
              p=Path(path)
              if not p.exists(): return ''
              return '\n'.join(p.read_text(errors='replace').splitlines()[-80:])
          payload={
              'sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'canonical_url': os.environ['GRAFANA_URL'],
              'tailnet_outcome': os.environ.get('TAILNET_OUTCOME',''),
              'ssh_outcome': os.environ.get('SSH_OUTCOME',''),
              'apply_outcome': os.environ.get('APPLY_OUTCOME',''),
              'verify_outcome': os.environ.get('VERIFY_OUTCOME',''),
              'ssh_log': tail('grafana-ssh.log'),
              'apply_log': tail('grafana-apply.log'),
              'verify_log': tail('grafana-verify.log'),
          }
          Path('grafana-access-status.json').write_text(json.dumps(payload, indent=2))
          PY
          endpoint="repos/${GITHUB_REPOSITORY}/contents/telemetry/grafana-access-status.json"
          content="$(base64 -w0 grafana-access-status.json)"
          current_sha="$(gh api "${endpoint}?ref=telemetry" --jq .sha 2>/dev/null || true)"
          args=("$endpoint" --method PUT -f message="Update Grafana access status" -f content="$content" -f branch=telemetry)
          if [[ -n "$current_sha" ]]; then args+=(-f sha="$current_sha"); fi
          gh api "${args[@]}" >/dev/null
          cat grafana-access-status.json >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce successful private access
        if: always()
        shell: bash
        env:
          TAILNET_OUTCOME: ${{ steps.tailnet.outcome }}
          SSH_OUTCOME: ${{ steps.ssh.outcome }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          test "$TAILNET_OUTCOME" = success
          test "$SSH_OUTCOME" = success
          test "$APPLY_OUTCOME" = success
          test "$VERIFY_OUTCOME" = success
