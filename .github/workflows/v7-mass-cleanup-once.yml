name: V7 one-shot repository cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: v7-one-shot-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'cleanup/v7-only-everywhere-20260827'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply deterministic V7-only cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/v7_mass_cleanup_once.py
          git status --short
      - name: Package cleaned changed files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cleanup-artifact
          mkdir -p cleanup-artifact/tree
          git diff --name-status > cleanup-artifact/name-status.txt
          git diff --binary > cleanup-artifact/cleanup.patch
          git ls-files -s > cleanup-artifact/index.txt
          git diff --name-only --diff-filter=D > cleanup-artifact/deleted.txt
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            [[ -f "$file" ]] || continue
            mkdir -p "cleanup-artifact/tree/$(dirname "$file")"
            cp "$file" "cleanup-artifact/tree/$file"
          done < <(git diff --name-only --diff-filter=ACMRTUXB)
          printf '%s\n' "$(git rev-parse HEAD)" > cleanup-artifact/base-sha.txt
      - name: Upload cleaned tree
        uses: actions/upload-artifact@v4
        with:
          name: v7-cleanup-tree-${{ github.run_id }}
          path: cleanup-artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
