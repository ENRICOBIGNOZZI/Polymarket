name: Bootstrap Alpha V5

on:
  push:
    branches:
      - feature/unified-alpha-v5
    paths:
      - ops/alpha_v5_payload.ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-alpha-v5
          fetch-depth: 0
      - name: Verify and unpack reviewed payload
        shell: bash
        run: |
          set -euo pipefail
          cat ops/alpha_v5_payload.part* | base64 --decode > /tmp/alpha_v5_payload.tar.gz
          printf '%s  %s\n' '975bfa840e160f26244cafeb06788e0da08f1ce7d15b4e5eaa1a35fe307dd353' '/tmp/alpha_v5_payload.tar.gz' | sha256sum --check -
          tar -xzf /tmp/alpha_v5_payload.tar.gz -C .
          rm -f ops/alpha_v5_payload.part* ops/alpha_v5_payload.ready .github/workflows/bootstrap-alpha-v5.yml
      - name: Validate implementation before commit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts/alpha_v5 scripts/alpha_v5_runner.py scripts/market_ws_recorder_v5.py
          python3 -m unittest discover -s tests -p 'test_alpha_v5.py' -v
          python3 -m json.tool config/alpha_v5.json >/dev/null
          python3 -m json.tool config/paper_v5.json >/dev/null
          bash -n scripts/paper_v5_once.sh
          bash -n scripts/paper_v5_loop.sh
      - name: Commit V5 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add unified alpha V5 research stack'
          git push origin HEAD:feature/unified-alpha-v5
