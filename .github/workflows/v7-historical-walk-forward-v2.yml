name: V7 historical walk-forward V2 London

on:
  push:
    branches: [main]
    paths: [deploy/v7-historical-walk-forward-v2-request.json]
  workflow_dispatch:
  schedule:
    - cron: '15 22 * * *'
    - cron: '15 23 * * *'

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: v7-historical-walk-forward-v2
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Prepare push/manual/nightly request
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_EVENT_NAME" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          event=sys.argv[1]
          out=Path(sys.argv[2])
          now=datetime.now(ZoneInfo("Europe/Zurich"))
          should_run=True
          if event=="schedule":
              should_run=(now.hour==0 and 5 <= now.minute <= 40)
          if event=="push":
              request=Path("deploy/v7-historical-walk-forward-v2-request.json")
          else:
              request=Path(".nightly-v2-request.json")
              value={
                  "schema":"polymarket_v7_historical_walk_forward_v2_ssm_request_v1",
                  "version":1,
                  "request_id":"nightly-v2-"+now.strftime("%Y%m%d"),
                  "instance_id":"i-0fba2bac9fdc5cbeb",
                  "minimum_wall_ns":1789921800000000000,
                  "folds":3,
                  "output_directory":"docs/research/historical-walk-forward-v2-"+now.strftime("%Y-%m-%d"),
                  "paper_only":True,
                  "authenticated_execution":False,
                  "real_order_submission":False,
                  "real_capital_at_risk":False,
              }
              request.write_text(json.dumps(value,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          with out.open("a",encoding="utf-8") as h:
              h.write("should_run="+("true" if should_run else "false")+"\n")
              h.write("request="+str(request)+"\n")
          print(json.dumps({
              "event":event,"zurich_now":now.isoformat(),
              "should_run":should_run,"request":str(request)
          },sort_keys=True))
          PY

      - name: Configure AWS credentials through OIDC
        if: steps.prepare.outputs.should_run == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
          role-session-name: polymarket-walk-forward-v2
          aws-region: eu-west-2

      - name: Run V2 against active London PAPER evidence
        if: steps.prepare.outputs.should_run == 'true'
        env:
          REQUEST: ${{ steps.prepare.outputs.request }}
        run: python3 ops/v7_historical_walk_forward_v2_ssm.py "$REQUEST" "$GITHUB_SHA"

      - name: Require real admissible evidence
        if: steps.prepare.outputs.should_run == 'true'
        env:
          REQUEST: ${{ steps.prepare.outputs.request }}
        run: |
          python3 - "$REQUEST" <<'PY'
          import json,sys
          from pathlib import Path
          req=json.loads(Path(sys.argv[1]).read_text())
          root=Path(req['output_directory'])
          data=json.loads((root/'data_manifest.json').read_text())
          folds=json.loads((root/'walk_forward_folds.json').read_text())
          assert data['paper_only'] is True and data['authenticated_execution'] is False
          assert data['real_order_submission'] is False and data['real_capital_at_risk'] is False
          assert data['input_state']=='READY', data['input_state']
          assert data['deduplicated_decisions']>0
          assert data['unique_markets']>0
          assert data['short_horizon_observed_pairs']>0
          assert folds['oos_predictions']>0
          print(json.dumps({'decisions':data['deduplicated_decisions'],
                            'markets':data['unique_markets'],
                            'short_horizon_pairs':data['short_horizon_observed_pairs'],
                            'oos_predictions':folds['oos_predictions']},sort_keys=True))
          PY

      - name: Fail-closed PAPER research champion promotion
        if: steps.prepare.outputs.should_run == 'true'
        env:
          REQUEST: ${{ steps.prepare.outputs.request }}
        run: |
          set -euo pipefail
          output="$(python3 -c 'import json,os;print(json.load(open(os.environ["REQUEST"]))["output_directory"])')"
          python3 -m research.walk_forward_v2.promotion \
            --report-dir "$output" \
            --registry config/v7_executable_markout_research_champion.json \
            --receipt "$output/promotion_receipt.json"

      - name: Publish research report, PNGs and PAPER research champion
        if: steps.prepare.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST: ${{ steps.prepare.outputs.request }}
        run: |
          set -euo pipefail
          output="$(python3 -c 'import json,os;print(json.load(open(os.environ["REQUEST"]))["output_directory"])')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$output"
          if test -f config/v7_executable_markout_research_champion.json; then
            git add config/v7_executable_markout_research_champion.json
          fi
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Research results unchanged."
            exit 0
          fi
          git commit -m "Publish nightly London V2 research and champion receipt"
          if ! git push origin HEAD:main; then
            branch="research/historical-walk-forward-v2-results-${GITHUB_RUN_ID}"
            git push origin "HEAD:refs/heads/${branch}"
            gh pr create --base main --head "$branch" --title "research: publish London walk-forward V2 results" --body "Automated PAPER-only London historical walk-forward V2 results. Generated from exact main SHA ${GITHUB_SHA}; no runtime or execution authority changes."
          fi
