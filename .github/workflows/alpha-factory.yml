name: Polymarket Alpha Factory

on:
  workflow_dispatch:
  schedule:
    - cron: "2 * * * *"
  push:
    branches: [main]
    paths:
      - "config/alpha_factory.json"
      - "config/live_champion.json"
      - "config/external_intelligence.json"
      - "config/research_v7_cross_sectional_rank.json"
      - "scripts/alpha_factory.py"
      - "scripts/attach_external_evidence.py"
      - "scripts/v7_cross_sectional_rank.py"
      - "scripts/v7_cross_sectional_rank_core.py"
      - "scripts/v7_cross_sectional_history.py"
      - "scripts/v7_cross_sectional_rank_forward.py"
      - "tests/test_alpha_factory.py"
      - "tests/test_attach_external_evidence.py"
      - "tests/test_v7_cross_sectional_rank.py"
      - "tests/test_v7_cross_sectional_history.py"
      - "tests/test_v7_cross_sectional_rank_forward.py"
      - ".github/workflows/alpha-factory.yml"
      - ".github/workflows/external-intelligence.yml"
      - "docs/ALPHA_FACTORY.md"
      - "docs/EXTERNAL_INTELLIGENCE.md"
  pull_request:
    branches: [main]
    paths:
      - "config/alpha_factory.json"
      - "config/live_champion.json"
      - "config/external_intelligence.json"
      - "config/research_v7_cross_sectional_rank.json"
      - "scripts/alpha_factory.py"
      - "scripts/attach_external_evidence.py"
      - "scripts/v7_cross_sectional_rank.py"
      - "scripts/v7_cross_sectional_rank_core.py"
      - "scripts/v7_cross_sectional_history.py"
      - "scripts/v7_cross_sectional_rank_forward.py"
      - "tests/test_alpha_factory.py"
      - "tests/test_attach_external_evidence.py"
      - "tests/test_v7_cross_sectional_rank.py"
      - "tests/test_v7_cross_sectional_history.py"
      - "tests/test_v7_cross_sectional_rank_forward.py"
      - ".github/workflows/alpha-factory.yml"
      - ".github/workflows/external-intelligence.yml"
      - "docs/ALPHA_FACTORY.md"
      - "docs/EXTERNAL_INTELLIGENCE.md"

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: polymarket-alpha-factory
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Alpha Factory invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests/test_alpha_factory.py \
            tests/test_attach_external_evidence.py \
            tests/test_v7_cross_sectional_rank.py \
            tests/test_v7_cross_sectional_history.py \
            tests/test_v7_cross_sectional_rank_forward.py -v
          python3 -m py_compile \
            scripts/alpha_factory.py \
            scripts/attach_external_evidence.py \
            scripts/v7_cross_sectional_rank_core.py \
            scripts/v7_cross_sectional_rank.py \
            scripts/v7_cross_sectional_history.py \
            scripts/v7_cross_sectional_rank_forward.py
          python3 -m json.tool config/alpha_factory.json >/dev/null
          python3 -m json.tool config/research_v7_cross_sectional_rank.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path("config/alpha_factory.json").read_text())
          rank = json.loads(Path("config/research_v7_cross_sectional_rank.json").read_text())
          assert cfg["paper_only"] is True
          assert cfg["allow_authenticated_execution"] is False
          assert cfg["allow_direct_champion_mutation"] is False
          assert "deploy-paper-server.yml" not in cfg["coordination"]["allowlisted_dispatches"]
          assert rank["paper_only"] is True
          assert rank["research_only"] is True
          assert rank["live_intents_enabled"] is False
          PY

      - name: Materialize latest empirical evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p alpha_factory/input alpha_factory/output
          git fetch --no-tags origin telemetry:refs/remotes/origin/telemetry || true

          extract_or_empty() {
            local remote_path="$1"
            local local_path="$2"
            if git show "origin/telemetry:${remote_path}" > "$local_path" 2>/dev/null; then
              test -s "$local_path" || : > "$local_path"
            else
              : > "$local_path"
            fi
          }

          extract_or_empty telemetry/latest-live-smoke.json \
            alpha_factory/input/latest-live-smoke.json
          extract_or_empty telemetry/latest-forward-maker.json \
            alpha_factory/input/latest-forward-maker.json
          extract_or_empty telemetry/forward-maker-history.jsonl \
            alpha_factory/input/forward-maker-history.jsonl
          extract_or_empty telemetry/alpha-factory-state.json \
            alpha_factory/input/alpha-factory-state.json
          extract_or_empty telemetry/latest-external-intelligence.json \
            alpha_factory/input/latest-external-intelligence.json
          extract_or_empty telemetry/ranking-forward-state.json \
            alpha_factory/input/ranking-forward-state.json

      - name: Diagnose bottlenecks and evaluate challengers
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/alpha_factory.py \
            --config config/alpha_factory.json \
            --champion config/live_champion.json \
            --live-smoke alpha_factory/input/latest-live-smoke.json \
            --forward-maker alpha_factory/input/latest-forward-maker.json \
            --forward-history alpha_factory/input/forward-maker-history.jsonl \
            --state-in alpha_factory/input/alpha-factory-state.json \
            --state-out alpha_factory/output/alpha-factory-state.json \
            --output-json alpha_factory/output/latest-alpha-factory.json \
            --output-markdown alpha_factory/output/latest-alpha-factory.md \
            | tee alpha_factory/output/alpha-factory.log

      - name: Attach external-information evidence without self-promotion
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/attach_external_evidence.py \
            --alpha-report alpha_factory/output/latest-alpha-factory.json \
            --alpha-state alpha_factory/output/alpha-factory-state.json \
            --external-report alpha_factory/input/latest-external-intelligence.json \
            --output-report alpha_factory/output/latest-alpha-factory.json \
            --output-state alpha_factory/output/alpha-factory-state.json \
            --alpha-markdown alpha_factory/output/latest-alpha-factory.md \
            --max-age-seconds 10800 \
            | tee -a alpha_factory/output/alpha-factory.log

          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("alpha_factory/output/latest-alpha-factory.json").read_text())
          state = json.loads(Path("alpha_factory/output/alpha-factory-state.json").read_text())
          assert report["submitted_orders"] == 0
          assert report["authenticated_execution"] is False
          assert report["direct_champion_mutation"] is False
          assert (state.get("invariants") or {}).get("external_authenticated_execution") is False
          assert (state.get("invariants") or {}).get("external_direct_champion_mutation") is False
          PY

      - name: Collect prospective 2h and 6h ranking evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/v7_cross_sectional_rank_forward.py \
            --config config/research_v7_cross_sectional_rank.json \
            --state-in alpha_factory/input/ranking-forward-state.json \
            --state-out alpha_factory/output/ranking-forward-state.json \
            --output-json alpha_factory/output/latest-ranking-forward.json \
            --market-limit 150 \
            | tee alpha_factory/output/ranking-forward.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("alpha_factory/output/latest-ranking-forward.json").read_text())
          state = json.loads(Path("alpha_factory/output/ranking-forward-state.json").read_text())
          assert report["paper_only"] is True
          assert report["research_only"] is True
          assert report["submitted_orders"] == 0
          assert report["authenticated_execution"] is False
          assert report["live_intents_enabled"] is False
          assert report["point_in_time_universe"] is True
          assert report["promotion_ready"] is False
          assert state["submitted_orders"] == 0
          assert state["authenticated_execution"] is False
          PY

      - name: Publish Alpha Factory summary
        if: always()
        shell: bash
        run: |
          echo '## Polymarket Alpha Factory' >> "$GITHUB_STEP_SUMMARY"
          if test -s alpha_factory/output/latest-alpha-factory.md; then
            cat alpha_factory/output/latest-alpha-factory.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Alpha Factory report is missing.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### V7 2h/6h forward ranking observer' >> "$GITHUB_STEP_SUMMARY"
          if test -s alpha_factory/output/latest-ranking-forward.json; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path('alpha_factory/output/latest-ranking-forward.json').read_text())
          print(f"- point-in-time universe: {r['point_in_time_universe']}")
          print(f"- data healthy: {r['history_data_healthy']} ({r['history_market_count']} histories)")
          print(f"- new/open/completed/invalid sections: {r['new_sections']}/{r['open_sections']}/{r['completed_sections']}/{r['invalid_sections']}")
          for h in r['forward']:
              print(f"- {h['horizon_minutes']}m: days={h['days']}, sections={h['completed_sections']}, median IC={h['median_rank_ic']:.4f}, +IC={h['positive_rank_ic_fraction']:.3f}, median tail={h['median_top_bottom_logit_spread']:.6f}, +tail={h['positive_top_bottom_fraction']:.3f}, gate={h['forward_statistical_gate']}")
          PY
          else
            echo '- forward observer report missing' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish latest registry and evidence to telemetry
        if: github.event_name != 'pull_request' && success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          publish_file() {
            local local_path="$1"
            local remote_path="$2"
            local message="$3"
            local endpoint="repos/${GITHUB_REPOSITORY}/contents/${remote_path}"
            local content current_sha
            content="$(base64 -w0 "$local_path")"
            current_sha="$(gh api "${endpoint}?ref=telemetry" --jq .sha 2>/dev/null || true)"
            local args=("$endpoint" --method PUT -f message="$message" -f content="$content" -f branch=telemetry)
            if [[ -n "$current_sha" ]]; then
              args+=(-f sha="$current_sha")
            fi
            gh api "${args[@]}" >/dev/null
          }

          publish_file alpha_factory/output/latest-alpha-factory.json \
            telemetry/latest-alpha-factory.json \
            "Update Alpha Factory evidence report"
          publish_file alpha_factory/output/latest-alpha-factory.md \
            telemetry/latest-alpha-factory.md \
            "Update Alpha Factory human report"
          publish_file alpha_factory/output/alpha-factory-state.json \
            telemetry/alpha-factory-state.json \
            "Update Alpha Factory candidate registry"
          publish_file alpha_factory/output/latest-ranking-forward.json \
            telemetry/latest-ranking-forward.json \
            "Update V7 forward ranking evidence"
          publish_file alpha_factory/output/ranking-forward-state.json \
            telemetry/ranking-forward-state.json \
            "Update V7 forward ranking state"

      - name: Upload durable Alpha Factory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-factory-${{ github.run_id }}
          path: alpha_factory/
          if-no-files-found: error
          retention-days: 30
