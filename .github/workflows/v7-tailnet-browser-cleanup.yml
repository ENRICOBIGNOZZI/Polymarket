name: V7 Tailscale encrypted browser cleanup

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-tailnet-login.envelope.json
      - .github/workflows/v7-tailnet-browser-cleanup.yml
      - ops/v7_tailscale_browser_cleanup.py

permissions:
  contents: read
  actions: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 50

      - name: Decrypt one-shot Tailscale login
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.POLYMARKET_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy-key"
          python3 scripts/v7_ssh_envelope.py \
            --private-key "$RUNNER_TEMP/deploy-key" \
            --input deploy/v7-tailnet-login.envelope.json \
            --output "$RUNNER_TEMP/tailnet-login.json"
          rm -f "$RUNNER_TEMP/deploy-key"
          expected_sha="$(python3 - "$RUNNER_TEMP/tailnet-login.json" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1],encoding='utf-8'))
          assert set(v)=={'schema','purpose','expected_parent_sha','email','password','maximum_deletions'}
          assert v['schema']=='polymarket_v7_tailnet_login_handoff_v2'
          assert v['purpose']=='TAILNET_CI_QUOTA_RECOVERY'
          assert isinstance(v['expected_parent_sha'],str) and len(v['expected_parent_sha'])==40
          assert isinstance(v['email'],str) and '@' in v['email']
          assert isinstance(v['password'],str) and v['password']
          assert 1 <= int(v['maximum_deletions']) <= 120
          print(v['expected_parent_sha'])
          PY
          )"
          git merge-base --is-ancestor "$expected_sha" HEAD
          echo "tailnet_envelope_expected_ancestor_ok=1"

      - name: Install browser automation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check playwright
          command -v google-chrome >/dev/null 2>&1
          command -v Xvfb >/dev/null 2>&1

      - name: Remove stale CI helper nodes only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -u ops/v7_tailscale_browser_cleanup.py \
            --credentials "$RUNNER_TEMP/tailnet-login.json" \
            --repository "$GITHUB_REPOSITORY" \
            --github-token "$GH_TOKEN" \
            --chrome google-chrome

      - name: Destroy plaintext login
        if: always()
        shell: bash
        run: |
          set +e
          shred -u "$RUNNER_TEMP/tailnet-login.json" "$RUNNER_TEMP/deploy-key" 2>/dev/null || \
            rm -f "$RUNNER_TEMP/tailnet-login.json" "$RUNNER_TEMP/deploy-key"
