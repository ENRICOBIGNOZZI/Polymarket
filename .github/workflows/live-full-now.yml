name: live-full-now

on:
  push:
    branches: ["ops/live-test-now"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: live-full-now-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  live-paper-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev python3

      - name: Build and deterministic tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Run fresh live read-only and paper scans
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p live-results/maker live-results/terminal
          printf 'component\texit_code\n' > live-results/exit_codes.tsv

          run_component() {
            local name="$1"
            shift
            set +e
            "$@" > "live-results/${name}.log" 2>&1
            local rc=$?
            set -e
            printf '%s\t%s\n' "$name" "$rc" >> live-results/exit_codes.tsv
            echo "===== ${name} (exit ${rc}) ====="
            cat "live-results/${name}.log"
          }

          run_component structural \
            ./build/polymarket_negrisk_arb \
              --config config/paper_v3.json \
              --markets 600 --min-liquidity 100 --top 100

          run_component pair_stat_arb \
            ./build/polymarket_stat_arb \
              --config config/paper_v3.json \
              --markets 400 --history-universe 160 \
              --lookback-hours 336 --fidelity-minutes 30 \
              --min-z 1.5 --max-half-life-hours 168 \
              --top 100 --csv live-results/stat_arb.csv

          run_component pca_stat_arb \
            ./build/polymarket_pca_stat_arb \
              --config config/paper_v3.json \
              --markets 400 --universe 100 \
              --lookback-hours 336 --fidelity-minutes 30 \
              --factors 3 --min-z 1.5 \
              --top 100 --csv live-results/pca_stat_arb.csv

          run_component maker_paper \
            ./build/polymarket_maker_paper \
              --config config/paper_v3.json \
              --run-dir live-results/maker \
              --markets 240 --min-liquidity 100 \
              --min-edge 0.003 --max-order-usd 50 \
              --ttl-seconds 300 --hold-seconds 180 \
              --adverse-selection-mult 0.50 --once

          run_component terminal_scan \
            ./build/polymarket_engine \
              --config config/paper_v3.json \
              --once --scan-only --markets 120 \
              --min-liquidity 100 \
              --run-dir live-results/terminal

          echo '===== exit codes ====='
          cat live-results/exit_codes.tsv

      - name: Publish concise result summary
        if: always()
        shell: bash
        run: |
          echo "## Fresh Polymarket live paper validation" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          if test -s live-results/exit_codes.tsv; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat live-results/exit_codes.tsv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          for f in structural pair_stat_arb pca_stat_arb maker_paper terminal_scan; do
            echo "### $f" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            if test -s "live-results/$f.log"; then
              head -n 30 "live-results/$f.log" >> "$GITHUB_STEP_SUMMARY"
            else
              echo missing >> "$GITHUB_STEP_SUMMARY"
            fi
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload complete live diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-live-full-${{ github.run_id }}
          path: live-results/
          if-no-files-found: warn
          retention-days: 7
