name: source-export-v4-post

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'implement/paper-live-oos-pilot-v4'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implement/paper-live-oos-pilot-v4
      - name: Package source
        run: |
          tar --exclude=.git --exclude=build --exclude='**/__pycache__' -czf /tmp/polymarket-v4-current.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: polymarket-v4-current
          path: /tmp/polymarket-v4-current.tgz
          retention-days: 1
