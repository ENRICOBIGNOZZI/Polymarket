name: V7 dynamic RX self-build

on:
  push:
    branches:
      - perf/hft-dynamic-rx-affinity-20260917

permissions:
  contents: write

concurrency:
  group: polymarket-v7-dynamic-rx-selfbuild
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: perf/hft-dynamic-rx-affinity-20260917
          fetch-depth: 0

      - name: Apply and test patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_v7_dynamic_rx_patch.py
          git diff --check
          python3 tests/test_v7_dynamic_rx_alignment.py

      - name: Build and validate
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ libboost-all-dev libssl-dev libcurl4-openssl-dev pkg-config >/dev/null
          cmake -S . -B build-rx -DCMAKE_BUILD_TYPE=Release
          cmake --build build-rx --target polymarket_v7_crypto_flash_shadow_runtime pm_v7_external_ingress_tests -j2
          ./build-rx/polymarket_v7_crypto_flash_shadow_runtime --dynamic-rx-align 1 --validate-only

      - name: Commit tested patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v7-dynamic-rx-selfbuild.yml
          rm scripts/apply_v7_dynamic_rx_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'perf(v7): align feed threads to observed RX CPU'
          git push origin HEAD:perf/hft-dynamic-rx-affinity-20260917
