name: Polymarket External Intelligence

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Collection mode
        required: false
        default: incremental
        type: choice
        options: [incremental, backfill, demo]
  schedule:
    - cron: "17 * * * *"
  pull_request:
    branches: [main]
    paths:
      - "config/external_intelligence.json"
      - "scripts/external_intelligence.py"
      - "scripts/external_request_policy.py"
      - "scripts/gdelt_webngrams.py"
      - "scripts/run_external_intelligence.py"
      - "scripts/build_github_contents_request.py"
      - "tests/test_external_intelligence.py"
      - "tests/test_external_request_policy.py"
      - "tests/test_gdelt_webngrams.py"
      - "tests/test_external_intelligence_workflow_contract.py"
      - ".github/workflows/external-intelligence.yml"

permissions:
  contents: write

concurrency:
  group: external-intelligence-${{ github.event_name == 'schedule' && 'writer' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate standalone external-intelligence contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests/test_external_intelligence.py \
            tests/test_external_request_policy.py \
            tests/test_gdelt_webngrams.py \
            tests/test_external_intelligence_workflow_contract.py -v
          python3 -m py_compile \
            scripts/external_intelligence.py \
            scripts/external_request_policy.py \
            scripts/gdelt_webngrams.py \
            scripts/run_external_intelligence.py \
            scripts/build_github_contents_request.py
          python3 - <<'PY'
          import json
          cfg=json.load(open('config/external_intelligence.json'))
          assert cfg['paper_only'] is True
          assert cfg['allow_authenticated_execution'] is False
          assert cfg['allow_direct_champion_mutation'] is False
          assert cfg['allow_production_signal_write'] is False
          PY

      - name: Restore point-in-time history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external_intelligence/input external_intelligence/output
          git fetch --no-tags origin telemetry:refs/remotes/origin/telemetry || true
          restore() {
            local remote="$1" local="$2"
            git show "origin/telemetry:${remote}" > "$local" 2>/dev/null || true
          }
          restore telemetry/external-intelligence-observations.jsonl.gz external_intelligence/input/observations.jsonl.gz
          restore telemetry/external-intelligence-prices.jsonl.gz external_intelligence/input/prices.jsonl.gz
          restore telemetry/external-intelligence-state.json external_intelligence/input/state.json
          python3 - <<'PY'
          import gzip
          from pathlib import Path
          for name in ('observations.jsonl.gz','prices.jsonl.gz'):
              p=Path('external_intelligence/input')/name
              if not p.exists() or p.stat().st_size == 0:
                  p.write_bytes(gzip.compress(b'', compresslevel=9, mtime=0))
          p=Path('external_intelligence/input/state.json')
          if not p.exists() or p.stat().st_size == 0:
              p.write_text('{}\n')
          PY

      - name: Collect point-in-time public information
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          mode=incremental
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then mode=demo; fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then mode="${REQUESTED_MODE:-incremental}"; fi
          case "$mode" in incremental|backfill|demo) ;; *) exit 2 ;; esac
          python3 scripts/run_external_intelligence.py \
            --config config/external_intelligence.json \
            --observations-in external_intelligence/input/observations.jsonl.gz \
            --prices-in external_intelligence/input/prices.jsonl.gz \
            --state-in external_intelligence/input/state.json \
            --observations-out external_intelligence/output/observations.jsonl.gz \
            --prices-out external_intelligence/output/prices.jsonl.gz \
            --state-out external_intelligence/output/state.json \
            --signals-out external_intelligence/output/latest-signals.jsonl \
            --report-json external_intelligence/output/latest-external-intelligence.json \
            --report-markdown external_intelligence/output/latest-external-intelligence.md \
            --mode "$mode"
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.load(open('external_intelligence/output/latest-external-intelligence.json'))
          assert r['paper_only'] is True
          assert r['submitted_orders'] == 0
          assert r['authenticated_execution'] is False
          assert r['direct_champion_mutation'] is False
          assert r['production_signal_write'] is False
          assert Path('external_intelligence/output/observations.jsonl.gz').stat().st_size > 0
          assert Path('external_intelligence/output/prices.jsonl.gz').stat().st_size > 0
          PY

      - name: Publish durable standalone telemetry
        if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code origin refs/heads/telemetry >/dev/null 2>&1; then
            git push origin "HEAD:refs/heads/telemetry"
          fi
          publish_file() {
            local local_path="$1" remote_path="$2" message="$3"
            local endpoint="repos/${GITHUB_REPOSITORY}/contents/${remote_path}"
            local current_sha request
            current_sha="$(gh api "${endpoint}?ref=telemetry" --jq .sha 2>/dev/null || true)"
            request="$(mktemp)"
            args=(--input "$local_path" --message "$message" --branch telemetry --output "$request")
            [[ -n "$current_sha" ]] && args+=(--sha "$current_sha")
            python3 scripts/build_github_contents_request.py "${args[@]}"
            gh api "$endpoint" --method PUT --input "$request" >/dev/null
            rm -f "$request"
          }
          publish_file external_intelligence/output/observations.jsonl.gz telemetry/external-intelligence-observations.jsonl.gz "Update external observations"
          publish_file external_intelligence/output/prices.jsonl.gz telemetry/external-intelligence-prices.jsonl.gz "Update external prices"
          publish_file external_intelligence/output/state.json telemetry/external-intelligence-state.json "Update external state"
          publish_file external_intelligence/output/latest-signals.jsonl telemetry/latest-external-signals.jsonl "Update external shadow signals"
          publish_file external_intelligence/output/latest-external-intelligence.json telemetry/latest-external-intelligence.json "Update external evidence"

      - name: Upload external-intelligence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-intelligence-${{ github.run_id }}
          path: external_intelligence/
          if-no-files-found: error
          retention-days: 30
