name: V7 mamma Grafana robust probe

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-mamma-grafana-robust-probe-request.json
      - .github/workflows/v7-mamma-grafana-robust-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SERVER_HOST: ${{ vars.POLYMARKET_SERVER_HOST || '100.104.183.109' }}
      SERVER_USER: ${{ vars.POLYMARKET_SERVER_USER || 'enrico' }}
      SERVER_PORT: ${{ vars.POLYMARKET_SERVER_PORT || '22' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate request
        run: |
          python3 - deploy/v7-mamma-grafana-robust-probe-request.json <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1]))=={"schema":"polymarket_v7_mamma_grafana_robust_probe_v1","read_only":True}
          PY

      - name: Select Tailscale credential
        id: ts
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          set -euo pipefail
          if [[ -n "${TS_AUTHKEY:-}" ]]; then
            echo mode=authkey >> "$GITHUB_OUTPUT"
          elif [[ -n "${TS_OAUTH_CLIENT_ID:-}" && -n "${TS_OAUTH_SECRET:-}" ]]; then
            echo mode=oauth >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi

      - name: Join tailnet with auth key
        if: steps.ts.outputs.mode == 'authkey'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: ${{ env.SERVER_HOST }}

      - name: Join tailnet with OAuth
        if: steps.ts.outputs.mode == 'oauth'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TS_TAGS || 'tag:ci' }}
          ping: ${{ env.SERVER_HOST }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.POLYMARKET_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -T 5 -p "$SERVER_PORT" "$SERVER_HOST" > ~/.ssh/known_hosts

      - name: Copy and run read-only probe
        run: |
          set -euo pipefail
          scp -i ~/.ssh/key -o IdentitiesOnly=yes -o BatchMode=yes -P "$SERVER_PORT" \
            ops/v7_mamma_grafana_probe.sh "$SERVER_USER@$SERVER_HOST:/tmp/v7_mamma_grafana_probe.sh"
          ssh -i ~/.ssh/key -o IdentitiesOnly=yes -o BatchMode=yes -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            'chmod 700 /tmp/v7_mamma_grafana_probe.sh && /tmp/v7_mamma_grafana_probe.sh; rm -f /tmp/v7_mamma_grafana_probe.sh'
