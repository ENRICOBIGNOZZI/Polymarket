name: Operator Authority Gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: operator-authority-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Reject pull-request mutation of operator authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gate
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            > gate/files-pages.json
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > gate/pr.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          protected = {
              'config/operator_directives.json',
              'config/project_context.json',
              'scripts/hard_safety_policy.py',
              'scripts/project_context_snapshot.py',
              'scripts/validate_project_context.py',
              'tests/test_hard_safety_policy.py',
              'tests/test_v7_authorized_paper_envelope.py',
              '.github/workflows/operator-authority-gate.yml',
          }
          canonical_allowed = {
              'scripts/hard_safety_policy.py',
              'scripts/validate_project_context.py',
          }
          instruction_id = 'user-v7-master-multi-agent-operating-prompt-20260827'
          operator_marker = 'operator authorization change: latest explicit user instruction'
          convergence_marker = f'canonical convergence authority: {instruction_id}'

          pages = json.loads(Path('gate/files-pages.json').read_text())
          files = [item for page in pages for item in page] if pages and all(isinstance(page, list) for page in pages) else pages
          changed = {str(item.get('filename') or '') for item in files if isinstance(item, dict)}
          blocked = sorted(changed & protected)

          pr = json.loads(Path('gate/pr.json').read_text())
          body = str(pr.get('body') or '').lower()
          head_sha = os.environ['HEAD_SHA'].lower()
          canonical = (
              os.environ['PR_NUMBER'] == '740'
              and os.environ['HEAD_REF'] == 'integration/v7-complete-20260827'
              and os.environ['BASE_REF'] == 'main'
              and len(head_sha) == 40
              and all(ch in '0123456789abcdef' for ch in head_sha)
              and operator_marker in body
              and convergence_marker in body
          )
          canonical_blocked_ok = canonical and set(blocked).issubset(canonical_allowed)
          policy_fail = bool(blocked) and not canonical_blocked_ok

          report = {
              'head_sha': head_sha,
              'head_ref': os.environ['HEAD_REF'],
              'base_ref': os.environ['BASE_REF'],
              'protected_changed': blocked,
              'canonical_v7_convergence': canonical,
              'canonical_authority_diff_allowed': canonical_blocked_ok,
              'policy': 'fail' if policy_fail else 'pass',
              'rule': 'operator authority is immutable through pull requests except the exact operator-authorized PR #740 convergence bridge with a narrowly enumerated authority diff',
          }
          Path('gate/report.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print(json.dumps(report, indent=2, sort_keys=True))
          if policy_fail:
              print('::error::operator authority surfaces are immutable through this pull request: ' + ', '.join(blocked))
              raise SystemExit(1)
          PY

      - name: Publish gate report
        if: always()
        shell: bash
        run: |
          if test -s gate/report.json; then
            echo '## Operator Authority Gate' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat gate/report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
