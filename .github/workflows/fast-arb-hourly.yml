name: Fast Arbitrage Hourly Shadow

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"
  pull_request:
    branches: [main]
    paths:
      - "include/pm/fast_arb.hpp"
      - "include/pm/fast_ws.hpp"
      - "include/pm/generated/fast_arb_candidate_policy.hpp"
      - "src/fast_arb.cpp"
      - "src/fast_ws.cpp"
      - "src/fast_arb_main.cpp"
      - "src/fast_runtime/**"
      - "config/fast_arb_*"
      - "scripts/arb_theory_scheduler.py"
      - "scripts/v7_fast_structural_gate.py"
      - "scripts/v7_fast_joint_execution_evidence.py"
      - "scripts/validate_fast_data_health.py"
      - "scripts/paper_v7_loop.sh"
      - "tests/test_fast_*"
      - "tests/test_v7_fast_structural_gate.py"
      - "tests/test_v7_fast_joint_execution_evidence.py"
      - "tests/test_arb_theory_scheduler.py"
      - ".github/workflows/fast-arb-hourly.yml"
      - ".github/workflows/arb-theory-hourly.yml"
      - "CMakeLists.txt"

permissions:
  contents: read

concurrency:
  group: fast-arb-hourly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shadow-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libssl-dev libboost-all-dev python3

      - name: Build and test all engine planes
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
          python3 -m unittest \
            tests/test_fast_data_health.py \
            tests/test_v7_fast_structural_gate.py \
            tests/test_v7_fast_joint_execution_evidence.py -v

      - name: Run read-only V7 fast shadow probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs/hourly-fast
          duration=180
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then duration=45; fi
          ./build/polymarket_fast_arb_shadow \
            --config config/paper_v7.json \
            --policy config/fast_arb_policy.json \
            --relations config/fast_arb_relations.csv \
            --external-signals data/external_signals.csv \
            --run-dir runs/hourly-fast \
            --markets 600 \
            --min-liquidity 100 \
            --shard-size 200 \
            --snapshot-refresh-seconds 20 \
            --duration-seconds "$duration" \
            --recycle-seconds 0

      - name: Produce cost-stressed research evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse HEAD)"
          python3 scripts/arb_theory_scheduler.py \
            --evidence-root runs/hourly-fast \
            --base-policy config/fast_arb_policy.json \
            --stress-bps 10 \
            --output-json runs/hourly-fast/fast_arb_candidate.json \
            --output-markdown runs/hourly-fast/fast_arb_theory_report.md \
            --output-header runs/hourly-fast/fast_arb_candidate_policy.hpp

          execution_args=()
          if [[ -s runs/hourly-fast/fast_arb_joint_execution.csv ]]; then
            python3 scripts/v7_fast_joint_execution_evidence.py \
              --input runs/hourly-fast/fast_arb_joint_execution.csv \
              --expected-sha "$target_sha" \
              --output-json runs/hourly-fast/fast_arb_joint_execution_evidence.json
            execution_args=(--execution-evidence runs/hourly-fast/fast_arb_joint_execution_evidence.json)
          fi
          python3 scripts/v7_fast_structural_gate.py \
            --candidate runs/hourly-fast/fast_arb_candidate.json \
            --expected-sha "$target_sha" \
            --generated-header runs/hourly-fast/fast_arb_candidate_policy.hpp \
            "${execution_args[@]}"
          python3 scripts/validate_fast_data_health.py \
            --status runs/hourly-fast/fast_arb_status.json \
            --errors runs/hourly-fast/fast_arb_errors.csv \
            --max-feed-stale-ms 45000 \
            --min-rest-resyncs 2
          TARGET_SHA="$target_sha" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          status = json.loads(Path("runs/hourly-fast/fast_arb_status.json").read_text())
          candidate_path = Path("runs/hourly-fast/fast_arb_candidate.json")
          candidate = json.loads(candidate_path.read_text())
          base_policy = json.loads(Path("config/fast_arb_policy.json").read_text())
          execution_path = Path("runs/hourly-fast/fast_arb_joint_execution_evidence.json")
          assert status["mode"] == "shadow"
          assert status["real_order_submission"] is False
          assert candidate["mode"] == "research_only"
          assert candidate["real_order_submission"] is False
          assert candidate["model_sha"] == os.environ["TARGET_SHA"]
          assert candidate["candidate_policy"]["min_net_edge"] >= base_policy["min_net_edge"]
          if not execution_path.is_file():
              assert candidate["promotion_ready"] is False
              assert "joint_execution_evidence_missing" in candidate["promotion_gate"]["reasons"]
          with Path("runs/hourly-fast/fast_arb_theory_report.md").open("a", encoding="utf-8") as handle:
              handle.write("\n## Authoritative V7 economic promotion gate\n\n")
              handle.write(f"- model_sha: `{candidate['model_sha']}`\n")
              handle.write(f"- quoted_theory_promotion_ready: `{candidate['quoted_theory_promotion_ready']}`\n")
              handle.write(f"- promotion_ready: `{str(candidate['promotion_ready']).lower()}`\n")
              reasons = candidate["promotion_gate"]["reasons"]
              handle.write(f"- reasons: `{', '.join(reasons) if reasons else 'none'}`\n")
          PY
          cat runs/hourly-fast/fast_arb_theory_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload hourly evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-arb-evidence-${{ github.run_id }}
          path: runs/hourly-fast
          if-no-files-found: warn
          retention-days: 30
