name: Fast Arbitrage Hourly Shadow

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"
  pull_request:
    branches: [main]
    paths:
      - "include/pm/fast_arb.hpp"
      - "include/pm/fast_ws.hpp"
      - "include/pm/generated/fast_arb_candidate_policy.hpp"
      - "src/fast_arb.cpp"
      - "src/fast_ws.cpp"
      - "src/fast_arb_main.cpp"
      - "src/fast_runtime/**"
      - "config/fast_arb_*"
      - "config/scheduler_context.json"
      - "docs/SCHEDULER_CONTEXT.md"
      - "scripts/arb_theory_scheduler.py"
      - "scripts/validate_scheduler_context.py"
      - "scripts/paper_latest_loop.sh"
      - "tests/test_fast_*"
      - "tests/test_arb_theory_scheduler.py"
      - "tests/test_scheduler_context.py"
      - ".github/workflows/fast-arb-hourly.yml"
      - ".github/workflows/arb-theory-hourly.yml"
      - "CMakeLists.txt"

permissions:
  contents: read

concurrency:
  group: fast-arb-hourly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shadow-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Load shared scheduler context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs/hourly-fast
          python3 scripts/validate_scheduler_context.py \
            --context config/scheduler_context.json \
            --scheduler-id fast-arb-shadow-research \
            --output runs/hourly-fast/scheduler-context.md \
            --output-json runs/hourly-fast/scheduler-context.json \
            --github-env "$GITHUB_ENV"

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libssl-dev libboost-all-dev python3

      - name: Build and test all engine planes
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure

      - name: Run read-only fast shadow probe
        shell: bash
        run: |
          set -euo pipefail
          duration=180
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then duration=45; fi
          ./build/polymarket_fast_arb_shadow \
            --config config/paper_v4.json \
            --policy config/fast_arb_policy.json \
            --relations config/fast_arb_relations.csv \
            --external-signals data/external_signals.csv \
            --run-dir runs/hourly-fast \
            --markets 600 \
            --min-liquidity 100 \
            --shard-size 200 \
            --snapshot-refresh-seconds 20 \
            --duration-seconds "$duration" \
            --recycle-seconds 0

      - name: Produce cost-stressed research evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/arb_theory_scheduler.py \
            --evidence-root runs/hourly-fast \
            --base-policy config/fast_arb_policy.json \
            --stress-bps 10 \
            --output-json runs/hourly-fast/fast_arb_candidate.json \
            --output-markdown runs/hourly-fast/fast_arb_theory_report.md \
            --output-header runs/hourly-fast/fast_arb_candidate_policy.hpp
          python3 - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path("runs/hourly-fast/fast_arb_status.json").read_text())
          candidate = json.loads(Path("runs/hourly-fast/fast_arb_candidate.json").read_text())
          base_policy = json.loads(Path("config/fast_arb_policy.json").read_text())
          context = json.loads(Path("runs/hourly-fast/scheduler-context.json").read_text())
          errors = Path("runs/hourly-fast/fast_arb_errors.csv").read_text()
          assert context["valid"] is True
          assert context["scheduler_id"] == "fast-arb-shadow-research"
          assert context["context_sha256"] == "${{ env.POLYMARKET_SCHEDULER_CONTEXT_SHA }}"
          assert status["mode"] == "shadow"
          assert status["real_order_submission"] is False
          assert status["ws_workers"] > 0
          assert status["ws_messages"] > 0, "public WebSocket produced no messages"
          assert status["book_updates"] > 0, "WebSocket messages did not update books"
          assert "Unsupported protocol" not in errors
          assert candidate["mode"] == "research_only"
          assert candidate["real_order_submission"] is False
          assert candidate["candidate_policy"]["min_net_edge"] >= base_policy["min_net_edge"]
          PY
          cat runs/hourly-fast/scheduler-context.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          cat runs/hourly-fast/fast_arb_theory_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload hourly evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-arb-evidence-${{ github.run_id }}
          path: runs/hourly-fast
          if-no-files-found: warn
          retention-days: 30
