name: Fast Arbitrage Hourly Shadow

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"
  pull_request:
    branches: [main]
    paths:
      - "include/pm/fast_arb.hpp"
      - "include/pm/fast_ws.hpp"
      - "include/pm/generated/fast_arb_candidate_policy.hpp"
      - "src/fast_arb.cpp"
      - "src/fast_ws.cpp"
      - "src/fast_arb_main.cpp"
      - "src/fast_runtime/**"
      - "config/fast_arb_*"
      - "config/operator_directives.json"
      - "scripts/arb_theory_scheduler.py"
      - "scripts/validate_fast_data_health.py"
      - "scripts/paper_latest_loop.sh"
      - "tests/test_fast_*"
      - "tests/test_arb_theory_scheduler.py"
      - ".github/workflows/fast-arb-hourly.yml"
      - ".github/workflows/arb-theory-hourly.yml"
      - "CMakeLists.txt"

permissions:
  contents: read

concurrency:
  group: fast-arb-hourly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shadow-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libssl-dev libboost-all-dev python3

      - name: Build and test all engine planes
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
          python3 -m unittest tests/test_fast_data_health.py -v

      - name: Run read-only V7-authority fast shadow probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs/hourly-fast
          duration=180
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then duration=45; fi
          ./build/polymarket_fast_arb_shadow \
            --config config/fast_arb_v7_shadow.json \
            --policy config/fast_arb_policy.json \
            --relations config/fast_arb_relations.csv \
            --external-signals data/external_signals.csv \
            --run-dir runs/hourly-fast \
            --markets 1000 \
            --min-liquidity 2 \
            --shard-size 200 \
            --snapshot-refresh-seconds 5 \
            --duration-seconds "$duration" \
            --recycle-seconds 0

      - name: Produce cost-stressed research evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/arb_theory_scheduler.py \
            --evidence-root runs/hourly-fast \
            --base-policy config/fast_arb_policy.json \
            --stress-bps 10 \
            --output-json runs/hourly-fast/fast_arb_candidate.json \
            --output-markdown runs/hourly-fast/fast_arb_theory_report.md \
            --output-header runs/hourly-fast/fast_arb_candidate_policy.hpp
          python3 scripts/validate_fast_data_health.py \
            --status runs/hourly-fast/fast_arb_status.json \
            --errors runs/hourly-fast/fast_arb_errors.csv \
            --max-feed-stale-ms 45000 \
            --min-rest-resyncs 2
          python3 - <<'PY'
          import csv
          import json
          import math
          from pathlib import Path

          status = json.loads(Path("runs/hourly-fast/fast_arb_status.json").read_text())
          candidate = json.loads(Path("runs/hourly-fast/fast_arb_candidate.json").read_text())
          base_policy = json.loads(Path("config/fast_arb_policy.json").read_text())
          v7 = json.loads(Path("config/fast_arb_v7_shadow.json").read_text())
          directives = json.loads(Path("config/operator_directives.json").read_text())["paper_v7_authorization"]
          assert status["mode"] == "shadow"
          assert status["real_order_submission"] is False
          assert candidate["mode"] == "research_only"
          assert candidate["real_order_submission"] is False
          assert candidate["candidate_policy"]["min_net_edge"] >= base_policy["min_net_edge"]
          assert base_policy["min_net_edge"] == directives["min_net_edge"]
          assert base_policy["external_uncertainty_penalty"] == directives["uncertainty_penalty"]
          assert v7["market_limit"] == directives["market_limit"] == 1000
          assert v7["min_liquidity"] == directives["min_liquidity"] == 2.0
          assert v7["fractional_kelly"] == directives["fractional_kelly_ceiling"] == 0.25
          assert v7["max_trade_usd"] == directives["max_trade_usd_compatibility_sentinel"]
          assert v7["max_drawdown"] == directives["max_drawdown"] == 0.15
          assert v7["paper_only"] is True and v7["authenticated_execution"] is False

          # The huge dollar value in operator_directives is a compatibility sentinel,
          # not spendable capital. Every shadow opportunity must remain bounded by the
          # loaded PAPER account and percentage ceilings, otherwise modeled profit is
          # economically meaningless even though no real orders are sent.
          fraction_ceiling = max(0.0, min(
              1.0,
              float(v7["max_market_fraction"]),
              float(v7["max_event_fraction"]),
              float(v7["max_gross_fraction"]),
          ))
          capital_ceiling = float(v7["starting_capital"]) * fraction_ceiling
          assert math.isfinite(capital_ceiling) and capital_ceiling > 0.0
          max_seen_capital = 0.0
          with Path("runs/hourly-fast/fast_arb_opportunities.csv").open(newline="") as handle:
              for row in csv.DictReader(handle):
                  capital = float(row["capital_required"])
                  profit = float(row["expected_profit"])
                  shares = float(row["executable_shares"])
                  assert math.isfinite(capital)
                  assert math.isfinite(profit)
                  assert math.isfinite(shares)
                  assert capital <= capital_ceiling + 1e-6, (capital, capital_ceiling, row["id"])
                  max_seen_capital = max(max_seen_capital, capital)
          assert max_seen_capital <= capital_ceiling + 1e-6
          PY
          cat runs/hourly-fast/fast_arb_theory_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload hourly evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-arb-evidence-${{ github.run_id }}
          path: runs/hourly-fast
          if-no-files-found: warn
          retention-days: 30
