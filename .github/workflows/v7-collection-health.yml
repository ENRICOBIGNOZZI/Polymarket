name: V7 independent collection health

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-collection-health-request.json
  schedule:
    - cron: "*/10 * * * *"
  workflow_run:
    workflows: ["V7 independent collection plane"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: v7-independent-collection-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
      INSTANCE_ID: i-0fba2bac9fdc5cbeb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate explicit read-only health request
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          import json
          import re
          value=json.load(open('deploy/v7-collection-health-request.json',encoding='utf-8'))
          assert value.get('schema')=='polymarket_v7_collection_health_request_v1'
          assert re.fullmatch(r'[A-Za-z0-9._:-]{8,128}',value.get('request_id') or '')
          assert value.get('paper_only') is True
          assert value.get('authenticated_execution') is False
          assert value.get('real_order_submission') is False
          assert value.get('operation')=='READ_ONLY_HEALTH'
          assert value.get('model_independent') is True
          PY

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: polymarket-v7-collection-health
          aws-region: eu-west-2

      - name: Verify collection liveness and real tape growth
        run: |
          set -u
          rc=0
          python3 ops/v7_collection_plane_health.py --instance-id "$INSTANCE_ID" --output collection-health.json || rc=$?
          test -s collection-health.json
          cat collection-health.json >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Upload health receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v7-collection-health-${{ github.run_id }}
          path: collection-health.json
          retention-days: 14
