name: V7 trusted A0-A5 maker alpha horse race

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-a0-a5-maker-2h-request.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: v7-a0-a5-maker-alpha-horse-race
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
      RESEARCH_BRANCH: research/a0-a5-maker-horse-race-20260924

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Validate trusted-main request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request=deploy/v7-a0-a5-maker-2h-request.json
          python3 - "$request" <<'PY'
          import json,re,sys
          v=json.load(open(sys.argv[1]))
          assert v["schema"]=="polymarket_v7_a0_a5_maker_2h_request_v1"
          assert v["version"]==1
          assert re.fullmatch(r"[A-Za-z0-9._:-]{8,128}",v["request_id"])
          assert re.fullmatch(r"i-[0-9a-f]+",v["instance_id"])
          assert re.fullmatch(r"[0-9a-f]{40}",v["expected_research_sha"])
          assert v["research_branch"]=="research/a0-a5-maker-horse-race-20260924"
          assert isinstance(v["minimum_wall_ns"],int) and v["minimum_wall_ns"]>0
          assert v["output_directory"]=="docs/research/a0-a5-maker-2h-2026-09-24"
          assert v["paper_only"] is True
          assert v["authenticated_execution"] is False
          assert v["real_order_submission"] is False
          assert v["real_capital_at_risk"] is False
          assert v["automatic_promotion"] is False
          PY
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          test "$changed" = "$request"
          echo "source_sha=$(python3 -c 'import json;print(json.load(open("'"$request"'"))["expected_research_sha"])')" >> "$GITHUB_OUTPUT"
          echo "instance_id=$(python3 -c 'import json;print(json.load(open("'"$request"'"))["instance_id"])')" >> "$GITHUB_OUTPUT"
          echo "minimum_wall_ns=$(python3 -c 'import json;print(json.load(open("'"$request"'"))["minimum_wall_ns"])')" >> "$GITHUB_OUTPUT"

      - name: Fetch exact A0-A5 source
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch origin "$RESEARCH_BRANCH" --depth=100
          branch_sha="$(git rev-parse FETCH_HEAD)"
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" "$branch_sha"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Test frozen A0-A5 protocol
        run: |
          python3 -m pip install --disable-pip-version-check -q -r research/requirements-learning.txt
          PYTHONPATH=. python3 -m pytest -q tests/test_v7_a0_a5_maker_2h.py
          python3 -m py_compile research/walk_forward_v3/a0_a5_maker_2h.py ops/v7_a0_a5_maker_2h_ssm.py

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: polymarket-a0-a5-maker-alpha
          aws-region: eu-west-2

      - name: Run frozen 2H 60-40 A0-A5 experiment
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          INSTANCE_ID: ${{ steps.request.outputs.instance_id }}
          MINIMUM_WALL_NS: ${{ steps.request.outputs.minimum_wall_ns }}
        run: |
          set -euo pipefail
          python3 ops/v7_a0_a5_maker_2h_ssm.py             --instance-id "$INSTANCE_ID"             --expected-sha "$SOURCE_SHA"             --minimum-wall-ns "$MINIMUM_WALL_NS"             --output-dir docs/research/a0-a5-maker-2h-2026-09-24

      - name: Emit compact A0-A5 result
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("docs/research/a0-a5-maker-2h-2026-09-24")
          summary=json.load(open(root/"00_summary.json"))
          grid=json.load(open(root/"03_locked_oos_grid.json"))["rows"]
          mono=json.load(open(root/"04_monotonicity.json"))
          compact={"window":summary["window"],"residual_rule":summary["residual_rule"],"policies":{}}
          for policy in sorted(set(r["policy"] for r in grid)):
              rows=[r for r in grid if r["policy"]==policy]
              valid=[r for r in rows if r.get("net_pnl_per_share") is not None]
              best=max(valid,key=lambda r:(r["net_pnl_per_share"],r["fills"])) if valid else None
              compact["policies"][policy]={
                  "cells":len(rows),
                  "total_selected_signals":sum(int(r.get("selected_signals") or 0) for r in rows),
                  "total_fills":sum(int(r.get("fills") or 0) for r in rows),
                  "descriptive_best_cell":best,
              }
          compact["monotonicity"]={
              "latency_net_pnl_per_share":mono.get("latency_net_pnl_per_share"),
              "horizon_future_pm_signed_move":mono.get("horizon_future_pm_signed_move"),
          }
          print("A0_A5_COMPACT="+json.dumps(compact,sort_keys=True,separators=(",",":")))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v7-a0-a5-maker-2h-${{ github.run_id }}
          path: docs/research/a0-a5-maker-2h-2026-09-24
          retention-days: 30
