name: V7 mamma Grafana restart and verify

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-mamma-grafana-restart-request.json
      - .github/workflows/v7-mamma-grafana-restart.yml

permissions:
  contents: read

jobs:
  restart:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SERVER_HOST: ${{ vars.POLYMARKET_SERVER_HOST || '100.104.183.109' }}
      SERVER_USER: ${{ vars.POLYMARKET_SERVER_USER || 'enrico' }}
      SERVER_PORT: ${{ vars.POLYMARKET_SERVER_PORT || '22' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate
        run: |
          python3 - deploy/v7-mamma-grafana-restart-request.json <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1]))
          assert v=={"schema":"polymarket_v7_mamma_grafana_restart_v1","monitoring_only":True}
          PY
      - name: Select Tailscale credential
        id: ts
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          set -euo pipefail
          if [[ -n "${TS_AUTHKEY:-}" ]]; then echo mode=authkey >> "$GITHUB_OUTPUT"
          elif [[ -n "${TS_OAUTH_CLIENT_ID:-}" && -n "${TS_OAUTH_SECRET:-}" ]]; then echo mode=oauth >> "$GITHUB_OUTPUT"
          else exit 1; fi
      - name: Join tailnet authkey
        if: steps.ts.outputs.mode == 'authkey'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      - name: Join tailnet oauth
        if: steps.ts.outputs.mode == 'oauth'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TS_TAGS || 'tag:ci' }}
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.POLYMARKET_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -T 5 -p "$SERVER_PORT" "$SERVER_HOST" > ~/.ssh/known_hosts
      - name: Restart only mamma Grafana and verify dashboard
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/key -o IdentitiesOnly=yes -o BatchMode=yes -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          BASE="$HOME/.cache/polymarket-grafana-london"
          HOME_PATH="/opt/homebrew/opt/grafana/share/grafana"
          BIN="/opt/homebrew/bin/grafana"
          CFG="$BASE/config/grafana.ini"
          DATA="$BASE/data"
          LOGS="$BASE/logs"
          PLUGINS="$BASE/plugins"
          PROV="$BASE/config/provisioning"
          DASH="$BASE/dashboards/polymarket-v7-pure-arb.json"
          PROVIDER="$PROV/dashboards/v7-pure-arb.yml"

          test -x "$BIN"
          test -f "$CFG"
          test -f "$DASH"
          test -f "$PROVIDER"
          grep -q 'folderUid: afyms0c1xjabkf' "$PROVIDER"
          grep -q '"uid": "polymarket-v7-pure-arb"' "$DASH"

          old_pid="$(pgrep -f '/opt/homebrew/bin/grafana server' | head -1 || true)"
          if [[ -n "$old_pid" ]]; then
            kill -TERM "$old_pid" || true
          fi
          for _ in $(seq 1 30); do
            if ! pgrep -f '/opt/homebrew/bin/grafana server' >/dev/null 2>&1; then break; fi
            sleep 1
          done

          # If launchd did not restart the exact custom instance, start it explicitly.
          if ! pgrep -f '/opt/homebrew/bin/grafana server.*polymarket-grafana-london' >/dev/null 2>&1; then
            mkdir -p "$DATA" "$LOGS" "$PLUGINS"
            nohup "$BIN" server               --homepath="$HOME_PATH"               --config="$CFG"               "cfg:default.paths.data=$DATA"               "cfg:default.paths.logs=$LOGS"               "cfg:default.paths.plugins=$PLUGINS"               "cfg:default.paths.provisioning=$PROV"               >"$LOGS/grafana-manual-restart.log" 2>&1 </dev/null &
          fi

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health >/tmp/grafana-health.json 2>/dev/null; then break; fi
            sleep 1
          done
          cat /tmp/grafana-health.json
          grep -q '"database"' /tmp/grafana-health.json

          found=0
          for _ in $(seq 1 60); do
            code="$(curl -sS -o /tmp/uid.json -w '%{http_code}' http://127.0.0.1:3000/api/dashboards/uid/polymarket-v7-pure-arb || true)"
            if [[ "$code" == 200 ]] && grep -q 'polymarket-v7-pure-arb' /tmp/uid.json; then
              found=1
              break
            fi
            python3 - "$DATA/grafana.db" <<'PY' >/tmp/dbcheck 2>/dev/null || true
          import json,sqlite3,sys,os
          db=sys.argv[1]
          if not os.path.isfile(db): raise SystemExit(1)
          con=sqlite3.connect('file:'+db+'?mode=ro',uri=True)
          tabs={r[0] for r in con.execute("select name from sqlite_master where type='table'")}
          ok=False
          if 'resource' in tabs:
              cols=[r[1] for r in con.execute('pragma table_info(resource)')]
              idx={c:i for i,c in enumerate(cols)}
              for row in con.execute("select * from resource where name=?",('polymarket-v7-pure-arb',)).fetchall():
                  folder=str(row[idx['folder']] or '') if 'folder' in idx else ''
                  if folder=='afyms0c1xjabkf': ok=True
          if not ok and 'dashboard' in tabs:
              row=con.execute("select uid from dashboard where uid=?",('polymarket-v7-pure-arb',)).fetchone()
              ok=bool(row)
          con.close()
          print('1' if ok else '0')
          PY
            if [[ "$(cat /tmp/dbcheck 2>/dev/null || true)" == 1 ]]; then
              found=1
              break
            fi
            sleep 1
          done
          test "$found" = 1

          echo "=== SEARCH ==="
          curl -sS 'http://127.0.0.1:3000/api/search?query=Pure%20Arbitrage' || true
          echo
          echo "=== ROUTE ==="
          curl -k -sS -I --max-time 8             https://mamma-portfolio.tail1bae85.ts.net/d/polymarket-v7-pure-arb/polymarket-v7-crypto-pure-arbitrage-paper             | head -12 || true
          echo "=== PROMETHEUS PURE ARB ==="
          curl -sS --get --data-urlencode 'query=polymarket_pure_arb_up'             http://100.102.9.16:19091/api/v1/query || true
          echo
          echo MAMMA_GRAFANA_PURE_ARB_OK=1
          REMOTE
