name: V7 recent PAPER research read
on:
  push:
    branches: [main]
    paths: [deploy/v7-recent-research-request.json]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: v7-recent-research-read
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
          role-session-name: polymarket-recent-research-read
          aws-region: eu-west-2
      - name: Read recent PAPER evidence, encrypted to research recipient
        run: python3 ops/v7_recent_research_read.py deploy/v7-recent-research-request.json
