name: V7 collect after deploy

on:
  push:
    branches: [codex/v7-maker-ttl]
    paths: [.github/workflows/v7-collect-after-deploy.yml]

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      SERVER_HOST: ${{ vars.POLYMARKET_SERVER_HOST || '100.104.183.109' }}
      SERVER_USER: ${{ vars.POLYMARKET_SERVER_USER || 'enrico' }}
      SERVER_PORT: ${{ vars.POLYMARKET_SERVER_PORT || '22' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/v7-maker-ttl
          fetch-depth: 0
      - name: Resolve current main
        id: target
        run: |
          git fetch --no-tags origin main
          echo "sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
      - name: Select Tailscale credential mode
        id: tailscale_auth
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          if [[ -n "${TS_AUTHKEY:-}" ]]; then mode=authkey
          elif [[ -n "${TS_OAUTH_CLIENT_ID:-}" && -n "${TS_OAUTH_SECRET:-}" ]]; then mode=oauth
          else exit 1; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Join tailnet with auth key
        if: steps.tailscale_auth.outputs.mode == 'authkey'
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with: {authkey: "${{ secrets.TS_AUTHKEY }}", ping: "${{ env.SERVER_HOST }}"}
      - name: Join tailnet with OAuth
        if: steps.tailscale_auth.outputs.mode == 'oauth'
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TS_TAGS || 'tag:ci' }}
          ping: ${{ env.SERVER_HOST }}
      - name: Configure SSH
        env: {SSH_PRIVATE_KEY: "${{ secrets.POLYMARKET_SERVER_SSH_KEY }}"}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/polymarket_collect
          chmod 600 ~/.ssh/polymarket_collect
          ssh-keyscan -T 5 -p "$SERVER_PORT" "$SERVER_HOST" > ~/.ssh/known_hosts
      - name: Wait for exact deployment and collect evidence
        env: {TARGET_SHA: "${{ steps.target.outputs.sha }}"}
        shell: bash
        run: |
          set -euo pipefail
          ssh_common=(-i ~/.ssh/polymarket_collect -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10 -p "$SERVER_PORT")
          ready=0
          for _ in $(seq 1 270); do
            observed="$(ssh "${ssh_common[@]}" "$SERVER_USER@$SERVER_HOST" 'cat "$HOME/polymarket/runs/paper_v7_live/control/deployed_sha" 2>/dev/null || true')"
            if [[ "$observed" == "$TARGET_SHA" ]]; then ready=1; break; fi
            sleep 10
          done
          test "$ready" = 1
          mkdir -p diagnostics
          ssh "${ssh_common[@]}" "$SERVER_USER@$SERVER_HOST" "TARGET_SHA='$TARGET_SHA' bash -s" <<'REMOTE' > diagnostics/live_after_deploy.json
          set -euo pipefail
          cd "$HOME/polymarket"
          python3 - <<'PY'
          import collections,json,os,subprocess,time,urllib.request
          from pathlib import Path
          root=Path.home()/"polymarket/runs/paper_v7_live"
          repo=Path.home()/"polymarket"
          def load(path):
              try:
                  v=json.loads(path.read_text(encoding='utf-8')); return v if isinstance(v,dict) else {}
              except Exception:return {}
          def tail(path,n=5000):
              try: lines=path.read_text(encoding='utf-8',errors='replace').splitlines()[-n:]
              except Exception:return []
              out=[]
              for raw in lines:
                  try:v=json.loads(raw)
                  except Exception:continue
                  if isinstance(v,dict):out.append(v)
              return out
          runtime=load(root/'control/runtime_status.json')
          router=load(root/'external_fair/paper_router_status.json')
          state=load(root/'external_fair/paper_router_state.json')
          coordinator=load(root/'control/global_portfolio_coordinator.json')
          portfolio=load(root/'control/portfolio_state.json')
          reasons=collections.Counter(); events=collections.Counter(); latest=[]
          paths={
              'counterfactual':root/'external_fair/counterfactuals.jsonl',
              'research':root/'external_fair/research_evidence.jsonl',
              'decisions':root/'opportunities/decisions.jsonl',
              'ledger':root/'ledger/execution.jsonl',
          }
          for surface,path in paths.items():
              rows=tail(path)
              for row in rows:
                  events[f"{surface}:{row.get('event_type') or row.get('action') or row.get('state') or 'UNKNOWN'}"]+=1
                  for key in ('reason','last_attempt_reason','rejection_reason','status','state'):
                      value=row.get(key)
                      if isinstance(value,str) and value:reasons[f'{surface}:{key}:{value}']+=1
                  if isinstance(row.get('reasons'),list):
                      for value in row['reasons']:
                          if isinstance(value,str):reasons[f'{surface}:reasons:{value}']+=1
              latest.extend([{'surface':surface,**{k:r.get(k) for k in (
                  'timestamp','timestamp_ms','decision_timestamp_ns','event_type','action','state','reason','reasons',
                  'last_attempt_reason','market_id','token_id','side','expected_ev','predicted_alpha','limit_price',
                  'intended_size','filled_size','complete','new_risk_authorized','paper_exploration_authorized',
                  'deterministic_replay_key','selected_replay_key','model_sha') if k in r}} for r in rows[-10:]])
          metrics={}
          try:
              text=urllib.request.urlopen('http://127.0.0.1:9108/metrics',timeout=5).read().decode()
              prefixes=('polymarket_execution_','polymarket_runtime_pnl_usd','polymarket_v7_canonical_',
                        'polymarket_v7_health','polymarket_v7_execution_alive','polymarket_v7_ledger_valid',
                        'polymarket_v7_single_writer_ok','polymarket_v7_exact_sha_ok')
              for line in text.splitlines():
                  if line.startswith(prefixes):metrics[line.rsplit(' ',1)[0]]=line.rsplit(' ',1)[-1]
          except Exception as exc:metrics={'error':type(exc).__name__}
          out={
              'collected_at':int(time.time()),
              'repo_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'deployed_sha':(root/'control/deployed_sha').read_text().strip(),
              'runtime':runtime,
              'router_status':router,
              'router_state':state,
              'coordinator':coordinator,
              'portfolio':portfolio,
              'queue_counts':{p:len(list((root/p).glob('*.json'))) if (root/p).exists() else 0 for p in ('opportunities/inbox','opportunities/receipts','ledger/spool')},
              'events':dict(events.most_common()),
              'reasons':dict(reasons.most_common(200)),
              'latest':latest[-60:],
              'metrics':metrics,
              'paper_exploration_config':load(repo/'config/v7_external_fair.json').get('paper_exploration'),
          }
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
          REMOTE
          python3 -m json.tool diagnostics/live_after_deploy.json >/dev/null
      - name: Commit redacted evidence to diagnostic branch
        run: |
          git config user.name ENRICOBIGNOZZI
          git config user.email 88671442+ENRICOBIGNOZZI@users.noreply.github.com
          git add diagnostics/live_after_deploy.json
          git commit -m 'ops: record redacted live V7 funnel after deploy'
          git push origin HEAD:codex/v7-maker-ttl
