name: TEMP V7 maker replay clock patcher

on:
  push:
    branches:
      - fix/v7-maker-replay-clock-diagnostics-20260907

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/v7-maker-replay-clock-diagnostics-20260907
          fetch-depth: 0
      - name: Install focused build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev libssl-dev python3
      - name: Apply guarded source patch
        run: |
          set -euo pipefail
          python3 scripts/tmp_patch_v7_maker_replay_clock.py
          git diff --check
      - name: Build and run maker regressions
        run: |
          set -euo pipefail
          cmake -S . -B build-maker-replay -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-maker-replay --parallel 2 \
            --target pm_v7_maker_hft_tests pm_v7_maker_lane_tests
          ./build-maker-replay/pm_v7_maker_hft_tests
          ./build-maker-replay/pm_v7_maker_lane_tests
      - name: Commit source and regression only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/v7_maker_hft.cpp tests/test_v7_maker_hft.cpp
          git commit -m 'fix: make maker replay policy clock deterministic'
          git push origin HEAD:fix/v7-maker-replay-clock-diagnostics-20260907
