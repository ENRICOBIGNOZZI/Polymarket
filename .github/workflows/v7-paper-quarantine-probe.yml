name: V7 PAPER quarantine probe

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-paper-quarantine-probe-request.json

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
      INSTANCE_ID: ${{ vars.POLYMARKET_LONDON_INSTANCE_ID || 'i-0fba2bac9fdc5cbeb' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate
        run: |
          python3 - deploy/v7-paper-quarantine-probe-request.json <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1]))=={"schema":"polymarket_v7_paper_quarantine_probe_v1","read_only":True}
          PY
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: polymarket-v7-paper-quarantine-probe
          aws-region: eu-west-2
      - name: Read quarantine state
        run: |
          set -euo pipefail
          payload="$(cat <<'SH'
          set -euo pipefail
          PAPER=polymarket-v7-paper.service
          echo "SERVICE=$(systemctl is-active "$PAPER" || true)"
          echo "MAINPID=$(systemctl show "$PAPER" -p MainPID --value || true)"
          ROOT="$(systemctl show "$PAPER" -p Environment --value | python3 -c 'import shlex,sys; print(next(v.split("=",1)[1] for v in shlex.split(sys.stdin.read()) if v.startswith("PM_V7_RUN_ROOT=")))')"
          echo "ROOT=$ROOT"
          for name in supervisor_status.json supervisor_restarts.json runtime_status.json portfolio_state.json; do
            echo "===$name==="
            cat "$ROOT/control/$name" 2>/dev/null || true
            echo
          done
          echo "===KILL==="
          if [[ -e "$ROOT/control/KILL" ]]; then
            ls -l "$ROOT/control/KILL"
            cat "$ROOT/control/KILL" || true
          else
            echo ABSENT
          fi
          echo "===JOURNAL_RECENT==="
          journalctl -u "$PAPER" --since '2026-09-21 21:25:00' --no-pager || true
          SH
          )"
          encoded="$(printf '%s' "$payload" | base64 -w0)"
          wrapped="printf '%s' '$encoded' | base64 -d | bash"
          params="$(python3 -c 'import json,sys; print(json.dumps({"commands":[sys.argv[1]],"executionTimeout":["120"]},separators=(",",":")))' "$wrapped")"
          cid="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --parameters "$params" --comment "Polymarket V7 PAPER quarantine read-only probe" --region "$AWS_REGION" --query 'Command.CommandId' --output text)"
          for i in $(seq 1 60); do
            status="$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query Status --output text 2>/dev/null || true)"
            if [[ "$status" == Success ]]; then
              aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query StandardOutputContent --output text
              exit 0
            fi
            case "$status" in Failed|Cancelled|TimedOut)
              aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query StandardErrorContent --output text >&2 || true
              exit 1;;
            esac
            sleep 1
          done
          exit 1
