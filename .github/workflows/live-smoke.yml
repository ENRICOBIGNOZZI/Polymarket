name: live-api-smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/live-smoke.yml"

permissions:
  contents: read

concurrency:
  group: live-api-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-api-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev python3 curl

      - name: Build Release engine
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2

      - name: Read-only Gamma and CLOB scan
        run: |
          mkdir -p live-smoke-output
          ./build/polymarket_engine \
            --config config/paper.example.json \
            --once --scan-only --markets 10 --min-liquidity 100 \
            --run-dir live-smoke-output
          test -s live-smoke-output/status.json
          test -s live-smoke-output/signals.csv

      - name: Read-only Data API trade-tape probe
        run: |
          set -euo pipefail
          mkdir -p live-smoke-output
          curl -fsS --connect-timeout 10 --max-time 30 \
            -D live-smoke-output/data-api-trades.headers \
            'https://data-api.polymarket.com/trades?limit=100' \
            -o live-smoke-output/data-api-trades.json
          python3 - <<'PY'
          import json
          import time
          from pathlib import Path

          path = Path('live-smoke-output/data-api-trades.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          if not isinstance(payload, list):
              raise SystemExit('Data API /trades response is not an array')
          if not payload:
              raise SystemExit('Data API /trades returned zero public trades')

          timestamps = []
          malformed = 0
          for row in payload:
              if not isinstance(row, dict):
                  malformed += 1
                  continue
              try:
                  ts = int(row.get('timestamp', 0))
              except (TypeError, ValueError):
                  malformed += 1
                  continue
              if ts <= 0 or not row.get('conditionId') or not row.get('asset'):
                  malformed += 1
                  continue
              timestamps.append(ts)

          if not timestamps:
              raise SystemExit('Data API /trades returned no structurally valid trade rows')

          now = int(time.time())
          latest = max(timestamps)
          age = now - latest
          future_skew = latest - now
          health = {
              'status': 'healthy',
              'rows': len(payload),
              'valid_rows': len(timestamps),
              'malformed_rows': malformed,
              'latest_trade_ts': latest,
              'trade_age_seconds': age,
              'future_skew_seconds': max(0, future_skew),
          }
          if future_skew > 120:
              health['status'] = 'unhealthy'
              health['failure'] = 'future_trade_timestamp'
          elif age > 1200:
              health['status'] = 'unhealthy'
              health['failure'] = 'stale_global_trade_tape'

          Path('live-smoke-output/data-api-trade-health.json').write_text(
              json.dumps(health, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(health, sort_keys=True))
          if health['status'] != 'healthy':
              raise SystemExit(health['failure'])
          PY

      - name: Publish status summary
        if: always()
        run: |
          echo "## Read-only live API smoke" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          if test -s live-smoke-output/status.json; then
            python3 -m json.tool live-smoke-output/status.json >> "$GITHUB_STEP_SUMMARY" || cat live-smoke-output/status.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo '{"status":"missing"}' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "## Public Data API trade tape" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          if test -s live-smoke-output/data-api-trade-health.json; then
            cat live-smoke-output/data-api-trade-health.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo '{"status":"missing"}' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-${{ github.run_id }}
          path: live-smoke-output/
          if-no-files-found: warn
          retention-days: 7
