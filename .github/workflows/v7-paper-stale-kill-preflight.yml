name: V7 PAPER stale-kill preflight

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-paper-stale-kill-preflight-request.json

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
      INSTANCE_ID: ${{ vars.POLYMARKET_LONDON_INSTANCE_ID || 'i-0fba2bac9fdc5cbeb' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: polymarket-v7-stale-kill-preflight
          aws-region: eu-west-2
      - name: Read exact preflight
        run: |
          set -euo pipefail
          payload="$(cat <<'SH'
          set -euo pipefail
          PAPER=polymarket-v7-paper.service
          ROOT="$(systemctl show "$PAPER" -p Environment --value | python3 -c 'import shlex,sys; print(next(v.split("=",1)[1] for v in shlex.split(sys.stdin.read()) if v.startswith("PM_V7_RUN_ROOT=")))')"
          python3 - "$ROOT" <<'PY'
          import json,sys,os
          from pathlib import Path
          root=Path(sys.argv[1])
          def load(p):
              try:return json.loads(p.read_text())
              except Exception:return {}
          portfolio=load(root/'control/portfolio_state.json')
          runtime=load(root/'control/runtime_status.json')
          supervisor=load(root/'control/supervisor_status.json')
          account=load(root/'external_fair/paper_router_status.json')
          executor=load(root/'micro_maker/authorized_make_executor_status.json')
          ledger=root/'ledger/execution.jsonl'
          kill=root/'control/KILL'
          print('SERVICE_INACTIVE=1')
          print('KILL_EXISTS='+str(kill.exists()))
          print('KILL_SIZE='+str(kill.stat().st_size if kill.exists() else -1))
          print('LEDGER_SIZE='+str(ledger.stat().st_size if ledger.exists() else -1))
          print('PORTFOLIO='+json.dumps({k:portfolio.get(k) for k in ['paper_only','authenticated_execution','real_order_submission','real_capital_at_risk','killed','drawdown','max_drawdown']},sort_keys=True))
          print('DETAILS='+json.dumps((((portfolio.get('engines') or {}).get('CRYPTO_SETTLEMENT_ENGINE') or {}).get('details') or {}),sort_keys=True))
          print('RUNTIME='+json.dumps({k:runtime.get(k) for k in ['model_sha','paper_only','authenticated_execution','real_order_submission','killed','state','pid']},sort_keys=True))
          print('SUPERVISOR='+json.dumps({k:supervisor.get(k) for k in ['expected_sha','state','reasons']},sort_keys=True))
          print('ACCOUNT='+json.dumps({k:account.get(k) for k in ['paper_only','authenticated_execution','open_positions','pending_maker_orders']},sort_keys=True))
          print('EXECUTOR='+json.dumps({k:executor.get(k) for k in ['paper_only','authenticated_execution','active_orders']},sort_keys=True))
          PY
          SH
          )"
          encoded="$(printf '%s' "$payload" | base64 -w0)"
          wrapped="printf '%s' '$encoded' | base64 -d | bash"
          params="$(python3 -c 'import json,sys; print(json.dumps({"commands":[sys.argv[1]],"executionTimeout":["90"]},separators=(",",":")))' "$wrapped")"
          cid="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --parameters "$params" --comment "Polymarket V7 stale KILL preflight" --region "$AWS_REGION" --query 'Command.CommandId' --output text)"
          for i in $(seq 1 45); do
            status="$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query Status --output text 2>/dev/null || true)"
            if [[ "$status" == Success ]]; then
              aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query StandardOutputContent --output text
              exit 0
            fi
            case "$status" in Failed|Cancelled|TimedOut) exit 1;; esac
            sleep 1
          done
          exit 1
