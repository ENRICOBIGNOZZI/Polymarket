name: V7 deploy PAPER server

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main and paper-validated SHA approved for cutover
        required: true
        type: string
      cutover_approved:
        description: Confirm the single-writer blue/green PAPER cutover
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: polymarket-v7-paper-server
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.cutover_approved == true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SERVER_HOST: ${{ vars.POLYMARKET_SERVER_HOST || '100.104.183.109' }}
      SERVER_USER: ${{ vars.POLYMARKET_SERVER_USER || 'enrico' }}
      SERVER_PORT: ${{ vars.POLYMARKET_SERVER_PORT || '22' }}
      EXPECTED_VALIDATED_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: paper-validated
          fetch-depth: 0

      - name: Fail-closed V7 deploy preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main paper-validated
          validated_sha="$(git rev-parse origin/paper-validated)"
          main_sha="$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD)" = "$validated_sha"

          if [[ "$main_sha" != "$validated_sha" ]]; then
            echo "V7 deploy blocked: main and paper-validated are not the same SHA" >&2
            exit 1
          fi

          [[ "$EXPECTED_VALIDATED_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$validated_sha" != "$EXPECTED_VALIDATED_SHA" || "$main_sha" != "$EXPECTED_VALIDATED_SHA" ]]; then
            echo "V7 deploy blocked: canonical refs do not match the explicitly approved SHA" >&2
            exit 1
          fi

          if python3 scripts/v7_cutover_contract.py --repository-root . --expected-head "$validated_sha" --github-env "$GITHUB_ENV"; then
            test -f monitoring/v7_monitoring_manifest.json
            python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('monitoring/v7_monitoring_manifest.json').read_text(encoding='utf-8'))
          assert m.get('schema') == 'polymarket_v7_monitoring_manifest_v2'
          assert m.get('version') == 7
          assert m.get('paper_only') is True
          assert m.get('authenticated_execution') is False
          assert m.get('run_root') == 'runs/paper_v7_live'
          assert str((m.get('grafana') or {}).get('dashboard_uid') or '')
          required=set(m.get('required_surfaces') or [])
          assert {
              'control/runtime_status.json',
              'control/incumbent_identity.json',
              'control/portfolio_state.json',
              'control/allocations/manifest.json',
              'graph_rv/status.json',
              'canonical_economics.json',
              'ledger/execution.jsonl',
              'trade_tape.csv',
          } <= required
          PY
            echo "ready=true" >> "$GITHUB_OUTPUT"
            printf 'reconciliation_result=ready\nvalidated_sha=%s\nmain_sha=%s\nexpected_validated_sha=%s\n' \
              "$validated_sha" "$main_sha" "${EXPECTED_VALIDATED_SHA:-none}" | tee deploy-evidence.txt
          else
            echo "V7 deploy preflight failed" >&2
            exit 1
          fi

      - name: Select Tailscale credential mode
        if: steps.preflight.outputs.ready == 'true'
        id: tailscale_auth
        shell: bash
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TS_TAGS: ${{ vars.TS_TAGS || 'tag:ci' }}
        run: |
          set -euo pipefail
          if [[ -n "${TS_AUTHKEY:-}" ]]; then
            mode=authkey
          elif [[ -n "${TS_OAUTH_CLIENT_ID:-}" && -n "${TS_OAUTH_SECRET:-}" ]]; then
            test -n "${TS_TAGS:-}"
            mode=oauth
          else
            echo "No visible Tailscale credential set" >&2
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Join private tailnet with auth key
        if: steps.preflight.outputs.ready == 'true' && steps.tailscale_auth.outputs.mode == 'authkey'
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Join private tailnet with OAuth
        if: steps.preflight.outputs.ready == 'true' && steps.tailscale_auth.outputs.mode == 'oauth'
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TS_TAGS || 'tag:ci' }}

      - name: Configure SSH identity and await private server
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.POLYMARKET_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/polymarket_deploy
          chmod 600 ~/.ssh/polymarket_deploy
          : > ~/.ssh/known_hosts
          ready=0
          for _ in $(seq 1 30); do
            tailscale ping --timeout=4s -c 1 "$SERVER_HOST" >/dev/null 2>&1 || true
            if ssh-keyscan -T 3 -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              ready=1
              break
            fi
            sleep 3
          done
          test "$ready" = 1
          test -s ~/.ssh/known_hosts

      - name: Reconcile exact paper-validated V7 SHA on server
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          validated_sha="$(git rev-parse origin/paper-validated)"
          ssh_common=(
            -i ~/.ssh/polymarket_deploy
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o ConnectTimeout=10
            -o ConnectionAttempts=3
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -p "$SERVER_PORT"
          )

          set +e
          ssh "${ssh_common[@]}" "$SERVER_USER@$SERVER_HOST" \
            "EXPECTED_VALIDATED_SHA='$validated_sha' bash -s" <<'REMOTE' | tee -a deploy-evidence.txt
          set -euo pipefail
          cd ~/polymarket

          if [[ "$(uname -s)" == "Darwin" ]]; then
            brew_bin=""
            for candidate in /opt/homebrew/bin/brew /usr/local/bin/brew; do
              if [[ -x "$candidate" ]]; then
                brew_bin="$candidate"
                break
              fi
            done
            [[ -n "$brew_bin" ]] || {
              echo "V7 deploy blocked: Homebrew not found on macOS server" >&2
              exit 1
            }
            eval "$("$brew_bin" shellenv)"
            missing=""
            for cmd in cmake pkg-config prometheus grafana; do
              if ! command -v "$cmd" >/dev/null 2>&1; then
                missing="$missing $cmd"
              fi
            done
            if [[ -n "$missing" ]]; then
              echo "[v7-deploy] Installing missing macOS dependencies:$missing"
              brew install $missing
            fi
            for cmd in cmake pkg-config prometheus grafana; do
              command -v "$cmd" >/dev/null 2>&1
            done
          fi

          git fetch --no-tags origin main paper-validated
          main_sha="$(git rev-parse origin/main)"
          validated_sha="$(git rev-parse origin/paper-validated)"
          test "$validated_sha" = "$EXPECTED_VALIDATED_SHA"
          test "$main_sha" = "$EXPECTED_VALIDATED_SHA"

          tmp_checkout="$(mktemp -d)"
          trap 'git worktree remove --force "$tmp_checkout" >/dev/null 2>&1 || true; rm -rf "$tmp_checkout"' EXIT
          rmdir "$tmp_checkout"
          git worktree add --detach "$tmp_checkout" "$validated_sha" >/dev/null
          python3 "$tmp_checkout/scripts/v7_cutover_contract.py" \
            --repository-root "$tmp_checkout" --expected-head "$validated_sha" >/dev/null
          test -f "$tmp_checkout/ops/update_server_v7.sh"
          test -f "$tmp_checkout/monitoring/v7_monitoring_manifest.json"
          git worktree remove --force "$tmp_checkout" >/dev/null
          trap - EXIT

          updater="$(mktemp)"
          trap 'rm -f "$updater"' EXIT
          git show "$validated_sha:ops/update_server_v7.sh" > "$updater"
          chmod 700 "$updater"
          POLYMARKET_APP_DIR="$HOME/polymarket" \
            EXPECTED_VALIDATED_SHA="$validated_sha" \
            POLYMARKET_DEPLOY_REF=paper-validated \
            POLYMARKET_RUNTIME_HEALTH_ATTEMPTS=60 \
            bash "$updater"
          printf 'deploy_result=success\ndeployed_sha=%s\norigin_main=%s\npaper_validated=%s\n' \
            "$validated_sha" "$main_sha" "$validated_sha"
          REMOTE
          primary_status=${PIPESTATUS[0]}
          set -e

          if [[ "$primary_status" -ne 0 ]]; then
            printf 'primary_ssh_status=%s\n' "$primary_status" | tee -a deploy-evidence.txt
            if [[ "$primary_status" -ne 255 ]]; then
              echo "V7 remote deploy failed with non-transport status=$primary_status" >&2
              exit "$primary_status"
            fi

            recovered=0
            for _ in $(seq 1 18); do
              if ssh "${ssh_common[@]}" "$SERVER_USER@$SERVER_HOST" \
                "EXPECTED_VALIDATED_SHA='$validated_sha' bash -s" <<'VERIFY' >> deploy-evidence.txt 2>&1
          set -euo pipefail
          cd ~/polymarket
          root="$HOME/polymarket/runs/paper_v7_live"
          test "$(git rev-parse HEAD)" = "$EXPECTED_VALIDATED_SHA"
          test "$(cat "$root/control/deployed_sha")" = "$EXPECTED_VALIDATED_SHA"
          python3 - "$root" "$EXPECTED_VALIDATED_SHA" <<'PY'
          import csv,json,os,sys,time
          from pathlib import Path
          root=Path(sys.argv[1]); sha=sys.argv[2]; now=int(time.time())
          runtime=json.loads((root/'control/runtime_status.json').read_text(encoding='utf-8'))
          identity=json.loads((root/'control/incumbent_identity.json').read_text(encoding='utf-8'))
          portfolio=json.loads((root/'control/portfolio_state.json').read_text(encoding='utf-8'))
          graph=json.loads((root/'graph_rv/status.json').read_text(encoding='utf-8'))
          economics=json.loads((root/'canonical_economics.json').read_text(encoding='utf-8'))
          assert runtime.get('version') == 7 and runtime.get('model_sha') == sha
          assert runtime.get('paper_only') is True and runtime.get('authenticated_execution') is False
          assert runtime.get('real_order_submission') is False and runtime.get('state') == 'running'
          assert runtime.get('killed') is False
          assert identity.get('schema') == 'polymarket_v7_incumbent_identity_v1'
          assert identity.get('verified') is True and identity.get('runtime_sha') == sha
          for key in ('config_hash','policy_hash','model_hash','run_id','ledger_id','server_id'):
              assert identity.get(key) == runtime.get(key) and str(identity.get(key) or '')
          pid=int(runtime.get('pid') or 0); assert pid > 0; os.kill(pid,0)
          assert now-int(runtime.get('timestamp') or 0) <= 180
          assert portfolio.get('paper_only') is True and portfolio.get('authenticated_execution') is False
          assert portfolio.get('killed') is False and float(portfolio.get('drawdown',1)) < .15
          assert now-int(portfolio.get('timestamp') or 0) <= 30
          assert graph.get('paper_only') is True and graph.get('authenticated_execution') is False
          assert now-int(graph.get('timestamp') or 0) <= 180
          assert economics.get('paper_only') is True and economics.get('authenticated_execution') is False
          assert economics.get('expected_model_sha') == sha
          with (root/'trade_tape.csv').open(newline='',encoding='utf-8') as handle:
              rows=list(csv.DictReader(handle))
          assert rows and max(int(float(r.get('received_ms') or 0)) for r in rows) > 0
          print(f'recovered_runtime_pid={pid}')
          PY
          curl -fsS http://127.0.0.1:9108/healthz >/dev/null
          metrics="$(curl -fsS http://127.0.0.1:9108/metrics)"
          grep -q '^polymarket_v7_runtime_info 1$' <<<"$metrics"
          grep -q '^polymarket_v7_execution_alive 1$' <<<"$metrics"
          grep -q '^polymarket_v7_paper_only_contract_ok 1$' <<<"$metrics"
          grep -q '^polymarket_v7_authenticated_execution_disabled 1$' <<<"$metrics"
          grep -q '^polymarket_v7_ledger_valid 1$' <<<"$metrics"
          curl -fsS http://127.0.0.1:9090/-/ready >/dev/null
          curl -fsS http://127.0.0.1:3000/api/health >/dev/null
          uid="$(python3 - <<'PY'
          import json
          print(json.load(open('monitoring/v7_monitoring_manifest.json'))['grafana']['dashboard_uid'])
          PY
          )"
          curl -fsS "http://127.0.0.1:3000/api/dashboards/uid/$uid" >/dev/null
          VERIFY
              then
                recovered=1
                break
              fi
              sleep 5
            done
            test "$recovered" = 1
            printf 'deploy_result=recovered_after_transport_loss\ndeployed_sha=%s\n' \
              "$validated_sha" | tee -a deploy-evidence.txt
          fi

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v7-paper-server-deploy-${{ github.run_id }}
          path: deploy-evidence.txt
          if-no-files-found: warn
          retention-days: 14
