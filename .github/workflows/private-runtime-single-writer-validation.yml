name: Private runtime single-writer validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/runtime_singleton_launcher.py"
      - "scripts/paper_latest_loop.sh"
      - "scripts/paper_v6_loop.sh"
      - "scripts/v6_market_proxy.py"
      - "config/live_champion.json"
      - "config/paper_v6.json"
      - "tests/test_fast_runtime_contract.py"
      - "tests/test_v6_runtime_contract.py"
      - "tests/test_v6_market_proxy_deadline.py"
      - "scripts/validate_scheduler_registry.py"
      - ".github/workflows/private-runtime-single-writer-validation.yml"

permissions:
  contents: read

concurrency:
  group: polymarket-private-single-writer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  private-proof:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SERVER_HOST: ${{ vars.POLYMARKET_SERVER_HOST || '100.104.183.109' }}
      SERVER_USER: ${{ vars.POLYMARKET_SERVER_USER || 'enrico' }}
      SERVER_PORT: ${{ vars.POLYMARKET_SERVER_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Bind validation to exact source head
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          test "$sha" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          python3 -m unittest tests/test_fast_runtime_contract.py -v

      - name: Select existing Tailscale credential mode
        id: tailscale_auth
        shell: bash
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TS_TAGS: ${{ vars.TS_TAGS || 'tag:ci' }}
        run: |
          set -euo pipefail
          if [[ -n "${TS_AUTHKEY:-}" ]]; then
            mode=authkey
          elif [[ -n "${TS_OAUTH_CLIENT_ID:-}" && -n "${TS_OAUTH_SECRET:-}" ]]; then
            test -n "${TS_TAGS:-}"
            mode=oauth
          else
            echo "No visible Tailscale credential set" >&2
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Join private tailnet with auth key
        if: steps.tailscale_auth.outputs.mode == 'authkey'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: ${{ env.SERVER_HOST }}

      - name: Join private tailnet with OAuth
        if: steps.tailscale_auth.outputs.mode == 'oauth'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TS_TAGS || 'tag:ci' }}
          ping: ${{ env.SERVER_HOST }}

      - name: Configure SSH identity
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.POLYMARKET_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}" || { echo "missing POLYMARKET_SERVER_SSH_KEY" >&2; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/polymarket_deploy
          chmod 600 ~/.ssh/polymarket_deploy
          ssh-keyscan -T 5 -p "$SERVER_PORT" "$SERVER_HOST" > ~/.ssh/known_hosts

      - name: Prove exact-head single ownership on private macOS node
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p private-single-writer-evidence
          ssh -i ~/.ssh/polymarket_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=10 -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "SOURCE_SHA='$SOURCE_SHA' PROBE_ID='${GITHUB_RUN_ID}' bash -s" <<'REMOTE' | tee private-single-writer-evidence/remote-proof.txt
          set -euo pipefail
          repo="$HOME/polymarket"
          root="$repo/.private_validation/$PROBE_ID"
          source_dir="$root/source"
          run_root="$root/run"
          evidence="$root/evidence"
          first_pid=0
          restart_pid=0

          cleanup() {
            set +e
            for pid in "$restart_pid" "$first_pid"; do
              if [[ "$pid" =~ ^[0-9]+$ ]] && (( pid > 0 )); then
                kill "$pid" 2>/dev/null || true
                for _ in {1..20}; do kill -0 "$pid" 2>/dev/null || break; sleep 0.25; done
                kill -9 "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
              fi
            done
          }
          trap cleanup EXIT INT TERM

          rm -rf "$root"
          mkdir -p "$source_dir" "$run_root" "$evidence"
          cd "$repo"
          git fetch -q origin "$SOURCE_SHA"
          git cat-file -e "$SOURCE_SHA^{commit}"
          git archive "$SOURCE_SHA" | tar -x -C "$source_dir"
          test "$(git rev-parse "$SOURCE_SHA")" = "$SOURCE_SHA"
          ln -s "$repo/build" "$source_dir/build"

          python3 - "$source_dir/config/paper_v6.json" "$root/probe_config.json" <<'PY'
          import json,sys
          src,dst=sys.argv[1:]
          cfg=json.load(open(src,encoding='utf-8'))
          cfg['starting_capital']=0.0
          cfg['max_drawdown']=0.15
          json.dump(cfg,open(dst,'w',encoding='utf-8'),indent=2,sort_keys=True)
          open(dst,'a',encoding='utf-8').write('\n')
          PY

          port="$(python3 - <<'PY'
          import socket
          s=socket.socket(); s.bind(('127.0.0.1',0)); print(s.getsockname()[1]); s.close()
          PY
          )"

          runtime_env=(
            env
            POLYMARKET_RUN_ROOT="$run_root"
            POLYMARKET_CONFIG="$root/probe_config.json"
            POLYMARKET_FAST_ARB_ENABLED=0
            V6_MARKET_PROXY_PORT="$port"
            V6_MARKETS=1
            V6_RECORDER_MARKETS=1
          )

          cd "$source_dir"
          "${runtime_env[@]}" /usr/bin/env bash scripts/paper_latest_loop.sh \
            >"$evidence/first-runtime.log" 2>&1 &
          first_pid=$!

          for _ in {1..80}; do
            [[ -s "$run_root/runtime_owner.lock" ]] && kill -0 "$first_pid" 2>/dev/null && break
            kill -0 "$first_pid" 2>/dev/null || { cat "$evidence/first-runtime.log" >&2; exit 1; }
            sleep 0.25
          done
          test -s "$run_root/runtime_owner.lock"
          owner_pid="$(tr -dc '0-9' < "$run_root/runtime_owner.lock")"
          test "$owner_pid" = "$first_pid"
          kill -0 "$owner_pid"
          printf 'source_sha=%s\nfirst_owner_pid=%s\nproxy_port=%s\n' "$SOURCE_SHA" "$owner_pid" "$port"

          set +e
          "${runtime_env[@]}" /usr/bin/env bash scripts/paper_latest_loop.sh \
            >"$evidence/competing-runtime.out" 2>"$evidence/competing-runtime.err"
          competing_rc=$?
          set -e
          printf 'competing_rc=%s\n' "$competing_rc"
          test "$competing_rc" -eq 75
          grep -q 'another paper runtime already owns' "$evidence/competing-runtime.err"

          snapshot_tree() {
            local label="$1"
            python3 - "$first_pid" "$label" "$evidence" <<'PY'
          import json,subprocess,sys
          owner=int(sys.argv[1]); label=sys.argv[2]; out=sys.argv[3]
          rows=[]
          for line in subprocess.check_output(['ps','-axo','pid=,ppid=,command='],text=True).splitlines():
              parts=line.strip().split(None,2)
              if len(parts)<3: continue
              try: pid=int(parts[0]); ppid=int(parts[1])
              except ValueError: continue
              rows.append((pid,ppid,parts[2]))
          children={}
          for pid,ppid,cmd in rows: children.setdefault(ppid,[]).append((pid,cmd))
          desc=[]; stack=[owner]; seen={owner}
          while stack:
              parent=stack.pop()
              for pid,cmd in children.get(parent,[]):
                  if pid in seen: continue
                  seen.add(pid); desc.append({'pid':pid,'command':cmd}); stack.append(pid)
          markers=[
              'paper_v6_loop.sh','v6_market_proxy.py','polymarket_trade_recorder',
              'polymarket_multileg_paper','polymarket_engine','polymarket_maker_paper',
              'v6_micro_taker.py','v6_hard_arb_paper.py','v6_local_factor_intents.py',
              'v6_relation_intents.py','v6_intent_guard.py','v6_external_bridge.py'
          ]
          counts={m:sum(m in row['command'] for row in desc) for m in markers}
          bad={k:v for k,v in counts.items() if v>1}
          payload={'owner':owner,'label':label,'descendants':desc,'counts':counts,'duplicates':bad}
          open(f'{out}/process-{label}.json','w',encoding='utf-8').write(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'label':label,'counts':counts,'duplicates':bad},sort_keys=True))
          if bad: raise SystemExit(1)
          PY
          }

          for i in 1 2 3; do
            sleep 10
            kill -0 "$first_pid"
            snapshot_tree "steady-$i"
          done

          python3 scripts/v6_runtime_status.py --config "$root/probe_config.json" --run-root "$run_root" >/dev/null
          cp "$run_root/runtime_status.json" "$evidence/status-before-restart.json"
          if find "$run_root" -type f \( -name '*.tmp' -o -name '*.tmp.*' \) -print | tee "$evidence/temp-files-before.txt" | grep -q .; then
            echo 'temporary state files remain before restart' >&2
            exit 1
          fi

          stopped_or_zombie() {
            local pid="$1"
            local state=""
            if ! kill -0 "$pid" 2>/dev/null; then return 0; fi
            state="$(ps -o stat= -p "$pid" 2>/dev/null | tr -d '[:space:]')"
            [[ "$state" == Z* ]]
          }

          kill "$first_pid"
          for _ in {1..40}; do
            stopped_or_zombie "$first_pid" && break
            sleep 0.25
          done
          if ! stopped_or_zombie "$first_pid"; then
            echo 'first runtime did not stop cleanly' >&2
            exit 1
          fi
          # kill -0 remains true for an unreaped zombie on macOS. Reap it before
          # asserting lock recovery; lingering children would still retain the lock.
          wait "$first_pid" 2>/dev/null || true
          first_pid=0

          port2="$(python3 - <<'PY'
          import socket
          s=socket.socket(); s.bind(('127.0.0.1',0)); print(s.getsockname()[1]); s.close()
          PY
          )"
          runtime_env2=(
            env
            POLYMARKET_RUN_ROOT="$run_root"
            POLYMARKET_CONFIG="$root/probe_config.json"
            POLYMARKET_FAST_ARB_ENABLED=0
            V6_MARKET_PROXY_PORT="$port2"
            V6_MARKETS=1
            V6_RECORDER_MARKETS=1
          )
          "${runtime_env2[@]}" /usr/bin/env bash scripts/paper_latest_loop.sh \
            >"$evidence/restarted-runtime.log" 2>&1 &
          restart_pid=$!
          restarted_owner=""
          candidate_owner=""
          for _ in {1..80}; do
            kill -0 "$restart_pid" 2>/dev/null || { cat "$evidence/restarted-runtime.log" >&2; exit 1; }
            if [[ -s "$run_root/runtime_owner.lock" ]]; then
              candidate_owner="$(tr -dc '0-9' < "$run_root/runtime_owner.lock")"
              if [[ "$candidate_owner" = "$restart_pid" ]]; then
                restarted_owner="$candidate_owner"
                break
              fi
            fi
            sleep 0.25
          done
          if [[ "$restarted_owner" != "$restart_pid" ]]; then
            echo "restart lock owner mismatch: expected=$restart_pid observed=${candidate_owner:-empty}" >&2
            cat "$evidence/restarted-runtime.log" >&2 || true
            exit 1
          fi
          printf 'restart_owner_pid=%s\n' "$restarted_owner"
          sleep 10

          python3 scripts/v6_runtime_status.py --config "$root/probe_config.json" --run-root "$run_root" >/dev/null
          cp "$run_root/runtime_status.json" "$evidence/status-after-restart.json"
          python3 - "$evidence/status-before-restart.json" "$evidence/status-after-restart.json" <<'PY'
          import json,math,sys
          a=json.load(open(sys.argv[1],encoding='utf-8')); b=json.load(open(sys.argv[2],encoding='utf-8'))
          keys=['starting_capital','cash','equity','pnl','realized_pnl','reserved_cash','gross_exposure']
          for obj in (a,b):
              assert obj.get('paper_only') is True
              assert abs(float(obj['equity'])-float(obj['starting_capital'])-float(obj['pnl'])) < 1e-8
              assert float(obj['drawdown']) <= 0.15 + 1e-12
          for key in keys:
              av=float(a.get(key,0.0)); bv=float(b.get(key,0.0))
              assert math.isclose(av,bv,rel_tol=1e-9,abs_tol=1e-8),(key,av,bv)
          print('restart_accounting_identity=stable')
          PY

          if find "$run_root" -type f \( -name '*.tmp' -o -name '*.tmp.*' \) -print | tee "$evidence/temp-files-after.txt" | grep -q .; then
            echo 'temporary state files remain after restart' >&2
            exit 1
          fi
          test -z "$(grep -R -E 'Cannot replace state file|another V6 multi-leg broker already owns|FileNotFoundError.*\.tmp' "$run_root" --include='*.log' 2>/dev/null || true)"

          printf 'private_single_writer_validation=PASS\n'
          REMOTE

          scp -i ~/.ssh/polymarket_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            -P "$SERVER_PORT" -r "$SERVER_USER@$SERVER_HOST:~/polymarket/.private_validation/${GITHUB_RUN_ID}/evidence/." \
            private-single-writer-evidence/

      - name: Upload private exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-single-writer-${{ github.run_id }}
          path: private-single-writer-evidence/
          if-no-files-found: error
          retention-days: 30
