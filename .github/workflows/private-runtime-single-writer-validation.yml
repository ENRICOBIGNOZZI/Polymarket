name: Private runtime single-writer validation

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: false
        type: string
  # Live PAPER validation is exact-SHA. Therefore every main SHA needs a
  # single-writer proof, even when the commit changes only deploy/monitoring
  # orchestration and does not touch the runtime files themselves.
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: polymarket-v7-single-writer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  private-proof:
    name: single-writer-v7
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VALIDATION_SHA: ${{ github.event.inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact V7 source head
        run: |
          set -euo pipefail
          [[ "$VALIDATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"
      - name: Prove V7 direct single-writer ownership
        run: |
          set -euo pipefail
          bash -n scripts/paper_v7_execution_loop.sh
          python3 -m unittest tests/test_v7_single_writer_contract.py -v
