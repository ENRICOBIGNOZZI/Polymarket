name: Private runtime single-writer validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/runtime_singleton_launcher.py"
      - "scripts/run_paper.sh"
      - "scripts/v7_runtime_status.py"
      - "scripts/v7_cutover_contract.py"
      - "scripts/v7_server_health.py"
      - "ops/update_server.sh"
      - "ops/update_server_macos.sh"
      - "config/live_champion.json"
      - "config/scheduler_registry.json"
      - "scripts/validate_scheduler_registry.py"
      - ".github/workflows/v7-*.yml"
      - ".github/workflows/private-runtime-single-writer-validation.yml"
      - "tests/test_fast_runtime_contract.py"

permissions:
  contents: read

concurrency:
  group: polymarket-private-single-writer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  private-proof:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SERVER_HOST: ${{ vars.POLYMARKET_SERVER_HOST || '100.104.183.109' }}
      SERVER_USER: ${{ vars.POLYMARKET_SERVER_USER || 'enrico' }}
      SERVER_PORT: ${{ vars.POLYMARKET_SERVER_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Bind validation to exact source head
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p private-single-writer-evidence
          sha="$(git rev-parse HEAD)"
          test "$sha" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$sha" > private-single-writer-evidence/source-sha.txt
          python3 -m unittest tests/test_fast_runtime_contract.py -v \
            |& tee private-single-writer-evidence/local-contract-tests.txt

      - name: Select existing Tailscale credential mode
        id: tailscale_auth
        shell: bash
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TS_TAGS: ${{ vars.TS_TAGS || 'tag:ci' }}
        run: |
          set -euo pipefail
          if [[ -n "${TS_AUTHKEY:-}" ]]; then
            mode=authkey
          elif [[ -n "${TS_OAUTH_CLIENT_ID:-}" && -n "${TS_OAUTH_SECRET:-}" ]]; then
            test -n "${TS_TAGS:-}"
            mode=oauth
          else
            echo "No visible Tailscale credential set" >&2
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Join private tailnet with auth key
        if: steps.tailscale_auth.outputs.mode == 'authkey'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: ${{ env.SERVER_HOST }}

      - name: Join private tailnet with OAuth
        if: steps.tailscale_auth.outputs.mode == 'oauth'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TS_TAGS || 'tag:ci' }}
          ping: ${{ env.SERVER_HOST }}

      - name: Configure SSH identity
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.POLYMARKET_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}" || { echo "missing POLYMARKET_SERVER_SSH_KEY" >&2; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/polymarket_validation
          chmod 600 ~/.ssh/polymarket_validation
          ssh-keyscan -T 5 -p "$SERVER_PORT" "$SERVER_HOST" > ~/.ssh/known_hosts

      - name: Prove exact-head singleton primitive on private node
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/polymarket_validation -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=10 -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "SOURCE_SHA='$SOURCE_SHA' PROBE_ID='${GITHUB_RUN_ID}' bash -s" <<'REMOTE' \
            | tee private-single-writer-evidence/remote-proof.txt
          set -euo pipefail
          repo="$HOME/polymarket"
          root="$repo/.private_validation/$PROBE_ID"
          source_dir="$root/source"
          run_root="$root/run"
          evidence="$root/evidence"
          first_pid=0
          child_pid=0

          cleanup() {
            set +e
            if [[ "$first_pid" =~ ^[1-9][0-9]*$ ]]; then
              kill -9 "$first_pid" 2>/dev/null || true
              wait "$first_pid" 2>/dev/null || true
            fi
            if [[ "$child_pid" =~ ^[1-9][0-9]*$ ]]; then
              kill -9 "$child_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT INT TERM

          rm -rf "$root"
          mkdir -p "$source_dir" "$run_root" "$evidence"
          cd "$repo"
          git fetch -q origin "$SOURCE_SHA"
          git cat-file -e "$SOURCE_SHA^{commit}"
          test "$(git rev-parse "$SOURCE_SHA")" = "$SOURCE_SHA"
          git archive "$SOURCE_SHA" | tar -x -C "$source_dir"

          launcher="$source_dir/scripts/runtime_singleton_launcher.py"
          lock="$run_root/runtime_owner.lock"
          child_file="$evidence/child.pid"
          test -f "$launcher"
          python3 -m py_compile "$launcher"

          child_code='import os,sys,time; open(sys.argv[1],"w",encoding="utf-8").write(str(os.getpid())); time.sleep(30)'
          python3 "$launcher" --lock "$lock" -- \
            python3 -c "$child_code" "$child_file" \
            >"$evidence/first-owner.out" 2>"$evidence/first-owner.err" &
          first_pid=$!

          for _ in $(seq 1 100); do
            if [[ -s "$lock" && -s "$child_file" ]]; then
              break
            fi
            kill -0 "$first_pid" 2>/dev/null || {
              echo "first singleton owner exited before materializing ownership" >&2
              exit 1
            }
            sleep 0.05
          done
          test -s "$lock"
          test -s "$child_file"
          test "$(tr -d '[:space:]' < "$lock")" = "$first_pid"
          child_pid="$(tr -d '[:space:]' < "$child_file")"
          [[ "$child_pid" =~ ^[1-9][0-9]*$ ]]
          kill -0 "$child_pid"

          set +e
          python3 "$launcher" --lock "$lock" -- python3 -c 'print("unexpected-owner")' \
            >"$evidence/second-owner.out" 2>"$evidence/second-owner.err"
          second_rc=$?
          set -e
          test "$second_rc" -eq 75
          grep -q 'another paper runtime already owns' "$evidence/second-owner.err"

          # Kill only the isolated supervisor. Its child intentionally remains
          # alive long enough to prove the singleton descriptor was not inherited.
          kill -9 "$first_pid"
          wait "$first_pid" 2>/dev/null || true
          first_pid=0
          kill -0 "$child_pid"

          python3 "$launcher" --lock "$lock" -- python3 -c 'print("reacquired")' \
            >"$evidence/third-owner.out" 2>"$evidence/third-owner.err"
          grep -qx 'reacquired' "$evidence/third-owner.out"

          kill -9 "$child_pid" 2>/dev/null || true
          child_pid=0

          python3 - "$evidence/summary.json" "$SOURCE_SHA" "$second_rc" <<'PY'
          import json
          import sys
          from pathlib import Path

          output, source_sha, second_rc = sys.argv[1:]
          payload = {
              "schema": "polymarket_v7_private_single_writer_probe_v1",
              "source_sha": source_sha,
              "paper_only": True,
              "authenticated_execution": False,
              "isolated_probe": True,
              "live_runtime_started": False,
              "second_owner_exit_code": int(second_rc),
              "singleton_exclusion": True,
              "descriptor_not_inherited": True,
              "reacquire_after_supervisor_exit": True,
          }
          Path(output).write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(payload, sort_keys=True))
          PY
          REMOTE

      - name: Upload exact-head private proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-single-writer-${{ github.run_id }}
          path: private-single-writer-evidence/
          if-no-files-found: warn
          retention-days: 30
