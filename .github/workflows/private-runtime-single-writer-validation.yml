name: Private runtime single-writer validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/paper_v7_loop.sh"
      - "scripts/paper_v7_execution_loop.sh"
      - "scripts/v7_*.py"
      - "config/paper_v7.json"
      - "config/live_champion.json"
      - "ops/**"
      - "monitoring/**"
      - ".github/workflows/private-runtime-single-writer-validation.yml"

permissions:
  contents: read

concurrency:
  group: polymarket-private-runtime-single-writer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SERVER_HOST: ${{ vars.POLYMARKET_SERVER_HOST || '100.104.183.109' }}
      SERVER_USER: ${{ vars.POLYMARKET_SERVER_USER || 'enrico' }}
      SERVER_PORT: ${{ vars.POLYMARKET_SERVER_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate candidate V7 ownership contract statically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.load(open('config/live_champion.json'))
          assert int(m['version']) == 7
          assert m['loop'] == 'scripts/paper_v7_loop.sh'
          assert m['config'] == 'config/paper_v7.json'
          assert m['run_root'] == 'runs/paper_v7_live'
          cfg=json.load(open('config/paper_v7.json'))
          assert cfg['paper_only'] is True
          assert cfg['v7']['authenticated_execution'] is False
          outer=Path('scripts/paper_v7_loop.sh').read_text()
          execution=Path('scripts/paper_v7_execution_loop.sh').read_text()
          assert outer.count('start_execution') >= 2
          assert 'paper_v7_execution_loop.sh' in outer
          assert 'v7_shadow_loop.py' in outer
          assert 'POLYMARKET_RUNTIME_PARENT_PID="$$"' in outer
          assert 'runtime_singleton_launcher.py' not in outer
          assert 'paper_latest_loop.sh' not in outer
          for token in ('paper_v3','paper_v4','paper_v5','paper_v6','scripts/v3_','scripts/v4_','scripts/v5_','scripts/v6_'):
              assert token not in outer
              assert token not in execution
          PY
          bash -n scripts/paper_v7_loop.sh scripts/paper_v7_execution_loop.sh
          python3 -m py_compile scripts/v7_*.py

      - name: Select existing Tailscale credential mode
        id: tailscale_auth
        shell: bash
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TS_TAGS: ${{ vars.TS_TAGS || 'tag:ci' }}
        run: |
          set -euo pipefail
          if [[ -n "${TS_AUTHKEY:-}" ]]; then mode=authkey
          elif [[ -n "${TS_OAUTH_CLIENT_ID:-}" && -n "${TS_OAUTH_SECRET:-}" ]]; then test -n "${TS_TAGS:-}"; mode=oauth
          else echo "No visible Tailscale credential set" >&2; exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Join private tailnet with auth key
        if: steps.tailscale_auth.outputs.mode == 'authkey'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: ${{ env.SERVER_HOST }}

      - name: Join private tailnet with OAuth
        if: steps.tailscale_auth.outputs.mode == 'oauth'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TS_TAGS || 'tag:ci' }}
          ping: ${{ env.SERVER_HOST }}

      - name: Configure SSH identity
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.POLYMARKET_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/polymarket_single_writer
          chmod 600 ~/.ssh/polymarket_single_writer
          ssh-keyscan -T 5 -p "$SERVER_PORT" "$SERVER_HOST" > ~/.ssh/known_hosts

      - name: Prove one deployed V7 runtime owner
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/polymarket_single_writer -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10 \
            -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE' | tee single-writer-evidence.txt
          set -euo pipefail
          cd ~/polymarket
          git fetch -q origin main paper-validated
          head_sha="$(git rev-parse HEAD)"
          validated_sha="$(git rev-parse origin/paper-validated)"
          main_sha="$(git rev-parse origin/main)"
          test "$head_sha" = "$validated_sha"
          git merge-base --is-ancestor "$validated_sha" "$main_sha"
          python3 - <<'PY'
          import json
          m=json.load(open('config/live_champion.json'))
          assert int(m['version']) == 7
          assert m['loop'] == 'scripts/paper_v7_loop.sh'
          assert m['config'] == 'config/paper_v7.json'
          assert m['run_root'] == 'runs/paper_v7_live'
          PY

          root=runs/paper_v7_live
          ex="$root/execution"
          test -s "$root/v7_supervisor.json"
          test -s "$ex/v7_execution_supervisor.json"
          test -s "$ex/runtime_status.json"
          test -s "$ex/market_proxy_status.json"
          python3 - "$root" <<'PY'
          import json,sys,time
          from pathlib import Path
          root=Path(sys.argv[1]); ex=root/'execution'; now=time.time()
          sup=json.load(open(root/'v7_supervisor.json'))
          exe=json.load(open(ex/'v7_execution_supervisor.json'))
          runtime=json.load(open(ex/'runtime_status.json'))
          proxy=json.load(open(ex/'market_proxy_status.json'))
          assert sup['execution_alive'] is True and sup['shadow_alive'] is True
          assert now-float(sup['timestamp']) <= 60
          assert now-float(exe['timestamp']) <= 120 and exe['paper_only'] is True
          assert runtime['schema']=='polymarket_v7_runtime_status_v1' and runtime['version']==7
          assert runtime['paper_only'] is True and runtime['authenticated_execution'] is False
          assert proxy['schema']=='polymarket_v7_market_proxy_status_v1'
          assert now-float(proxy['timestamp']) <= 180
          PY

          count_cmd() {
            local pattern="$1"
            ps -axo pid=,command= | grep -F "$pattern" | grep -v grep | wc -l | tr -d ' '
          }
          outer_count="$(count_cmd 'scripts/paper_v7_loop.sh')"
          execution_count="$(count_cmd 'scripts/paper_v7_execution_loop.sh')"
          proxy_count="$(count_cmd 'scripts/v7_market_proxy.py')"
          test "$outer_count" = 1
          test "$execution_count" = 1
          test "$proxy_count" = 1

          predecessor_count="$(ps -axo command= | grep -E 'paper_v[3-6]|scripts/v[3-6]_' | grep -v grep | wc -l | tr -d ' ')"
          test "$predecessor_count" = 0

          proxy_listeners=0
          if command -v lsof >/dev/null 2>&1; then
            proxy_listeners="$(lsof -nP -t -iTCP:9120 -sTCP:LISTEN 2>/dev/null | sort -u | wc -l | tr -d ' ')"
            test "$proxy_listeners" = 1
          fi
          printf 'server_head=%s\npaper_validated=%s\norigin_main=%s\n' "$head_sha" "$validated_sha" "$main_sha"
          printf 'v7_outer_owners=%s\nv7_execution_owners=%s\nv7_proxy_owners=%s\nproxy_listeners=%s\npredecessor_processes=%s\n' \
            "$outer_count" "$execution_count" "$proxy_count" "$proxy_listeners" "$predecessor_count"
          printf 'single_writer_status=ok\n'
          REMOTE

      - name: Publish single-writer evidence
        if: always()
        run: |
          echo '## V7 private runtime single-writer validation' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat single-writer-evidence.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload single-writer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-v7-single-writer-${{ github.run_id }}
          path: single-writer-evidence.txt
          if-no-files-found: warn
          retention-days: 7
