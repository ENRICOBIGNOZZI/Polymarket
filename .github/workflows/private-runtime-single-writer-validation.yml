name: Private runtime single-writer validation

on:
  workflow_dispatch:
  # Live PAPER validation is exact-SHA. Therefore every main SHA needs a
  # single-writer proof, even when the commit changes only deploy/monitoring
  # orchestration and does not touch the runtime files themselves.
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "scripts/paper_v7_execution_loop.sh"
      - "tests/test_v7_single_writer_contract.py"
      - ".github/workflows/private-runtime-single-writer-validation.yml"
      - "config/live_champion.json"
      - "config/paper_v7.json"
      - "src/v7_market_maker_runtime.cpp"
      - "include/pm/v7_order_tx.hpp"
      - "include/pm/v7_execution_plan.hpp"
      - "include/pm/v7_execution_admission.hpp"
      - "include/pm/v7_capital.hpp"

permissions:
  contents: read

concurrency:
  group: polymarket-v7-single-writer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  private-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VALIDATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact V7 source head
        run: |
          set -euo pipefail
          [[ "$VALIDATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"
      - name: Prove V7 direct single-writer ownership
        run: |
          set -euo pipefail
          bash -n scripts/paper_v7_execution_loop.sh
          python3 -m unittest tests/test_v7_single_writer_contract.py -v
