name: V7 rich-history research progress probe

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-rich-history-progress-probe.json

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: rich-history-progress
          aws-region: eu-west-2
      - name: Probe
        shell: bash
        run: |
          set -euo pipefail
          instance="$(python3 -c 'import json;print(json.load(open("deploy/v7-rich-history-progress-probe.json"))["instance_id"])')"
          params='{"commands":["echo ===PROCESSES===","ps -eo pid,etime,pcpu,pmem,rss,args | grep -E \"rich_history_information|polymarket-rich-history\" | grep -v grep || true","echo ===OUTPUTS===","find /tmp -maxdepth 4 -type f -path \"*polymarket-rich-history*/output/*\" -printf \"%TY-%Tm-%Td %TH:%TM:%TS %s %p\\n\" 2>/dev/null | sort || true","echo ===FEATURE_TAPES===","find /mnt/polymarket-data /home -type f \\( -iname '*feature*tape*.jsonl' -o -iname '*feature*tape*.jsonl.gz' \\) -printf '%s %p\\n' 2>/dev/null | awk '{n++;b+=$1} END{print \"files=\"n+0,\"bytes=\"b+0}'","echo ===DISK===","df -h /tmp"]}'
          cmd="$(aws ssm send-command --instance-ids "$instance" --document-name AWS-RunShellScript --parameters "$params" --query 'Command.CommandId' --output text)"
          for i in $(seq 1 60); do
            status="$(aws ssm get-command-invocation --command-id "$cmd" --instance-id "$instance" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 2
          done
          aws ssm get-command-invocation --command-id "$cmd" --instance-id "$instance" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json
