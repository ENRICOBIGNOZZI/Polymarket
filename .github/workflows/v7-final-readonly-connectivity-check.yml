name: V7 final read-only connectivity check
on:
  push:
    branches: [fix/v7-readonly-diagnostic-20260905]
    paths: [.github/workflows/v7-final-readonly-connectivity-check.yml]
permissions: {}
jobs:
  remove-own-redundant-ref:
    if: github.repository == 'ENRICOBIGNOZZI/Polymarket' && github.ref == 'refs/heads/fix/v7-readonly-diagnostic-20260905'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 8
      - name: Remove only the duplicate diagnostic branch after proving preserved history
        run: |
          set -euo pipefail
          ref=refs/heads/ops/v7-readonly-diagnostic-20260905
          expected=c56f454eb9ff04ac7aec71e50df8845364ccafef
          actual="$(git ls-remote --heads origin "$ref" | cut -f1)"
          if [[ -z "$actual" ]]; then
            echo 'Redundant diagnostic ref already absent'
            exit 0
          fi
          test "$actual" = "$expected"
          git merge-base --is-ancestor "$expected" HEAD
          git push --force-with-lease="$ref:$expected" origin ":$ref"
          test -z "$(git ls-remote --heads origin "$ref")"
          echo 'Removed only the redundant diagnostic ref; its history is retained on this fix/v7 branch'
  inspect-only:
    if: github.repository == 'ENRICOBIGNOZZI/Polymarket' && github.ref == 'refs/heads/fix/v7-readonly-diagnostic-20260905'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
      id-token: write
    env:
      SERVER_HOST: ${{ vars.POLYMARKET_SERVER_HOST || '100.104.183.109' }}
      SERVER_USER: ${{ vars.POLYMARKET_SERVER_USER || 'enrico' }}
      SERVER_PORT: ${{ vars.POLYMARKET_SERVER_PORT || '22' }}
    steps:
      - name: Select existing tailnet credentials
        id: auth
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
        run: |
          set -euo pipefail
          if [[ -n "${TS_OAUTH_CLIENT_ID:-}" && -n "${TS_AUDIENCE:-}" ]]; then mode=oidc
          elif [[ -n "${TS_OAUTH_CLIENT_ID:-}" && -n "${TS_OAUTH_SECRET:-}" ]]; then mode=oauth
          elif [[ -n "${TS_AUTHKEY:-}" ]]; then mode=authkey
          else echo 'No existing tailnet credentials available' >&2; exit 1; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Join tailnet using workload identity
        if: steps.auth.outputs.mode == 'oidc'
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: ${{ vars.TS_TAGS || 'tag:ci' }}
          statedir: ''
          version: 1.94.2
          timeout: 45s
          retry: 1
          hostname: gh-readonly-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Join tailnet using OAuth
        if: steps.auth.outputs.mode == 'oauth'
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TS_TAGS || 'tag:ci' }}
          statedir: ''
          version: 1.94.2
          timeout: 45s
          retry: 1
          hostname: gh-readonly-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Join tailnet using auth key and supported in-memory state
        if: steps.auth.outputs.mode == 'authkey'
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          statedir: ''
          version: 1.94.2
          timeout: 45s
          retry: 1
          hostname: gh-readonly-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Read only server identity, disk and PAPER diagnostic counters
        env:
          SSH_PRIVATE_KEY: ${{ secrets.POLYMARKET_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}" || { echo 'No existing server SSH key' >&2; exit 1; }
          install -d -m 700 ~/.ssh
          key=~/.ssh/v7-readonly
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          chmod 600 "$key"
          ssh-keyscan -T 5 -p "$SERVER_PORT" "$SERVER_HOST" > ~/.ssh/known_hosts
          ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" 'cd "$HOME/polymarket" && python3 -' <<'PY'
          import json, re, shutil, subprocess, time
          from pathlib import Path
          root=Path('runs/paper_v7_live')
          def scalar(value):
              return isinstance(value,(bool,int,float)) or value is None
          numeric={'orders','orders_submitted','fills','open_positions','terminal_positions','cash','equity',
                   'starting_capital','realized_pnl','unrealized_pnl','drawdown','counterfactual_fills',
                   'counterfactual_forecasts','counterfactual_resolved_forecasts','counterfactual_open_positions',
                   'counterfactual_realized_pnl','counterfactual_equity','book_requests','book_request_failures',
                   'book_parse_failures','restart_count','timestamp','timestamp_ms','updated_at','pid'}
          flags={'healthy','complete','ready','paper_only','authenticated_execution','real_order_submission',
                 'real_capital_at_risk','economic_new_risk_ready','drain_requested','drain_complete','killed'}
          reports={'canonical_order_reconciliation','canonical_final_reconciliation','paper_exploration_account'}
          def safe(value):
              out={k:v for k,v in value.items() if k in numeric|flags and scalar(v)}
              for k in ('model_sha','code_sha','expected_model_sha'):
                  v=value.get(k)
                  if isinstance(v,str) and re.fullmatch('[0-9a-f]{40}',v): out[k]=v
              for k in ('mode','state','execution_mode','runtime_mode','blocker'):
                  v=value.get(k)
                  if isinstance(v,str) and re.fullmatch('[A-Za-z0-9_-]{1,120}',v): out[k]=v
              for k in reports:
                  v=value.get(k)
                  if isinstance(v,dict):
                      out[k]=safe(v)
                      if isinstance(v.get('issues'),list): out[k]['issue_count']=len(v['issues'])
              for k in ('rejection_reasons','wait_reasons'):
                  v=value.get(k)
                  if isinstance(v,dict):
                      out[k]={key:n for key,n in v.items() if isinstance(key,str) and re.fullmatch('[A-Za-z0-9_-]{1,120}',key) and isinstance(n,(int,float))}
              return out
          def sample():
              paths={root/'canonical_economics.json',root/'control/runtime_status.json',root/'control/supervisor_status.json',root/'control/retention_status.json'}
              paths.update(root.glob('*/*status*.json'))
              out={}
              for path in sorted(paths)[:60]:
                  entry={'exists':path.is_file()}
                  if path.is_file() and not path.is_symlink():
                      stat=path.stat(); entry.update(bytes=stat.st_size,age_seconds=round(time.time()-stat.st_mtime,2))
                      if stat.st_size<=300000:
                          try:
                              value=json.loads(path.read_text())
                              if isinstance(value,dict): entry['values']=safe(value)
                          except Exception as error: entry['read_error']=type(error).__name__
                  out[str(path.relative_to(root))]=entry
              return out
          usage=shutil.disk_usage('.')
          result={'schema':'v7_readonly_diagnostic_v1','server_modified':False,
                  'utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),
                  'disk_free_bytes':usage.free,'disk_free_ratio':usage.free/usage.total}
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True,timeout=10).strip()
          result['git_head']=head if re.fullmatch('[0-9a-f]{40}',head) else 'INVALID_SHA'
          deployed=root/'control/deployed_sha'
          if deployed.is_file():
              value=deployed.read_text().strip()
              result['deployed_sha']=value if re.fullmatch('[0-9a-f]{40}',value) else 'INVALID_SHA'
          result['first']=sample(); time.sleep(2); result['second']=sample()
          print(json.dumps(result,sort_keys=True))
          PY
