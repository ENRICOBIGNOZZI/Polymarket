name: TEMP V7 Grafana tailnet repair

on:
  push:
    branches: ["fix/v7-gamma-universe-422"]

permissions:
  contents: read

concurrency:
  group: tmp-v7-grafana-tailnet-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SERVER_HOST: 100.104.183.109
      SERVER_USER: enrico
      SERVER_PORT: 22
      GRAFANA_HOSTNAME: mamma-portfolio
      GRAFANA_FQDN: mamma-portfolio.tail1bae85.ts.net
    steps:
      - name: Join private tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: ${{ env.SERVER_HOST }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.POLYMARKET_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/polymarket_grafana_repair
          chmod 600 ~/.ssh/polymarket_grafana_repair
          ssh-keyscan -T 5 -p "$SERVER_PORT" "$SERVER_HOST" > ~/.ssh/known_hosts

      - name: Re-converge Grafana and Tailscale Serve on host
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/polymarket_grafana_repair -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10 -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/polymarket"
          root="$HOME/polymarket/runs/paper_v7_live"
          test -s "$root/control/deployed_sha"
          test "$(git rev-parse HEAD)" = "$(cat "$root/control/deployed_sha")"

          if ! curl -fsS --max-time 5 http://127.0.0.1:3000/api/health >/dev/null; then
            launchctl kickstart -k "gui/$(id -u)/com.polymarket.v7.grafana"
            for _ in $(seq 1 50); do
              curl -fsS --max-time 2 http://127.0.0.1:3000/api/health >/dev/null && break
              sleep 0.2
            done
          fi
          curl -fsS --max-time 5 http://127.0.0.1:3000/api/health
          curl -fsS --max-time 5 http://127.0.0.1:3000/api/dashboards/uid/polymarket-v7 >/dev/null

          ts=''
          for candidate in /Applications/Tailscale.app/Contents/MacOS/Tailscale /opt/homebrew/bin/tailscale /usr/local/bin/tailscale; do
            if [[ -x "$candidate" ]]; then ts="$candidate"; break; fi
          done
          test -n "$ts"

          ts_admin() {
            if "$ts" "$@"; then return 0; fi
            sudo -n "$ts" "$@"
          }
          ts_admin set --hostname=mamma-portfolio >/dev/null
          ts_admin serve --bg --https=443 localhost:3000 >/dev/null
          ts_admin serve --bg --http=80 localhost:3000 >/dev/null
          "$ts" serve status
          "$ts" status --json | python3 - <<'PY'
          import json,sys
          value=json.load(sys.stdin)
          self=value.get('Self') or {}
          print('tailscale_dns='+str(self.get('DNSName') or ''))
          print('tailscale_ips='+','.join(self.get('TailscaleIPs') or []))
          PY
          REMOTE

      - name: Verify browser routes from independent tailnet peer
        run: |
          set -euo pipefail
          tailscale ping --until-direct=false --c 1 --timeout=10s "$GRAFANA_HOSTNAME"
          getent hosts "$GRAFANA_FQDN"
          curl -fsS --max-time 10 "https://$GRAFANA_FQDN/api/health"
          curl -fsS --max-time 10 "https://$GRAFANA_FQDN/api/dashboards/uid/polymarket-v7" >/dev/null
          curl -LfsS --max-time 10 "https://$GRAFANA_FQDN/d/polymarket-v7/polymarket-v7-canonical-paper-economics" >/dev/null
          curl -fsS --max-time 10 "http://$GRAFANA_FQDN/api/health"
          if curl -fsS --max-time 10 "http://$SERVER_HOST/api/health"; then
            echo 'TAILSCALE_IP_HTTP_FALLBACK=PASS'
          else
            echo 'TAILSCALE_IP_HTTP_FALLBACK=UNAVAILABLE'
          fi
