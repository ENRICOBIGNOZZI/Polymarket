name: V7 mamma Grafana recover

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-mamma-grafana-recover-request.json

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SERVER_HOST: ${{ vars.POLYMARKET_SERVER_HOST || '100.104.183.109' }}
      SERVER_USER: ${{ vars.POLYMARKET_SERVER_USER || 'enrico' }}
      SERVER_PORT: ${{ vars.POLYMARKET_SERVER_PORT || '22' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate request
        run: |
          python3 - deploy/v7-mamma-grafana-recover-request.json <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1])) == {"schema":"polymarket_v7_mamma_grafana_recover_v1","monitoring_only":True}
          PY

      - name: Select Tailscale credential
        id: ts
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          set -euo pipefail
          if [[ -n "${TS_AUTHKEY:-}" ]]; then
            echo mode=authkey >> "$GITHUB_OUTPUT"
          elif [[ -n "${TS_OAUTH_CLIENT_ID:-}" && -n "${TS_OAUTH_SECRET:-}" ]]; then
            echo mode=oauth >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi

      - name: Join tailnet authkey
        if: steps.ts.outputs.mode == 'authkey'
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          version: 1.94.2
          statedir: ''
          hostname: gh-mamma-recover-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Join tailnet oauth
        if: steps.ts.outputs.mode == 'oauth'
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TS_TAGS || 'tag:ci' }}
          version: 1.94.2
          statedir: ''
          hostname: gh-mamma-recover-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.POLYMARKET_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -T 5 -p "$SERVER_PORT" "$SERVER_HOST" > ~/.ssh/known_hosts

      - name: Recover Grafana
        run: |
          set -euo pipefail
          scp -i ~/.ssh/key -o IdentitiesOnly=yes -o BatchMode=yes -P "$SERVER_PORT" \
            ops/v7_mamma_grafana_recover.sh "$SERVER_USER@$SERVER_HOST:/tmp/v7_mamma_grafana_recover.sh"
          ssh -i ~/.ssh/key -o IdentitiesOnly=yes -o BatchMode=yes -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" 'bash /tmp/v7_mamma_grafana_recover.sh; rc=$?; rm -f /tmp/v7_mamma_grafana_recover.sh; exit $rc'
