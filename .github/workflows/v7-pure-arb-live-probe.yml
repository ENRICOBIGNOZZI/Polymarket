name: V7 pure arb live probe

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-pure-arb-live-probe-request.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: v7-pure-arb-live-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
      INSTANCE_ID: ${{ vars.POLYMARKET_LONDON_INSTANCE_ID || 'i-0fba2bac9fdc5cbeb' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Validate request
        id: request
        run: |
          set -euo pipefail
          python3 - deploy/v7-pure-arb-live-probe-request.json "$GITHUB_OUTPUT" <<'PY'
          import json,re,sys
          v=json.load(open(sys.argv[1]))
          assert set(v)=={'schema','version','request_id','expected_sha','paper_only','authenticated_execution','real_order_submission'}
          assert v['schema']=='polymarket_v7_pure_arb_live_probe_request_v1'
          assert v['version']==1
          assert re.fullmatch(r'[A-Za-z0-9._:-]{8,128}',v['request_id'])
          assert re.fullmatch(r'[0-9a-f]{40}',v['expected_sha'])
          assert v['paper_only'] is True
          assert v['authenticated_execution'] is False
          assert v['real_order_submission'] is False
          with open(sys.argv[2],'a') as h:h.write('expected_sha='+v['expected_sha']+'\n')
          PY
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: polymarket-v7-pure-arb-probe
          aws-region: eu-west-2
      - name: Probe pure arb PAPER and Grafana
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.expected_sha }}
        run: |
          set -euo pipefail
          python3 - "$INSTANCE_ID" "$EXPECTED_SHA" <<'PY' | tee pure-arb-probe.txt
          import json,sys
          sys.path.insert(0,'ops')
          from v7_london_ssm_deploy import run,REGION
          instance,sha=sys.argv[1:3]
          command=r'''set -euo pipefail
          UNIT=polymarket-v7-paper.service
          ROOT="$(systemctl show "$UNIT" -p Environment --value | python3 -c 'import shlex,sys; print(next(x.split("=",1)[1] for x in shlex.split(sys.stdin.read()) if x.startswith("PM_V7_RUN_ROOT=")))')"
          STATUS="$ROOT/research/repricing_book/pure_arb_status.json"
          for i in $(seq 1 40); do
            if [[ -s "$STATUS" ]] && python3 - "$STATUS" "__SHA__" <<'PYSTAT' >/dev/null 2>&1
          import json,sys,time
          v=json.load(open(sys.argv[1]))
          assert v.get('schema')=='polymarket_v7_pure_arb_paper_status_v1'
          assert v.get('model_sha')==sys.argv[2]
          assert v.get('paper_only') is True
          assert v.get('authenticated_execution') is False
          assert v.get('real_order_submission') is False
          assert v.get('state')=='running'
          assert int(v.get('expected_contexts') or 0)==30
          assert len(v.get('contexts') or [])==30
          assert int(time.time()*1000)-int(v.get('timestamp_ms') or 0)<10000
          PYSTAT
            then break; fi
            sleep 1
          done
          python3 - "$STATUS" "__SHA__" <<'PYSTAT'
          import json,sys,time
          v=json.load(open(sys.argv[1]))
          assert v.get('model_sha')==sys.argv[2]
          out={k:v.get(k) for k in (
            'state','expected_contexts','fee_ready_contexts','evaluations','fee_blocked_evaluations',
            'cycles_total','paper_locked_pnl_pre_gas_total','last_decision_compute_ns',
            'max_decision_compute_ns','last_receive_to_decision_ns','max_receive_to_decision_ns')}
          active=[]
          for r in v.get('contexts') or []:
            for key,kind in [('buy_complete_set','BUY'),('sell_complete_set','SELL')]:
              x=r.get(key) or {}
              if x.get('active') or int(x.get('cycles') or 0)>0:
                active.append({'asset':r.get('asset'),'horizon':r.get('horizon'),'kind':kind,
                               'active':x.get('active'),'cycles':x.get('cycles'),
                               'pnl':x.get('paper_locked_pnl_pre_gas'),
                               'last_edge':x.get('last_edge_per_share'),
                               'max_edge':x.get('max_edge_per_share')})
          out['contexts_with_activity']=active
          print('PURE_ARB_STATUS='+json.dumps(out,sort_keys=True,separators=(',',':')))
          PYSTAT
          for i in $(seq 1 30); do
            prom="$(curl -fsS --get --data-urlencode 'query=polymarket_pure_arb_up' http://127.0.0.1:9090/api/v1/query || true)"
            if python3 - "$prom" <<'PYPROM' >/dev/null 2>&1
          import json,sys
          v=json.loads(sys.argv[1]);r=v.get('data',{}).get('result',[])
          assert r and float(r[0]['value'][1])==1
          PYPROM
            then break; fi
            sleep 1
          done
          curl -fsS --get --data-urlencode 'query=polymarket_pure_arb_up' http://127.0.0.1:9090/api/v1/query
          echo
          curl -fsS --get --data-urlencode 'query=polymarket_pure_arb_paper_locked_pnl_pre_gas_usd_total' http://127.0.0.1:9090/api/v1/query
          echo
          curl -fsS http://127.0.0.1:3000/api/health
          echo
          '''.replace('__SHA__',sha)
          stdout,stderr=run(REGION,instance,command,180)
          print(stdout)
          if stderr: print(stderr,file=sys.stderr)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v7-pure-arb-live-probe-${{ github.run_id }}
          path: pure-arb-probe.txt
          retention-days: 14
