name: v4-live-paper-smoke

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit SHA to validate; defaults to the event SHA
        required: false
        type: string
  push:
    branches: [main]
  schedule:
    - cron: "37 * * * *"
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: champion-live-paper-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-paper-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VALIDATION_SHA: ${{ github.event.inputs.expected_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.expected_sha || github.sha }}

      - name: Verify exact validation revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VALIDATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"
          echo "validation_sha=$VALIDATION_SHA"

      - name: Resolve manifest-selected paper champion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path, PurePosixPath
          m=json.loads(Path('config/live_champion.json').read_text(encoding='utf-8'))
          version=m.get('version')
          if isinstance(version,bool) or not isinstance(version,int) or version <= 0:
              raise SystemExit('invalid champion version')
          for key in ('config','run_root','loop'):
              value=str(m[key]); path=PurePosixPath(value)
              if path.is_absolute() or '..' in path.parts:
                  raise SystemExit(f'invalid champion {key}')
          print(f'CHAMPION_VERSION={version}')
          print(f'CHAMPION_CONFIG={m["config"]}')
          print(f'CHAMPION_RUN_ROOT={m["run_root"]}')
          print(f'CHAMPION_RUN_NAME={Path(m["run_root"]).name}')
          print(f'CHAMPION_LOOP={m["loop"]}')
          PY

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev python3

      - name: Build Release champion dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -f "$CHAMPION_CONFIG"
          test -f "$CHAMPION_LOOP"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          bash -n scripts/paper_latest_loop.sh "$CHAMPION_LOOP"
          python3 -m py_compile monitoring/exporter_latest.py scripts/runtime_contract_health.py
          if [[ -f "monitoring/exporter_v${CHAMPION_VERSION}.py" ]]; then
            python3 -m py_compile "monitoring/exporter_v${CHAMPION_VERSION}.py"
          fi

      - name: Fresh public-data V5 compatibility smoke
        if: env.CHAMPION_VERSION == '5'
        shell: bash
        run: |
          set -euo pipefail
          R="$CHAMPION_RUN_NAME"
          mkdir -p "$R"
          python3 scripts/multi_strategy_paper.py \
            --config "$CHAMPION_CONFIG" --run-root "$R" --engine ./build/polymarket_engine \
            --markets 180 --min-liquidity 25 --once | tee "$R/allocator_once.log"
          PYTHONPATH=monitoring python3 - "$R" "$CHAMPION_CONFIG" <<'PY'
          from pathlib import Path
          import sys
          from exporter_latest import LatestCollector
          root=Path(sys.argv[1])
          text=LatestCollector(root.parent,Path('config'),root.name,sys.argv[2],20).collect()
          assert 'version="v5"' in text
          (root/'metrics.prom').write_text(text,encoding='utf-8')
          PY
          echo "SMOKE_RUN_ROOT=$R" >> "$GITHUB_ENV"

      - name: Fresh public-data V6 model-specific smoke
        id: v6_smoke
        if: env.CHAMPION_VERSION == '6'
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          R="$CHAMPION_RUN_NAME"
          bash scripts/v6_live_smoke_once.sh "$CHAMPION_CONFIG" "$R"
          echo "SMOKE_RUN_ROOT=$R" >> "$GITHUB_ENV"

      - name: Verify V6 unhealthy-tape negative canary
        if: github.event_name == 'pull_request' && env.CHAMPION_VERSION == '6' && steps.v6_smoke.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          R="$CHAMPION_RUN_NAME"
          test -s "$R/trade_recorder_health.json"
          python3 - "$R/trade_recorder_health.json" <<'PY'
          import json, sys
          from pathlib import Path
          report=json.loads(Path(sys.argv[1]).read_text())
          if report.get('status') != 'unhealthy' or not report.get('failures'):
              raise SystemExit('V6 smoke failed outside the explicit recorder-health gate')
          print('expected_pr_negative_canary=' + ','.join(report['failures']))
          PY
          echo "SMOKE_RUN_ROOT=$R" >> "$GITHUB_ENV"

      - name: Version-neutral V7+ PAPER runtime smoke
        if: env.CHAMPION_VERSION != '5' && env.CHAMPION_VERSION != '6'
        shell: bash
        run: |
          set -euo pipefail
          R="$CHAMPION_RUN_ROOT"
          rm -rf "$R"
          mkdir -p "$R"
          POLYMARKET_FAST_ARB_ENABLED=0 bash scripts/paper_latest_loop.sh >"$R/live_smoke_supervisor.log" 2>&1 &
          owner=$!
          cleanup() {
            kill -TERM "$owner" 2>/dev/null || true
            wait "$owner" 2>/dev/null || true
          }
          trap cleanup EXIT INT TERM

          healthy=0
          for _ in {1..360}; do
            if ! kill -0 "$owner" 2>/dev/null; then
              tail -n 120 "$R/live_smoke_supervisor.log" >&2 || true
              exit 1
            fi
            if python3 scripts/runtime_contract_health.py \
              --manifest config/live_champion.json --repository-root . \
              --max-age-seconds 180 >/tmp/runtime-contract-health.txt 2>&1; then
              healthy=1
              break
            fi
            sleep 2
          done
          cat /tmp/runtime-contract-health.txt || true
          test "$healthy" = 1

          PYTHONPATH=monitoring python3 - "$R" "$CHAMPION_CONFIG" "$CHAMPION_VERSION" <<'PY'
          import re
          import sys
          from pathlib import Path
          from exporter_latest import LatestCollector
          root=Path(sys.argv[1]); config=sys.argv[2]; version=sys.argv[3]
          text=LatestCollector(root.parent,Path('config'),root.name,config,20).collect()
          pattern=rf'^polymarket_runtime_info\{{adapter="[^"]+",run_root="{re.escape(root.name)}",version="v{re.escape(version)}"\}} 1$'
          assert re.search(pattern,text,re.MULTILINE), text[:2500]
          assert 'polymarket_runtime_contract_present 1' in text
          assert 'polymarket_runtime_pnl_usd ' in text
          (root/'metrics.prom').write_text(text,encoding='utf-8')
          PY
          echo "SMOKE_RUN_ROOT=$R" >> "$GITHUB_ENV"
          cleanup
          trap - EXIT INT TERM

      - name: Verify selected champion telemetry
        if: env.CHAMPION_VERSION != '6' || github.event_name != 'pull_request' || steps.v6_smoke.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          R="${SMOKE_RUN_ROOT:-$CHAMPION_RUN_NAME}"
          test -s "$R/metrics.prom"
          grep -Eq "^polymarket_runtime_info\\{adapter=\"[^\"]+\",run_root=\"$(basename "$R")\",version=\"v${CHAMPION_VERSION}\"\\} 1$" "$R/metrics.prom"
          grep -q '^polymarket_runtime_pnl_usd ' "$R/metrics.prom"
          if (( CHAMPION_VERSION >= 6 )); then
            grep -q '^polymarket_runtime_contract_present 1$' "$R/metrics.prom"
          fi
          if (( CHAMPION_VERSION >= 7 )); then
            python3 scripts/runtime_contract_health.py \
              --manifest config/live_champion.json --repository-root . \
              --max-age-seconds 180
          fi

      - name: Build public telemetry snapshot
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          R="${SMOKE_RUN_ROOT:-$CHAMPION_RUN_NAME}"
          python3 - "$R" "$VALIDATION_SHA" "$GITHUB_RUN_ID" <<'PY'
          import json, sys
          from pathlib import Path
          root=Path(sys.argv[1])
          candidates=[root/'runtime_status.json']
          candidates += sorted(p/'runtime_status.json' for p in root.iterdir() if p.is_dir()) if root.exists() else []
          source=next((p for p in candidates if p.is_file()),None)
          if source is None:
              raise SystemExit(0)
          payload=json.loads(source.read_text(encoding='utf-8'))
          payload['git_sha']=sys.argv[2]
          payload['workflow_run_id']=sys.argv[3]
          (root/'live_snapshot.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

      - name: Publish live summary
        if: always()
        shell: bash
        run: |
          R="${SMOKE_RUN_ROOT:-$CHAMPION_RUN_NAME}"
          echo "## V${CHAMPION_VERSION} manifest-selected live paper smoke" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$R/live_snapshot.json" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for f in "$R/live_smoke_supervisor.log" "$R/trade_recorder_latest.log" "$R/maker_latest.log" "$R/micro_taker_latest.log" "$R/hard_arb_latest.log" "$R/local_factor_latest.log" "$R/relation_latest.log" "$R/multileg_latest.log"; do
            if [[ -s "$f" ]]; then
              echo "### $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              tail -n 12 "$f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Publish latest public telemetry
        if: github.event_name != 'pull_request' && success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          R="${SMOKE_RUN_ROOT:-$CHAMPION_RUN_NAME}"
          test -s "$R/live_snapshot.json"
          endpoint="repos/${GITHUB_REPOSITORY}/contents/telemetry/latest-live-smoke.json"
          content="$(base64 -w0 "$R/live_snapshot.json")"
          publish_error="$(mktemp)"
          for attempt in 1 2 3 4 5; do
            current_sha="$(gh api "${endpoint}?ref=telemetry" --jq .sha 2>/dev/null || true)"
            args=("$endpoint" --method PUT -f message="Update public V${CHAMPION_VERSION} live smoke telemetry" -f content="$content" -f branch=telemetry)
            if [[ -n "$current_sha" ]]; then args+=(-f sha="$current_sha"); fi
            if gh api "${args[@]}" >/dev/null 2>"$publish_error"; then
              rm -f "$publish_error"
              exit 0
            fi
            if [[ "$attempt" -eq 5 ]]; then
              cat "$publish_error" >&2
              rm -f "$publish_error"
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Upload live diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: champion-live-paper-smoke-${{ github.run_id }}
          path: ${{ env.SMOKE_RUN_ROOT || env.CHAMPION_RUN_NAME }}/
          if-no-files-found: warn
          retention-days: 7

      - name: Advance paper validated ref
        if: github.event_name != 'pull_request' && success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          validated_sha="$(git rev-parse HEAD)"
          test "$validated_sha" = "$VALIDATION_SHA"
          git fetch --no-tags origin main paper-validated
          main_sha="$(git rev-parse origin/main)"
          current_validated_sha="$(git rev-parse origin/paper-validated)"
          test "$validated_sha" = "$main_sha"

          merged_pr=""
          for attempt in {1..10}; do
            merged_pr="$(
              gh api "repos/${GITHUB_REPOSITORY}/commits/${validated_sha}/pulls" \
                --jq '[.[] | select(.base.ref == "main" and .merged_at != null)] | first | .number // empty'
            )"
            if [[ -n "$merged_pr" ]]; then break; fi
            sleep 3
          done
          if [[ -z "$merged_pr" ]]; then
            echo "::error::refusing paper-validated promotion: main revision $validated_sha has no merged pull-request provenance"
            exit 1
          fi
          echo "paper_validation_source_pr=$merged_pr"

          if [[ "$current_validated_sha" != "$validated_sha" ]]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/paper-validated" \
              -f sha="$validated_sha" -F force=false >/dev/null
          fi
          echo "paper_validated_sha=$validated_sha"
