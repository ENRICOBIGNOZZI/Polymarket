name: v4-live-paper-smoke

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit SHA to validate; defaults to the event SHA
        required: false
        type: string
  push:
    branches: [main]
  schedule:
    - cron: "37 * * * *"
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: v4-live-paper-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-paper-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VALIDATION_SHA: ${{ github.event.inputs.expected_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.expected_sha || github.sha }}

      - name: Verify exact validation revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VALIDATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"
          echo "validation_sha=$VALIDATION_SHA"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev python3

      - name: Build Release V4
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Fresh public-data V4 paper smoke
        shell: bash
        run: |
          set -euo pipefail
          R=paper_v4_live
          mkdir -p "$R" "$R/maker" "$R/terminal"

          ./build/polymarket_trade_recorder \
            --config config/paper_v4.json --run-dir "$R" \
            --markets 400 --batch 40 --min-liquidity 100 --lookback-seconds 900 --once \
            | tee "$R/trade_recorder_latest.log"

          ./build/polymarket_negrisk_arb \
            --config config/paper_v4.json --markets 400 --min-liquidity 100 --top 80 \
            | tee "$R/structural_latest.log" "$R/structural_latest.csv"

          # B3 remains shadow-only: it creates no broker intents and estimated
          # rewards are never booked into paper PnL. Retry the public endpoint,
          # but do not let a rewards-only outage block validation of the core
          # recorder, alpha scanners, broker, risk and telemetry chain.
          : > "$R/reward_latest.log"
          reward_scan_ok=0
          for attempt in 1 2 3; do
            rm -f "$R/reward_opportunities.csv"
            printf 'reward_scan_attempt=%s\n' "$attempt" | tee -a "$R/reward_latest.log"
            if ./build/polymarket_rewards_scan \
              --config config/paper_v4.json --markets 1200 --top 80 \
              --quote-shares 50 --max-notional 100 --improve-ticks 0 \
              --competition-multiplier 2.0 --reward-haircut 0.25 --native-reward-unit-usd 1.0 \
              --annual-capital-rate 0.20 --adverse-bps 50 --one-sided-fills-per-day 1.0 \
              --csv "$R/reward_opportunities.csv" \
              >> "$R/reward_latest.log" 2>&1; then
              reward_scan_ok=1
              break
            fi
            printf 'reward_scan_retry=%s\n' "$attempt" | tee -a "$R/reward_latest.log"
            sleep $((attempt * 5))
          done
          if [[ "$reward_scan_ok" == 1 && -s "$R/reward_opportunities.csv" ]]; then
            python3 scripts/apply_reward_payout_floor.py \
              --csv "$R/reward_opportunities.csv" --minimum-daily-payout-usd 1.0 \
              | tee -a "$R/reward_latest.log"
            printf 'reward_scan_status=available\n' | tee -a "$R/reward_latest.log"
          else
            : > "$R/reward_opportunities.csv"
            printf 'reward_scan_status=unavailable_nonblocking sleeve=shadow_only intents=0 booked_pnl=0\n' \
              | tee -a "$R/reward_latest.log"
          fi
          cat "$R/reward_latest.log"

          ./build/polymarket_stat_arb \
            --config config/paper_v4.json --markets 400 --history-universe 120 \
            --lookback-hours 336 --fidelity-minutes 30 --min-z 1.5 \
            --max-half-life-hours 168 --top 80 --csv "$R/stat_arb_pairs.csv" \
            | tee "$R/stat_arb_pairs_latest.log"

          # Keep global PCA output for research, then fail closed through the
          # event/semantic coherence gate before building broker intents.
          ./build/polymarket_pca_stat_arb \
            --config config/paper_v4.json --markets 400 --universe 100 \
            --lookback-hours 336 --fidelity-minutes 30 --factors 3 --max-hedges 4 --min-z 1.5 \
            --max-half-life-hours 168 --top 80 --csv "$R/stat_arb_pca_raw.csv" \
            | tee "$R/stat_arb_pca_latest.log"
          python3 scripts/filter_coherent_hedges.py \
            --input "$R/stat_arb_pca_raw.csv" \
            --output "$R/stat_arb_pca.csv" \
            --rejections "$R/stat_arb_pca_rejected.csv" \
            --cache "$R/market_metadata_cache.json" \
            | tee "$R/coherent_hedges.log"

          python3 scripts/build_v4_intents.py --strategy B1 \
            --input "$R/stat_arb_pairs.csv" --output "$R/b1_intents.csv" --config config/paper_v4.json --min-edge 0.001
          python3 scripts/build_v4_intents.py --strategy B2 \
            --input "$R/stat_arb_pca.csv" --output "$R/b2_intents.csv" --config config/paper_v4.json --min-edge 0.001
          python3 scripts/merge_v4_intents.py \
            --input "$R/b1_intents.csv" --input "$R/b2_intents.csv" --output "$R/intents.csv" \
            --min-edge 0.001 --max-age-seconds 600 --max-bundles 20

          ./build/polymarket_multileg_paper \
            --config config/paper_v4.json --run-dir "$R" --intents "$R/intents.csv" --trade-tape "$R/trade_tape.csv" \
            --min-edge 0.001 --completion-threshold 0.95 --submit-latency-ms 250 --cancel-latency-ms 250 \
            --max-replaces 3 --max-leg-risk-usd 5 --adverse-horizon-seconds 60 --once \
            | tee "$R/multileg_latest.log"

          ./build/polymarket_maker_paper \
            --config config/paper_v4.json --run-dir "$R/maker" --markets 160 --min-liquidity 100 \
            --min-edge 0.003 --max-order-usd 50 --ttl-seconds 300 --hold-seconds 180 \
            --adverse-selection-mult 0.50 --once | tee "$R/maker_latest.log"

          ./build/polymarket_engine \
            --config config/paper_v4.json --once --scan-only --markets 120 --min-liquidity 100 \
            --run-dir "$R/terminal" | tee "$R/terminal_latest.log"

          python3 scripts/walk_forward_v4.py --ledger "$R/bundle_ledger.csv" --output "$R/walk_forward.json" --starting-capital 10000 || true

          PYTHONPATH=monitoring python3 - <<'PY'
          from pathlib import Path
          from exporter_latest import LatestCollector
          c = LatestCollector(Path('.'), Path('config'), 'paper_v4_live', 'config/paper_v4.json', 20)
          text = c.collect()
          assert 'polymarket_runtime_info{adapter="v4",run_root="paper_v4_live",version="v4"} 1' in text
          assert 'polymarket_strategy_state_present{sleeve="structural"} 1' in text
          assert 'polymarket_multileg_state_present 1' in text
          assert 'polymarket_oos_state_present 1' in text
          Path('paper_v4_live/metrics.prom').write_text(text)
          PY

      - name: B1 shadow fillability diagnostic
        continue-on-error: true
        shell: bash
        run: |
          set -u
          R=paper_v4_live
          SH="$R/shadow_b1"
          mkdir -p "$SH"

          ./build/polymarket_stat_arb \
            --config config/paper_v4.json --markets 400 --history-universe 120 \
            --lookback-hours 336 --fidelity-minutes 30 --min-z 1.25 \
            --max-half-life-hours 168 --top 80 --csv "$SH/stat_arb_pairs.csv" \
            > "$SH/stat_arb_pairs_latest.log" 2> "$SH/stat_arb_pairs_errors.log" || true

          python3 scripts/build_v4_intents.py --strategy B1 \
            --input "$SH/stat_arb_pairs.csv" --output "$SH/b1_intents.csv" \
            --config config/paper_v4.json --min-edge 0.0 \
            > "$SH/intent_build.log" 2>&1 || true

          python3 scripts/merge_v4_intents.py \
            --input "$SH/b1_intents.csv" --output "$SH/intents.csv" \
            --min-edge 0.0 --max-age-seconds 600 --max-bundles 10 \
            > "$SH/intent_merge.log" 2>&1 || true

          ./build/polymarket_multileg_paper \
            --config config/paper_v4.json --run-dir "$SH" \
            --intents "$SH/intents.csv" --trade-tape "$R/trade_tape.csv" \
            --min-edge 0.0 --completion-threshold 0.95 --submit-latency-ms 250 --cancel-latency-ms 250 \
            --max-replaces 3 --max-leg-risk-usd 5 --adverse-horizon-seconds 60 --once \
            > "$SH/multileg_latest.log" 2> "$SH/multileg_errors.log" || true

      - name: Build public telemetry snapshot
        if: always()
        shell: bash
        run: |
          python3 scripts/summarize_live_smoke.py \
            --run-root paper_v4_live --output paper_v4_live/live_snapshot.json \
            --git-sha "$VALIDATION_SHA" --run-id "$GITHUB_RUN_ID" \
            --trade-lookback-seconds 900

      - name: Publish live summary
        if: always()
        shell: bash
        run: |
          R=paper_v4_live
          echo '## V4 live paper smoke' >> "$GITHUB_STEP_SUMMARY"
          for f in "$R/trade_recorder_latest.log" "$R/structural_latest.log" "$R/reward_latest.log" "$R/stat_arb_pairs_latest.log" "$R/stat_arb_pca_latest.log" "$R/coherent_hedges.log" "$R/multileg_latest.log" "$R/maker_latest.log" "$R/terminal_latest.log" "$R/shadow_b1/stat_arb_pairs_latest.log" "$R/shadow_b1/multileg_latest.log"; do
            echo "### $f" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 8 "$f" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
          if test -s "$R/walk_forward.json"; then
            echo '### walk-forward' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$R/walk_forward.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish latest public telemetry
        if: github.event_name != 'pull_request' && success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s paper_v4_live/live_snapshot.json
          endpoint="repos/${GITHUB_REPOSITORY}/contents/telemetry/latest-live-smoke.json"
          content="$(base64 -w0 paper_v4_live/live_snapshot.json)"
          current_sha="$(gh api "${endpoint}?ref=telemetry" --jq .sha 2>/dev/null || true)"
          args=("$endpoint" --method PUT -f message="Update public live smoke telemetry" -f content="$content" -f branch=telemetry)
          if [[ -n "$current_sha" ]]; then
            args+=(-f sha="$current_sha")
          fi
          gh api "${args[@]}" >/dev/null

      - name: Upload live diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-live-paper-smoke-${{ github.run_id }}
          path: paper_v4_live/
          if-no-files-found: error
          retention-days: 7

      - name: Advance paper validated ref
        if: github.event_name != 'pull_request' && success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          validated_sha="$(git rev-parse HEAD)"
          test "$validated_sha" = "$VALIDATION_SHA"
          git fetch --no-tags origin main paper-validated
          main_sha="$(git rev-parse origin/main)"
          current_validated_sha="$(git rev-parse origin/paper-validated)"
          test "$validated_sha" = "$main_sha"
          if [[ "$current_validated_sha" != "$validated_sha" ]]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/paper-validated" \
              -f sha="$validated_sha" -F force=false >/dev/null
          fi
          echo "paper_validated_sha=$validated_sha"
