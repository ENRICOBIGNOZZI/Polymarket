name: v4-live-paper-smoke

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit SHA to validate; defaults to the event SHA
        required: false
        type: string
  push:
    branches: [main]
  schedule:
    - cron: "37 * * * *"
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: v5-live-paper-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-paper-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VALIDATION_SHA: ${{ github.event.inputs.expected_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.expected_sha || github.sha }}

      - name: Verify exact validation revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VALIDATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"
          echo "validation_sha=$VALIDATION_SHA"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev python3

      - name: Build Release V5
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Fresh public-data aggressive V5 full-strategy smoke
        shell: bash
        run: |
          set -euo pipefail
          R=paper_v5_live
          mkdir -p "$R" "$R/maker" "$R/strategies"

          # Execute every independent sleeve once against live public books. This
          # is not a manifest-only check: each child engine must discover, score,
          # write signals/status and simulate paper orders when its edge gate fires.
          python3 scripts/multi_strategy_paper.py \
            --config config/paper_v5.json --run-root "$R" --engine ./build/polymarket_engine \
            --markets 180 --min-liquidity 25 --once \
            | tee "$R/allocator_once.log"

          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path('paper_v5_live')
          manifest = json.loads((root / 'allocator_manifest.json').read_text())
          assert manifest['paper_only'] is True
          assert len(manifest['strategies']) == 5
          expected = {'micro', 'pca', 'graph', 'semantic', 'external'}
          assert {item['name'] for item in manifest['strategies']} == expected

          for item in manifest['strategies']:
              child = json.loads(Path(item['config']).read_text())
              active = {name: weight for name, weight in child['expert_weights'].items() if weight > 0}
              assert active == {item['expert']: 1.0}
              run_dir = Path(item['run_dir'])
              log = run_dir / 'engine.log'
              assert log.exists() and 'discovered=' in log.read_text(errors='replace'), (item['name'], log)
              assert (run_dir / 'signals.csv').exists()
              assert (run_dir / 'fills.csv').exists()
              assert (run_dir / 'status.json').exists()

          rows = list(csv.DictReader((root / 'strategy_status.csv').open(newline='', encoding='utf-8')))
          assert {row['name'] for row in rows} == expected
          PY

          ./build/polymarket_trade_recorder \
            --config config/paper_v5.json --run-dir "$R" \
            --markets 500 --batch 40 --min-liquidity 25 --lookback-seconds 900 --once \
            | tee "$R/trade_recorder_latest.log"

          ./build/polymarket_negrisk_arb \
            --config config/paper_v5.json --markets 500 --min-liquidity 25 --top 200 \
            | tee "$R/structural_latest.log" "$R/structural_latest.csv"

          ./build/polymarket_stat_arb \
            --config config/paper_v5.json --markets 500 --history-universe 240 \
            --lookback-hours 720 --fidelity-minutes 30 --min-z 0.75 --min-t-reversion 0.75 \
            --max-half-life-hours 336 --top 200 --csv "$R/stat_arb_pairs.csv" \
            | tee "$R/stat_arb_pairs_latest.log"

          ./build/polymarket_pca_stat_arb \
            --config config/paper_v5.json --markets 500 --universe 240 \
            --lookback-hours 720 --fidelity-minutes 30 --factors 5 --max-hedges 8 \
            --min-z 0.65 --min-t-reversion 0.60 --max-half-life-hours 336 \
            --max-factor-hedge-error 0.80 --top 200 --csv "$R/stat_arb_pca_raw.csv" \
            | tee "$R/stat_arb_pca_latest.log"

          # Research-only B2 ablation: keep every economic/statistical gate fixed
          # and vary only the maximum hedge-candidate count. This tests whether
          # the current 5-8-leg baskets are consuming their raw edge in execution
          # costs. The incumbent k=8 path below remains the only path feeding
          # intents; sparse scans are diagnostics only.
          for k in 1 2 3 4; do
            ./build/polymarket_pca_stat_arb \
              --config config/paper_v5.json --markets 500 --universe 240 \
              --lookback-hours 720 --fidelity-minutes 30 --factors 5 --max-hedges "$k" \
              --min-z 0.65 --min-t-reversion 0.60 --max-half-life-hours 336 \
              --max-factor-hedge-error 0.80 --top 200 --csv "$R/stat_arb_pca_k${k}.csv" \
              | tee "$R/stat_arb_pca_k${k}.log"
          done
          python3 scripts/b2_sparse_hedge_frontier.py \
            --input "8:$R/stat_arb_pca_raw.csv" \
            --input "4:$R/stat_arb_pca_k4.csv" \
            --input "3:$R/stat_arb_pca_k3.csv" \
            --input "2:$R/stat_arb_pca_k2.csv" \
            --input "1:$R/stat_arb_pca_k1.csv" \
            --output-json "$R/b2_sparse_hedge_frontier.json" \
            --output-markdown "$R/b2_sparse_hedge_frontier.md"

          python3 scripts/filter_coherent_hedges.py \
            --input "$R/stat_arb_pca_raw.csv" --output "$R/stat_arb_pca.csv" \
            --rejections "$R/stat_arb_pca_rejected.csv" --cache "$R/market_metadata_cache.json" \
            --min-jaccard 0.08 --min-shared-tokens 1 \
            | tee "$R/coherent_hedges.log"

          python3 scripts/build_v4_intents.py --strategy B1 \
            --input "$R/stat_arb_pairs.csv" --output "$R/b1_intents.csv" \
            --config config/paper_v5.json --min-edge 0.00025
          python3 scripts/build_v4_intents.py --strategy B2 \
            --input "$R/stat_arb_pca.csv" --output "$R/b2_intents.csv" \
            --config config/paper_v5.json --min-edge 0.00025
          python3 scripts/merge_v4_intents.py \
            --input "$R/b1_intents.csv" --input "$R/b2_intents.csv" --output "$R/intents.csv" \
            --min-edge 0.00025 --max-age-seconds 240 --max-bundles 80

          ./build/polymarket_multileg_paper \
            --config config/paper_v5.json --run-dir "$R" --intents "$R/intents.csv" --trade-tape "$R/trade_tape.csv" \
            --min-edge 0.00025 --completion-threshold 0.75 --submit-latency-ms 100 --cancel-latency-ms 100 \
            --max-replaces 6 --max-leg-risk-usd 12 --adverse-horizon-seconds 45 --once \
            | tee "$R/multileg_latest.log"

          ./build/polymarket_maker_paper \
            --config config/paper_v5.json --run-dir "$R/maker" --markets 500 --min-liquidity 25 \
            --min-edge 0.0005 --max-order-usd 25 --ttl-seconds 120 --hold-seconds 300 \
            --adverse-selection-mult 0.20 --once | tee "$R/maker_latest.log"

          python3 scripts/walk_forward_v4.py \
            --ledger "$R/bundle_ledger.csv" --output "$R/walk_forward.json" --starting-capital 10000 || true

          PYTHONPATH=monitoring python3 - <<'PY'
          from pathlib import Path
          from exporter_latest import LatestCollector

          c = LatestCollector(Path('.'), Path('config'), 'paper_v5_live', 'config/paper_v5.json', 20)
          text = c.collect()
          assert 'polymarket_runtime_info{adapter="v5",run_root="paper_v5_live",version="v5"} 1' in text
          assert 'polymarket_allocator_state_present 1' in text
          for model in ('micro', 'pca', 'graph', 'semantic', 'external'):
              assert f'polymarket_model_info{{expert="{model}",model="{model}"}} 1' in text
          assert 'polymarket_multileg_state_present 1' in text
          staleness = next(
              float(line.split()[1])
              for line in text.splitlines()
              if line.startswith('polymarket_runtime_execution_staleness_seconds ')
          )
          assert staleness < 3600.0, staleness
          Path('paper_v5_live/metrics.prom').write_text(text)
          PY

          test -s "$R/runtime_status.json"
          test -s "$R/strategy_status.csv"
          test -s "$R/allocator_status.json"
          test -s "$R/b2_sparse_hedge_frontier.json"
          python3 -m json.tool "$R/runtime_status.json" >/dev/null
          python3 -m json.tool "$R/b2_sparse_hedge_frontier.json" >/dev/null
          python3 -m json.tool monitoring/grafana/dashboards/polymarket-multi-strategy.json >/dev/null

      - name: Build public telemetry snapshot
        if: always()
        shell: bash
        run: |
          python3 scripts/summarize_live_smoke.py \
            --run-root paper_v5_live --output paper_v5_live/live_snapshot.json \
            --git-sha "$VALIDATION_SHA" --run-id "$GITHUB_RUN_ID" \
            --trade-lookback-seconds 900

      - name: Publish live summary
        if: always()
        shell: bash
        run: |
          R=paper_v5_live
          echo '## Aggressive V5 full-strategy live paper smoke' >> "$GITHUB_STEP_SUMMARY"
          for model in micro pca graph semantic external; do
            f="$R/strategies/$model/engine.log"
            echo "### $model engine" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 8 "$f" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
          for f in "$R/trade_recorder_latest.log" "$R/structural_latest.log" "$R/stat_arb_pairs_latest.log" "$R/stat_arb_pca_latest.log" "$R/coherent_hedges.log" "$R/multileg_latest.log" "$R/maker_latest.log"; do
            echo "### $f" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 8 "$f" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
          if test -s "$R/b2_sparse_hedge_frontier.md"; then
            cat "$R/b2_sparse_hedge_frontier.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '### allocator status' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$R/allocator_status.json" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish latest public telemetry
        if: github.event_name != 'pull_request' && success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s paper_v5_live/live_snapshot.json
          endpoint="repos/${GITHUB_REPOSITORY}/contents/telemetry/latest-live-smoke.json"
          content="$(base64 -w0 paper_v5_live/live_snapshot.json)"
          publish_error="$(mktemp)"
          for attempt in 1 2 3 4 5; do
            current_sha="$(gh api "${endpoint}?ref=telemetry" --jq .sha 2>/dev/null || true)"
            args=("$endpoint" --method PUT -f message="Update public aggressive V5 live smoke telemetry" -f content="$content" -f branch=telemetry)
            if [[ -n "$current_sha" ]]; then
              args+=(-f sha="$current_sha")
            fi
            if gh api "${args[@]}" >/dev/null 2>"$publish_error"; then
              rm -f "$publish_error"
              exit 0
            fi
            if [[ "$attempt" -eq 5 ]]; then
              cat "$publish_error" >&2
              rm -f "$publish_error"
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Upload live diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-live-paper-smoke-${{ github.run_id }}
          path: paper_v5_live/
          if-no-files-found: error
          retention-days: 7

      - name: Advance paper validated ref
        if: github.event_name != 'pull_request' && success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          validated_sha="$(git rev-parse HEAD)"
          test "$validated_sha" = "$VALIDATION_SHA"
          git fetch --no-tags origin main paper-validated
          main_sha="$(git rev-parse origin/main)"
          current_validated_sha="$(git rev-parse origin/paper-validated)"
          test "$validated_sha" = "$main_sha"
          if [[ "$current_validated_sha" != "$validated_sha" ]]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/paper-validated" \
              -f sha="$validated_sha" -F force=false >/dev/null
          fi
          echo "paper_validated_sha=$validated_sha"
