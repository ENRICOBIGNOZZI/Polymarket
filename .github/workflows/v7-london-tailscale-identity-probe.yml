name: V7 London existing Tailscale identity probe

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-london-tailscale-identity-probe-request.json
      - .github/workflows/v7-london-tailscale-identity-probe.yml

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
      INSTANCE_ID: ${{ vars.POLYMARKET_LONDON_INSTANCE_ID || 'i-0fba2bac9fdc5cbeb' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate
        run: |
          python3 - deploy/v7-london-tailscale-identity-probe-request.json <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1]))=={"schema":"polymarket_v7_london_tailscale_identity_probe_v1","read_only":True}
          PY
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: v7-london-ts-identity-probe
          aws-region: eu-west-2
      - name: Probe existing Tailscale identity over SSM
        run: |
          set -euo pipefail
          command="$(cat <<'SH'
          set -euo pipefail
          echo '=== VERSION ==='
          tailscale version || true
          echo '=== STATUS JSON SAFE ==='
          tailscale status --json 2>/dev/null | python3 - <<'PY' || true
          import json,sys
          try:v=json.load(sys.stdin)
          except Exception as e:
              print('status_json_error='+str(e)); raise SystemExit
          s=v.get('Self') or {}
          out={
            'BackendState':v.get('BackendState'),
            'Self':{k:s.get(k) for k in ('ID','HostName','DNSName','TailscaleIPs','Online','Active','Expired','KeyExpiry')},
            'Health':v.get('Health'),
          }
          print(json.dumps(out,sort_keys=True))
          PY
          echo '=== IP ==='
          tailscale ip -4 2>&1 || true
          echo '=== STATE FILES ==='
          find /var/lib/tailscale /var/lib/tailscale* /var/cache/tailscale -maxdepth 2 -type f -print 2>/dev/null | sed -n '1,80p' || true
          echo '=== SERVICE ==='
          systemctl status tailscaled --no-pager -l 2>&1 | tail -80 || true
          echo '=== PREFERENCES SAFE ==='
          tailscale debug prefs 2>/dev/null | python3 - <<'PY' || true
          import json,sys
          try:v=json.load(sys.stdin)
          except Exception as e:
              print('prefs_error='+str(e)); raise SystemExit
          safe={k:v.get(k) for k in ('ControlURL','WantRunning','LoggedOut','Hostname','AdvertiseRoutes','ExitNodeID','ShieldsUp')}
          print(json.dumps(safe,sort_keys=True))
          PY
          SH
          )"
          encoded="$(printf '%s' "$command" | base64 -w0)"
          wrapped="printf '%s' '$encoded' | base64 -d | bash"
          params="$(python3 -c 'import json,sys; print(json.dumps({"commands":[sys.argv[1]],"executionTimeout":["120"]},separators=(",",":")))' "$wrapped")"
          cid="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --parameters "$params" --comment "V7 London existing Tailscale identity probe" --region "$AWS_REGION" --query 'Command.CommandId' --output text)"
          for i in $(seq 1 90); do
            st="$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query Status --output text 2>/dev/null || true)"
            if [[ "$st" == Success ]]; then
              aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query StandardOutputContent --output text
              exit 0
            fi
            case "$st" in Failed|Cancelled|TimedOut)
              aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query StandardErrorContent --output text >&2 || true
              exit 1;;
            esac
            sleep 1
          done
          exit 1
