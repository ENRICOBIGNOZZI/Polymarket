name: Repair PR68 control-plane contracts

on:
  push:
    branches: [feature/alpha-factory-control-plane-v5-clean]
    paths:
      - ".github/workflows/pr68-control-plane-repair.yml"

permissions:
  contents: write

concurrency:
  group: pr68-control-plane-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha-factory-control-plane-v5-clean
          fetch-depth: 0

      - name: Repair scheduler registry and split-governance references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          root = Path('.')

          registry_path = root / 'config/scheduler_registry.json'
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          schedulers = registry['schedulers']
          existing = {item['id'] for item in schedulers}
          additions = [
              {
                  'id': 'alpha-factory',
                  'workflow': '.github/workflows/alpha-factory.yml',
                  'workflow_name': 'Polymarket Alpha Factory',
                  'job': 'evaluate',
                  'cadence': 'hourly at minute 2, relevant changes and manual',
                  'responsibility': 'evaluate paper-only alpha challengers and publish durable evidence without mutating the live champion',
                  'critical': False,
                  'merge_authority': False,
                  'deploy_authority': False,
                  'validation_dispatch_authority': False,
              },
              {
                  'id': 'meta-supervisor',
                  'workflow': '.github/workflows/control-plane.yml',
                  'workflow_name': 'Polymarket Meta-Supervisor',
                  'job': 'coordinate',
                  'cadence': 'hourly at minute 29, relevant changes and manual',
                  'responsibility': 'coordinate bounded allowlisted research and validation remediation without merge, deploy or champion mutation',
                  'critical': True,
                  'merge_authority': False,
                  'deploy_authority': False,
                  'validation_dispatch_authority': False,
              },
          ]
          for item in additions:
              if item['id'] not in existing:
                  schedulers.append(item)
          registry_path.write_text(json.dumps(registry, indent=2) + '\n', encoding='utf-8')

          validator_path = root / 'scripts/validate_scheduler_registry.py'
          validator = validator_path.read_text(encoding='utf-8')
          required_marker = '    "live-api-smoke",\n}'
          required_replacement = (
              '    "live-api-smoke",\n'
              '    "alpha-factory",\n'
              '    "meta-supervisor",\n'
              '}'
          )
          if required_marker not in validator:
              raise SystemExit('validator REQUIRED_IDS marker not found')
          validator_path.write_text(
              validator.replace(required_marker, required_replacement, 1),
              encoding='utf-8',
          )

          governance_test_path = root / 'tests/test_model_governance.py'
          governance_test = governance_test_path.read_text(encoding='utf-8')
          expected_marker = '                "live-api-smoke",\n            },'
          expected_replacement = (
              '                "live-api-smoke",\n'
              '                "alpha-factory",\n'
              '                "meta-supervisor",\n'
              '            },'
          )
          if expected_marker not in governance_test:
              raise SystemExit('model-governance expected-id marker not found')
          governance_test_path.write_text(
              governance_test.replace(expected_marker, expected_replacement, 1),
              encoding='utf-8',
          )

          meta_test_path = root / 'tests/test_meta_supervisor.py'
          meta_test = meta_test_path.read_text(encoding='utf-8')
          if '    def run(\n' not in meta_test:
              raise SystemExit('meta-supervisor helper marker not found')
          meta_test = meta_test.replace('    def run(\n', '    def workflow_run(\n', 1)
          meta_test = meta_test.replace('self.run(', 'self.workflow_run(')
          meta_test_path.write_text(meta_test, encoding='utf-8')

          alpha_config_path = root / 'config/alpha_factory.json'
          alpha_config = json.loads(alpha_config_path.read_text(encoding='utf-8'))
          coordination = alpha_config['coordination']
          workflows = coordination['workflows']
          workflows.pop('model-governance.yml', None)
          workflows['research-policy.yml'] = {
              'name': 'Polymarket Research Policy',
              'requires_current_main': True,
              'max_age_seconds': 7200,
              'dispatchable': True,
              'priority': 60,
              'dependencies': ['ci.yml'],
          }
          allowlist = [
              'research-policy.yml' if item == 'model-governance.yml' else item
              for item in coordination['allowlisted_dispatches']
          ]
          coordination['allowlisted_dispatches'] = list(dict.fromkeys(allowlist))
          alpha_config_path.write_text(json.dumps(alpha_config, indent=2) + '\n', encoding='utf-8')

          control_path = root / '.github/workflows/control-plane.yml'
          control = control_path.read_text(encoding='utf-8')
          if 'model-governance.yml' not in control:
              raise SystemExit('obsolete model-governance reference not found')
          control_path.write_text(
              control.replace('model-governance.yml', 'research-policy.yml'),
              encoding='utf-8',
          )

          factory_path = root / '.github/workflows/alpha-factory.yml'
          factory = factory_path.read_text(encoding='utf-8')
          invariant = '          assert "deploy-paper-server.yml" not in cfg["coordination"]["allowlisted_dispatches"]\n'
          strengthened = (
              invariant
              + '          assert "model-governance.yml" not in cfg["coordination"]["workflows"]\n'
              + '          assert "research-policy.yml" in cfg["coordination"]["allowlisted_dispatches"]\n'
          )
          if invariant not in factory:
              raise SystemExit('Alpha Factory invariant marker not found')
          factory_path.write_text(factory.replace(invariant, strengthened, 1), encoding='utf-8')

          repair_workflow = root / '.github/workflows/pr68-control-plane-repair.yml'
          repair_workflow.unlink()
          PY

      - name: Validate repaired control plane
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_scheduler_registry.py --root . --registry config/scheduler_registry.json
          python3 -m unittest \
            tests/test_model_governance.py \
            tests/test_meta_supervisor.py \
            tests/test_alpha_factory.py -v
          python3 -m py_compile \
            scripts/validate_scheduler_registry.py \
            scripts/meta_supervisor.py \
            scripts/alpha_factory.py
          python3 -m json.tool config/scheduler_registry.json >/dev/null
          python3 -m json.tool config/alpha_factory.json >/dev/null

      - name: Commit repaired branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Alpha Factory scheduler and control-plane contracts"
          git push origin HEAD:feature/alpha-factory-control-plane-v5-clean
