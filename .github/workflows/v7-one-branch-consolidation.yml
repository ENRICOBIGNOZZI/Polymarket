name: V7 one-branch consolidation

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-branch-consolidation-request.json

permissions:
  contents: write

concurrency:
  group: v7-one-branch-consolidation
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Consolidate branch history or delete merged refs
        shell: bash
        run: |
          set -euo pipefail
          REQUEST=deploy/v7-branch-consolidation-request.json
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          mode="$(python3 - "$REQUEST" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1],encoding='utf-8'))
          assert v.get('schema')=='v7_branch_consolidation_request_v1'
          assert v.get('version')==1
          assert v.get('keep_branch')=='main'
          assert v.get('mode') in {'prepare','delete'}
          print(v['mode'])
          PY
          )"
          git config user.name "polymarket-branch-consolidator"
          git config user.email "actions@users.noreply.github.com"
          mapfile -t branches < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin \
            | sed 's#^origin/##' | grep -v '^main$' | grep -v '^HEAD$' | sort -u)
          echo "REMOTE_NON_MAIN_COUNT=${#branches[@]}"
          if [[ "$mode" == prepare ]]; then
            mapfile -t refs < <(printf '%s\n' "${branches[@]}" | sed 's#^#origin/#')
            if (( ${#refs[@]} > 0 )); then
              git merge -s ours --no-edit --no-ff "${refs[@]}"
            fi
            merge_sha="$(git rev-parse HEAD)"
            echo "PREPARED_MERGE_SHA=$merge_sha"
            echo "PREPARED_TREE_SHA=$(git rev-parse HEAD^{tree})"
            echo "BASE_TREE_SHA=$(git rev-parse HEAD^1^{tree})"
            test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse HEAD^1^{tree})"
            git push --force origin HEAD:refs/heads/__one_branch_consolidation_tmp
            exit 0
          fi

          # Destructive phase is fail-closed: every branch tip must already be
          # reachable from main before its ref can be deleted.
          git fetch origin main
          bad=0
          for b in "${branches[@]}"; do
            if ! git merge-base --is-ancestor "origin/$b" origin/main; then
              echo "NOT_MERGED=$b" >&2
              bad=1
            fi
          done
          test "$bad" = 0
          if (( ${#branches[@]} > 0 )); then
            git push origin --delete "${branches[@]}"
          fi
          git fetch --prune origin
          mapfile -t remaining < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin \
            | sed 's#^origin/##' | grep -v '^HEAD$' | sort -u)
          printf 'REMAINING_BRANCH=%s\n' "${remaining[@]}"
          test "${#remaining[@]}" = 1
          test "${remaining[0]}" = main
