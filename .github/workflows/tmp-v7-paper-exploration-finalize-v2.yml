name: TEMP V7 PAPER exploration final repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/v7-paper-exploration
          fetch-depth: 0

      - name: Repair feature branch contracts
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- config/paper_v7.json
          git rm -f .github/workflows/tmp-v7-paper-exploration-finalize.yml
          python3 - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          edges_path = Path("config/v7_authority_edges.json")
          edges = json.loads(edges_path.read_text(encoding="utf-8"))
          source = "scripts/v7_external_fair_paper_router.py"
          edges["edges"] = [row for row in edges["edges"] if row.get("source") != source]
          edges["edges"].append({
              "source": source,
              "classification": "MERGE_INTO_CANONICAL",
              "runtime_reachability": "CANONICAL_RUNTIME",
              "authority_mode": "COORDINATOR_RECEIPT_GATED_PAPER_EVENT_PRODUCER",
              "severity": "CONTROLLED",
              "reason": (
                  "emits bounded simulated PAPER lifecycle events only after a matching "
                  "global-coordinator receipt and never writes the canonical ledger directly"
              ),
              "canonical_replacement": "V7_CANONICAL_LEDGER",
          })
          edges["edges"] = sorted(edges["edges"], key=lambda row: row["source"])
          edges_path.write_text(json.dumps(edges, indent=2) + "\n", encoding="utf-8")

          test_path = Path("tests/test_v7_external_fair_paper_router.py")
          text = test_path.read_text(encoding="utf-8")
          old_static = '''    assert "spool_event" not in source
              assert "v7_ledger_spool" not in source
          '''
          new_static = '''    assert "from v7_ledger_spool import spool_event" in source
              assert "spool_event(self.root" in source
              assert "wait_for_exploration_receipt" in source
              assert "PAPER_EXPLORATION_NOT_SELECTED" in source
          '''
          if old_static not in text:
              raise SystemExit("missing old static authority assertions")
          text = text.replace(old_static, new_static, 1)

          old_step = '''        with mock.patch.object(router, "request_json", side_effect=public_request):
                      paper.step()
          '''
          new_step = '''        exploration_receipt = {
                      "schema": "polymarket_v7_global_opportunity_decision_v1",
                      "owner": "V7_GLOBAL_PORTFOLIO_COORDINATOR",
                      "decision_timestamp_ns": time.time_ns(),
                      "action": "TAKE",
                      "engine_id": "CRYPTO_SETTLEMENT_ENGINE",
                      "crypto_context": {
                          "asset": "BTC", "horizon": "M5",
                          "authority": "PAPER_EXPLORATION",
                      },
                      "selected_replay_key": "test-exploration",
                      "new_risk_authorized": False,
                      "paper_exploration_authorized": True,
                      "paper_only": True,
                      "authenticated_execution": False,
                      "real_order_submission": False,
                      "real_capital_at_risk": False,
                      "reasons": ["TEST_COORDINATOR_SELECTION"],
                  }
                  with mock.patch.object(router, "request_json", side_effect=public_request):
                      with mock.patch.object(
                          paper, "wait_for_exploration_receipt",
                          return_value=exploration_receipt,
                      ):
                          paper.step()
          '''
          if old_step not in text:
              raise SystemExit("missing first router step block")
          text = text.replace(old_step, new_step, 1)
          old = 'assert proposal["action"] == "NOTHING"'
          if old not in text:
              raise SystemExit("missing old proposal action assertion")
          text = text.replace(old, 'assert proposal["action"] == "TAKE"', 1)
          old = 'assert not (run_root / "ledger" / "spool").exists()'
          if old not in text:
              raise SystemExit("missing old zero-spool assertion")
          text = text.replace(old, 'assert (run_root / "ledger" / "spool").exists()', 1)
          test_path.write_text(text, encoding="utf-8")
          PY

          python3 scripts/v7_surface_classification.py \
            --repository-root . \
            --output artifacts/v7_unification/path_classification.json

      - name: Run affected safety contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_v7_authority_reachability_audit.py
          python3 tests/test_v7_capital_allocator.py
          python3 tests/test_v7_external_fair_paper_router.py
          python3 tests/test_v7_final_convergence_audit.py
          python3 tests/test_v7_surface_classification.py
          python3 -m pytest -q tests/test_v7_paper_exploration_authority.py \
            tests/test_v7_opportunity.py tests/test_v7_global_portfolio_coordinator.py \
            tests/test_v7_ledger_spool.py

      - name: Push tested feature repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ENRICOBIGNOZZI"
          git config user.email "88671442+ENRICOBIGNOZZI@users.noreply.github.com"
          git add -A
          git commit -m "fix: close PAPER exploration authority and regression contracts"
          git push origin HEAD:codex/v7-paper-exploration

      - name: Remove temporary main workflow
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C main origin/main
          git config user.name "ENRICOBIGNOZZI"
          git config user.email "88671442+ENRICOBIGNOZZI@users.noreply.github.com"
          git rm .github/workflows/tmp-v7-paper-exploration-finalize-v2.yml
          git commit -m "chore: remove temporary PAPER exploration repair workflow"
          git push origin main
