name: apply-pregame-queue-hotfix

on:
  push:
    branches: [fix/pregame-tape-fills]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-build-test:
    if: github.event_name == 'push' || github.head_ref == 'fix/pregame-tape-fills'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pregame-tape-fills
          fetch-depth: 0

      - name: Reassemble and validate source payload
        run: |
          cat > /tmp/hotfix-parts.sha256 <<'EOF'
          6a9780aa38de9d0032e68ed2bc66e479a8281e15572d82385b0b1c9c41f15d23  .github/hotfix_payload.part00
          767c922327059e4cf0fe98f40d0fff3049ad4c47489b9976b8ef40e136f8eb7a  .github/hotfix_payload.part01
          608b32320fe587194d6531b293d8c64deff8f1942e0a8ceaa8f1b23f20db8006  .github/hotfix_payload.part02
          056d1324bf6dbd7e86528017ef7adbc7444e18cff6c65f3c694ae6ce695eb617  .github/hotfix_payload.part03
          699001f3bce9c19983afe1d57c0ddff53461d552499b70b1e7954db1f942662e  .github/hotfix_payload.part04
          EOF
          sha256sum --check /tmp/hotfix-parts.sha256
          cat .github/hotfix_payload.part* | base64 --decode > /tmp/pregame_queue_hotfix.tar.gz
          echo "8d2acd45f070b6eea72428f4e152933389198ea4f808428e81b5da5aa8b02a92  /tmp/pregame_queue_hotfix.tar.gz" | sha256sum --check
          gzip --test /tmp/pregame_queue_hotfix.tar.gz
          tar -tzf /tmp/pregame_queue_hotfix.tar.gz
          tar -xzf /tmp/pregame_queue_hotfix.tar.gz
          rm -f .github/hotfix_payload.b64 .github/hotfix_payload.part* .github/workflows/apply-pregame-queue-hotfix.yml
          test -f src/api_safe.cpp
          test -f src/maker_paper_safe.cpp
          ! grep -q "strict_trade_through" src/maker_paper_safe.cpp

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev python3

      - name: Build and test Release
        run: |
          cmake -S . -B build-Release -DCMAKE_BUILD_TYPE=Release
          cmake --build build-Release --parallel 2
          ctest --test-dir build-Release --output-on-failure

      - name: Build and test Debug
        run: |
          cmake -S . -B build-Debug -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-Debug --parallel 2
          ctest --test-dir build-Debug --output-on-failure

      - name: Commit verified hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix in-play sports and maker fill simulation"
          git push origin HEAD:fix/pregame-tape-fills
