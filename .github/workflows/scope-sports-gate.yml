name: scope-sports-gate

on:
  push:
    branches: [fix/pregame-tape-fills]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-build-test:
    if: github.event_name == 'push' || github.head_ref == 'fix/pregame-tape-fills'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pregame-tape-fills
          fetch-depth: 0

      - name: Scope timed-sports gate to relative-value and maker sleeves
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected one match in {path}, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "include/pm/types.hpp",
              "    bool accepting_orders = true;\n    std::optional<int> resolved_yes;\n",
              "    bool accepting_orders = true;\n    bool timed_sports = false;\n    std::int64_t game_start_ts = 0;\n    int seconds_delay = 0;\n    std::optional<int> resolved_yes;\n")

          replace_once(
              "src/api.cpp",
              "    if (auto it = o.find(\"acceptingOrders\"); it != o.end()) m.accepting_orders = as_bool(it->value(), true);\n    if (auto it = o.find(\"eventId\"); it != o.end()) m.event_id = as_string(it->value());\n",
              "    if (auto it = o.find(\"acceptingOrders\"); it != o.end()) m.accepting_orders = as_bool(it->value(), true);\n    const auto timing = timing_from_object(o);\n    m.timed_sports = timing.timed_sports;\n    m.game_start_ts = timing.game_start_ts;\n    m.seconds_delay = timing.seconds_delay;\n    if (auto it = o.find(\"eventId\"); it != o.end()) m.event_id = as_string(it->value());\n")

          replace_once(
              "src/api.cpp",
              "    std::size_t offset = 0;\n    const auto now = static_cast<std::int64_t>(std::time(nullptr));\n",
              "    std::size_t offset = 0;\n")

          replace_once(
              "src/api.cpp",
              "        for (const auto& v : *arr) {\n            if (!v.is_object()) continue;\n            const auto timing = timing_from_object(v.as_object());\n            // The public Gamma metadata is the venue clock for timed sports. Fail closed for\n            // timed sport markets without a valid start and stop admitting them 15 minutes pre-game.\n            if (!pregame_market_eligible(timing, now)) continue;\n            if (auto m = parse_market_object(v.as_object(), min_liquidity)) {\n",
              "        for (const auto& v : *arr) {\n            if (!v.is_object()) continue;\n            if (auto m = parse_market_object(v.as_object(), min_liquidity)) {\n")

          replace_once(
              "src/stat_arb.cpp",
              "        auto books = api.fetch_books(tokens);\n\n        std::vector<const pm::Market*> universe;\n",
              "        auto books = api.fetch_books(tokens);\n        const std::int64_t now = static_cast<std::int64_t>(std::time(nullptr));\n\n        std::vector<const pm::Market*> universe;\n")

          replace_once(
              "src/stat_arb.cpp",
              "        for (const auto& m : markets) {\n            auto y = books.find(m.yes_token), n = books.find(m.no_token);\n",
              "        for (const auto& m : markets) {\n            if (!pm::pregame_market_eligible(\n                    pm::MarketTiming{m.timed_sports, m.game_start_ts, m.seconds_delay}, now)) continue;\n            auto y = books.find(m.yes_token), n = books.find(m.no_token);\n")

          replace_once(
              "src/stat_arb.cpp",
              "        const std::int64_t now = static_cast<std::int64_t>(std::time(nullptr));\n        const std::int64_t start = now - static_cast<std::int64_t>(lookback_hours) * 3600;\n",
              "        const std::int64_t start = now - static_cast<std::int64_t>(lookback_hours) * 3600;\n")

          replace_once(
              "src/pca_stat_arb.cpp",
              "        auto books = api.fetch_books(all_tokens);\n\n        std::vector<const pm::Market*> universe;\n",
              "        auto books = api.fetch_books(all_tokens);\n        const auto now = std::chrono::duration_cast<std::chrono::seconds>(\n            std::chrono::system_clock::now().time_since_epoch()).count();\n\n        std::vector<const pm::Market*> universe;\n")

          replace_once(
              "src/pca_stat_arb.cpp",
              "        for (const auto& m : markets) {\n            auto y = books.find(m.yes_token), n = books.find(m.no_token);\n",
              "        for (const auto& m : markets) {\n            if (!pm::pregame_market_eligible(\n                    pm::MarketTiming{m.timed_sports, m.game_start_ts, m.seconds_delay}, now)) continue;\n            auto y = books.find(m.yes_token), n = books.find(m.no_token);\n")

          replace_once(
              "src/pca_stat_arb.cpp",
              "        const auto now = std::chrono::duration_cast<std::chrono::seconds>(\n            std::chrono::system_clock::now().time_since_epoch()).count();\n        const auto start = now - static_cast<std::int64_t>(lookback_hours) * 3600;\n",
              "        const auto start = now - static_cast<std::int64_t>(lookback_hours) * 3600;\n")

          replace_once(
              "src/maker_paper.cpp",
              "                std::optional<pm::MarketTiming> timing;\n                try {\n                    timing = api_.fetch_market_timing(m.id);\n                } catch (const std::exception& e) {\n                    std::cerr << \"maker_timing_error market=\" << m.id << \" error=\" << e.what() << '\\n';\n                    continue;\n                }\n                if (!timing || !pm::pregame_market_eligible(*timing, now)) continue;\n",
              "                const pm::MarketTiming timing{m.timed_sports, m.game_start_ts, m.seconds_delay};\n                if (!pm::pregame_market_eligible(timing, now)) continue;\n")

          replace_once("src/maker_paper.cpp", "o.game_start_ts = timing->game_start_ts;", "o.game_start_ts = timing.game_start_ts;")
          replace_once("src/maker_paper.cpp", "o.timed_sports = timing->timed_sports;", "o.timed_sports = timing.timed_sports;")

          p = Path("docs/HOTFIX_INPLAY_QUEUE.md")
          text = p.read_text()
          text = text.replace(
              "Gamma `gameStartTime` and `sportsMarketType` metadata are parsed before a market enters the discovered universe. A timed sports market is rejected from new scans and new maker orders when:",
              "Gamma `gameStartTime`, `sportsMarketType`, and `secondsDelay` metadata are stored on each discovered market. B1, B2, and maker entry reject a timed sports market when:")
          text = text.replace(
              "The gate currently applies at the shared discovery layer. This is intentionally conservative: it also removes timed in-play sports from structural and terminal scans until strategy-specific universe routing is introduced.",
              "The gate is strategy-scoped: structural arbitrage and genuine terminal-probability scans retain their universe, while only mean-reversion and maker-entry sleeves are blocked around game start.")
          p.write_text(text)
          PY

          rm .github/workflows/scope-sports-gate.yml
          grep -q "timed_sports" include/pm/types.hpp
          grep -q "pregame_market_eligible" src/stat_arb.cpp
          grep -q "pregame_market_eligible" src/pca_stat_arb.cpp
          ! grep -q "maker_timing_error" src/maker_paper.cpp
          ! grep -q "shared discovery layer" docs/HOTFIX_INPLAY_QUEUE.md

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev python3

      - name: Build and test Release
        run: |
          cmake -S . -B build-Release -DCMAKE_BUILD_TYPE=Release
          cmake --build build-Release --parallel 2
          ctest --test-dir build-Release --output-on-failure

      - name: Build and test Debug
        run: |
          cmake -S . -B build-Debug -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-Debug --parallel 2
          ctest --test-dir build-Debug --output-on-failure

      - name: Commit scoped verified hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Scope timed-sports gate to relative-value sleeves"
          git push origin HEAD:fix/pregame-tape-fills
