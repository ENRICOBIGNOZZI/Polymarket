name: V7 sparse Local Factor evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/v7_local_factor_core.py"
      - "scripts/v7_local_factor_inference.py"
      - "scripts/v7_local_factor_pairs.py"
      - "scripts/v7_local_factor_research.py"
      - "tests/test_v7_local_factor_core.py"
      - "tests/test_v7_local_factor_inference.py"
      - "tests/test_v7_local_factor_pairs.py"
      - ".github/workflows/v7-local-factor-research.yml"

permissions:
  contents: read

concurrency:
  group: v7-local-factor-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Deterministic Local Factor contracts
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests/test_v7_local_factor_core.py \
            tests/test_v7_local_factor_inference.py \
            tests/test_v7_local_factor_pairs.py -v
          python3 -m py_compile \
            scripts/v7_local_factor_core.py \
            scripts/v7_local_factor_inference.py \
            scripts/v7_local_factor_pairs.py \
            scripts/v7_local_factor_research.py

      - name: Live public-data sparse Local Factor research
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lf_evidence
          python3 scripts/v7_local_factor_research.py \
            --config config/research_v7_local_factor.json \
            --paper-config config/paper_v6.json \
            --bootstrap-reps 199 \
            --output-json lf_evidence/report.json \
            | tee lf_evidence/run.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('lf_evidence/report.json').read_text())
          assert r['paper_only'] is True
          assert r['research_only'] is True
          assert r['live_intents_enabled'] is False
          assert r['submitted_orders'] == 0
          assert r['promotion_ready'] is False
          assert r['history_data_healthy'] is True
          assert r['pair_graph_selection'] == 'contract_metadata_only_before_price_history'
          assert r['pair_hypotheses'] <= r['predeclared_pair_count']
          if r['pair_hypotheses']:
              assert r['bootstrap_resolution']['singleton_bh_resolution_adequate'] is True
          PY

      - name: Publish Local Factor summary
        if: always()
        shell: bash
        run: |
          echo '## V7 sparse Local Factor evidence' >> "$GITHUB_STEP_SUMMARY"
          if test -s lf_evidence/report.json; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path('lf_evidence/report.json').read_text())
          print(f"- markets: {r['markets']}")
          print(f"- clusters: {r['clusters']}")
          print(f"- histories: {r['histories']}")
          print(f"- predeclared pairs: {r['predeclared_pair_count']}")
          print(f"- tested pairs: {r['pair_hypotheses']}")
          print(f"- bootstrap reps: {r['bootstrap_repetitions']}")
          print(f"- resolution adequate: {r['bootstrap_resolution']['singleton_bh_resolution_adequate'] if r['pair_hypotheses'] else 'n/a'}")
          print(f"- BH selected: {r['bh_selected_pairs']}")
          print(f"- post-BH signals: {r['post_bh_pair_signals']}")
          PY
          else
            echo '- report missing' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Local Factor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-local-factor-sparse-${{ github.run_id }}
          path: lf_evidence/
          if-no-files-found: warn
          retention-days: 30
