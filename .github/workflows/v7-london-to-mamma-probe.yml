name: V7 London to mamma network probe

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-london-to-mamma-probe-request.json
      - .github/workflows/v7-london-to-mamma-probe.yml

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
      INSTANCE_ID: ${{ vars.POLYMARKET_LONDON_INSTANCE_ID || 'i-0fba2bac9fdc5cbeb' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate
        run: |
          python3 - deploy/v7-london-to-mamma-probe-request.json <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1]))=={"schema":"polymarket_v7_london_to_mamma_probe_v1","read_only":True}
          PY
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: v7-london-to-mamma-probe
          aws-region: eu-west-2
      - name: Probe from London
        run: |
          set -euo pipefail
          cmd="set -e; echo DNS; getent ahosts Mac.usilu.net || true; echo SSH; timeout 8 bash -lc '</dev/tcp/Mac.usilu.net/22' && echo TCP22_OPEN || echo TCP22_CLOSED; echo HTTPS; curl -k -sS -I --max-time 8 https://mamma-portfolio.tail1bae85.ts.net/ || true"
          enc="$(printf '%s' "$cmd" | base64 -w0)"
          wrapped="printf '%s' '$enc' | base64 -d | bash"
          params="$(python3 -c 'import json,sys; print(json.dumps({"commands":[sys.argv[1]],"executionTimeout":["60"]}))' "$wrapped")"
          cid="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --parameters "$params" --region "$AWS_REGION" --query 'Command.CommandId' --output text)"
          for _ in $(seq 1 60); do
            st="$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query Status --output text 2>/dev/null || true)"
            if [[ "$st" == Success ]]; then
              aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query StandardOutputContent --output text
              exit 0
            fi
            case "$st" in Failed|TimedOut|Cancelled)
              aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query StandardErrorContent --output text >&2 || true
              exit 1;;
            esac
            sleep 1
          done
          exit 1
