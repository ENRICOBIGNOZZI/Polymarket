name: TEMP regenerate clean V7 surface audit

on:
  push:
    branches: [codex/v7-paper-probe-deploy-20260904]
    paths: [.github/workflows/tmp-regenerate-v7-surface-after-repair.yml]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/v7-paper-probe-deploy-20260904
          fetch-depth: 0
      - name: Remove one-shot surface before inventory generation
        run: git rm .github/workflows/tmp-regenerate-v7-surface-after-repair.yml
      - name: Regenerate immutable surface audit
        run: >-
          python3 scripts/v7_surface_classification.py
          --repository-root .
          --output artifacts/v7_unification/path_classification.json
      - name: Validate focused contracts
        run: |
          python3 -m pip install --disable-pip-version-check pytest
          python3 -m pytest -q \
            tests/test_v7_surface_classification.py \
            tests/test_v7_final_convergence_audit.py \
            tests/test_v7_external_fair_paper_router.py \
            tests/test_v7_paper_exploration_authority.py \
            tests/test_v7_opportunity.py \
            tests/test_v7_global_portfolio_coordinator.py \
            tests/test_v7_ledger_spool.py \
            tests/test_monitoring_v7_external_fair.py \
            tests/test_monitoring_v7_native.py
      - name: Commit clean audit
        run: |
          set -euo pipefail
          git config user.name ENRICOBIGNOZZI
          git config user.email 88671442+ENRICOBIGNOZZI@users.noreply.github.com
          git add -A
          git commit -m 'chore: regenerate clean V7 surface audit'
          git push origin HEAD:codex/v7-paper-probe-deploy-20260904
