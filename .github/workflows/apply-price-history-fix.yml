name: Apply price history fix

on:
  push:
    branches: [research/aggressive-v5-execution]
    paths:
      - ops/fix_price_history_interval.py
      - .github/workflows/apply-price-history-fix.yml

permissions:
  contents: write

concurrency:
  group: apply-price-history-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/aggressive-v5-execution
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev python3

      - name: Apply fix
        run: |
          set -euo pipefail
          python3 -m py_compile ops/fix_price_history_interval.py
          python3 ops/fix_price_history_interval.py

      - name: Build and test
        run: |
          set -euo pipefail
          # This one-shot bootstrap workflow is intentionally absent while the
          # scheduler-governance test inventories permanent workflows.
          mv .github/workflows/apply-price-history-fix.yml /tmp/apply-price-history-fix.yml
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Targeted live history validation
        run: |
          set -euo pipefail
          ./build/polymarket_stat_arb \
            --config config/paper_v5.json --markets 240 --history-universe 120 \
            --lookback-hours 336 --fidelity-minutes 30 --min-z 0.65 \
            --min-t-reversion 0.50 --max-half-life-hours 336 --top 20 \
            --csv /tmp/stat_arb_pairs.csv | tee /tmp/stat_arb.log
          ./build/polymarket_pca_stat_arb \
            --config config/paper_v5.json --markets 240 --universe 100 \
            --lookback-hours 336 --fidelity-minutes 30 --factors 3 --max-hedges 8 \
            --min-z 0.65 --min-t-reversion 0.50 --max-factor-hedge-error 0.80 \
            --max-half-life-hours 336 --top 20 --csv /tmp/pca.csv | tee /tmp/pca.log
          grep -Eq 'usable_series=[1-9][0-9]*' /tmp/stat_arb.log
          grep -Eq 'panel_series=[1-9][0-9]*' /tmp/pca.log

      - name: Commit validated code
        run: |
          set -euo pipefail
          cp /tmp/apply-price-history-fix.yml .github/workflows/apply-price-history-fix.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "Fix Polymarket history interval ingestion"
          git push origin HEAD:research/aggressive-v5-execution
