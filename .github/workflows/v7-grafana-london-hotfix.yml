name: V7 Grafana Polymarket London hotfix

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-grafana-london-hotfix-request.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: v7-grafana-london-hotfix
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
      INSTANCE_ID: ${{ vars.POLYMARKET_LONDON_INSTANCE_ID || 'i-0fba2bac9fdc5cbeb' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate request
        id: req
        run: |
          python3 - deploy/v7-grafana-london-hotfix-request.json "$GITHUB_OUTPUT" <<'PY'
          import json,re,sys
          v=json.load(open(sys.argv[1]))
          assert set(v)=={'schema','target_sha','folder_uid','paper_only','real_order_submission'}
          assert v['schema']=='polymarket_v7_grafana_london_hotfix_v1'
          assert re.fullmatch(r'[0-9a-f]{40}',v['target_sha'])
          assert v['folder_uid']=='afyms0c1xjabkf'
          assert v['paper_only'] is True
          assert v['real_order_submission'] is False
          with open(sys.argv[2],'a') as h:
              h.write('target_sha='+v['target_sha']+'\n')
          PY

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: polymarket-v7-grafana-london-hotfix
          aws-region: eu-west-2

      - name: Apply monitoring-only Grafana folder fix
        env:
          TARGET_SHA: ${{ steps.req.outputs.target_sha }}
        run: |
          set -euo pipefail
          command="$(cat <<'SH'
          set -euo pipefail
          SHA=__SHA__
          APP=/home/ubuntu/polymarket
          UNIT=polymarket-v7-paper.service
          [[ -d "$APP/.git" ]]
          sudo -u ubuntu git -C "$APP" fetch --no-tags origin main
          sudo -u ubuntu git -C "$APP" cat-file -e "$SHA^{commit}"

          PROV="$(systemctl show grafana-server.service -p Environment --value | python3 -c 'import shlex,sys; x=shlex.split(sys.stdin.read()); print(next(v.split("=",1)[1] for v in x if v.startswith("PROVISIONING_CFG_DIR=")))')"
          [[ "$PROV" == /*/grafana/provisioning ]]
          GRAFANA_DIR="$(dirname "$PROV")"
          DASH_DIR="$GRAFANA_DIR/dashboards"
          mkdir -p "$PROV/dashboards" "$DASH_DIR"

          tmp_provider="$(mktemp)"
          sudo -u ubuntu git -C "$APP" show "$SHA:monitoring/grafana/provisioning/dashboards/v7.yml" > "$tmp_provider"
          python3 - "$tmp_provider" "$DASH_DIR" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]); d=sys.argv[2]
          s=p.read_text()
          assert s.count('__POLYMARKET_V7_DASHBOARD_DIR__')==1
          s=s.replace('__POLYMARKET_V7_DASHBOARD_DIR__',d)
          assert 'folder: Polymarket London' in s
          assert 'folderUid: afyms0c1xjabkf' in s
          p.write_text(s)
          PY
          install -m 0644 "$tmp_provider" "$PROV/dashboards/v7.yml"
          rm -f "$tmp_provider"

          for name in polymarket-v7.json polymarket-v7-external-fair.json polymarket-v7-latency.json polymarket-v7-multi-crypto.json polymarket-v7-pure-arb.json; do
            tmp="$(mktemp)"
            sudo -u ubuntu git -C "$APP" show "$SHA:monitoring/grafana/dashboards/$name" > "$tmp"
            python3 - "$tmp" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1]))
          assert isinstance(v.get('uid'),str) and v['uid']
          assert isinstance(v.get('panels'),list)
          PY
            install -m 0644 "$tmp" "$DASH_DIR/$name"
            rm -f "$tmp"
          done

          systemctl restart grafana-server.service
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health

          python3 - <<'PY'
          import json,sqlite3,time
          db='/var/lib/grafana/grafana.db'
          deadline=time.time()+30
          while time.time()<deadline:
              con=sqlite3.connect(f'file:{db}?mode=ro',uri=True)
              cols=[r[1] for r in con.execute('pragma table_info(resource)')]
              idx={name:i for i,name in enumerate(cols)}
              rows=con.execute('select * from resource where name in (?,?)',('afyms0c1xjabkf','polymarket-v7-pure-arb')).fetchall()
              folder_ok=False; dash_ok=False; dash_title=''
              for row in rows:
                  name=str(row[idx['name']])
                  group=str(row[idx['group']])
                  folder=str(row[idx['folder']] or '')
                  value=row[idx['value']]
                  doc={}
                  if isinstance(value,(bytes,bytearray)):
                      try: doc=json.loads(value)
                      except Exception: doc={}
                  meta=doc.get('metadata') or {}
                  ann=meta.get('annotations') or {}
                  spec=doc.get('spec') or {}
                  if name=='afyms0c1xjabkf' and group=='folder.grafana.app' and spec.get('title')=='Polymarket London':
                      folder_ok=True
                  if name=='polymarket-v7-pure-arb' and group=='dashboard.grafana.app':
                      dash_title=str(spec.get('title') or '')
                      dash_ok=(folder=='afyms0c1xjabkf' and ann.get('grafana.app/folder')=='afyms0c1xjabkf')
              con.close()
              if folder_ok and dash_ok:
                  print('GRAFANA_FOLDER_OK=Polymarket London')
                  print('GRAFANA_PURE_ARB_OK='+dash_title)
                  break
              time.sleep(1)
          else:
              raise SystemExit('pure-arb dashboard not observed in requested Grafana unified folder')
          PY

          ROOT="$(systemctl show "$UNIT" -p Environment --value | python3 -c 'import shlex,sys; print(next(v.split("=",1)[1] for v in shlex.split(sys.stdin.read()) if v.startswith("PM_V7_RUN_ROOT=")))')"
          python3 - "$ROOT/research/repricing_book/pure_arb_status.json" <<'PY'
          import json,sys,time
          v=json.load(open(sys.argv[1]))
          assert v.get('state')=='running'
          assert v.get('paper_only') is True
          assert v.get('real_order_submission') is False
          assert int(v.get('expected_contexts') or 0)==30
          assert len(v.get('contexts') or [])==30
          assert int(time.time()*1000)-int(v.get('timestamp_ms') or 0)<10000
          print('PURE_ARB_LIVE_OK=1')
          print('EVALUATIONS='+str(v.get('evaluations')))
          print('CYCLES='+str(v.get('cycles_total')))
          print('PNL='+str(v.get('paper_locked_pnl_pre_gas_total')))
          PY
          SH
          )"
          command="${command/__SHA__/$TARGET_SHA}"
          encoded="$(printf '%s' "$command" | base64 -w0)"
          wrapped="printf '%s' '$encoded' | base64 -d | bash"
          params="$(python3 -c 'import json,sys; print(json.dumps({"commands":[sys.argv[1]],"executionTimeout":["300"]},separators=(",",":")))' "$wrapped")"
          cid="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --parameters "$params" --comment "Polymarket V7 Grafana London monitoring-only hotfix" --region "$AWS_REGION" --query 'Command.CommandId' --output text)"
          for i in $(seq 1 90); do
            status="$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query Status --output text 2>/dev/null || true)"
            if [[ "$status" == "Success" ]]; then
              aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query StandardOutputContent --output text
              exit 0
            fi
            case "$status" in Failed|Cancelled|TimedOut)
              aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query StandardErrorContent --output text >&2 || true
              exit 1;;
            esac
            sleep 1
          done
          exit 1
