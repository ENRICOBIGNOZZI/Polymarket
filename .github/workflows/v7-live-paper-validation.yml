name: V7 live PAPER validation

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main V7 SHA to validate
        required: false
        type: string
  repository_dispatch:
    types: [v7-live-paper-validate]
  workflow_run:
    workflows: ["ci", "monitoring", "Private runtime single-writer validation"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "11,26,41,56 * * * *"

permissions:
  actions: read
  contents: write

concurrency:
  group: v7-live-paper-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VALIDATION_SHA: ${{ github.event.inputs.expected_sha || github.event.client_payload.expected_sha || github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Validate requested SHA
        run: |
          set -euo pipefail
          [[ "$VALIDATION_SHA" =~ ^[0-9a-f]{40}$ ]]

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VALIDATION_SHA }}
          fetch-depth: 0

      - name: Require exact-main V7 technical gates
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "ready=false" >> "$GITHUB_OUTPUT"
          git fetch --no-tags origin main paper-validated
          test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"
          if [[ "$(git rev-parse origin/main)" != "$VALIDATION_SHA" ]]; then
            echo "validation_state=stale_non_main_sha" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - <<'PY'
          import json
          m=json.load(open('config/live_champion.json'))
          assert m.get('enabled') is True and m.get('version') == 7
          assert m.get('loop') == 'scripts/paper_v7_execution_loop.sh'
          assert m.get('config') == 'config/paper_v7.json'
          assert m.get('paper_only') is True
          assert m.get('authenticated_execution') is False
          assert m.get('real_order_submission') is False
          assert m.get('legacy_fallback_allowed') is False
          PY
          for pair in \
            "ci.yml:ci" \
            "monitoring.yml:monitoring" \
            "private-runtime-single-writer-validation.yml:Private runtime single-writer validation"; do
            workflow="${pair%%:*}"; name="${pair#*:}"; tmp="/tmp/${workflow%.yml}-runs.json"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&per_page=50" > "$tmp"
            python3 - "$tmp" "$VALIDATION_SHA" "$name" <<'PY'
          import json,sys
          path,sha,name=sys.argv[1:]
          rows=json.load(open(path)).get('workflow_runs',[])
          exact=[r for r in rows if r.get('head_sha')==sha and r.get('status')=='completed']
          if not any(r.get('conclusion')=='success' for r in exact):
              raise SystemExit(f'{name} has no exact-SHA success for {sha}')
          PY
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Enforce V7 PAPER safety contract
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          current_validated="$(git rev-parse origin/paper-validated)"
          git merge-base --is-ancestor "$current_validated" "$VALIDATION_SHA"
          python3 scripts/v7_cutover_contract.py --repository-root . --expected-head "$VALIDATION_SHA" --github-env "$GITHUB_ENV"

      - name: Install build dependencies
        if: steps.gate.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev libssl-dev python3

      - name: Deterministic V7 validation
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          python3 -m py_compile scripts/v7_*.py monitoring/exporter_v7.py monitoring/v7_ledger_metrics.py
          bash -n scripts/paper_v7_execution_loop.sh
          python3 -m json.tool config/paper_v7.json >/dev/null
          python3 -m json.tool config/v7_frequency_matrix.json >/dev/null

      - name: Bounded same-SHA public-data PAPER runtime
        if: steps.gate.outputs.ready == 'true'
        id: economics
        shell: bash
        run: |
          set -euo pipefail
          R="runs/v7_cutover_validation/$VALIDATION_SHA"
          rm -rf "$R"
          mkdir -p "$R/ledger"
          touch "$R/ledger/execution.jsonl"
          PM_V7_CONFIG=config/paper_v7.json \
          PM_V7_RUN_ROOT="$R" \
          PM_TRADE_RECORDER="$PWD/build/polymarket_v7_trade_recorder" \
            bash scripts/paper_v7_execution_loop.sh >"$R/runtime.log" 2>&1 &
          owner=$!
          cleanup() { kill -TERM "$owner" 2>/dev/null || true; wait "$owner" 2>/dev/null || true; }
          trap cleanup EXIT INT TERM
          healthy=0
          for _ in {1..180}; do
            if ! kill -0 "$owner" 2>/dev/null; then tail -n 200 "$R/runtime.log" >&2 || true; exit 1; fi
            if [[ -s "$R/control/runtime_status.json" && -s "$R/control/allocations/manifest.json" && -s "$R/control/portfolio_state.json" ]]; then healthy=1; break; fi
            sleep 1
          done
          test "$healthy" = 1
          test ! -e "$R/control/KILL"
          python3 scripts/v7_ledger_spool.py --run-root "$R" --model-sha "$VALIDATION_SHA" >/dev/null
          python3 scripts/v7_canonical_economics.py --ledger "$R/ledger/execution.jsonl" --expected-model-sha "$VALIDATION_SHA" --output "$R/canonical_economics.json"
          python3 scripts/v7_portfolio_guard.py --run-root "$R" --allocation-manifest "$R/control/allocations/manifest.json" --max-drawdown 0.15 >/dev/null
          python3 - "$R" "$VALIDATION_SHA" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1]); sha=sys.argv[2]; out=Path(sys.argv[3])
          runtime=json.loads((root/'control/runtime_status.json').read_text())
          portfolio=json.loads((root/'control/portfolio_state.json').read_text())
          economics=json.loads((root/'canonical_economics.json').read_text())
          assert runtime.get('paper_only') is True and runtime.get('authenticated_execution') is False
          assert runtime.get('model_sha') == sha
          assert portfolio.get('paper_only') is True and portfolio.get('authenticated_execution') is False
          assert float(portfolio.get('drawdown',1)) <= .15 + 1e-12 and portfolio.get('killed') is False
          assert economics.get('expected_model_sha') == sha
          assert economics.get('paper_only') is True and economics.get('authenticated_execution') is False
          ready=bool(economics.get('promotion_ready'))
          with out.open('a') as f: f.write(f'economic_ready={str(ready).lower()}\n')
          print(json.dumps({'state':economics.get('state'),'promotion_ready':ready,'submitted_units':economics.get('submitted_units'),'complete_units':economics.get('complete_units'),'net_pnl':economics.get('net_pnl'),'stressed_net_pnl':economics.get('stressed_net_pnl'),'reason_codes':economics.get('reason_codes')},sort_keys=True))
          PY
          cleanup
          trap - EXIT INT TERM
          echo "SMOKE_ROOT=$R" >> "$GITHUB_ENV"

      - name: Economic gate remains closed
        if: steps.gate.outputs.ready == 'true' && steps.economics.outputs.economic_ready != 'true'
        run: echo "paper-validated unchanged: exact-SHA canonical PAPER economics need more evidence." >> "$GITHUB_STEP_SUMMARY"

      - name: Advance paper-validated to exact economically validated V7 SHA
        if: steps.gate.outputs.ready == 'true' && steps.economics.outputs.economic_ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main paper-validated
          main_sha="$(git rev-parse origin/main)"; old_validated="$(git rev-parse origin/paper-validated)"
          test "$main_sha" = "$VALIDATION_SHA"; test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"
          git merge-base --is-ancestor "$old_validated" "$VALIDATION_SHA"
          if [[ "$old_validated" != "$VALIDATION_SHA" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/paper-validated" -f sha="$VALIDATION_SHA" -F force=false >/dev/null
          fi
          echo "paper_validated_sha=$VALIDATION_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact-SHA V7 PAPER evidence
        if: always() && steps.gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v7-live-paper-${{ env.VALIDATION_SHA }}-${{ github.run_id }}
          path: ${{ env.SMOKE_ROOT || format('runs/v7_cutover_validation/{0}', env.VALIDATION_SHA) }}/
          if-no-files-found: warn
          retention-days: 14
