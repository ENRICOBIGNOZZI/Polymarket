name: V7 Grafana unified resource pinpoint

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-grafana-unified-pinpoint-request.json

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
      INSTANCE_ID: ${{ vars.POLYMARKET_LONDON_INSTANCE_ID || 'i-0fba2bac9fdc5cbeb' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate
        run: |
          python3 - deploy/v7-grafana-unified-pinpoint-request.json <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1]))=={"schema":"polymarket_v7_grafana_unified_pinpoint_v1","read_only":True}
          PY
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: polymarket-v7-grafana-unified-pinpoint
          aws-region: eu-west-2
      - name: Read unified resources
        run: |
          set -euo pipefail
          command="$(cat <<'SH'
          set -euo pipefail
          python3 - <<'PY'
          import sqlite3,json
          db='/var/lib/grafana/grafana.db'
          con=sqlite3.connect(f'file:{db}?mode=ro',uri=True)
          cols=[r[1] for r in con.execute('pragma table_info(resource)')]
          idx={name:i for i,name in enumerate(cols)}
          rows=con.execute('select * from resource').fetchall()
          out=[]
          for row in rows:
              group=str(row[idx['group']]); resource=str(row[idx['resource']]); name=str(row[idx['name']])
              value=row[idx['value']]
              folder=row[idx['folder']] if 'folder' in idx else None
              if name not in {'polymarket-v7-pure-arb','afyms0c1xjabkf','efymp0o1dlla8b'}:
                  continue
              item={'group':group,'resource':resource,'name':name,'folder_column':folder}
              if isinstance(value,(bytes,bytearray)):
                  try:
                      doc=json.loads(value)
                  except Exception:
                      doc=None
                  if isinstance(doc,dict):
                      meta=doc.get('metadata') or {}
                      ann=meta.get('annotations') or {}
                      spec=doc.get('spec') or {}
                      item.update({
                        'title':spec.get('title') or meta.get('title'),
                        'metadata_name':meta.get('name'),
                        'annotation_folder':ann.get('grafana.app/folder'),
                        'managed_by':ann.get('grafana.app/managedBy'),
                        'manager_id':ann.get('grafana.app/managerId'),
                        'source_path':ann.get('grafana.app/sourcePath'),
                      })
              out.append(item)
          con.close()
          print('PINPOINT='+json.dumps(out,sort_keys=True,separators=(",",":")))
          PY
          SH
          )"
          encoded="$(printf '%s' "$command" | base64 -w0)"
          wrapped="printf '%s' '$encoded' | base64 -d | bash"
          params="$(python3 -c 'import json,sys; print(json.dumps({"commands":[sys.argv[1]],"executionTimeout":["90"]},separators=(",",":")))' "$wrapped")"
          cid="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --parameters "$params" --comment "Polymarket V7 Grafana unified pinpoint" --region "$AWS_REGION" --query 'Command.CommandId' --output text)"
          for i in $(seq 1 45); do
            status="$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query Status --output text 2>/dev/null || true)"
            if [[ "$status" == "Success" ]]; then
              aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query StandardOutputContent --output text
              exit 0
            fi
            case "$status" in Failed|Cancelled|TimedOut) exit 1;; esac
            sleep 1
          done
          exit 1
