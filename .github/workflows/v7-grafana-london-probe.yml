name: V7 Grafana London folder probe

on:
  push:
    branches: [main]
    paths:
      - deploy/v7-grafana-london-probe-request.json

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
      INSTANCE_ID: ${{ vars.POLYMARKET_LONDON_INSTANCE_ID || 'i-0fba2bac9fdc5cbeb' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate request
        run: |
          python3 - deploy/v7-grafana-london-probe-request.json <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1]))
          assert v=={"schema":"polymarket_v7_grafana_london_probe_v1","read_only":True}
          PY
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: polymarket-v7-grafana-folder-probe
          aws-region: eu-west-2
      - name: Inspect Grafana provisioning
        run: |
          set -euo pipefail
          command="$(cat <<'SH'
          set -euo pipefail
          echo '=== HEALTH ==='
          curl -sS http://127.0.0.1:3000/api/health || true
          echo
          echo '=== PROVIDER ==='
          PROV="$(systemctl show grafana-server.service -p Environment --value | python3 -c 'import shlex,sys; x=shlex.split(sys.stdin.read()); print(next(v.split("=",1)[1] for v in x if v.startswith("PROVISIONING_CFG_DIR=")))')"
          cat "$PROV/dashboards/v7.yml" || true
          echo '=== DASHBOARD FILE ==='
          GRAFANA_DIR="$(dirname "$PROV")"
          ls -l "$GRAFANA_DIR/dashboards/polymarket-v7-pure-arb.json" || true
          python3 - "$GRAFANA_DIR/dashboards/polymarket-v7-pure-arb.json" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          if p.is_file():
              v=json.load(open(p))
              print('FILE_UID='+str(v.get('uid')))
              print('FILE_TITLE='+str(v.get('title')))
          PY
          echo '=== API SEARCH ==='
          curl -sS -w '\nHTTP=%{http_code}\n' 'http://127.0.0.1:3000/api/search?query=Pure%20Arbitrage' || true
          echo '=== DB SCHEMA/ROWS ==='
          python3 - <<'PY'
          import sqlite3,json
          db='/var/lib/grafana/grafana.db'
          con=sqlite3.connect(f'file:{db}?mode=ro',uri=True)
          tables=[r[0] for r in con.execute("select name from sqlite_master where type='table' order by name")]
          print('TABLES='+json.dumps(tables))
          for table in ('dashboard','folder'):
              if table not in tables:
                  continue
              cols=[r[1] for r in con.execute(f'pragma table_info({table})')]
              print(table.upper()+'_COLS='+json.dumps(cols))
              if table=='dashboard' and 'uid' in cols:
                  wanted=['id','uid','title']
                  if 'folder_id' in cols: wanted.append('folder_id')
                  if 'is_folder' in cols: wanted.append('is_folder')
                  rows=con.execute(f"select {','.join(wanted)} from dashboard where uid in (?,?)",('afyms0c1xjabkf','polymarket-v7-pure-arb')).fetchall()
                  print('DASHBOARD_ROWS='+json.dumps(rows))
              if table=='folder':
                  print('FOLDER_SAMPLE='+json.dumps(con.execute('select * from folder limit 10').fetchall()))
          echo '=== UNIFIED RESOURCE ==='
          if 'resource' in tables:
              cols=[r[1] for r in con.execute('pragma table_info(resource)')]
              print('RESOURCE_COLS='+json.dumps(cols))
              rows=con.execute('select * from resource').fetchall()
              hits=[]
              for row in rows:
                  rendered=' | '.join('' if x is None else str(x) for x in row)
                  if ('polymarket-v7-pure-arb' in rendered
                          or 'afyms0c1xjabkf' in rendered
                          or 'Polymarket London' in rendered
                          or 'Pure Arbitrage' in rendered):
                      hits.append(row)
              print('RESOURCE_HITS='+json.dumps(hits,default=str))
          con.close()
          PY
          echo '=== JOURNAL ==='
          journalctl -u grafana-server.service -n 160 --no-pager | tail -160 || true
          SH
          )"
          encoded="$(printf '%s' "$command" | base64 -w0)"
          wrapped="printf '%s' '$encoded' | base64 -d | bash"
          params="$(python3 -c 'import json,sys; print(json.dumps({"commands":[sys.argv[1]],"executionTimeout":["180"]},separators=(",",":")))' "$wrapped")"
          cid="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --parameters "$params" --comment "Polymarket V7 Grafana London read-only probe" --region "$AWS_REGION" --query 'Command.CommandId' --output text)"
          for i in $(seq 1 60); do
            status="$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query Status --output text 2>/dev/null || true)"
            if [[ "$status" == "Success" ]]; then
              aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query StandardOutputContent --output text
              exit 0
            fi
            case "$status" in Failed|Cancelled|TimedOut)
              aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query StandardErrorContent --output text >&2 || true
              exit 1;;
            esac
            sleep 1
          done
          exit 1
