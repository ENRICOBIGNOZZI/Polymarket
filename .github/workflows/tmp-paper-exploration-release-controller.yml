name: TEMP release PAPER exploration funnel repair

on:
  push:
    branches: [ops/paper-exploration-funnel-fix-20260903]
    paths: [.github/workflows/tmp-paper-exploration-release-controller.yml]

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ops/paper-exploration-funnel-fix-20260903
      REPO: ENRICOBIGNOZZI/Polymarket
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: ops/paper-exploration-funnel-fix-20260903, fetch-depth: 0}
      - name: Await verified feature commit
        run: |
          set -euo pipefail
          ready=0
          for _ in $(seq 1 900); do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            if grep -q 'def kick_global_coordinator' scripts/v7_external_fair_paper_router.py \
              && grep -q 'CANDIDATE_EMITTED' scripts/v7_external_fair_paper_router.py \
              && grep -q 'deterministic_coordinator_kick' config/v7_external_fair.json; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
      - name: Remove release scaffolding and regenerate canonical inventory
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/tmp-paper-exploration-live-diagnostic.yml \
            .github/workflows/tmp-paper-exploration-diagnostic-commit.yml \
            .github/workflows/tmp-paper-exploration-classify.yml \
            .github/workflows/tmp-paper-exploration-apply-fix.yml \
            .github/workflows/tmp-paper-exploration-release-controller.yml \
            scripts/tmp_apply_paper_exploration_funnel_fix.py \
            tests/test_v7_paper_exploration_funnel_fix.py
          rm -rf diagnostics
          help="$(python3 scripts/v7_surface_classification.py --help 2>&1 || true)"
          if grep -q -- '--output' <<<"$help"; then
            python3 scripts/v7_surface_classification.py --repository-root . --output artifacts/v7_unification/path_classification.json
          elif grep -q -- '--write' <<<"$help"; then
            python3 scripts/v7_surface_classification.py --repository-root . --write
          else
            python3 scripts/v7_surface_classification.py --repository-root . > artifacts/v7_unification/path_classification.json
          fi
          python3 -m json.tool artifacts/v7_unification/path_classification.json >/dev/null
          git config user.name ENRICOBIGNOZZI
          git config user.email 88671442+ENRICOBIGNOZZI@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: finalize PAPER exploration funnel repair'
            git push origin HEAD:"$BRANCH"
          fi
      - name: Locate pull request and await exact-head checks
        id: pr
        run: |
          set -euo pipefail
          number=""
          for _ in $(seq 1 120); do
            number="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
            [[ -n "$number" ]] && break
            sleep 2
          done
          test -n "$number"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          head_sha="$(git rev-parse HEAD)"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          for _ in $(seq 1 900); do
            payload="$(gh api -H 'Accept: application/vnd.github+json' "repos/$REPO/commits/$head_sha/check-runs?per_page=100")"
            result="$(python3 - "$payload" <<'PY'
          import json,sys
          rows=json.loads(sys.argv[1]).get('check_runs',[])
          required={'ci-v7-Release','ci-v7-Debug','sanitizer-v7','security-audit-v7'}
          latest={}
          for r in rows:
              n=r.get('name')
              if n in required and (n not in latest or int(r.get('id') or 0)>int(latest[n].get('id') or 0)):
                  latest[n]=r
          if any(n not in latest for n in required): print('WAIT')
          elif any(latest[n].get('status')!='completed' for n in required): print('WAIT')
          elif any(latest[n].get('conclusion')!='success' for n in required): print('FAIL')
          else: print('PASS')
          PY
          )"
            [[ "$result" == PASS ]] && break
            [[ "$result" == FAIL ]] && exit 1
            sleep 5
          done
          test "$result" = PASS
      - name: Squash merge verified repair
        id: merge
        run: |
          set -euo pipefail
          gh pr merge "${{ steps.pr.outputs.number }}" --repo "$REPO" --squash --delete-branch \
            --subject 'Fix bounded PAPER exploration funnel' \
            --body 'Deterministic canonical coordinator handoff, checked-in PAPER-only legacy-gate bypass, durable funnel diagnostics, and no real-money authority.'
          git fetch origin main
          main_sha="$(git rev-parse origin/main)"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
      - name: Await exact-main Release and Debug checks
        run: |
          set -euo pipefail
          sha="${{ steps.merge.outputs.main_sha }}"
          result=WAIT
          for _ in $(seq 1 900); do
            payload="$(gh api -H 'Accept: application/vnd.github+json' "repos/$REPO/commits/$sha/check-runs?per_page=100")"
            result="$(python3 - "$payload" <<'PY'
          import json,sys
          rows=json.loads(sys.argv[1]).get('check_runs',[])
          required={'ci-v7-Release','ci-v7-Debug'}
          latest={}
          for r in rows:
              n=r.get('name')
              if n in required and (n not in latest or int(r.get('id') or 0)>int(latest[n].get('id') or 0)):
                  latest[n]=r
          if any(n not in latest for n in required): print('WAIT')
          elif any(latest[n].get('status')!='completed' for n in required): print('WAIT')
          elif any(latest[n].get('conclusion')!='success' for n in required): print('FAIL')
          else: print('PASS')
          PY
          )"
            [[ "$result" == PASS ]] && break
            [[ "$result" == FAIL ]] && exit 1
            sleep 5
          done
          test "$result" = PASS
      - name: Dispatch exact-SHA PAPER deployment
        id: deploy
        run: |
          set -euo pipefail
          sha="${{ steps.merge.outputs.main_sha }}"
          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run v7-deploy-paper-server.yml --repo "$REPO" --ref main -f expected_sha="$sha"
          run_id=""
          for _ in $(seq 1 120); do
            run_id="$(gh run list --repo "$REPO" --workflow v7-deploy-paper-server.yml --branch main --event workflow_dispatch --json databaseId,headSha,createdAt --jq ".[] | select(.headSha==\"$sha\") | .databaseId" | head -1)"
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --repo "$REPO" --exit-status
      - name: Verify post-deploy server health workflow
        run: |
          set -euo pipefail
          sha="${{ steps.merge.outputs.main_sha }}"
          health_id=""
          for _ in $(seq 1 180); do
            health_id="$(gh run list --repo "$REPO" --workflow v7-paper-server-health.yml --branch main --json databaseId,headSha,status,conclusion --jq ".[] | select(.headSha==\"$sha\") | .databaseId" | head -1)"
            [[ -n "$health_id" ]] && break
            sleep 3
          done
          test -n "$health_id"
          gh run watch "$health_id" --repo "$REPO" --exit-status
      - name: Publish release summary
        run: |
          echo '## PAPER exploration funnel repair' >> "$GITHUB_STEP_SUMMARY"
          echo "- main SHA: ${{ steps.merge.outputs.main_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- deploy run: ${{ steps.deploy.outputs.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo '- authority: PAPER only; real order submission disabled' >> "$GITHUB_STEP_SUMMARY"
