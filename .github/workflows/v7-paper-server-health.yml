name: V7 PAPER server health

on:
  workflow_dispatch:
    inputs:
      expected_sha: {description: "Exact deployed V7 SHA or request SHA", required: false, type: string}
  repository_dispatch:
    types: [v7-paper-server-health]
  workflow_run:
    workflows: ["V7 deploy PAPER server AWS OIDC", "V7 deploy PAPER server"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "20,50 * * * *"

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: v7-paper-server-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      ROLE_ARN: arn:aws:iam::350769147128:role/PolymarketLondonPaperDeployPolicy
      EXPECTED_SHA: ${{ github.event.inputs.expected_sha || github.event.client_payload.expected_sha || '' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: polymarket-v7-paper-health
          aws-region: eu-west-2

      - name: Resolve canonical observed runtime identity
        id: target
        run: |
          python3 ops/v7_runtime_identity.py --expected-sha "$EXPECTED_SHA" \
            --output runtime-identity.json --github-output "$GITHUB_OUTPUT"

      - name: Verify London PAPER runtime through read-only SSM
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          aws sts get-caller-identity --region eu-west-2 --output json >/dev/null
          python3 ops/v7_london_ssm_health.py \
            --expected-sha "$TARGET_SHA" \
            --runtime-identity runtime-identity.json \
            --region eu-west-2 \
            --output v7-ssm-health-receipt.json | tee health-evidence.txt
          python3 - "$TARGET_SHA" <<'PY'
          import json,sys
          v=json.load(open('v7-ssm-health-receipt.json',encoding='utf-8'))
          assert v.get('schema')=='polymarket_v7_ssm_health_receipt_v1'
          assert v.get('expected_sha')==sys.argv[1]
          assert v.get('paper_only') is True
          assert v.get('authenticated_execution') is False
          assert v.get('real_order_submission') is False
          r=v.get('runtime') or {}
          assert r.get('core_runtime_healthy') is True
          assert r.get('prometheus_ready') is True
          assert r.get('grafana_local_ready') is True
          print('server_health=PASS')
          print('full_data_health_ok='+str(bool(r.get('full_data_health_ok'))).lower())
          print('full_data_health_reasons='+','.join(map(str,r.get('full_data_health_reasons') or [])))
          c=r.get('bilateral_capture') or {}
          kinds=c.get('recent_kind_counts') or {}
          pairs=c.get('pair_state_by_kind') or {}
          print('bilateral_capture_recent_kind2='+str(int(kinds.get('2') or 0)))
          print('bilateral_capture_recent_kind6='+str(int(kinds.get('6') or 0)))
          print('bilateral_capture_ready_kind2='+str(int((pairs.get('2') or {}).get('BILATERAL_EXECUTABLE_READY') or 0)))
          print('bilateral_capture_ready_kind6='+str(int((pairs.get('6') or {}).get('BILATERAL_EXECUTABLE_READY') or 0)))
          print('bilateral_capture_prices_only_kind2='+str(int((pairs.get('2') or {}).get('PRICES_ONLY') or 0)))
          print('bilateral_capture_prices_only_kind6='+str(int((pairs.get('6') or {}).get('PRICES_ONLY') or 0)))
          print('native_observations_dropped='+str(int(c.get('native_observations_dropped') or 0)))
          print('native_observations_queue_depth='+str(int(c.get('native_observations_queue_depth') or 0)))
          print('bilateral_capture_scan_truncated='+str(bool(c.get('scan_truncated'))).lower())
          PY

      - name: Publish health summary
        run: |
          echo '## V7 PAPER server health' >> "$GITHUB_STEP_SUMMARY"
          echo "- exact deployed SHA: ${{ steps.target.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '- core runtime / single writer / PAPER safety / Prometheus / local Grafana: PASS' >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          v=json.load(open('v7-ssm-health-receipt.json'))
          r=v.get('runtime') or {}
          print(f"- full data health: {'PASS' if r.get('full_data_health_ok') else 'WARMING/DEGRADED'}")
          if r.get('full_data_health_reasons'):
              print("- data readiness reasons: "+", ".join(map(str,r['full_data_health_reasons'])))
          c=r.get('bilateral_capture') or {}
          kinds=c.get('recent_kind_counts') or {}
          pairs=c.get('pair_state_by_kind') or {}
          print(f"- bilateral capture window: {c.get('window_seconds', 0)}s")
          print(f"- recent decision/repricing rows: {kinds.get('2', 0)} / {kinds.get('6', 0)}")
          print("- bilateral executable-ready decision/repricing rows: "
                f"{(pairs.get('2') or {}).get('BILATERAL_EXECUTABLE_READY', 0)} / "
                f"{(pairs.get('6') or {}).get('BILATERAL_EXECUTABLE_READY', 0)}")
          print(f"- native observation drops / queue: {c.get('native_observations_dropped', 0)} / {c.get('native_observations_queue_depth', 0)}")
          if c.get('scan_truncated'):
              print("- bilateral capture audit: bounded scan truncated; counts are lower bounds")
          PY

      - name: Upload health evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v7-paper-server-health-${{ github.run_id }}
          path: |
            health-evidence.txt
            runtime-identity.json
            v7-ssm-health-receipt.json
          if-no-files-found: warn
          retention-days: 14
