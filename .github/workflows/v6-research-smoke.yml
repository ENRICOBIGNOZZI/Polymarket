name: V6 live-data research smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "27 * * * *"
  pull_request:
    branches: [main]
    paths:
      - "config/paper_v6.json"
      - "config/v6_model_architecture.json"
      - "scripts/paper_v6_loop.sh"
      - "scripts/v6_*.py"
      - "scripts/hf_maker_ab_summary.py"
      - "scripts/hf_maker_tape_audit.py"
      - "tests/test_v6_model_contracts.py"
      - "tests/test_v6_runtime_contract.py"
      - "tests/test_v6_execution_costs.py"
      - "tests/test_hf_maker_ab_summary.py"
      - "tests/test_hf_maker_tape_audit.py"
      - ".github/workflows/v6-research-smoke.yml"

permissions:
  contents: read

concurrency:
  group: v6-research-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  research-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce isolated paper-only contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          from hard_safety_policy import V6_AUTHORIZED_CEILINGS, V6_AUTHORIZED_FLOORS
          cfg=json.loads(Path('config/paper_v6.json').read_text())
          arch=json.loads(Path('config/v6_model_architecture.json').read_text())
          live=json.loads(Path('config/live_champion.json').read_text())
          assert cfg['v6']['paper_only'] is True
          assert cfg['multi_strategy']['paper_only'] is True
          assert arch['paper_only'] is True
          assert arch['allow_authenticated_execution'] is False
          event='${{ github.event_name }}'
          head='${{ github.head_ref }}'
          base_sha='${{ github.event.pull_request.base.sha }}'
          if event == 'pull_request':
              if head.startswith('integration/'):
                  assert live['version'] == 6, 'V6 integration smoke requires the V6 live selector'
              else:
                  assert base_sha, 'non-integration PR must expose its base SHA'
                  base_live=json.loads(subprocess.check_output(['git','show',f'{base_sha}:config/live_champion.json'],text=True))
                  assert live == base_live, 'non-integration V6 smoke must preserve the base live champion selector'
          assert float(cfg['max_drawdown']) <= V6_AUTHORIZED_CEILINGS['max_drawdown']
          assert float(cfg['max_market_fraction']) <= V6_AUTHORIZED_CEILINGS['max_market_fraction']
          assert float(cfg['max_event_fraction']) <= V6_AUTHORIZED_CEILINGS['max_event_fraction']
          assert float(cfg['max_gross_fraction']) <= V6_AUTHORIZED_CEILINGS['max_gross_fraction']
          assert float(cfg['multi_strategy']['global_max_gross_fraction']) <= V6_AUTHORIZED_CEILINGS['global_max_gross_fraction']
          assert float(cfg['fractional_kelly']) <= V6_AUTHORIZED_CEILINGS['fractional_kelly']
          assert float(cfg['max_trade_usd']) <= V6_AUTHORIZED_CEILINGS['max_trade_usd']
          assert float(cfg['min_liquidity']) >= V6_AUTHORIZED_FLOORS['min_liquidity']
          assert float(cfg['min_net_edge']) >= V6_AUTHORIZED_FLOORS['min_net_edge']
          assert float(cfg['uncertainty_penalty']) >= V6_AUTHORIZED_FLOORS['uncertainty_penalty']
          v=cfg['v6']
          total=sum(float(v[k]) for k in ('micro_maker_capital_fraction','micro_taker_capital_fraction','relative_value_capital_fraction','hard_arb_capital_fraction','external_capital_fraction','reserve_fraction'))
          assert abs(total-1.0)<1e-9
          assert float(v['intent_min_edge']) >= V6_AUTHORIZED_FLOORS['intent_min_edge']
          assert float(v['hard_arb_min_net_edge']) >= V6_AUTHORIZED_FLOORS['hard_arb_min_net_edge']
          assert float(v['hard_arb_max_trade_usd']) <= V6_AUTHORIZED_CEILINGS['hard_arb_max_trade_usd']
          PY

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev

      - name: Build V6 dependencies and deterministic contracts
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          python3 -m py_compile scripts/v6_queue_filter.py scripts/hf_maker_ab_summary.py scripts/hf_maker_tape_audit.py
          python3 scripts/v6_queue_filter.py self-test
          python3 -m unittest \
            tests/test_v6_model_contracts.py \
            tests/test_v6_runtime_contract.py \
            tests/test_v6_execution_costs.py \
            tests/test_hf_maker_ab_summary.py \
            tests/test_hf_maker_tape_audit.py -v

      - name: Live public-data relation probes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v6_evidence
          python3 scripts/v6_relation_intents.py --config config/paper_v6.json --output v6_evidence/relation_raw.csv --status v6_evidence/relation_status.json --markets 300 --min-liquidity 10 --min-edge 0.0002 --max-trade-usd 60 --max-events 50 > v6_evidence/relation.log 2>&1 || true
          python3 scripts/v6_intent_guard.py --input v6_evidence/relation_raw.csv --output v6_evidence/relation_guarded.csv --status v6_evidence/relation_guard_status.json --min-edge 0.0002 --stress-bps 10 --max-age-seconds 240 > v6_evidence/relation_guard.log 2>&1 || true
          ./build/polymarket_negrisk_arb --config config/paper_v6.json --markets 300 --min-liquidity 10 --top 100 > v6_evidence/graph_hard_taker_scan.csv 2> v6_evidence/graph_hard_taker_errors.log || true

      - name: Live public-data executable hard-arb paper probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v6_evidence/hard_arb
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('config/paper_v6.json').read_text())
          cfg['starting_capital']=1500.0
          cfg['run_dir']='v6_evidence/hard_arb'
          Path('v6_evidence/hard_arb_config.json').write_text(json.dumps(cfg,indent=2,sort_keys=True)+'\n')
          PY
          python3 scripts/v6_queue_filter.py hard --config v6_evidence/hard_arb_config.json --run-dir v6_evidence/hard_arb --markets 300 --min-liquidity 10 --max-events 50 --min-edge 0.0002 --max-trade-usd 60 --slippage-bps 5 --leg-latency-ms 100 > v6_evidence/hard_arb.log 2>&1 || true

      - name: Live public-data FDR local-factor probe
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/v6_local_factor_intents.py --config config/paper_v6.json --output v6_evidence/local_factor_intents.csv --status v6_evidence/local_factor_status.json --markets 250 --min-liquidity 10 --lookback-hours 168 --fidelity-minutes 60 --max-clusters 12 --min-common-points 48 --min-z 1.00 --fdr 0.10 --min-edge 0.0002 --max-trade-usd 60 --slippage-bps 5 > v6_evidence/local_factor.log 2>&1 || true

      - name: Live public-data maker economics probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v6_evidence/maker
          ./build/polymarket_maker_paper --config config/paper_v6.json --run-dir v6_evidence/maker --markets 250 --min-liquidity 10 --min-edge 0.00035 --max-order-usd 25 --ttl-seconds 30 --hold-seconds 60 --adverse-selection-mult 0.15 --once > v6_evidence/maker.log 2>&1 || true

      - name: HF maker authorized-envelope common-window A/B with shared tape
        shell: bash
        run: |
          set -euo pipefail
          root=v6_evidence/hf_maker_ab
          mkdir -p "$root/at_touch" "$root/improve1" "$root/shared"
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('config/paper_v6.json').read_text())
          cfg['starting_capital']=1200.0
          cfg['min_liquidity']=2.0
          cfg['min_net_edge']=0.00005
          cfg['fractional_kelly']=0.25
          cfg['max_trade_usd']=125.0
          cfg['max_market_fraction']=0.05
          cfg['max_event_fraction']=0.15
          cfg['max_gross_fraction']=0.70
          cfg['max_drawdown']=0.15
          cfg['slippage_bps']=5.0
          cfg['multi_strategy']['global_max_drawdown']=0.15
          cfg['multi_strategy']['global_max_gross_fraction']=0.70
          Path('v6_evidence/hf_maker_ab/config.json').write_text(json.dumps(cfg,indent=2,sort_keys=True)+'\n')
          assert cfg['max_drawdown'] == 0.15
          assert cfg['max_market_fraction'] == 0.05
          assert cfg['max_event_fraction'] == 0.15
          assert cfg['max_gross_fraction'] == 0.70
          assert cfg['fractional_kelly'] == 0.25
          assert cfg['max_trade_usd'] == 125.0
          assert cfg['min_liquidity'] == 2.0
          assert cfg['min_net_edge'] == 0.00005
          PY

          duration=300
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then duration=600; fi

          ./build/polymarket_trade_recorder \
            --config "$root/config.json" \
            --run-dir "$root/shared" \
            --markets 600 \
            --min-liquidity 2 \
            --batch 40 \
            --lookback-seconds 360 \
            --once > "$root/shared/recorder-bootstrap.log" 2>&1 || true

          ./build/polymarket_trade_recorder \
            --config "$root/config.json" \
            --run-dir "$root/shared" \
            --markets 600 \
            --min-liquidity 2 \
            --batch 40 \
            --lookback-seconds 360 \
            --interval 10 \
            --loop > "$root/shared/recorder.log" 2>&1 &
          recorder_pid=$!
          cleanup_recorder() {
            kill "$recorder_pid" 2>/dev/null || true
            wait "$recorder_pid" 2>/dev/null || true
          }
          trap cleanup_recorder EXIT

          run_arm() {
            local name="$1" improve="$2"
            timeout --signal=TERM --kill-after=5s "${duration}s" \
              ./build/polymarket_maker_paper \
                --config "$root/config.json" \
                --run-dir "$root/$name" \
                --markets 600 \
                --min-liquidity 2 \
                --min-edge 0.00005 \
                --max-order-usd 125 \
                --ttl-seconds 60 \
                --hold-seconds 60 \
                --adverse-selection-mult 0.15 \
                --improve-ticks "$improve" \
                --max-queue-multiple 8 \
                --interval 10 \
                --loop > "$root/$name/run.log" 2>&1
          }

          set +e
          run_arm at_touch 0 &
          pid_a=$!
          run_arm improve1 1 &
          pid_b=$!
          wait "$pid_a"; rc_a=$?
          wait "$pid_b"; rc_b=$?
          set -e
          for rc in "$rc_a" "$rc_b"; do
            if [[ "$rc" -ne 0 && "$rc" -ne 124 && "$rc" -ne 143 ]]; then
              echo "maker arm failed rc=$rc" >&2
              exit "$rc"
            fi
          done

          sleep 15
          cleanup_recorder
          trap - EXIT

          python3 - <<'PY'
          import csv
          from pathlib import Path
          p=Path('v6_evidence/hf_maker_ab/shared/trade_tape.csv')
          if not p.exists() or p.stat().st_size == 0:
              raise SystemExit('shared trade tape is missing or empty')
          with p.open(newline='',encoding='utf-8') as fh:
              rows=list(csv.DictReader(fh))
          if not rows:
              raise SystemExit('shared trade tape has no rows')
          if not any(int(float(r.get('received_ms') or 0)) > 0 for r in rows):
              raise SystemExit('shared trade tape has no local receive timestamps')
          print(f'shared_tape_rows={len(rows)}')
          PY

          python3 scripts/hf_maker_ab_summary.py \
            --arm at_touch:"$root/at_touch" \
            --arm improve1:"$root/improve1" \
            --output-json "$root/summary.json" \
            --output-markdown "$root/summary.md"

          for arm in at_touch improve1; do
            python3 scripts/hf_maker_tape_audit.py \
              --order-log "$root/$arm/maker_order_log.csv" \
              --trade-tape "$root/shared/trade_tape.csv" \
              --ttl-seconds 60 \
              --output "$root/$arm/shared_tape_audit.json" \
              > "$root/$arm/shared_tape_audit.log"
          done

          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('v6_evidence/hf_maker_ab')
          summary=json.loads((root/'summary.json').read_text())
          actual={str(x.get('arm')):int(x.get('maker_fill_events') or 0) for x in summary.get('arms',[])}
          payload={'schema':'hf_maker_fill_evidence_gap_v1','paper_only':True,'authenticated_execution':False,'arms':{}}
          for arm in ('at_touch','improve1'):
              audit=json.loads((root/arm/'shared_tape_audit.json').read_text())
              causal=int(audit.get('causal_fill_orders') or 0)
              eventual=int(audit.get('event_time_fill_orders') or 0)
              observed=int(actual.get(arm,0))
              payload['arms'][arm]={
                  'maker_engine_fill_events':observed,
                  'shared_tape_causal_fill_orders':causal,
                  'shared_tape_eventual_fill_orders':eventual,
                  'causal_fill_evidence_gap':max(0,causal-observed),
                  'delayed_only_fill_orders':int(audit.get('delayed_only_fill_orders') or 0),
                  'causal_filled_shares':float(audit.get('causal_filled_shares') or 0.0),
                  'causal_filled_notional':float(audit.get('causal_filled_notional') or 0.0),
              }
          (root/'fill_evidence_gap.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          print(json.dumps(payload,indent=2,sort_keys=True))
          PY

          cat "$root/summary.md" >> "$GITHUB_STEP_SUMMARY"
          echo '## Shared-tape fill evidence gap' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$root/fill_evidence_gap.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Live public-data micro-taker causal warmup/markout probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v6_evidence/micro_taker
          for i in 1 2 3 4 5 6; do
            python3 scripts/v6_queue_filter.py micro --config config/paper_v6.json --run-dir v6_evidence/micro_taker --markets 120 --min-liquidity 25 --horizon-seconds 5 --max-target-staleness-seconds 3 --max-trade-usd 15 --min-edge 0.0003 --slippage-bps 5 --max-positions 10 >> v6_evidence/micro_taker.log 2>&1 || true
            sleep 2
          done

      - name: Summarize V6 evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import csv,json,re
          from pathlib import Path
          root=Path('v6_evidence'); root.mkdir(parents=True,exist_ok=True)
          def js(name):
              p=root/name
              try:return json.loads(p.read_text())
              except Exception:return {}
          hard=(root/'graph_hard_taker_scan.csv').read_text(errors='ignore') if (root/'graph_hard_taker_scan.csv').exists() else ''
          m=re.search(r'net_positive_pre_gas=(\d+)',hard)
          summary={
              'paper_only':True,
              'authenticated_execution':False,
              'relation':js('relation_status.json'),
              'relation_guard':js('relation_guard_status.json'),
              'local_factor':js('local_factor_status.json'),
              'hard_arb':js('hard_arb/status.json'),
              'graph_hard_net_positive_pre_gas':int(m.group(1)) if m else 0,
              'hf_maker_ab':js('hf_maker_ab/summary.json'),
              'hf_maker_fill_evidence_gap':js('hf_maker_ab/fill_evidence_gap.json'),
              'hf_maker_at_touch_shared_tape':js('hf_maker_ab/at_touch/shared_tape_audit.json'),
              'hf_maker_improve1_shared_tape':js('hf_maker_ab/improve1/shared_tape_audit.json'),
          }
          state=root/'micro_taker/state.json'
          if state.exists():
              try:
                  s=json.loads(state.read_text()); samples=s.get('samples') or []
                  labeled=[x for x in samples if isinstance(x,dict) and x.get('y') is not None]
                  bad=[x for x in labeled if int(x.get('target_observation_ts') or 0)>int(x.get('ts') or 0)+5]
                  lags=[int(x['target_staleness_seconds']) for x in labeled if x.get('target_staleness_seconds') is not None]
                  summary['micro_taker_samples']=len(samples)
                  summary['micro_taker_labeled']=len(labeled)
                  summary['micro_taker_post_horizon_labels']=len(bad)
                  summary['micro_taker_target_staleness_max_seconds']=max(lags) if lags else None
                  summary['micro_taker_open_positions']=len(s.get('positions') or {})
                  summary['micro_taker_signals_last_tick']=int(s.get('signals') or 0)
                  summary['micro_taker_opened_last_tick']=int(s.get('opened') or 0)
                  summary['micro_taker_best_edge_last_tick']=float(s.get('best_edge') or 0.0)
                  summary['micro_taker_realized_pnl_total']=float(s.get('realized_pnl_total') or 0.0)
                  summary['micro_taker_label_stats_last_tick']=s.get('label_stats_last_tick') or {}
                  summary['micro_taker_execution_model']=s.get('execution_model')
                  summary['micro_taker_depth_rejections_last_tick']=int(s.get('depth_rejections_last_tick') or 0)
                  summary['micro_taker_fee_sources_last_tick']=s.get('fee_sources_last_tick') or {}
                  if bad: raise RuntimeError('micro taker used a post-horizon target observation')
              except Exception as exc:
                  summary['micro_taker_summary_error']=f'{type(exc).__name__}:{exc}'
          fills=root/'micro_taker/fills.csv'
          if fills.exists():
              try:
                  rows=list(csv.DictReader(fills.open(newline='',encoding='utf-8')))
                  summary['micro_taker_buy_fills']=sum((r.get('action') or '').upper()=='BUY' for r in rows)
                  summary['micro_taker_sell_fills']=sum((r.get('action') or '').upper() in {'SELL','SELL_PARTIAL'} for r in rows)
                  summary['micro_taker_closed_fill_pnl']=sum(float(r.get('pnl') or 0.0) for r in rows if (r.get('action') or '').upper() in {'SELL','SELL_PARTIAL'})
              except Exception as exc:
                  summary['micro_taker_fills_summary_error']=f'{type(exc).__name__}:{exc}'
          (root/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          if summary.get('micro_taker_post_horizon_labels',0):
              raise SystemExit('causal micro target contract failed')
          PY
          echo '## V6 live-data research smoke' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat v6_evidence/summary.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload V6 research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-research-smoke-${{ github.run_id }}
          path: v6_evidence/
          if-no-files-found: error
          retention-days: 30
