name: V6 live-data research smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "27 * * * *"
  pull_request:
    branches: [main]
    paths:
      - "config/paper_v6.json"
      - "config/v6_model_architecture.json"
      - "scripts/paper_v6_loop.sh"
      - "scripts/v6_*.py"
      - "tests/test_v6_model_contracts.py"
      - "tests/test_v6_runtime_contract.py"
      - ".github/workflows/v6-research-smoke.yml"

permissions:
  contents: read

concurrency:
  group: v6-research-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  research-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce isolated paper-only contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          cfg=json.loads(Path('config/paper_v6.json').read_text())
          arch=json.loads(Path('config/v6_model_architecture.json').read_text())
          live=json.loads(Path('config/live_champion.json').read_text())
          assert cfg['v6']['paper_only'] is True
          assert cfg['multi_strategy']['paper_only'] is True
          assert arch['paper_only'] is True
          assert arch['allow_authenticated_execution'] is False
          event='${{ github.event_name }}'; head='${{ github.head_ref }}'; base_sha='${{ github.event.pull_request.base.sha }}'
          if event == 'pull_request':
              if head.startswith('integration/'):
                  assert live['version'] == 6, 'V6 integration smoke requires the V6 live selector'
              else:
                  assert base_sha, 'non-integration PR must expose its base SHA'
                  base_live=json.loads(subprocess.check_output(['git','show',f'{base_sha}:config/live_champion.json'],text=True))
                  assert live == base_live, 'non-integration V6 smoke must preserve the base live champion selector'
          assert float(cfg['max_drawdown']) <= .15
          assert float(cfg['multi_strategy']['global_max_drawdown']) <= .15
          assert float(cfg['max_market_fraction']) <= .05
          assert float(cfg['max_event_fraction']) <= .15
          assert float(cfg['max_gross_fraction']) <= .70
          assert float(cfg['multi_strategy']['global_max_gross_fraction']) <= .70
          assert float(cfg['slippage_bps']) >= 5.0
          assert float(cfg['min_net_edge']) > 0.0
          v=cfg['v6']
          total=sum(float(v[k]) for k in ('micro_maker_capital_fraction','micro_taker_capital_fraction','relative_value_capital_fraction','hard_arb_capital_fraction','external_capital_fraction','reserve_fraction'))
          assert abs(total-1.0)<1e-9
          PY

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev libboost-all-dev

      - name: Build V6 dependencies and deterministic contracts
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          bash -n scripts/paper_v6_loop.sh
          python3 -m py_compile \
            scripts/v6_market_common.py scripts/v6_micro_maker.py scripts/v6_micro_taker_v2.py \
            scripts/v6_hard_arb_paper_v2.py scripts/v6_queue_filter.py scripts/v6_local_factor_v3.py
          python3 -m unittest tests/test_v6_model_contracts.py tests/test_v6_runtime_contract.py -v

      - name: Live public-data relation and queue-economics probes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v6_evidence
          ./build/polymarket_trade_recorder --config config/paper_v6.json --run-dir v6_evidence --markets 500 --batch 40 --min-liquidity 2 --lookback-seconds 900 --once > v6_evidence/trade_recorder_initial.log 2>&1 || true
          python3 scripts/v6_relation_intents.py --config config/paper_v6.json --output v6_evidence/relation_raw.csv --status v6_evidence/relation_status.json --markets 500 --min-liquidity 2 --min-edge 0.00005 --max-trade-usd 125 --max-events 100 > v6_evidence/relation.log 2>&1 || true
          python3 scripts/v6_intent_guard.py --input v6_evidence/relation_raw.csv --output v6_evidence/relation_guarded.csv --status v6_evidence/relation_guard_status.json --min-edge 0.00005 --stress-bps 5 --max-age-seconds 180 > v6_evidence/relation_guard.log 2>&1 || true
          python3 scripts/v6_queue_filter.py --config config/paper_v6.json --input v6_evidence/relation_guarded.csv --output v6_evidence/relation_queue.csv --status v6_evidence/queue_filter_status.json --trade-tape v6_evidence/trade_tape.csv --min-edge 0.00005 --reserve-bps 5 --min-leg-fill-probability 0.005 --min-joint-fill-probability 0.000001 --target-leg-fill-probability 0.10 --max-improve-ticks-per-leg 4 > v6_evidence/queue_filter.log 2>&1 || true

      - name: Live public-data executable hard-arb v2 probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v6_evidence/hard_arb
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('config/paper_v6.json').read_text()); cfg['starting_capital']=2200.0; cfg['run_dir']='v6_evidence/hard_arb'; Path('v6_evidence/hard_arb_config.json').write_text(json.dumps(cfg,indent=2,sort_keys=True)+'\n')
          PY
          python3 scripts/v6_hard_arb_paper_v2.py --config v6_evidence/hard_arb_config.json --run-dir v6_evidence/hard_arb --markets 600 --min-liquidity 2 --max-events 120 --min-edge 0.00005 --max-trade-usd 125 --slippage-bps 5 > v6_evidence/hard_arb.log 2>&1 || true

      - name: Live public-data repaired local-factor probe
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/v6_local_factor_v3.py --config config/paper_v6.json --output v6_evidence/local_factor_intents.csv --status v6_evidence/local_factor_status.json --trade-tape v6_evidence/trade_tape.csv --markets 500 --min-liquidity 2 --lookback-hours 168 --fidelity-minutes 60 --max-clusters 25 --min-common-points 36 --min-z 0.75 --fdr 0.15 --min-edge 0.00005 --max-trade-usd 100 --slippage-bps 5 --min-fill-probability 0.005 > v6_evidence/local_factor.log 2>&1 || true

      - name: Live public-data forward flow-aware maker probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v6_evidence/maker
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('config/paper_v6.json').read_text()); cfg['starting_capital']=2200.0; cfg['run_dir']='v6_evidence/maker'; Path('v6_evidence/maker_config.json').write_text(json.dumps(cfg,indent=2,sort_keys=True)+'\n')
          PY
          record_trade_tape() {
            ./build/polymarket_trade_recorder --config config/paper_v6.json --run-dir v6_evidence --markets 500 --batch 40 --min-liquidity 2 --lookback-seconds 900 --once >> v6_evidence/trade_recorder_forward.log 2>&1 || true
          }
          maker_tick() {
            python3 scripts/v6_micro_maker.py --config v6_evidence/maker_config.json --run-dir v6_evidence/maker --trade-tape v6_evidence/trade_tape.csv --markets 500 --min-liquidity 2 --min-edge 0.00005 --max-order-usd 125 --ttl-seconds 60 --hold-seconds 45 --min-fill-probability 0.005 --target-fill-probability 0.10 --max-improve-ticks 3 --slippage-bps 5 >> v6_evidence/maker.log 2>&1 || true
          }
          record_trade_tape
          maker_tick
          for delay in 20 20 20 20; do
            sleep "$delay"
            record_trade_tape
            maker_tick
          done

      - name: Summarize aggressive V6 evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('v6_evidence'); root.mkdir(parents=True,exist_ok=True)
          def js(path):
              p=root/path
              try:return json.loads(p.read_text())
              except Exception:return {}
          tape=root/'trade_tape.csv'
          tape_rows=max(0, sum(1 for _ in tape.open(encoding='utf-8'))-1) if tape.exists() else 0
          fills=root/'maker'/'maker_fills.csv'
          fill_rows=max(0, sum(1 for _ in fills.open(encoding='utf-8'))-1) if fills.exists() else 0
          summary={
              'paper_only':True,
              'authenticated_execution':False,
              'trade_tape_rows':tape_rows,
              'maker_fill_rows':fill_rows,
              'relation':js('relation_status.json'),
              'relation_guard':js('relation_guard_status.json'),
              'queue_filter':js('queue_filter_status.json'),
              'local_factor':js('local_factor_status.json'),
              'hard_arb':js('hard_arb/status.json'),
              'maker':js('maker/status.json'),
          }
          (root/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
          echo '## Aggressive V6 live-data research smoke' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat v6_evidence/summary.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload V6 research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-aggressive-research-smoke-${{ github.run_id }}
          path: v6_evidence/
          if-no-files-found: error
